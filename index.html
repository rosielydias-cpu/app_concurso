<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Reels de Concurso</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%2337d99a'/%3E%3C/svg%3E">
<script>
  /* Monitor de erros: roda antes do app, então captura até erros de sintaxe do script principal.
     Todo erro vai para o console (prefixo [Reels]) e aparece numa faixa vermelha na tela. */
  (function(){
    var list = [];
    window.__reelsErrors = list;
    function panel(){
      var el = document.getElementById('err-panel');
      if(el || !document.body) return el;
      el = document.createElement('div');
      el.id = 'err-panel';
      el.setAttribute('role', 'alert');
      el.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9999;background:#b3123a;color:#fff;border-radius:12px;padding:10px 12px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:40vh;overflow:auto';
      el.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>Erro no app</b><button type="button" id="err-close" style="background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer">Fechar</button></div><ul id="err-list" style="margin:6px 0 0 18px"></ul>';
      document.body.appendChild(el);
      el.querySelector('#err-close').addEventListener('click', function(){ el.remove(); });
      return el;
    }
    function show(msg){
      var el = panel();
      if(!el){ document.addEventListener('DOMContentLoaded', function(){ show(msg); }); return; }
      var li = document.createElement('li');
      li.textContent = msg;
      el.querySelector('#err-list').appendChild(li);
    }
    window.reportError = function(msg, err){
      var full = String(msg) + (err && err.stack ? '\n' + err.stack : '');
      list.push({ at: new Date().toISOString(), msg: String(msg) });
      console.error('[Reels] ' + full);
      show(String(msg));
    };
    window.addEventListener('error', function(e){
      var where = e.lineno ? ' (linha ' + e.lineno + (e.colno ? ':' + e.colno : '') + ')' : '';
      window.reportError((e.message || 'Erro desconhecido') + where, e.error);
    });
    window.addEventListener('unhandledrejection', function(e){
      var r = e.reason;
      window.reportError('Promessa rejeitada: ' + (r && r.message ? r.message : r), r);
    });
  })();
</script>
<style>
  :root{
    --font: system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --bg:#0a0e13; --surface:#111823; --surface-2:#182231; --border:#23303f;
    --text:#e9f0f8; --muted:#8b98aa;
    --accent:#37d99a; --accent-2:#3aa0ff; --danger:#ff5c7a; --warn:#ffc94d; --ok:#37d99a;
    --radius:18px; --radius-sm:12px;
    --header-h:58px; --tab-h:64px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f8; --border:#dce3ee;
    --text:#0e1620; --muted:#5d6b7d;
    --shadow:0 10px 30px rgba(20,40,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; overflow:hidden;
    overscroll-behavior:none;
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  #app-header{
    flex:0 0 auto; height:var(--header-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:.2px}
  .brand-dot{width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .header-right{display:flex; align-items:center; gap:8px}
  .streak{display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:14px; font-weight:600}
  .streak svg{width:16px; height:16px; color:var(--warn)}
  .icon-btn{
    width:40px; height:40px; display:grid; place-items:center;
    border:1px solid var(--border); border-radius:12px;
    background:var(--surface-2); color:var(--text); cursor:pointer;
  }
  .icon-btn svg{width:20px; height:20px}

  #viewport{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  }

  #tabbar{
    flex:0 0 auto; height:var(--tab-h); display:flex;
    background:var(--surface); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:0; color:var(--muted);
    font-size:10.5px; font-weight:600; cursor:pointer; padding:6px 2px;
  }
  .tab svg{width:22px; height:22px}
  .tab.active{color:var(--accent)}

  #toast{
    position:fixed; left:50%; bottom:calc(var(--tab-h) + 20px);
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    padding:12px 16px; border-radius:12px; font-size:13.5px; max-width:90vw;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:50; box-shadow:var(--shadow); text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .view{max-width:640px; margin:0 auto; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .eyebrow{font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--accent); font-weight:700}
  .greeting{font-size:26px; font-weight:800; margin-top:6px; line-height:1.15}
  .h1{font-size:24px; font-weight:800; margin-top:6px}
  .h2{font-size:15px; font-weight:700; margin-bottom:10px}
  .sub{color:var(--muted); margin-top:6px; font-size:14px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-top:16px}
  .soft{background:var(--surface-2)}
  .hero-stats{display:flex; justify-content:space-between; gap:8px; margin-bottom:16px}
  .hstat{flex:1; text-align:center; background:var(--surface-2); border-radius:12px; padding:12px 6px}
  .hnum{display:block; font-size:26px; font-weight:800}
  .hlabel{font-size:11.5px; color:var(--muted); font-weight:600}
  .btn-primary{
    width:100%; padding:16px; border:0; border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#04120c; font-weight:800; font-size:16px; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .08s ease;
  }
  .btn-primary:active{transform:scale(.98)}
  .hint{text-align:center; color:var(--muted); font-size:12.5px; margin-top:10px}
  .steps{list-style:none; display:grid; gap:8px; font-size:14px; color:var(--muted)}
  .steps b{color:var(--accent); margin-right:4px}
  .muted{color:var(--muted); font-size:14px; line-height:1.5}
  .badge{
    display:inline-block; margin-top:12px; font-size:12px; font-weight:700; color:var(--accent);
    background:rgba(55,217,154,.12); border:1px solid rgba(55,217,154,.3);
    padding:6px 10px; border-radius:999px;
  }
  .badge.ok-badge{color:var(--ok); background:rgba(55,217,154,.12); border-color:rgba(55,217,154,.3)}
  .badge.warn-badge{color:var(--warn); background:rgba(255,201,77,.12); border-color:rgba(255,201,77,.3)}
  .btn-ghost{
    width:100%; margin-top:10px; padding:14px; border:1px solid var(--border); border-radius:14px;
    background:var(--surface-2); color:var(--text); font-weight:700; font-size:15px; cursor:pointer;
  }
  .plan-list{list-style:none; display:grid; gap:16px}
  .plan-item{display:block}
  .plan-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .plan-name{font-weight:700; font-size:14.5px}
  .weight{
    font-size:11px; font-weight:700; color:var(--accent-2);
    background:rgba(58,160,255,.12); border:1px solid rgba(58,160,255,.3);
    padding:3px 8px; border-radius:999px; white-space:nowrap;
  }
  .plan-meta{font-size:12px; color:var(--muted); margin:4px 0 8px}
  .field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border)}
  .field:last-of-type{border-bottom:0}
  .field > span{font-size:13.5px; color:var(--muted); font-weight:600}
  .field input{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:10px 12px; font-size:14px; font-family:var(--font); max-width:180px}
  .week-dist{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap}
  .day-chip{flex:1; min-width:44px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); font-size:11px; color:var(--muted); text-align:center}
  .day-chip b{font-size:11.5px; color:var(--text)}
  .day-chip.on{border-color:var(--accent); color:var(--accent)}
  .heatmap{display:grid; grid-template-rows:repeat(7,12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; margin:8px 0 10px; overflow-x:auto; padding-bottom:2px}
  .hm-cell{width:12px; height:12px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border)}
  .hm-cell.empty{background:transparent; border-color:transparent}
  .hm-cell.lvl0{background:var(--surface-2)}
  .hm-cell.lvl1{background:rgba(55,217,154,.18); border-color:rgba(55,217,154,.25)}
  .hm-cell.lvl2{background:rgba(55,217,154,.38); border-color:rgba(55,217,154,.45)}
  .hm-cell.lvl3{background:rgba(55,217,154,.62); border-color:rgba(55,217,154,.7)}
  .hm-cell.lvl4{background:rgba(55,217,154,.9); border-color:rgba(55,217,154,.95)}
  .hm-legend{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted)}
  .chart-line{width:100%; height:90px; display:block; margin-top:8px}
  .chart-bars{width:100%; height:auto; display:block; margin-top:6px}
  .bar{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border)}
  .bar > span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:0; transition:width .3s}
  .run-view{padding-top:6px}
  .run-top{display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .run-progress{flex:1; height:8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
  .run-progress #run-progress-fill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .25s}
  .run-counter{font-size:12px; color:var(--muted); font-weight:700; min-width:44px; text-align:right}
  .run-score-wrap{display:inline-flex; align-items:center; gap:4px; color:var(--warn); font-weight:700; font-size:13px}
  .run-score-wrap svg{width:15px; height:15px}
  .banner{padding:8px 12px; background:var(--warn); color:#04120c; font-size:12px; margin-bottom:12px; border-radius:var(--radius-sm)}
  .banner.warning{background:var(--danger)}
  .banner button{margin-left:8px; background:rgba(0,0,0,.15); border:0; color:inherit; padding:2px 8px; border-radius:8px; font:inherit; font-weight:700; cursor:pointer}
  .field select{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:10px 12px; font-size:14px; font-family:var(--font); max-width:180px}
  .field input[type="checkbox"]{width:22px; height:22px; accent-color:var(--accent)}
  .field input[type="text"]{width:100%}
  .btn-danger{width:100%; margin-top:10px; padding:14px; border:1px solid var(--danger); border-radius:14px; background:transparent; color:var(--danger); font-weight:700; font-size:15px; cursor:pointer}
  .btn-danger.solid{background:var(--danger); color:#fff}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1 1 140px}
  .confirm-box{margin-top:10px; padding:12px; border:1px solid var(--danger); border-radius:12px; background:rgba(255,92,122,.08)}
  .goal-bar{height:10px; margin-top:10px}
  .tip{font-size:14px; line-height:1.45; color:var(--text)}
  .tip + .tip{margin-top:12px}
  .tip b{color:var(--accent)}
  .check{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer}
  .check:last-child{border-bottom:0}
  .check input{width:20px; height:20px; accent-color:var(--accent)}
  .check.done span{color:var(--muted); text-decoration:line-through}
  .reel-a .ans{font-weight:600}
  .more-box, .tip-box{margin-top:12px; padding:12px 14px; border-radius:12px; font-size:calc(14.5px * var(--fs)); line-height:1.55}
  .more-box{background:rgba(58,160,255,.08); border:1px solid rgba(58,160,255,.3)}
  .more-box b{color:var(--accent-2)}
  .tip-box{background:rgba(255,201,77,.08); border:1px solid rgba(255,201,77,.35)}
  .tip-box b{color:var(--warn)}
  .more-box b, .tip-box b{display:block; font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; margin-bottom:4px}
  .blank{display:inline-block; min-width:80px; border-bottom:2px dashed var(--accent-2); color:var(--accent-2); padding:0 4px}
  .blank.ok{border-bottom-style:solid; border-color:var(--ok); color:var(--ok)}
  .blank.bad{border-bottom-style:solid; border-color:var(--danger); color:var(--danger)}
  .opts-chips{grid-template-columns:repeat(auto-fit, minmax(130px, 1fr))}
  .ord-pool{display:grid; gap:8px}
  .ord-item{display:flex; gap:10px; align-items:center; text-align:left; padding:12px 14px; border:1px dashed var(--border); border-radius:12px; background:var(--surface-2); color:var(--text); font-size:calc(15px * var(--fs)); cursor:pointer}
  .ord-item:disabled{opacity:.35; cursor:default}
  .ord-picked, .ord-answer{margin:0; padding-left:22px; display:grid; gap:6px; font-size:calc(15px * var(--fs))}
  .ord-picked:empty::before{content:"Sua ordem aparece aqui"; color:var(--muted); font-size:13px; margin-left:-22px}
  .ord-picked li{padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--accent-2); cursor:pointer}
  .ord-picked li.right{border-color:var(--ok); background:rgba(55,217,154,.12)}
  .ord-picked li.off{border-color:var(--danger); background:rgba(255,92,122,.12)}
  .ord-answer li{color:var(--ok); font-weight:600}
  .edital{margin-top:8px; font-size:12.5px; color:var(--muted)}
  .edital summary{cursor:pointer; color:var(--accent-2); font-weight:700; padding:4px 0}
  .edital p{margin-top:6px; line-height:1.5}
  .topic-list{list-style:none; display:grid; gap:4px; margin:6px 0 4px}
  .topic-list li{color:var(--text)}
  .topic-list span{color:var(--muted); font-size:11.5px}
  .opts-ce{grid-template-columns:1fr 1fr}
  .opts-ce .opt{justify-content:center; align-items:center; font-weight:800}
  .reel-q.reel-q-ce{font-weight:600; line-height:1.45}
  html{--fs:1}
  .reel-q{font-size:calc(20px * var(--fs))}
  .reel-a, .opt{font-size:calc(15.5px * var(--fs))}
  .fb-exp{font-size:calc(13.5px * var(--fs))}
  .reel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; min-height:58vh; display:flex; flex-direction:column; gap:14px; animation:fade .2s ease}
  .reel-tag{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:700}
  .reel-tag span{color:var(--accent-2)}
  .reel-q{font-size:20px; font-weight:700; line-height:1.35}
  .reel-a{font-size:16px; line-height:1.5; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:16px; animation:fade .2s ease}
  .card-controls{display:flex; gap:10px; margin-top:auto}
  .btn-no,.btn-yes{flex:1; padding:16px; border-radius:14px; font-weight:800; font-size:15px; cursor:pointer}
  .btn-no{background:var(--surface-2); color:var(--text); border:1px solid var(--border)}
  .btn-yes{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#04120c; border:0}
  .swipe-hint{text-align:center; color:var(--muted); font-size:12px; margin-top:auto}
  .opts{display:grid; gap:10px; margin-top:4px}
  .opt{display:flex; align-items:flex-start; gap:10px; text-align:left; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2); color:var(--text); font-size:15px; line-height:1.35; cursor:pointer; transition:transform .08s, border-color .15s}
  .opt:active{transform:scale(.99)}
  .opt:disabled{cursor:default}
  .opt-letter{flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:800; color:var(--muted)}
  .opt.correct{border-color:var(--ok); background:rgba(55,217,154,.12)}
  .opt.correct .opt-letter{background:var(--ok); color:#04120c; border-color:var(--ok)}
  .opt.wrong{border-color:var(--danger); background:rgba(255,92,122,.12)}
  .opt.wrong .opt-letter{background:var(--danger); color:#fff; border-color:var(--danger)}
  .feedback{margin-top:auto; display:grid; gap:10px; animation:fade .2s ease; padding-left:12px}
  .feedback.ok{border-left:3px solid var(--ok)}
  .feedback.bad{border-left:3px solid var(--danger)}
  .fb-title{font-weight:800; font-size:15px}
  .feedback.ok .fb-title{color:var(--ok)}
  .feedback.bad .fb-title{color:var(--danger)}
  .fb-exp{font-size:13.5px; color:var(--muted); line-height:1.45}
  .sum-pct{font-size:12px; font-weight:800}
  .sum-pct.ok{color:var(--ok)}
  .sum-pct.warn{color:var(--warn)}
  .sum-pct.bad{color:var(--danger)}
  .bar > span.ok{background:var(--ok)}
  .bar > span.warn{background:var(--warn)}
  .bar > span.bad{background:var(--danger)}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
  <header id="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Reels de Concurso</span>
    </div>
    <div class="header-right">
      <span class="streak" title="Sequência de estudo">
        <svg viewBox="0 0 24 24"><path d="M12 3c.8 3-2 4.2-2 7a2 2 0 0 0 4 0c0-1-.4-1.8-.4-1.8C16 10 17.5 12 17.5 14.5a5.5 5.5 0 1 1-11 0C6.5 10 10 8 12 3z"/></svg>
        <b id="streak-count">0</b>
      </span>
      <button class="icon-btn" id="theme-toggle" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="viewport" aria-live="polite"></main>

  <nav id="tabbar" aria-label="Navegação principal">
    <button class="tab active" data-route="home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
      <span>Início</span>
    </button>
    <button class="tab" data-route="plan">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Plano</span>
    </button>
    <button class="tab" data-route="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6"/><path d="M3 20h18"/></svg>
      <span>Progresso</span>
    </button>
    <button class="tab" data-route="coach">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>
      <span>Coach</span>
    </button>
    <button class="tab" data-route="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="7" cy="17" r="2.2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
  (function(){
    'use strict';

    var U = {

      mulberry32: function(seed){
        var a = seed >>> 0;
        return function(){
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);

        { id:'fc71', syllabusId:'tox', front:'N-acetilcisteína é o antídoto de escolha para a intoxicação por paracetamol (acetaminofeno), repondo a glutationa hepática e facilitando a excreção conjugada.', back:'É mais eficaz quando administrada nas primeiras 8–10 h após a ingestão, por via oral ou intravenosa.' },

        { id:'fc74', syllabusId:'fg', front:'Digitálicos (digitoxina e digoxina) inibem a bomba Na⁺/K⁺-ATPase nos miócitos cardíacos, aumentando a contratilidade e reduzindo a condução no nó atrioventricular.', back:'Indicados para insuficiência cardíaca congestiva e controle da frequência atrial; índice terapêutico estreito requer monitoramento da concentração sérica.' },

        { id:'fc77', syllabusId:'fg', front:'A quinina, obtida da casca da quina (Cinchona spp.), é um antimalárico usado sobretudo na malária por P. falciparum resistente à cloroquina.', back:'Age inibindo a polimerização do heme no parasita; efeitos adversos incluem cinchonismo (zumbido) e hipoglicemia.' },

        { id:'fc79', syllabusId:'br', front:'O método de Soxhlet extrai lipídios (extrato etéreo) de amostras sólidas em ciclos de percolação contínua com solvente fresco.', back:'O solvente (éter etílico ou éter de petróleo) dissolve os lipídios; o aparelho permite refluxo contínuo por horas.' },
        { id:'fc80', syllabusId:'qb', front:'A Lei de Beer-Lambert estabelece a relação direta entre a absorbância (A), a concentração (c) do absorvente e o caminho óptico (l): A = ε·c·l.', back:'ε é o coeficiente de extinção molar; a lei assume radiação monocromática, soluções diluídas e ausência de interações entre as moléculas absorventes.' },
        { id:'fc81', syllabusId:'qb', front:'O HPLC (High Performance Liquid Chromatography) separa, identifica e quantifica componentes de uma mistura usando uma fase móvel fluida e uma fase estacionária por partição ou adsorção.', back:'Na fase normal, a fase estacionária é polar e a móvel apolar; na fase reversa (a mais usada) ocorre o inverso. Detectores comuns: UV-Vis e espectrometria de massas.' },
        { id:'fc82', syllabusId:'crim', front:'A cena do crime deve ser isolada, preservada e fotografada/filmada antes de qualquer movimentação de vestígios, para evitar contaminação ou perda de provas.', back:'Isolamento da área, uso de EPI e registro fotográfico; a cadeia de custódia acompanha o vestígio da coleta até o descarte (arts. 158-A a 158-F do CPP).' },
        { id:'fc83', syllabusId:'crim', front:'A cadeia de custódia na perícia criminal registra de forma contínua a posse e a integridade dos vestígios desde a coleta até a análise laboratorial, garantindo sua admissibilidade judicial.', back:'Cada transferência deve ser documentada (data, hora, responsável, finalidade); ausência de registros pode invalidar as evidências.' },
        { id:'fc84', syllabusId:'pt', front:'A crase ocorre na fusão da preposição "a" com o artigo feminino "a(s)" (a + a = à) ou com os pronomes aquele(s), aquela(s) e aquilo.', back:'Exemplos: fui à escola, refiro-me àquilo. Não há crase antes de palavra masculina: "a pé", "aos alunos" (a + os, sem crase).' },
        { id:'fc85', syllabusId:'rl', front:'A negação da proposição "Todo A é B" é "Algum A não é B", seguindo a lógica quantificacional de oposição de quantificadores universais e particulares.', back:'Em lógica de predicados: ¬∀x(Ax → Bx) ≡ ∃x(Ax ∧ ¬Bx); lê-se "existe ao menos um A que não é B".' },
        { id:'fc86', syllabusId:'inf', front:'O protocolo HTTPS fornece comunicação criptografada entre cliente e servidor, garantindo confidencialidade (via criptografia assimétrica/simétrica), integridade (hash) e autenticação (certificado X.509).', back:'O handshake TLS estabelece chaves simétricas para criptografia de sessão; o certificado válido evita ataques MITM.' },
        /* ---- Área 14 (Farmácia): reforço alinhado à prova CESPE 2018 ---- */
        { id:'fc87', syllabusId:'far', front:'Qual a diferença entre potência e eficácia?', back:'Potência: concentração que produz 50% do efeito máximo (CE50); quanto menor a CE50, mais potente. Eficácia: o efeito máximo (Emax) que o fármaco consegue produzir.' },
        { id:'fc88', syllabusId:'far', front:'Como o antagonista competitivo reversível altera a curva dose-resposta do agonista?', back:'Desloca a curva para a DIREITA (aumenta a CE50) sem reduzir o efeito máximo; é superável aumentando a dose do agonista.' },
        { id:'fc89', syllabusId:'far', front:'E o antagonista não competitivo (ou irreversível)?', back:'Reduz o efeito máximo do agonista; aumentar a dose do agonista não recupera a resposta.' },
        { id:'fc90', syllabusId:'far', front:'Qual o mecanismo de ação da cocaína?', back:'Bloqueia a recaptação de dopamina, noradrenalina e serotonina (principalmente o transportador de dopamina, DAT), aumentando a dopamina na via de recompensa.' },
        { id:'fc91', syllabusId:'far', front:'Como agem os antidepressivos tricíclicos?', back:'Inibem de forma NÃO seletiva a recaptação de noradrenalina e serotonina; também bloqueiam receptores muscarínicos, H1 e α1, o que explica boca seca, sedação e hipotensão.' },
        { id:'fc92', syllabusId:'far', front:'Quais receptores são intracelulares (nucleares)?', back:'Receptores de hormônios esteroides (glicocorticoides, mineralocorticoides, estrogênio), de hormônios tireoidianos, de vitamina D e de retinoides. Atuam como fatores de transcrição.' },
        { id:'fc93', syllabusId:'far', front:'O que é metabolismo de primeira passagem?', back:'Metabolização do fármaco no intestino e no fígado (via sistema porta) antes de chegar à circulação sistêmica. Ocorre sobretudo na via oral e reduz a biodisponibilidade.' },
        { id:'fc94', syllabusId:'fg', front:'Qual a diferença entre infusão e decocção?', back:'Infusão: verte-se água fervente sobre a droga e abafa-se (folhas e flores). Decocção: a droga é fervida junto com a água (cascas, raízes e sementes).' },
        { id:'fc95', syllabusId:'fg', front:'O que é maceração?', back:'Extração a frio: a droga vegetal fica em contato com o solvente, à temperatura ambiente, por horas ou dias.' },
        { id:'fc96', syllabusId:'tox', front:'Por que o chumbo é neurotóxico?', back:'Atravessa a barreira hematoencefálica e causa encefalopatia (mais grave em crianças); também inibe enzimas da síntese do heme, como a ALA-desidratase.' },
        { id:'fc97', syllabusId:'tox', front:'Carvão ativado é útil na intoxicação por álcool?', back:'Não. O carvão ativado adsorve mal álcoois, metais (lítio, ferro) e ácidos ou bases fortes. É útil para muitos fármacos ingeridos recentemente.' },
        { id:'fc98', syllabusId:'qa', front:'A cromatografia em camada delgada (CCD) é qualitativa ou quantitativa?', back:'Qualitativa ou semiquantitativa: identifica pelo fator de retenção (Rf). Para quantificar, usa-se CLAE (HPLC), CG ou espectrofotometria.' },
        { id:'fc99', syllabusId:'qa', front:'O que o infravermelho e o UV-Visível medem?', back:'IV: vibrações das ligações (ex.: estiramento C=O por volta de 1.700 cm⁻¹). UV-Vis: transições eletrônicas (ex.: HOMO → LUMO).' },
        { id:'fc100', syllabusId:'qa', front:'O que é a regressão PLS (mínimos quadrados parciais)?', back:'Uma técnica de calibração multivariada (quimiometria) que quantifica analitos com sinais sobrepostos sem precisar separá-los.' },
        { id:'fc101', syllabusId:'qa', front:'O que é análise gravimétrica?', back:'Determinação quantitativa pela massa: o analito é isolado (por precipitação ou volatilização) e pesado.' },
        { id:'fc102', syllabusId:'qa', front:'Qual o critério de linearidade na validação pela RDC 166/2017?', back:'Coeficiente de correlação (r) acima de 0,990, além da avaliação dos resíduos e da significância do coeficiente angular.' },
        { id:'fc103', syllabusId:'qb', front:'Qual a geometria molecular da amônia (NH₃)?', back:'Piramidal trigonal: 3 pares ligantes e 1 par de elétrons livre (arranjo tetraédrico), com ângulo de cerca de 107°.' },
        { id:'fc104', syllabusId:'qb', front:'Qual a diferença entre esterificação e saponificação?', back:'Esterificação: ácido + álcool → éster + água (a formação de triglicerídeos é uma esterificação). Saponificação: hidrólise do éster em meio básico → sabão (sal de ácido graxo) + álcool.' },
        { id:'fc105', syllabusId:'qb', front:'O que caracteriza o equilíbrio químico?', back:'É um equilíbrio dinâmico: a velocidade direta é igual à inversa (e diferente de zero), e as concentrações permanecem constantes.' },
        { id:'fc106', syllabusId:'qb', front:'Por que o íon Cl⁻ é maior que o átomo de Cl?', back:'O elétron extra aumenta a repulsão entre os elétrons sob a mesma carga nuclear, e o raio cresce. Os cátions, ao contrário, são menores que seus átomos.' },
        { id:'fc107', syllabusId:'qb', front:'Na eletrólise de NaCl em solução aquosa, o que se forma em cada eletrodo?', back:'Ânodo (oxidação): Cl₂. Cátodo (redução): H₂ e OH⁻. Dica: ânodo e oxidação começam com vogal; cátodo e redução, com consoante.' },
        { id:'fc108', syllabusId:'qb', front:'A que classe pertence a cafeína e qual é o seu núcleo?', back:'É um alcaloide metilxantina (1,3,7-trimetilxantina) de núcleo purínico (pirimidina fundida a imidazol), com grupos amida no anel. A guanina tem o mesmo núcleo.' },
        { id:'fc109', syllabusId:'qb', front:'O que é um carbono quiral e qual a sua consequência?', back:'É um carbono ligado a 4 grupos diferentes. Gera estereoisômeros com atividade óptica (ex.: o ácido L-ascórbico tem 2 carbonos quirais).' },
        { id:'fc110', syllabusId:'mic', front:'Qual a diferença entre bactérias gram-positivas e gram-negativas?', back:'Gram-positivas: parede espessa de peptidoglicano e sem membrana externa (coram de roxo). Gram-negativas: camada fina de peptidoglicano e membrana externa com LPS (coram de rosa).' },
        { id:'fc111', syllabusId:'mic', front:'Quais são as formas básicas das bactérias?', back:'Cocos (esféricos), bacilos (bastonetes), espirilos e espiroquetas (espirais) e vibriões (em forma de vírgula).' },
        { id:'fc112', syllabusId:'mic', front:'Qual a morfologia e o Gram da Neisseria meningitidis?', back:'É um diplococo gram-negativo, agente da meningite meningocócica.' },
        { id:'fc113', syllabusId:'mic', front:'Qual o agente do antraz e quais as suas características?', back:'Bacillus anthracis: bacilo gram-positivo formador de esporos. Tem formas cutânea, inalatória e gastrointestinal e já foi usado como arma biológica.' },
        { id:'fc114', syllabusId:'imu', front:'A quais linfócitos o MHC de classe I e o de classe II apresentam antígenos?', back:'MHC I: peptídeos endógenos para linfócitos T CD8 (citotóxicos). MHC II: peptídeos exógenos, nas células apresentadoras, para linfócitos T CD4 (auxiliares).' },
        { id:'fc115', syllabusId:'imu', front:'De que células se originam os plasmócitos?', back:'Da diferenciação de linfócitos B ativados. Os plasmócitos secretam anticorpos (imunidade humoral); linfócitos T não viram plasmócitos.' },
        { id:'fc116', syllabusId:'imu', front:'Quais as citocinas e os alvos dos perfis Th1, Th2 e Th17?', back:'Th1: IFN-γ, contra patógenos intracelulares. Th2: IL-4, IL-5 e IL-13, contra helmintos e na alergia. Th17: IL-17, contra bactérias extracelulares e fungos.' },
        { id:'fc117', syllabusId:'imu', front:'Qual a função dos linfócitos T regulatórios (Treg)?', back:'São CD4⁺CD25⁺FOXP3⁺ e suprimem respostas imunes (via IL-10, TGF-β e CTLA-4), inclusive modulando células apresentadoras, o que mantém a tolerância.' },
        { id:'fc118', syllabusId:'imu', front:'Qual a principal célula apresentadora capaz de ativar linfócitos T naive?', back:'A célula dendrítica.' },
        { id:'fc119', syllabusId:'qual', front:'De que trata a ABNT NBR ISO/IEC 17025:2017?', back:'Dos requisitos gerais para a competência, a imparcialidade e a operação consistente de laboratórios de ensaio e calibração.' },
        { id:'fc120', syllabusId:'qual', front:'Quando a validação de método é obrigatória pela ISO/IEC 17025?', back:'Em métodos não normalizados, em métodos desenvolvidos pelo laboratório e em métodos normalizados usados fora do escopo previsto ou modificados (ampliados).' },
        { id:'fc121', syllabusId:'qual', front:'Quais são os parâmetros de validação analítica da RDC 166/2017?', back:'Seletividade, linearidade, intervalo, precisão (repetibilidade, intermediária e reprodutibilidade), exatidão, limites de detecção e de quantificação e robustez.' },
        { id:'fc122', syllabusId:'qual', front:'Quem responde a uma reclamação no laboratório, segundo a ISO/IEC 17025?', back:'A resposta é feita, ou revisada e aprovada, por pessoa não envolvida nas atividades de laboratório que geraram a reclamação.' },
        { id:'fc123', syllabusId:'qual', front:'Quais condições ambientais a ISO/IEC 17025 manda controlar?', back:'As que podem afetar os resultados, como temperatura, umidade, vibração, ruído, poeira e interferência eletromagnética. Elas devem ser monitoradas e registradas.' },
        { id:'fc124', syllabusId:'lsan', front:'Que lei criou a ANVISA?', back:'A Lei nº 9.782/1999, que também define o Sistema Nacional de Vigilância Sanitária.' },
        { id:'fc125', syllabusId:'lsan', front:'Que lei trata da vigilância sanitária de medicamentos, cosméticos e saneantes?', back:'A Lei nº 6.360/1976.' },
        { id:'fc126', syllabusId:'lsan', front:'Sobre o que dispõe a RDC ANVISA 81/2008?', back:'É o regulamento técnico de bens e produtos importados para fins de vigilância sanitária. Material terapêutico, como células e tecidos, depende de autorização prévia da ANVISA.' },
        { id:'fc127', syllabusId:'lsan', front:'Quais as regras do suplemento de cafeína para atletas na RDC 18/2010?', back:'Deve fornecer de 210 a 420 mg de cafeína por porção e não pode ser adicionado de nutrientes nem de outros não nutrientes. Confira a norma vigente: os suplementos alimentares passaram a seguir a RDC 243/2018.' },
        { id:'fc128', syllabusId:'lsan', front:'Como se comprova a eficácia e a segurança de um fitoterápico?', back:'Por ensaios clínicos, por dados da literatura técnico-científica ou pela tradicionalidade de uso (RDC 14/2010, substituída pela RDC 26/2014).' },
        /* ---- Área 19 — Genética Forense (edital 2025) ---- */
        { id:'fc182', syllabusId:'dh', front:'Que status os tratados de direitos humanos têm no Brasil?', back:'Os aprovados pelo rito do art. 5º, §3º, da CF (3/5 dos votos, em dois turnos, nas duas Casas) equivalem a emenda constitucional. Os demais são supralegais (STF, RE 466.343).' },
        { id:'fc183', syllabusId:'dh', front:'Onde a Convenção Americana prevê o duplo grau de jurisdição?', back:'No art. 8.2.h: o direito de recorrer da sentença a juiz ou tribunal superior.' },
        { id:'fc184', syllabusId:'dh', front:'Quando não se exige esgotar os recursos internos para peticionar à Comissão Interamericana?', back:'Pelo art. 46.2 da CADH: quando não há devido processo legal, quando o acesso aos recursos foi impedido ou quando há demora injustificada na decisão.' },
        { id:'fc185', syllabusId:'dh', front:'O que as Regras de Mandela dizem sobre presos com deficiência?', back:'Exigem adaptações razoáveis para eles. O tratamento diferenciado que assegura igualdade não é discriminação.' },
        { id:'fc186', syllabusId:'dh', front:'O que a CEDAW garante sobre a nacionalidade da mulher casada?', back:'O casamento com estrangeiro ou a mudança de nacionalidade do marido não alteram automaticamente a nacionalidade da esposa, não a tornam apátrida e não a obrigam a adotar a do cônjuge (art. 9).' },
        { id:'fc187', syllabusId:'crim', front:'Como se classificam os vestígios quanto à natureza?', back:'Biológicos (sangue, sêmen, saliva, pelos), físicos, químicos, morfológicos (marcas e formas, como pegadas e marcas de ferramenta) e microvestígios.' },
        { id:'fc188', syllabusId:'crim', front:'Quando começa a cadeia de custódia (CPP, art. 158-A, §1º)?', back:'Com a preservação do local de crime ou com procedimentos policiais ou periciais em que se detecte a existência de vestígio.' },
        { id:'fc189', syllabusId:'crim', front:'Como o assistente técnico acessa o material periciado (CPP, art. 159, §6º)?', back:'Havendo requerimento, o material é disponibilizado no ambiente do órgão oficial, na presença de perito oficial, desde que seja possível conservá-lo.' },
        { id:'fc190', syllabusId:'crim', front:'O que diz a Lei nº 12.030/2009?', back:'Trata das perícias oficiais e assegura ao perito autonomia técnica, científica e funcional.' },
        { id:'fc191', syllabusId:'crim', front:'Como se descarta um vestígio, segundo o CPP?', back:'O descarte é a liberação do vestígio respeitando a legislação vigente e, quando pertinente, mediante autorização judicial (art. 158-B, X). Até lá, o vestígio fica na central de custódia.' },
        { id:'fc192', syllabusId:'pt', front:'Quais os fechos das comunicações oficiais?', back:'"Respeitosamente", para autoridades de hierarquia superior, e "Atenciosamente", para a mesma hierarquia ou inferior.' },
        { id:'fc193', syllabusId:'pt', front:'Em que páginas vai o cabeçalho com o brasão nos expedientes oficiais?', back:'Somente na primeira página do documento (Manual de Redação da Presidência, 3ª ed.).' },
        { id:'fc194', syllabusId:'pt', front:'Existe um "padrão oficial de linguagem"?', back:'O Manual de Redação (3ª ed.) afirma que não existe propriamente um padrão oficial de linguagem: usa-se a norma padrão, com formalidade, impessoalidade e clareza.' },
        { id:'fc195', syllabusId:'rl', front:'A que equivale P → Q e qual a sua negação?', back:'P → Q ≡ ¬P ∨ Q ≡ ¬Q → ¬P (contrapositiva). A negação é P ∧ ¬Q.' },
        { id:'fc196', syllabusId:'rl', front:'O que significa "A só ocorre se B"?', back:'B é condição necessária para A: A → B. Se A ocorreu sem B, a regra foi contrariada.' },
        { id:'fc197', syllabusId:'inf', front:'Qual a diferença entre clustering e classificação em mineração de dados?', back:'Clustering agrupa os dados por semelhança, sem categorias prévias (não supervisionado). Classificação atribui categorias já definidas (supervisionado).' },
        { id:'fc198', syllabusId:'inf', front:'Quais são os 5 Vs do Big Data?', back:'Volume, velocidade, variedade, veracidade e valor.' },
        { id:'fc199', syllabusId:'inf', front:'Qual a diferença entre firewall e antivírus?', back:'O firewall controla o tráfego de rede e bloqueia acessos não autorizados. O antivírus detecta e remove malware nos arquivos e no sistema; não controla o tráfego.' },
        { id:'fc200', syllabusId:'da', front:'O sistema de registro de preços é uma modalidade de licitação?', back:'Não. Na Lei 14.133/2021 ele é um procedimento auxiliar (art. 78). As modalidades são pregão, concorrência, concurso, leilão e diálogo competitivo.' },
        { id:'fc201', syllabusId:'da', front:'A justificativa de preço é obrigatória na contratação direta?', back:'Sim. Inclusive na inexigibilidade, o processo deve ter a justificativa de preço (Lei 14.133/2021, art. 72, VII).' },
        /* ---- Cobertura do edital 2025 (Área 19 + básicos): tópicos não cobrados na prova ---- */
        { id:'fc221', syllabusId:'crim', front:'Como se classificam os fenômenos cadavéricos?', back:'Abióticos imediatos (parada cardiorrespiratória, perda da consciência) e consecutivos (resfriamento, livores, rigidez, desidratação). Transformativos destrutivos (autólise, putrefação) e conservadores (saponificação, mumificação).' },
        { id:'fc222', syllabusId:'crim', front:'Qual a diferença entre calibre real e calibre nominal?', back:'Real: o diâmetro interno do cano medido entre os cheios (as partes entre as raias). Nominal: a designação comercial da munição (ex.: .38, 9 mm).' },
        { id:'fc223', syllabusId:'crim', front:'O que são resíduos do tiro (GSR) e como são analisados?', back:'Partículas com chumbo, bário e antimônio vindas da espoleta, detectadas por microscopia eletrônica de varredura com EDS (MEV/EDS).' },
        { id:'fc224', syllabusId:'dh', front:'O que a Lei nº 13.060/2014 diz sobre o uso de armas de fogo?', back:'Prioriza instrumentos de menor potencial ofensivo. Não é legítimo usar arma de fogo contra pessoa em fuga desarmada que não ofereça risco imediato, nem contra veículo que desrespeite bloqueio sem representar risco.' },
        { id:'fc225', syllabusId:'dh', front:'O que a Convenção contra a Tortura diz sobre exceções?', back:'A proibição é absoluta: nenhuma circunstância excepcional (guerra, ameaça, ordem superior) justifica a tortura.' },
        { id:'fc226', syllabusId:'dh', front:'O que é genocídio, segundo a Convenção de 1948?', back:'Atos cometidos com a intenção de destruir, no todo ou em parte, um grupo nacional, étnico, racial ou religioso.' },
        { id:'fc227', syllabusId:'dh', front:'O que é desaparecimento forçado?', back:'A privação de liberdade por agentes do Estado (ou com o seu apoio), seguida da recusa em reconhecê-la ou da ocultação do paradeiro da pessoa. É um crime de natureza permanente.' },
        { id:'fc228', syllabusId:'rl', front:'Quais são as leis de De Morgan?', back:'¬(P ∧ Q) ≡ ¬P ∨ ¬Q e ¬(P ∨ Q) ≡ ¬P ∧ ¬Q.' },
        { id:'fc229', syllabusId:'rl', front:'Como se negam os quantificadores?', back:'A negação de "Todo A é B" é "Algum A não é B". A negação de "Algum A é B" é "Nenhum A é B".' },
        { id:'fc230', syllabusId:'inf', front:'O que é autenticação multifator (MFA)?', back:'É a combinação de fatores de categorias diferentes: algo que você sabe (senha), algo que você tem (token, celular) e algo que você é (biometria).' },
        { id:'fc231', syllabusId:'inf', front:'Quais os modelos de serviço em nuvem e suas vantagens e desvantagens?', back:'Modelos: IaaS, PaaS e SaaS. Vantagens: elasticidade e pagamento por uso. Desvantagens: dependência da internet e do provedor.' },
        { id:'fc232', syllabusId:'dpp', front:'Quais as hipóteses de flagrante do art. 302 do CPP?', back:'Quem está cometendo o crime; quem acaba de cometê-lo; quem é perseguido logo após; e quem é encontrado logo depois com instrumentos ou objetos que façam presumir a autoria.' },
        { id:'fc233', syllabusId:'dpp', front:'A autoridade policial é obrigada a fazer as diligências pedidas pelo ofendido?', back:'Não: pode deferi-las ou não (CPP, art. 14), salvo o exame de corpo de delito, que não pode ser negado (art. 184).' },
        { id:'fc234', syllabusId:'dp', front:'Quais são as excludentes de ilicitude?', back:'Estado de necessidade, legítima defesa, estrito cumprimento do dever legal e exercício regular de direito (CP, art. 23). O agente responde pelo excesso doloso ou culposo (parágrafo único).' }
      ],
questions: [
        { id:'q01', syllabusId:'dc', stem:'São fundamentos da República Federativa do Brasil, EXCETO:', options:['Soberania','Cidadania','Dignidade da pessoa humana','Separação dos Poderes'], answer:3, explanation:'A separação dos Poderes (art. 60, §4º da CF) é princípio fundamental (art. 2º) e cláusula pétrea, mas não está entre os fundamentos do art. 1º: soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político.' },
        { id:'q02', syllabusId:'dc', stem:'O remédio constitucional adequado para proteger a liberdade de locomoção é:', options:['Habeas data','Mandado de segurança','Habeas corpus','Ação popular'], answer:2, explanation:'O habeas corpus (art. 5º, LXVIII, CF) tem por finalidade garantir a liberdade de locomoção contra ilegalidade ou abuso de poder estatal.' },
        { id:'q03', syllabusId:'da', stem:'São princípios expressos da Administração Pública no art. 37 da CF, EXCETO:', options:['Legalidade','Impessoalidade','Razoabilidade','Publicidade'], answer:2, explanation:'A razoabilidade é princípio implícito e não consta entre os princípios expressos do art. 37, que são legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE).' },
        { id:'q04', syllabusId:'da', stem:'A Lei nº 14.133/2021 dispõe sobre:', options:['Licitações e contratos administrativos','Improbidade administrativa','Processo administrativo disciplinar','Crimes de responsabilidade'], answer:0, explanation:'A Lei nº 14.133/2021 é a nova Lei de Licitações e Contratos Administrativos, que substituiu a Lei nº 8.666/1993.' },
        { id:'q05', syllabusId:'dp', stem:'Segundo o princípio da legalidade penal, não há crime sem:', options:['Sentença judicial','Lei anterior que o defina','Denúncia do Ministério Público','Inquérito policial'], answer:1, explanation:'Nullum crimen sine lege (art. 5º, XXXIX, CF, e art. 1º do CP): exige lei anterior que defina o tipo penal e a respectiva cominação.' },
        { id:'q06', syllabusId:'dp', stem:'A lei penal mais benéfica:', options:['Aplica-se apenas a fatos futuros','Retroage em benefício do réu','Nunca retroage','Só retroage após o trânsito em julgado'], answer:1, explanation:'Art. 2º do CP: a lei posterior mais benéfica aplica-se aos fatos anteriores, retroagindo os efeitos penais em favor do réu.' },
        { id:'q07', syllabusId:'dpp', stem:'O inquérito policial é:', options:['Peça acusatória obrigatória','Procedimento administrativo, inquisitivo e dispensável','Fase judicial contraditória','Condição de procedibilidade da ação penal pública incondicionada'], answer:1, explanation:'O inquérito policial é procedimento administrativo inquisitivo (arts. 4º a 23 do CPP), dispensável para a promoção da ação penal pública incondicionada.' },
        { id:'q08', syllabusId:'dpp', stem:'A cadeia de custódia está prevista no:', options:['Código Civil','Código Penal','Código de Processo Penal (art. 158-A)','Código Tributário Nacional'], answer:2, explanation:'A disciplina da cadeia de custódia encontra-se no art. 158-A do CPP, que rege o rastreamento dos vestígios da coleta à análise.' },
        { id:'q09', syllabusId:'le', stem:'A Lei nº 11.343/2006 dispõe sobre:', options:['Crimes hediondos','Drogas (política e crimes)','Desarmamento','Organizações criminosas'], answer:1, explanation:'A Lei nº 11.343/2006 é a Política Nacional de Drogas, que estabelece as diretrizes e bases para as ações concernentes às drogas.' },
        { id:'q10', syllabusId:'le', stem:'O crime de tortura é tratado pela Lei:', options:['8.072/1990','9.455/1997','9.613/1998','12.850/2013'], answer:1, explanation:'A Lei nº 9.455/1997 define o crime de tortura e as respectivas penas (art. 1º).' },
        { id:'q11', syllabusId:'far', stem:'A farmacocinética estuda:', options:['O mecanismo de ação dos fármacos','O que o organismo faz com o fármaco (ADME)','Apenas interações medicamentosas','Apenas efeitos colaterais'], answer:1, explanation:'Farmacocinética: estudo do que o organismo faz com o fármaco, englobando absorção, distribuição, metabolismo e excreção (ADME).' },
        { id:'q12', syllabusId:'far', stem:'Os AINEs atuam principalmente inibindo:', options:['Canais de cálcio','Ciclo-oxigenases (COX)','Receptores opioides','Bombas de prótons'], answer:1, explanation:'AINEs (anti-inflamatórios não esteroides) inibem as ciclo-oxigenases (COX-1 e COX-2), reduzindo a síntese de prostaglandinas.' },
        { id:'q13', syllabusId:'far', stem:'A varfarina exerce ação anticoagulante inibindo:', options:['A trombina diretamente','A vitamina K epóxido redutase','A antitrombina III','A ciclo-oxigenase'], answer:1, explanation:'A varfarina inibe a vitamina K epóxido redutase (VKOR), impedindo a carboxilação dos fatores de coagulação dependentes de vitamina K.' },
        { id:'q14', syllabusId:'tox', stem:'O antídoto utilizado na intoxicação por paracetamol é:', options:['Naloxona','N-acetilcisteína','Flumazenil','Atropina'], answer:1, explanation:'A N-acetilcisteína repõe a glutationa hepática e é o antídoto de escolha para a intoxicação aguda por paracetamol.' },
        { id:'q15', syllabusId:'tox', stem:'Na intoxicação por organofosforados, utiliza-se:', options:['Atropina (e pralidoxima)','Etanol','Deferoxamina','Hidroxocobalamina'], answer:0, explanation:'Associação de atropina (bloqueia os efeitos muscarínicos) com pralidoxima (reativa a acetilcolinesterase) é o protocolo padrão.' },
        { id:'q16', syllabusId:'tox', stem:'A intoxicação por monóxido de carbono pode ser avaliada pela dosagem de:', options:['Meta-hemoglobina','Carboxihemoglobina','Bilirrubina','Creatinina'], answer:1, explanation:'A carboxi-hemoglobina (COHb) é o marcador bioquímico padrão para diagnóstico de intoxicação por CO.' },
        { id:'q17', syllabusId:'fg', stem:'A espécie Papaver somniferum é fonte do alcaloide:', options:['Quinina','Morfina','Atropina','Digitoxina'], answer:1, explanation:'A Papaver somniferum (papoula) é a principal fonte natural de morfina e outros opioides fenantrenos.' },
        { id:'q18', syllabusId:'br', stem:'O método de Kjeldahl é utilizado para determinar:', options:['Lipídios','Proteínas (nitrogênio total)','Cinzas','Umidade'], answer:1, explanation:'O método de Kjeldahl quantifica o nitrogênio total da amostra, sendo usado como parâmetro estimativo de teor proteico.' },
        { id:'q19', syllabusId:'qb', stem:'A Lei de Beer-Lambert relaciona a absorbância com:', options:['Temperatura e pressão','Concentração e caminho óptico','pH e condutividade','Massa molecular e densidade'], answer:1, explanation:'A lei estabelece a relação direta entre a absorbância, a concentração do absorvente e o caminho óptico percorrido.' },
        { id:'q20', syllabusId:'crim', stem:'Preservar o local de crime é essencial para:', options:['Acelerar o julgamento','Evitar a contaminação e a perda de vestígios','Dispensar a perícia','Reduzir o inquérito'], answer:1, explanation:'A preservação da cena do crime evita a contaminação, alteração ou perda de vestígios técnicos, indispensáveis à perícia criminal.' },
        { id:'q21', syllabusId:'rl', stem:'A negação da proposição "Todo A é B" é:', options:['Nenhum A é B','Algum A não é B','Todo B é A','Algum B é A'], answer:1, explanation:'A negação universal ("todo") particulariza para "existe ao menos um A que não é B", seguindo a lógica quantificacional de oposição.' },
        { id:'q22', syllabusId:'pt', stem:'O emprego da crase ocorre, tipicamente, na fusão de:', options:['Preposição "a" com artigo "a(s)"','Preposição "de" com artigo','Verbo com preposição','Pronome com conjunção'], answer:0, explanation:'A crase é a fusão da preposição "a" com o artigo feminino "a(s)" (ex.: vou à praia, às vezes).' },
        { id:'q23', syllabusId:'inf', stem:'O protocolo HTTPS tem como principal função:', options:['Aumentar a velocidade da rede','Garantir comunicação criptografada entre cliente e servidor','Bloquear anúncios','Compactar arquivos'], answer:1, explanation:'O HTTPS (HTTP over SSL/TLS) fornece criptografia, autenticação e integridade da comunicação entre cliente e servidor.' },
        /* ---- CESPE 2018 · PF · Perito Criminal Federal Área 14 (Farmácia) · itens 51–120 ----
           Formato Certo/Errado com gabarito oficial definitivo. Itens anulados (56, 71) e itens
           que dependem de figura não reproduzível foram omitidos; "(adaptado)" = enunciado
           reescrito para ficar autossuficiente sem a figura. answer: 0 = Certo, 1 = Errado. */
        { id:'pf18-51', syllabusId:'far', source:'CESPE 2018 · item 51', stem:'Os receptores acoplados à proteína G representam a classe mais abundante de receptores no corpo humano e são considerados receptores metabotrópicos.', options:['Certo','Errado'], answer:0, explanation:'Os GPCRs formam a maior superfamília de receptores de membrana e são metabotrópicos: agem via proteína G e segundos mensageiros, não abrindo um canal diretamente.' },
        { id:'pf18-52', syllabusId:'far', source:'CESPE 2018 · item 52', stem:'Canais iônicos transmembrana podem ser considerados receptores farmacológicos.', options:['Certo','Errado'], answer:0, explanation:'Canais iônicos controlados por ligante (receptores ionotrópicos, como o GABA-A e o nicotínico) são alvos farmacológicos clássicos.' },
        { id:'pf18-53', syllabusId:'far', source:'CESPE 2018 · item 53', stem:'Os receptores de glicocorticoides são classificados como receptores intracelulares.', options:['Certo','Errado'], answer:1, explanation:'Gabarito oficial: ERRADO. Item polêmico: o receptor de glicocorticoide fica no citoplasma e age no núcleo como fator de transcrição, e muitos livros o chamam de intracelular. Na prova, vale o gabarito da banca.' },
        { id:'pf18-54', syllabusId:'far', source:'CESPE 2018 · item 54', stem:'Fármacos administrados por via oral não sofrem metabolismo de primeira passagem.', options:['Certo','Errado'], answer:1, explanation:'A via oral é justamente a mais sujeita ao metabolismo de primeira passagem, no intestino e no fígado (via sistema porta).' },
        { id:'pf18-55', syllabusId:'far', source:'CESPE 2018 · item 55', stem:'O metabolismo de primeira passagem diminui a biodisponibilidade de fármacos.', options:['Certo','Errado'], answer:0, explanation:'Parte do fármaco é metabolizada antes de chegar à circulação sistêmica, o que reduz a fração biodisponível.' },
        { id:'pf18-57', syllabusId:'far', source:'CESPE 2018 · item 57', stem:'A insuficiência renal pode aumentar a taxa de eliminação de um fármaco excretado por via renal.', options:['Certo','Errado'], answer:1, explanation:'A insuficiência renal REDUZ a eliminação, aumenta a meia-vida e o risco de toxicidade; por isso a dose é ajustada.' },
        { id:'pf18-58', syllabusId:'far', source:'CESPE 2018 · item 58', stem:'Fármacos antagonistas interagem com receptores, sem alterar a sinalização intracelular, mas impedem a ação de um agonista.', options:['Certo','Errado'], answer:0, explanation:'O antagonista tem afinidade, mas não tem eficácia intrínseca: ocupa o receptor sem ativá-lo e bloqueia o agonista.' },
        { id:'pf18-59', syllabusId:'far', source:'CESPE 2018 · item 59', stem:'A curva dose-resposta de um fármaco agonista na presença de um antagonista competitivo reversível é deslocada para a esquerda.', options:['Certo','Errado'], answer:1, explanation:'Ela é deslocada para a DIREITA (a potência aparente diminui), sem redução do efeito máximo.' },
        { id:'pf18-60', syllabusId:'far', source:'CESPE 2018 · item 60', stem:'A eficácia de um fármaco corresponde à concentração em que esse fármaco produz 50% de sua resposta máxima.', options:['Certo','Errado'], answer:1, explanation:'Isso é a POTÊNCIA (CE50). Eficácia é o efeito máximo (Emax) que o fármaco consegue produzir.' },
        { id:'pf18-61', syllabusId:'far', source:'CESPE 2018 · item 61', stem:'José usa o medicamento A para dor severa há um ano, agora sem sucesso, e ingeriu três comprimidos do medicamento B, um hipnótico e sedativo. Julgue: os opioides são os fármacos de escolha para tratar dor severa.', options:['Certo','Errado'], answer:0, explanation:'Na escada analgésica da OMS, a dor intensa é tratada com opioides fortes, como a morfina.' },
        { id:'pf18-62', syllabusId:'far', source:'CESPE 2018 · item 62', stem:'José usa o medicamento A para dor severa há um ano, agora sem sucesso, e ingeriu três comprimidos do medicamento B, um hipnótico e sedativo. Julgue: o fármaco A poderia ser um opioide e o fármaco B, um benzodiazepínico.', options:['Certo','Errado'], answer:0, explanation:'Perda de efeito com o uso prolongado sugere opioide (tolerância), e um hipnótico-sedativo sugere benzodiazepínico. A associação dos dois pode causar depressão respiratória fatal.' },
        { id:'pf18-63', syllabusId:'far', source:'CESPE 2018 · item 63', stem:'Na mesma situação de José, um exemplo de medicamento B (hipnótico e sedativo) é a quetiapina, comumente utilizada na prática clínica como hipnótico.', options:['Certo','Errado'], answer:1, explanation:'A quetiapina é um antipsicótico atípico, não um hipnótico-sedativo de referência.' },
        { id:'pf18-64', syllabusId:'far', source:'CESPE 2018 · item 64', stem:'Na mesma situação de José, se o medicamento A for um anti-inflamatório não esteroidal, a associação dele com o medicamento B (hipnótico-sedativo) poderá levar à depressão do sistema nervoso central e ao óbito.', options:['Certo','Errado'], answer:1, explanation:'AINEs não deprimem o SNC. O risco grave de depressão está na associação de opioides com benzodiazepínicos.' },
        { id:'pf18-65', syllabusId:'far', source:'CESPE 2018 · item 65', stem:'A tolerância farmacológica ocorre quando, após a administração repetida de uma droga, há a necessidade do aumento da dose para produzir um mesmo efeito anterior.', options:['Certo','Errado'], answer:0, explanation:'Essa é exatamente a definição de tolerância.' },
        { id:'pf18-66', syllabusId:'far', source:'CESPE 2018 · item 66', stem:'Drogas estimulantes do sistema nervoso central têm potencial para causar dependência porque ativam a via de recompensa e causam aumento da liberação de dopamina nessa região encefálica.', options:['Certo','Errado'], answer:0, explanation:'A via mesolímbica (da área tegmentar ventral ao núcleo accumbens) é dopaminérgica, e o aumento de dopamina ali reforça o uso.' },
        { id:'pf18-67', syllabusId:'far', source:'CESPE 2018 · item 67', stem:'Os fármacos antidepressivos tricíclicos podem causar dependência porque atuam como inibidores seletivos da recaptação de serotonina.', options:['Certo','Errado'], answer:1, explanation:'Os tricíclicos inibem a recaptação de noradrenalina e serotonina de forma NÃO seletiva. Os ISRS (como a fluoxetina) são outra classe.' },
        { id:'pf18-68', syllabusId:'far', source:'CESPE 2018 · item 68', stem:'A cocaína é uma droga estimulante do sistema nervoso central e seu mecanismo de ação baseia-se no bloqueio dos receptores GABA-A.', options:['Certo','Errado'], answer:1, explanation:'A cocaína bloqueia a recaptação de monoaminas, principalmente pelo transportador de dopamina (DAT). Quem age no GABA-A são os benzodiazepínicos e os barbitúricos.' },
        { id:'pf18-69', syllabusId:'fg', source:'CESPE 2018 · item 69', stem:'Decocção é o método utilizado para extração que consiste em expor o produto natural à água fervente e abafá-lo em recipiente com tampa.', options:['Certo','Errado'], answer:1, explanation:'Essa é a descrição da INFUSÃO. Na decocção, a droga é fervida junto com a água, método usado para partes duras como cascas e raízes.' },
        { id:'pf18-70', syllabusId:'tox', source:'CESPE 2018 · item 70', stem:'O chumbo pode causar intoxicação no sistema nervoso central, já que o metal ultrapassa a barreira hematoencefálica.', options:['Certo','Errado'], answer:0, explanation:'O chumbo atravessa a barreira hematoencefálica e causa encefalopatia, sobretudo em crianças.' },
        { id:'pf18-72', syllabusId:'tox', source:'CESPE 2018 · item 72', stem:'Lauro, 19 anos, chegou ao hospital com ataxia, déficit cognitivo, hipotensão e bradicardia; a alcoolemia, isoladamente, não explicava o quadro. Julgue: uma possível causa seria a associação de álcool a barbitúricos, por sinergismo dos efeitos.', options:['Certo','Errado'], answer:0, explanation:'Etanol e barbitúricos são depressores do SNC e potencializam o efeito um do outro.' },
        { id:'pf18-73', syllabusId:'tox', source:'CESPE 2018 · item 73', stem:'No caso de Lauro, se o exame também mostrasse benzodiazepínico, as duas intoxicações poderiam ser tratadas com flumazenil (para o benzodiazepínico) e carvão ativado (para o álcool).', options:['Certo','Errado'], answer:1, explanation:'O carvão ativado adsorve mal o etanol e não é tratamento para intoxicação alcoólica.' },
        { id:'pf18-74', syllabusId:'qb', source:'CESPE 2018 · item 74', stem:'A cafeína é um alcaloide de núcleo purínico, solúvel em água (22 g/L) e em clorofórmio (130 g/L). O grupo funcional amida está presente na molécula da cafeína.', options:['Certo','Errado'], answer:0, explanation:'A cafeína tem carbonilas ligadas a nitrogênio no anel, ou seja, amidas cíclicas.' },
        { id:'pf18-75', syllabusId:'qb', source:'CESPE 2018 · item 75', stem:'A cafeína (alcaloide metilxantina) apresenta caráter ácido em meio aquoso.', options:['Certo','Errado'], answer:1, explanation:'Como alcaloide, a cafeína é praticamente neutra ou uma base muito fraca; não tem caráter ácido em água.' },
        { id:'pf18-76', syllabusId:'qa', source:'CESPE 2018 · item 76', stem:'A cromatografia de camada delgada permite quantificar a concentração de cafeína presente em um suplemento alimentar termogênico.', options:['Certo','Errado'], answer:1, explanation:'A CCD é qualitativa ou semiquantitativa (identifica pelo Rf). Para quantificar, usa-se CLAE (HPLC) ou espectrofotometria.' },
        { id:'pf18-77', syllabusId:'qa', source:'CESPE 2018 · item 77', stem:'A banda de absorção mais evidente da cafeína no espectro infravermelho (ligação C=O, 1.709–1.654 cm⁻¹) se deve à excitação de um elétron da carbonila do HOMO para o LUMO.', options:['Certo','Errado'], answer:1, explanation:'Bandas no IV vêm de VIBRAÇÕES das ligações (estiramento C=O). Transições HOMO → LUMO são eletrônicas e aparecem no UV-Visível.' },
        { id:'pf18-78', syllabusId:'qb', source:'CESPE 2018 · item 78', stem:'A cafeína é solúvel em água (22 g/L) e em clorofórmio (130 g/L). Com base na sua solubilidade, é correto afirmar que a cafeína é uma molécula com alta polaridade.', options:['Certo','Errado'], answer:1, explanation:'Ela se dissolve mais no clorofórmio, pouco polar, do que na água, o que indica polaridade moderada, e não alta.' },
        { id:'pf18-79', syllabusId:'qb', source:'CESPE 2018 · item 79', stem:'Os dois anéis presentes na estrutura da cafeína também estão presentes na molécula da guanina.', options:['Certo','Errado'], answer:0, explanation:'As duas moléculas têm o núcleo purínico: um anel pirimidínico fundido a um imidazol.' },
        { id:'pf18-81', syllabusId:'qb', source:'CESPE 2018 · item 81', stem:'A molécula de amônia tem estrutura trigonal planar.', options:['Certo','Errado'], answer:1, explanation:'A amônia é PIRAMIDAL trigonal: 3 pares ligantes e 1 par livre, com ângulo de cerca de 107°.' },
        { id:'pf18-82', syllabusId:'qb', source:'CESPE 2018 · item 82 (adaptado)', stem:'A reação de formação de triglicerídeos a partir de glicerol e ácidos graxos (lipogênese) é uma reação de saponificação.', options:['Certo','Errado'], answer:1, explanation:'Formar triglicerídeos é uma ESTERIFICAÇÃO. Saponificação é a hidrólise de éster em meio básico, que gera sabão e glicerol.' },
        { id:'pf18-83', syllabusId:'qb', source:'CESPE 2018 · item 83 (adaptado)', stem:'A adição dos ácidos HCl ou H₂SO₄, que catalisam a esterificação do glicerol (um poliálcool), aumentaria a constante da lei de velocidade dessa reação.', options:['Certo','Errado'], answer:0, explanation:'O catalisador diminui a energia de ativação e, com isso, aumenta a constante de velocidade k, sem deslocar o equilíbrio.' },
        { id:'pf18-84', syllabusId:'qb', source:'CESPE 2018 · item 84', stem:'A água é um dos produtos da reação de formação de triglicerídeos.', options:['Certo','Errado'], answer:0, explanation:'Na esterificação, cada ligação éster formada entre o glicerol e um ácido graxo libera uma molécula de água.' },
        { id:'pf18-85', syllabusId:'qb', source:'CESPE 2018 · item 85', stem:'Se a reação na lipogênese estiver em equilíbrio, as taxas (velocidade) da reação de formação e de hidrólise do triglicerídeo são iguais a zero.', options:['Certo','Errado'], answer:1, explanation:'No equilíbrio dinâmico, as velocidades direta e inversa são IGUAIS entre si, mas diferentes de zero.' },
        { id:'pf18-89', syllabusId:'qb', source:'CESPE 2018 · item 89', stem:'O ácido ascórbico (vitamina C) apresenta atividade ótica.', options:['Certo','Errado'], answer:0, explanation:'Ele tem 2 carbonos quirais (C4 e C5); a forma biologicamente ativa é o ácido L-ascórbico.' },
        { id:'pf18-90', syllabusId:'qb', source:'CESPE 2018 · item 90', stem:'Os átomos de carbono do ácido ascórbico têm estrutura tetraédrica.', options:['Certo','Errado'], answer:1, explanation:'Os carbonos da carbonila (C=O) e da dupla C=C do anel são sp², com geometria trigonal plana; nem todos são tetraédricos.' },
        { id:'pf18-91', syllabusId:'qa', source:'CESPE 2018 · item 91', stem:'Ácido acetilsalicílico e cafeína têm bandas sobrepostas nos espectros de emissão, mas podem ser quantificados por regressão PLS (Partial Least Squares). O PLS é uma técnica de calibração multivariada.', options:['Certo','Errado'], answer:0, explanation:'O PLS relaciona muitas variáveis espectrais à concentração; é uma ferramenta central da quimiometria.' },
        { id:'pf18-92', syllabusId:'qa', source:'CESPE 2018 · item 92', stem:'O texto compara o método PLS a um método quantitativo em que os compostos são separados e pesados individualmente para determinar o teor de cada um. Ou seja, o PLS é comparado a uma análise gravimétrica.', options:['Certo','Errado'], answer:0, explanation:'Separar e pesar os componentes para determinar o teor é, por definição, análise gravimétrica.' },
        { id:'pf18-93', syllabusId:'qa', source:'CESPE 2018 · item 93', stem:'Foi feito um ajuste linear entre a concentração de ácido acetilsalicílico e a intensidade máxima do sinal de emissão, com coeficiente de correlação 0,98. Nessa situação, a relação não é linear, pois o coeficiente de correlação é menor que um.', options:['Certo','Errado'], answer:1, explanation:'r = 0,98 indica forte correlação linear; r < 1 significa apenas que o ajuste não é perfeito. (Para validação, a RDC 166/2017 exige r > 0,990.)' },
        { id:'pf18-94', syllabusId:'qb', source:'CESPE 2018 · item 94', stem:'O ânion presente no soro fisiológico (solução de NaCl) é menor que o seu átomo correspondente neutro.', options:['Certo','Errado'], answer:1, explanation:'O Cl⁻ é MAIOR que o Cl: o elétron extra aumenta a repulsão e expande a nuvem eletrônica.' },
        { id:'pf18-95', syllabusId:'qb', source:'CESPE 2018 · item 95', stem:'Se for aplicada uma adequada diferença de potencial no soro fisiológico, haverá formação de Cl₂ no cátodo.', options:['Certo','Errado'], answer:1, explanation:'O Cl₂ se forma no ÂNODO, por oxidação (2Cl⁻ → Cl₂ + 2e⁻). No cátodo ocorre redução, com formação de H₂.' },
        { id:'pf18-96', syllabusId:'qb', source:'CESPE 2018 · item 96', stem:'O vapor de água no interior de um frasco fechado contendo soro fisiológico exerce sobre o soro e sobre as paredes do recipiente a mesma pressão.', options:['Certo','Errado'], answer:0, explanation:'Um gás em equilíbrio exerce a mesma pressão em todas as direções; essa é a pressão de vapor.' },
        { id:'pf18-97', syllabusId:'qb', source:'CESPE 2018 · item 97', stem:'Na preparação do soro fisiológico, a interação eletrostática do ânion com seu contra-íon no sólido cristalino não é superada pela interação desses íons individualmente com as moléculas do solvente.', options:['Certo','Errado'], answer:1, explanation:'O NaCl se dissolve justamente porque a solvatação (interação íon-dipolo com a água) supera a energia do retículo cristalino.' },
        { id:'pf18-100', syllabusId:'mic', source:'CESPE 2018 · item 100 (adaptado)', stem:'Bactérias em forma de bacilo, como as encontradas no líquido cefalorraquidiano do caso da prova, podem ser transmitidas por inalação, ingestão ou por via cutânea.', options:['Certo','Errado'], answer:0, explanation:'O Bacillus anthracis, por exemplo, infecta pelas vias inalatória, gastrointestinal e cutânea.' },
        { id:'pf18-101', syllabusId:'mic', source:'CESPE 2018 · item 101 (adaptado)', stem:'Encontrando-se bacilos no líquido cefalorraquidiano, deve-se realizar a prova de Gram nessa amostra para a confirmação da infecção por Neisseria meningitidis.', options:['Certo','Errado'], answer:1, explanation:'A N. meningitidis é um DIPLOCOCO gram-negativo, e não um bacilo.' },
        { id:'pf18-102', syllabusId:'mic', source:'CESPE 2018 · item 102 (adaptado)', stem:'O antraz, doença que já foi explorada como arma biológica, é causado por uma bactéria em forma de bacilo.', options:['Certo','Errado'], answer:0, explanation:'O agente é o Bacillus anthracis, um bacilo gram-positivo formador de esporos.' },
        { id:'pf18-103', syllabusId:'mic', source:'CESPE 2018 · item 103', stem:'O resultado positivo para a presença de bactéria gram-positiva significa que a bactéria possui uma camada fina de peptidoglicano e uma membrana externa com lipopolissacarídeo, fosfolipídios e proteínas.', options:['Certo','Errado'], answer:1, explanation:'Essa descrição é das GRAM-NEGATIVAS. As gram-positivas têm parede espessa de peptidoglicano e não têm membrana externa.' },
        { id:'pf18-104', syllabusId:'imu', source:'CESPE 2018 · item 104 (adaptado)', stem:'Na diferenciação de linfócitos T naive em efetores, a substância que inicia o processo pode ser um antígeno, e a célula que o apresenta, uma célula dendrítica.', options:['Certo','Errado'], answer:0, explanation:'As células dendríticas são as principais células apresentadoras capazes de ativar linfócitos T naive.' },
        { id:'pf18-105', syllabusId:'imu', source:'CESPE 2018 · item 105 (adaptado)', stem:'Linfócitos T regulatórios (Treg) são células capazes de modular a atividade de células apresentadoras de antígeno.', options:['Certo','Errado'], answer:0, explanation:'As Treg suprimem respostas imunes, inclusive inibindo células apresentadoras, por meio de CTLA-4, IL-10 e TGF-β.' },
        { id:'pf18-106', syllabusId:'imu', source:'CESPE 2018 · item 106 (adaptado)', stem:'Para gerar uma resposta imunológica do tipo Th1, a célula apresentadora de antígeno sinaliza o linfócito T CD4 via MHC classe I.', options:['Certo','Errado'], answer:1, explanation:'Linfócitos T CD4, que originam Th1, Th2 e Th17, reconhecem antígeno em MHC de CLASSE II. O MHC I apresenta antígeno a linfócitos T CD8.' },
        { id:'pf18-107', syllabusId:'imu', source:'CESPE 2018 · item 107 (adaptado)', stem:'Linfócitos T podem se diferenciar em plasmócitos e secretar anticorpos para compor a imunidade humoral.', options:['Certo','Errado'], answer:1, explanation:'Plasmócitos derivam de linfócitos B. Linfócitos T auxiliam os B, mas não produzem anticorpos.' },
        { id:'pf18-109', syllabusId:'imu', source:'CESPE 2018 · item 109 (adaptado)', stem:'A resposta Th17 está associada à defesa contra bactérias extracelulares e fungos.', options:['Certo','Errado'], answer:0, explanation:'As células Th17 produzem IL-17, recrutam neutrófilos e atuam contra bactérias extracelulares e fungos.' },
        { id:'pf18-110', syllabusId:'qual', source:'CESPE 2018 · item 110', stem:'Em caso de método não normalizado, de método criado pelo próprio laboratório ou de situação de ampliação de método normalizado, é indispensável a validação de método.', options:['Certo','Errado'], answer:0, explanation:'A ISO/IEC 17025:2017 exige validar métodos não normalizados, métodos desenvolvidos pelo laboratório e métodos normalizados usados fora do escopo ou modificados.' },
        { id:'pf18-113', syllabusId:'qual', source:'CESPE 2018 · item 113', stem:'Temperatura e som são variáveis que podem comprometer a validade de resultados de exames realizados em laboratório.', options:['Certo','Errado'], answer:0, explanation:'A ISO/IEC 17025 exige monitorar e controlar condições ambientais, como temperatura, umidade, vibração e ruído, quando elas afetam os resultados.' },
        { id:'pf18-114', syllabusId:'qual', source:'CESPE 2018 · item 114', stem:'Atividades de laboratório podem ser providas externamente se o laboratório não tiver recurso financeiro ou equipe técnica capacitada para realizá-las.', options:['Certo','Errado'], answer:0, explanation:'A ISO/IEC 17025:2017 admite atividades providas externamente (subcontratação) quando faltam recursos ou competência, desde que o cliente seja informado e o provedor seja competente.' },
        { id:'pf18-115', syllabusId:'qual', source:'CESPE 2018 · item 115', stem:'Em caso de reclamação ao laboratório, as conclusões a serem informadas ao reclamante devem ser analisadas criticamente por indivíduo que não esteja envolvido nas atividades de laboratório que tenham motivado a queixa.', options:['Certo','Errado'], answer:0, explanation:'A ISO/IEC 17025:2017 exige que a resposta seja feita, ou revisada e aprovada, por pessoa não envolvida nas atividades em questão.' },
        { id:'pf18-117', syllabusId:'lsan', source:'CESPE 2018 · item 117', stem:'Tecido destinado a uso terapêutico que não tenha sido autorizado pela área técnica da ANVISA pode entrar em território nacional se estiver identificado com data de envio, nome do paciente e centro hospitalar de destino.', options:['Certo','Errado'], answer:1, explanation:'A importação de células, tecidos e órgãos para uso terapêutico depende de autorização prévia da ANVISA (RDC 81/2008); identificar a remessa não a dispensa.' },
        { id:'pf18-118', syllabusId:'lsan', source:'CESPE 2018 · item 118', stem:'Os suplementos hidroeletrolíticos para atletas devem conter até 700 mg/L de potássio e até 15% (m/v) de fibras alimentares.', options:['Certo','Errado'], answer:1, explanation:'A RDC 18/2010 limitava o potássio a até 700 mg/L, mas não permitia adicionar fibras alimentares a esses suplementos.' },
        { id:'pf18-119', syllabusId:'lsan', source:'CESPE 2018 · item 119', stem:'Suplemento de cafeína para atletas não pode ser adicionado de nutrientes.', options:['Certo','Errado'], answer:0, explanation:'Pela RDC 18/2010, esse suplemento fornece de 210 a 420 mg de cafeína por porção e não pode receber nutrientes nem outros não nutrientes.' },
        { id:'pf18-120', syllabusId:'lsan', source:'CESPE 2018 · item 120', stem:'Tradicionalidade de uso constitui informação comprobatória de eficácia e segurança de fitoterápico.', options:['Certo','Errado'], answer:0, explanation:'A RDC 14/2010 aceitava a tradicionalidade de uso como forma de comprovação. A norma atual (RDC 26/2014) mantém essa via para o "produto tradicional fitoterápico".' },
        /* ---- Cebraspe 2025 · PF · Perito Criminal Federal · Área 19 Genética Forense (aplicação 27/07/2025) ----
           Gabarito oficial definitivo. Omitidos: anulados (básicos 18, 19, 31, 38; específicos 55, 84, 91, 93, 94,
           97, 99, 106, 116), itens que dependem do texto longo de Português (1–8) e itens cuja justificativa
           da banca não dá para reconstruir com segurança (14, 50, 117). answer: 0 = Certo, 1 = Errado. */
        { id:'pf25-09', syllabusId:'pt', source:'Cebraspe 2025 · item 9', stem:'Com base no Manual de Redação da Presidência da República: Respeitosamente e Atenciosamente são os dois fechos indicados para as comunicações oficiais, sendo o seu uso regulado pela relação de hierarquia entre emissor e destinatário da comunicação.', options:['Certo','Errado'], answer:0, explanation:'"Respeitosamente" é usado para autoridades de hierarquia superior; "Atenciosamente", para a mesma hierarquia ou inferior.' },
        { id:'pf25-10', syllabusId:'pt', source:'Cebraspe 2025 · item 10', stem:'Exposição de motivos é o expediente oficial a ser elaborado para se submeter projeto de ato normativo à consideração do presidente ou vice-presidente da República.', options:['Certo','Errado'], answer:0, explanation:'A exposição de motivos é dirigida ao Presidente (ou ao Vice) para informar sobre um assunto, propor uma medida ou submeter projeto de ato normativo.' },
        { id:'pf25-11', syllabusId:'pt', source:'Cebraspe 2025 · item 11', stem:'Em expedientes oficiais que tenham mais de uma página, todas as páginas devem conter cabeçalho que apresente o brasão de Armas da República, o nome do órgão principal e, se necessário, o nome de órgãos secundários.', options:['Certo','Errado'], answer:1, explanation:'O cabeçalho com o brasão vai somente na primeira página do documento.' },
        { id:'pf25-12', syllabusId:'pt', source:'Cebraspe 2025 · item 12', stem:'Com vistas a garantir o caráter público e a finalidade das comunicações oficiais, nelas deve ser empregado o padrão oficial de linguagem, que, desenvolvido a partir da norma padrão da língua portuguesa, é o modelo reconhecido como regra para os documentos oficiais.', options:['Certo','Errado'], answer:1, explanation:'O Manual (3ª ed.) afirma que não existe propriamente um "padrão oficial de linguagem"; o que se usa é a norma padrão da língua.' },
        { id:'pf25-13', syllabusId:'inf', source:'Cebraspe 2025 · item 13', stem:'No Windows, um arquivo pode estar distribuído em diversos volumes.', options:['Certo','Errado'], answer:1, explanation:'Um arquivo pertence a um único volume. O que pode ocorrer é um mesmo volume ocupar vários discos (volume estendido).' },
        { id:'pf25-15', syllabusId:'inf', source:'Cebraspe 2025 · item 15', stem:'A técnica de clustering em data mining atribui categorias aos grupos de dados para facilitar a análise e a tomada de decisão.', options:['Certo','Errado'], answer:1, explanation:'O clustering agrupa os dados por semelhança, sem categorias prévias (não supervisionado). Atribuir categorias definidas é classificação.' },
        { id:'pf25-16', syllabusId:'inf', source:'Cebraspe 2025 · item 16', stem:'Em geral, projetos de Big Data caracterizam-se por cinco diferentes atributos: valor, variedade, velocidade, veracidade e volume.', options:['Certo','Errado'], answer:0, explanation:'Esses são os 5 Vs do Big Data.' },
        { id:'pf25-17', syllabusId:'inf', source:'Cebraspe 2025 · item 17', stem:'Firewalls e antivírus são ferramentas de proteção da rede por meio do controle do tráfego de dados e do impedimento a acessos não autorizados.', options:['Certo','Errado'], answer:1, explanation:'Controlar o tráfego é papel do firewall. O antivírus detecta e remove malware; não controla o tráfego da rede.' },
        { id:'pf25-20', syllabusId:'inf', source:'Cebraspe 2025 · item 20', stem:'Cardinalidades são restrições em relacionamentos e podem ter quatro diferentes variações: 1:1, 1:N, N:1 e N:N.', options:['Certo','Errado'], answer:1, explanation:'Usualmente se classificam em três tipos: 1:1, 1:N e N:N (N:1 é o mesmo 1:N visto do outro lado).' },
        { id:'pf25-21', syllabusId:'da', source:'Cebraspe 2025 · item 21', stem:'Autarquias são entidades que compõem a administração pública descentralizada, criadas por lei específica, com patrimônio e receita próprios, e dotadas de autonomia administrativa e financeira.', options:['Certo','Errado'], answer:0, explanation:'É a definição de autarquia: pessoa jurídica de direito público da administração indireta, criada por lei específica (CF, art. 37, XIX).' },
        { id:'pf25-22', syllabusId:'da', source:'Cebraspe 2025 · item 22', stem:'Ocorre descentralização administrativa quando o Estado concede ao particular determinado serviço público mediante celebração de um contrato.', options:['Certo','Errado'], answer:0, explanation:'É a descentralização por colaboração (delegação), como nas concessões e permissões de serviço público.' },
        { id:'pf25-23', syllabusId:'da', source:'Cebraspe 2025 · item 23', stem:'O sistema de registro de preços consiste em modalidade de licitação destinada a registrar formalmente os preços de bens e serviços para futuras contratações.', options:['Certo','Errado'], answer:1, explanation:'O SRP é um procedimento auxiliar (Lei 14.133/2021, art. 78), não uma modalidade.' },
