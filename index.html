      C('bcm-exp', 'Como a expressão gênica é regulada?',
        'Em procariotos, sobretudo por operons (ex.: operon lac). Em eucariotos, por promotores, enhancers, fatores de transcrição, estado da cromatina (epigenética), splicing e RNAs reguladores.',
        'No operon lac, o repressor bloqueia o operador quando não há lactose. Em eucariotos, a heterocromatina (DNA metilado, histonas desacetiladas) silencia genes, e a eucromatina acetilada facilita a transcrição.',
        'Todas as células somáticas têm o mesmo genoma; o que muda entre os tecidos é QUAIS genes são expressos.');
      MC('bcm-exp', 'Sobre o mRNA maduro eucarioto, é correto afirmar:',
        ['Tem CAP 5′ de 7-metilguanosina e cauda poli-A na 3′', 'Tem o CAP na extremidade 3′', 'Mantém os íntrons para a tradução', 'É sintetizado pela DNA polimerase', 'Contém timina no lugar de uracila'], 0,
        'O mRNA maduro tem CAP 5′, cauda poli-A 3′ e só os éxons; é feito pela RNA polimerase II e usa uracila.');
      ORD('bcm-exp', 'Ordene o caminho da informação do gene até a proteína.',
        ['Transcrição do gene', 'Adição de CAP e poli-A e splicing', 'Saída do mRNA para o citoplasma', 'Tradução no ribossomo'],
        'No núcleo, o gene é transcrito e o pré-mRNA é processado; o mRNA maduro vai ao citoplasma e é traduzido no ribossomo.');
      CLZ('bcm-exp', 'O códon de início da tradução é ___, que codifica a metionina.',
        ['AUG', 'UAA', 'UGA', 'GGC'], 0,
        'AUG é o códon de início. UAA, UAG e UGA são códons de parada.');

      T('bcm-mut', 'Mutação e reparo do DNA');
      C('bcm-mut', 'Quais são os tipos de mutação gênica?',
        'Substituições (silenciosa, de sentido trocado e sem sentido) e inserções ou deleções, que podem deslocar a fase de leitura.',
        'Silenciosa: a base muda, mas o aminoácido não (graças à degeneração do código). De sentido trocado (missense): muda o aminoácido. Sem sentido (nonsense): cria um códon de parada precoce. Indels que não são múltiplos de 3 deslocam a leitura (frameshift) e costumam ser graves.',
        'Transição: troca purina por purina ou pirimidina por pirimidina. Transversão: troca purina por pirimidina.');
      C('bcm-mut', 'Como os STRs sofrem mutação?',
        'Principalmente por deslizamento da DNA polimerase na replicação, que faz o alelo ganhar ou perder uma unidade de repetição.',
        'A taxa de mutação dos STRs é da ordem de 1 em 1.000 por locus por geração, muito maior que a de SNPs. Por isso, em vínculo genético, uma incompatibilidade de um passo pode ser mutação e entra no cálculo. O mesmo deslizamento gera os picos de stutter na PCR.',
        'Concluir exclusão de paternidade com base em um único locus discordante é arriscado: pode ser mutação.');
      C('bcm-mut', 'Quais os mecanismos de reparo do DNA?',
        'Reparo direto, excisão de bases (BER), excisão de nucleotídeos (NER), reparo de mau pareamento (MMR) e reparo de quebras de dupla fita (recombinação homóloga e junção de extremidades não homólogas).',
        'O BER corrige bases danificadas (oxidação, desaminação). O NER remove lesões volumosas, como os dímeros de timina causados por UV. O MMR corrige erros deixados pela replicação. A recombinação homóloga usa a cromátide-irmã como molde (fiel); a junção de extremidades não homólogas liga as pontas e está sujeita a erro.',
        'Dímero de pirimidina (UV) → NER. Mau pareamento depois da replicação → MMR.');
      C('bcm-mut', 'Qual a diferença entre mutação somática e germinativa?',
        'A somática ocorre em células do corpo e não é herdada; a germinativa ocorre em células que formam gametas e passa para os descendentes.',
        'Em genética forense, as mutações germinativas importam nos testes de vínculo. Mutações somáticas e quimerismo, como após transplante de medula óssea, podem fazer o perfil do sangue diferir do perfil da mucosa oral da mesma pessoa.',
        'Quem recebeu transplante de medula pode ter o perfil sanguíneo do doador. Nesse caso, use swab bucal como referência.');
      MC('bcm-mut', 'A principal origem das mutações nos STRs é:',
        ['O deslizamento da DNA polimerase durante a replicação', 'A exposição à radiação ultravioleta', 'A metilação de histonas', 'O splicing alternativo', 'A desnaturação do DNA no aquecimento'], 0,
        'O deslizamento da polimerase em regiões repetitivas muda o número de repetições; é também a origem dos stutters na PCR.');

      T('bcm-gen', 'Genoma humano e não humano');
      C('bcm-gen', 'Como o genoma nuclear humano está organizado?',
        'Tem cerca de 3,1 bilhões de pares de bases em 46 cromossomos (22 pares de autossomos + XX ou XY) e cerca de 20 mil genes codificadores de proteína.',
        'Menos de 2% do genoma codifica proteínas. O restante inclui íntrons, regiões reguladoras e muitas sequências repetitivas (microssatélites, minissatélites, elementos transponíveis). O DNA se enrola em histonas (nucleossomos), formando a cromatina.',
        'O número de genes humano é parecido com o de outros vertebrados e menor que o de várias plantas (item 67 de 2025). Os STRs forenses ficam em regiões não codificantes.');
      C('bcm-gen', 'Qual a estrutura de um gene eucarioto?',
        'Promotor, éxons (mantidos no mRNA), íntrons (removidos no splicing), regiões não traduzidas 5′ e 3′ e sinal de poliadenilação.',
        'Enhancers e silenciadores podem estar longe do gene e regulam a sua expressão. Alguns STRs forenses ficam dentro de íntrons, como o TH01 (gene da tirosina hidroxilase) e o TPOX (gene da tireoperoxidase).',
        'Estar dentro de um íntron não torna o STR "codificante": íntrons não viram proteína.');
      C('bcm-gen', 'Quais as características do DNA mitocondrial humano?',
        'É circular, tem cerca de 16.569 pb e 37 genes, existe em centenas a milhares de cópias por célula e tem herança materna.',
        'A região controle (D-loop) não codifica proteínas e concentra a variação usada na identificação (HV1, HV2, HV3). É útil em fios de cabelo sem bulbo, ossos, dentes e amostras degradadas. Pode haver heteroplasmia. A sequência é comparada à referência rCRS (Cambridge revisada).',
        'O mtDNA não individualiza: todos os parentes da linhagem materna têm o mesmo haplótipo.');
      C('bcm-gen', 'Quais genomas não humanos são usados em perícia?',
        'Animais: genes mitocondriais (COI e citocromo b). Plantas: genoma plastidial (rbcL, matK) e região ITS nuclear. Fungos: região ITS do DNA ribossômico nuclear.',
        'Aplicações: crimes contra a fauna (tráfico, marfim, couro, carne de caça), fraudes em alimentos (embutidos), identificação de plantas como a Cannabis e análise de pólen e solo como vestígio. O DNA barcoding compara a sequência com bancos de referência (como BOLD e GenBank).',
        'Kits de STR humanos não identificam espécies animais: são específicos para humanos (e primatas superiores).');
      MC('bcm-gen', 'Para identificar a espécie de origem de um pedaço de couro, o marcador mais indicado é:',
        ['A sequência de genes mitocondriais, como COI ou citocromo b', 'Um kit comercial de STR humano', 'A amelogenina', 'Um kit de Y-STR', 'A região HV1 comparada à rCRS humana'], 0,
        'Barcoding de espécies animais usa genes mitocondriais conservados entre indivíduos da mesma espécie e variáveis entre espécies.');

      T('bcm-epi', 'Epigenética e transcriptoma forense');
      C('bcm-epi', 'O que são modificações epigenéticas?',
        'Alterações que regulam a expressão gênica sem mudar a sequência de bases: metilação do DNA, modificações de histonas e RNAs não codificantes.',
        'A metilação ocorre sobretudo em citosinas de dinucleotídeos CpG e, quando está no promotor, costuma silenciar o gene. A acetilação de histonas abre a cromatina e favorece a transcrição. Os padrões mudam com idade, ambiente, tabagismo e álcool.',
        'A acetilação é das HISTONAS (proteínas), não da molécula de DNA. O item 55 de 2025, que dizia isso, foi anulado.');
      C('bcm-epi', 'Como a epigenética estima a idade em perícia?',
        'Por relógios epigenéticos: a metilação de certos CpGs muda de forma previsível com a idade (ex.: gene ELOVL2).',
        'O DNA é tratado com bissulfito (que converte a citosina não metilada em uracila) e a metilação é medida por pirossequenciamento, minissequenciamento ou MPS. O erro típico em adultos é de alguns anos para mais ou para menos. Também se inferem tabagismo (ex.: gene AHRR) e tipo de tecido.',
        'A sequência do STR não muda com a idade; o que muda é a metilação.');
      C('bcm-epi', 'Como o mRNA identifica fluidos biológicos?',
        'Cada tecido expressa mRNAs típicos: sangue (HBB, ALAS2), sangue menstrual (MMP7, MMP11), saliva (STATH, HTN3), sêmen (PRM1, KLK3) e secreção vaginal.',
        'É uma alternativa confirmatória aos testes presuntivos, e o RNA pode ser extraído junto com o DNA. O transcriptoma do sangue menstrual difere do sangue venoso, o que importa em casos de violência sexual.',
        'O RNA é menos estável que o DNA (tem a hidroxila 2′ e as RNases estão em toda parte), por isso exige cuidado extra.');
      C('bcm-epi', 'Por que hábitos de vida deixam marcas detectáveis no DNA?',
        'Porque fumar, beber e outras exposições alteram o padrão de metilação de genes específicos, o que pode ser medido numa amostra biológica.',
        'O gene AHRR, por exemplo, fica hipometilado em fumantes. Esses marcadores, junto com os de idade, ajudam a descrever uma pessoa desconhecida quando não há suspeito. São pistas probabilísticas, não identificação.',
        'Item 66 de 2025 (epigenoma para inferir álcool e tabaco) é CERTO.');
      MC('bcm-epi', 'Qual técnica é a base da estimativa de idade a partir do DNA?',
        ['Análise da metilação de CpGs após tratamento com bissulfito', 'Contagem de repetições dos STRs', 'Sequenciamento do cromossomo Y', 'Teste de Kastle-Meyer', 'Eletroforese em agarose do DNA total'], 0,
        'Os relógios epigenéticos medem a metilação; o bissulfito diferencia citosinas metiladas das não metiladas.');
      CLZ('bcm-epi', 'A acetilação ocorre nas ___, e não na molécula de DNA.',
        ['histonas', 'bases nitrogenadas', 'fosfatos', 'desoxirriboses'], 0,
        'Histonas acetiladas deixam a cromatina mais aberta e favorecem a transcrição.');

      /* ---------- Polimorfismos e marcadores ---------- */
      T('pol-str', 'STR (repetições curtas em tandem)');
      C('pol-str', 'O que é um STR e como se nomeia o alelo?',
        'É uma unidade de 2 a 6 pb repetida em sequência; o alelo é nomeado pelo número de repetições (ex.: alelo 12 = 12 repetições).',
        'Os STRs forenses são principalmente tetranucleotídeos (4 pb), que geram menos stutter. Existem alelos intermediários, como o 9.3 do TH01 (9 repetições completas + 3 pb). São muito polimórficos, codominantes e de herança mendeliana.',
        'O homozigoto mostra um só pico (de altura maior); o heterozigoto mostra dois.');
      C('pol-str', 'Quais são os marcadores do núcleo forense?',
        'O CODIS expandido usa 20 STRs autossômicos (ex.: D3S1358, vWA, FGA, TH01, TPOX, CSF1PO, D8S1179, D21S11), mais a amelogenina para o sexo.',
        'Os kits comerciais amplificam esses loci de uma vez (multiplex), com corantes de cores diferentes. A amelogenina distingue X e Y por uma diferença de 6 pb entre AMELX e AMELY. Deleções raras do AMELY podem fazer um homem parecer mulher.',
        'Amelogenina não é STR: é um marcador de sexo incluído nos kits.');
      C('pol-str', 'Quais os artefatos comuns na genotipagem de STR?',
        'Stutter (pico uma repetição menor), adenilação incompleta (−A), pull-up (vazamento de cor), picos fora de escala e drop-out ou drop-in.',
        'O stutter costuma ter de 5% a 15% da altura do alelo verdadeiro e complica misturas. Pouco DNA gera efeitos estocásticos: desbalanço entre os alelos do heterozigoto e perda de alelos (drop-out). DNA em excesso satura o detector. Os limiares analítico e estocástico são definidos na validação.',
        'Pico pequeno uma unidade antes de um alelo grande: pense em stutter antes de concluir que é mistura.');
      C('pol-str', 'Por que os STRs ainda são o padrão forense?',
        'Têm alto poder de discriminação, kits padronizados, compatibilidade com os bancos (CODIS e BNPG) e tipagem rápida por tamanho na eletroforese capilar.',
        'O MPS revela também variações de sequência dentro do STR (isoalelos), aumentando a discriminação, mas os bancos continuam usando o tamanho do alelo. Os mini-STRs, com amplicons menores, ajudam em DNA degradado.',
        'STRs não estão "deixando de ser usados" e não são tipados por sequenciamento na rotina (item 65 de 2025, ERRADO).');
      MC('pol-str', 'Um pico pequeno, uma unidade de repetição antes de um alelo alto, é mais provavelmente:',
        ['Um stutter', 'Com certeza um alelo de um segundo contribuinte', 'Um pull-up', 'A amelogenina', 'Um alelo intermediário'], 0,
        'O stutter nasce do deslizamento da polimerase e aparece logo antes do alelo verdadeiro, com altura bem menor.');

      T('pol-snp', 'SNP: ancestralidade e fenotipagem');
      C('pol-snp', 'O que são SNPs e como diferem dos STRs?',
        'São variações de uma única base, geralmente com dois alelos, muito numerosas no genoma e com baixa taxa de mutação.',
        'Cada SNP informa pouco, então são necessários dezenas a centenas para igualar o poder de discriminação de 15 a 20 STRs. Vantagens: amplicons curtos (ótimos para DNA degradado), estabilidade em parentesco distante e uso em ancestralidade e fenótipo.',
        'Baixa taxa de mutação faz dos SNPs bons marcadores para parentesco distante e genealogia; os STRs mutam mais.');
      C('pol-snp', 'Quais os tipos de SNPs usados em perícia?',
        'De identidade, de ancestralidade (AISNPs), de fenótipo (PISNPs) e de linhagem (no Y e no mtDNA).',
        'Os AISNPs têm frequências muito diferentes entre populações continentais. Os PISNPs ficam em genes de pigmentação, como HERC2/OCA2 (cor dos olhos), MC1R (cabelo ruivo) e SLC24A5/SLC45A2 (pele). O sistema HIrisPlex-S prevê cor de olhos, cabelo e pele.',
        'Marcadores de identificação não são de fenótipo: o perfil STR do banco não revela aparência (item 68 de 2025, CERTO).');
      C('pol-snp', 'Como se tipam os SNPs?',
        'Por minissequenciamento (SNaPshot), PCR em tempo real com sondas, microarranjos e sequenciamento massivo paralelo.',
        'Microarranjos com centenas de milhares de SNPs são a base da genealogia genética forense. O MPS consegue analisar STRs, SNPs e mtDNA numa única corrida.',
        'Microarranjos exigem DNA em boa quantidade e qualidade; o MPS lida melhor com amostras forenses difíceis.');
      C('pol-snp', 'Quais os limites da predição de ancestralidade e de aparência?',
        'A predição é probabilística, varia em acurácia conforme o traço e a população e serve como pista investigativa, não como identificação.',
        'Olhos azuis ou castanhos são previstos com boa acurácia; tons intermediários e cor de pele em populações miscigenadas, como a brasileira, são mais difíceis. Os bancos oficiais brasileiros não podem revelar traços somáticos (Lei 12.654/2012).',
        'Fenotipagem é usada quando não há suspeito para comparar; não substitui o confronto de perfis.');
      MC('pol-snp', 'Qual a vantagem dos SNPs sobre os STRs em amostras muito degradadas?',
        ['Amplicons mais curtos', 'Maior número de alelos por locus', 'Maior taxa de mutação', 'Dispensam a PCR', 'São o padrão do BNPG'], 0,
        'DNA degradado está fragmentado; alvos curtos têm mais chance de estar íntegros.');

      T('pol-uni', 'Marcadores uniparentais: Y e mtDNA');
      C('pol-uni', 'Para que serve o Y-STR?',
        'Para detectar e tipar DNA masculino em misturas com muito DNA feminino, como em swabs de violência sexual ou raspados de unha.',
        'Como o kit só amplifica o cromossomo Y, o DNA da vítima não interfere. Também estima quantos homens contribuíram e serve em parentesco pela linha paterna. Kits com Y-STRs de mutação rápida ajudam a diferenciar até parentes.',
        'Uma coincidência de Y-STR inclui toda a linhagem paterna do suspeito; o peso estatístico é a frequência do haplótipo.');
      C('pol-uni', 'Qual a limitação do Y-STR na interpretação?',
        'O haplótipo é herdado em bloco pelo pai: irmãos, pai, avô paterno, tios e primos paternos têm o mesmo perfil.',
        'Os loci do Y não são independentes, então não se multiplicam frequências; usa-se a contagem do haplótipo em bancos como o YHRD, com correções. Com suspeitos da mesma linhagem paterna, o Y-STR não distingue.',
        'Item 53 de 2025 (Y inadequado para suspeitos com ancestral paterno comum): CERTO.');
      C('pol-uni', 'Quando usar o DNA mitocondrial?',
        'Quando há pouco ou nenhum DNA nuclear: cabelo sem bulbo, ossos e dentes antigos, amostras muito degradadas.',
        'As muitas cópias por célula aumentam a chance de sucesso. Compara-se a região controle com a referência rCRS. As referências possíveis são parentes da linha materna: mãe, irmãos maternos, avó materna.',
        'O pai não serve de referência para o mtDNA do filho.');
      C('pol-uni', 'Como interpretar uma coincidência de Y ou de mtDNA?',
        'Indica que as amostras podem vir da mesma pessoa ou de alguém da mesma linhagem; o peso é dado pela frequência do haplótipo na população.',
        'A frequência é estimada por contagem num banco (EMPOP para mtDNA, YHRD para Y), com limite de confiança, porque muitos haplótipos são raros. O poder de discriminação é bem menor que o de um perfil autossômico completo.',
        'Linhagem não é indivíduo: não afirme identidade só com Y ou mtDNA.');
      MC('pol-uni', 'Um swab vaginal tem grande excesso de DNA da vítima e pouco DNA masculino. A melhor estratégia é:',
        ['Extração diferencial e/ou tipagem de Y-STR', 'STR autossômico direto, sem separação', 'mtDNA da fração feminina', 'Teste de amilase', 'Sequenciamento de Sanger do HV1 da vítima'], 0,
        'A extração diferencial separa os espermatozoides; o Y-STR ignora o DNA feminino.');

      /* ---------- Metodologias e técnicas ---------- */
      T('met-col', 'Vestígio, coleta e cadeia de custódia');
      C('met-col', 'Como coletar manchas e vestígios biológicos?',
        'Mancha seca: swab levemente umedecido com água estéril (duplo swab: um úmido e outro seco). Objeto pequeno: recolher inteiro. Roupa: recortar a área.',
        'Para DNA de toque, use swab ou fita adesiva. Pelos: pinça, preferindo os que têm bulbo. Sempre com EPI (luvas, máscara, touca), trocando as luvas entre vestígios e coletando controles do suporte quando indicado.',
        'Nunca embale material úmido em plástico: favorece fungos e bactérias que degradam o DNA.');
      C('met-col', 'Como acondicionar e guardar vestígios biológicos?',
        'Secar ao ar, à temperatura ambiente, embalar em papel, lacrar, identificar e guardar em local seco e fresco. Líquidos e tecidos frescos vão refrigerados ou congelados.',
        'Cada vestígio em embalagem separada, com lacre numerado e registro na ficha de cadeia de custódia. Swabs devem secar antes de embalar. Sangue de referência: tubo com EDTA refrigerado ou cartão FTA.',
        'Cartões FTA guardam sangue e saliva em temperatura ambiente por anos.');
      C('met-col', 'Quais são as etapas da cadeia de custódia (CPP, art. 158-B)?',
        'Reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte.',
        'A cadeia começa com a preservação do local ou com o procedimento em que se detecta o vestígio (art. 158-A, §1º). O vestígio fica na central de custódia, e o recipiente só deve ser aberto pelo perito que vai examiná-lo. O descarte respeita a legislação e, quando pertinente, depende de autorização judicial.',
        'A cadeia NÃO começa no transporte ao instituto (item 34 de 2025). Não há prazo legal único de 10 anos para guardar vestígios (item 74).');
      C('met-col', 'Como evitar contaminação no local e no laboratório?',
        'EPI, troca frequente de luvas, materiais estéreis descartáveis, separação física das áreas pré e pós-PCR com fluxo unidirecional, controles negativos e banco de perfis de eliminação da equipe.',
        'Consumíveis devem ser livres de DNA humano (ISO 18385). Brancos de extração e de amplificação revelam contaminação. Bancos de eliminação reconhecem perfis de policiais, peritos e fabricantes.',
        'Evitar o fluxo de pessoas e materiais do pós-PCR para o pré-PCR é CERTO (item 76 de 2025).');
      MC('met-col', 'Uma camiseta com mancha de sangue ainda úmida deve ser:',
        ['Seca ao ar, embalada em papel, lacrada e identificada', 'Embalada imediatamente em saco plástico fechado', 'Lavada para remover a sujeira antes da coleta', 'Exposta ao sol para secar rápido', 'Dobrada junto com as outras roupas da vítima'], 0,
        'Secar ao ar e embalar em papel evita a degradação; cada peça vai separada para evitar transferência.');
      ORD('met-col', 'Ordene as seis primeiras etapas da cadeia de custódia (CPP, art. 158-B).',
        ['Reconhecimento', 'Isolamento', 'Fixação', 'Coleta', 'Acondicionamento', 'Transporte'],
        'Depois vêm recebimento, processamento, armazenamento e descarte.');

      T('met-pres', 'Testes para sangue, sêmen e saliva');
      C('met-pres', 'Quais testes se usam para sangue?',
        'Presuntivos: Kastle-Meyer (fenolftaleína), luminol e leucomalaquita verde, que detectam a atividade semelhante à peroxidase do heme. Para confirmar sangue humano: testes imunocromatográficos de hemoglobina humana.',
        'O luminol revela manchas invisíveis por quimiluminescência, mesmo após lavagem, e em geral não impede o DNA depois. Falsos positivos: oxidantes (hipoclorito), peroxidases de vegetais e alguns metais.',
        'Presuntivo indica "possível sangue"; não confirma que é sangue, nem que é humano.');
      C('met-pres', 'Quais testes se usam para sêmen?',
        'Presuntivo: fosfatase ácida. Confirmatórios: ver espermatozoides ao microscópio (coloração "árvore de Natal") e detectar PSA (p30) ou semenogelina.',
        'O PSA é útil em vasectomizados ou azoospérmicos (sêmen sem espermatozoides). Luz forense ajuda a localizar manchas. Em violência sexual, a extração diferencial separa os espermatozoides das células da vítima.',
        'Fosfatase ácida também aparece em secreção vaginal (em níveis menores); por isso é só presuntiva.');
      C('met-pres', 'Como se identifica a saliva?',
        'Pela atividade da alfa-amilase, em testes presuntivos.',
        'Saliva é fonte rica de DNA (células da mucosa): bitucas, copos, selos, marcas de mordida. O swab bucal é a amostra de referência padrão para pessoas vivas.',
        'A amilase também ocorre em baixos níveis em outros fluidos, como suor e fezes.');
      C('met-pres', 'Qual a ordem lógica dos exames num vestígio?',
        'Documentar, fazer exames não destrutivos (visual, luz forense, fotografia), testes presuntivos mínimos, coletar para DNA e fazer os confirmatórios, preservando parte do material.',
        'Se há impressão papilar sobre sangue, planeje para não destruir nenhum vestígio: fotografe e revele a impressão e colete o sangue sem apagar as cristas. Nunca presuma de quem é cada vestígio.',
        'Item 75 de 2025 ("preferir a papiloscopia porque a impressão é do autor e o sangue da vítima") está ERRADO.');
      MC('met-pres', 'Qual exame confirma sêmen mesmo num homem vasectomizado?',
        ['Detecção de PSA (p30)', 'Fosfatase ácida', 'Pesquisa de espermatozoides ao microscópio', 'Luminol', 'Kastle-Meyer'], 0,
        'Sem espermatozoides, a microscopia é negativa; o PSA vem da próstata e continua presente.');

      T('met-ext', 'Extração, purificação e quantificação');
      C('met-ext', 'Quais os principais métodos de extração de DNA?',
        'Orgânico (fenol-clorofórmio), Chelex-100, sílica (colunas ou esferas magnéticas) e extração diferencial.',
        'Orgânico: bom rendimento e pureza, mas tóxico e trabalhoso. Chelex: resina quelante, rápida, gera DNA de fita simples (serve só para PCR). Sílica: o DNA se liga à sílica em alta concentração de sal e depois é eluído; é automatizável e o mais usado hoje. A lise usa detergente e proteinase K.',
        'Proteinase K digere proteínas (inclusive nucleases); ela não é uma nuclease.');
      C('met-ext', 'O que é extração diferencial?',
        'É a separação das células espermáticas das células epiteliais em amostras de violência sexual, gerando uma fração feminina e uma masculina.',
        'Uma lise branda rompe as células epiteliais; os espermatozoides resistem por causa das pontes dissulfeto das proteínas da cabeça. Depois da centrifugação, o sedimento de espermatozoides é lisado com DTT. Isso reduz a mistura e facilita obter o perfil do agressor.',
        'O DTT (ditiotreitol) é o reagente que rompe a cabeça do espermatozoide.');
      C('met-ext', 'Quais inibidores de PCR são comuns e como removê-los?',
        'Heme (sangue), ácido húmico (solo), índigo (jeans), melanina (cabelo), colágeno (osso), polissacarídeos e resíduos de EDTA ou etanol.',
        'A purificação em sílica e as lavagens removem a maioria. Na qPCR, o controle interno de amplificação revela inibição (o seu Ct atrasa). Soluções: diluir o extrato, purificar de novo, usar polimerases mais tolerantes ou adicionar BSA.',
        'Diluir o extrato pode salvar a PCR: reduz o inibidor proporcionalmente mais do que prejudica a detecção do DNA.');
      C('met-ext', 'Para que serve a quantificação por qPCR no fluxo forense?',
        'Para medir o DNA humano total e o masculino, avaliar degradação e inibição e decidir quanto DNA colocar na PCR de STR.',
        'A fluorescência é medida a cada ciclo; o Ct é inversamente proporcional à quantidade inicial (mais DNA, Ct menor). Kits usam um alvo curto e um longo, e a razão entre eles é o índice de degradação. A espectrofotometria não distingue DNA humano de bacteriano.',
        'Entre a extração e a amplificação vem a QUANTIFICAÇÃO, não a "validação" (item 78 de 2025).');
      MC('met-ext', 'Na qPCR, um Ct atrasado do controle interno de amplificação indica:',
        ['Presença de inibidores da PCR', 'Excesso de DNA masculino', 'DNA de outra espécie', 'Contaminação do controle negativo', 'Mistura de dois contribuintes'], 0,
        'O controle interno é adicionado em quantidade conhecida; se ele amplifica tarde, algo na amostra está inibindo a reação.');
      ORD('met-ext', 'Ordene as etapas do exame de DNA de uma amostra questionada.',
        ['Avaliação e amostragem', 'Extração', 'Quantificação', 'Amplificação (PCR)', 'Eletroforese capilar', 'Análise e interpretação'],
        'A quantificação define a quantidade ideal de DNA para a PCR.');

      T('met-pcr', 'PCR e eletroforese');
      C('met-pcr', 'Quais os componentes da PCR e a função de cada um?',
        'DNA molde, primers (definem a região), dNTPs (os blocos da nova fita), DNA polimerase termoestável, Mg²⁺ (cofator) e tampão.',
        'Nos kits forenses, um primer de cada par é marcado com fluorescência, e vários loci são amplificados juntos (multiplex). A quantidade ideal de DNA costuma ficar entre 0,5 e 1 ng. Controles positivo e negativo são obrigatórios.',
        'Mg²⁺ em excesso reduz a especificidade; o EDTA sequestra o Mg²⁺ e pode inibir a reação.');
      C('met-pcr', 'Quais são as etapas de cada ciclo da PCR?',
        'Desnaturação (~94–95 °C), anelamento dos primers (~55–60 °C) e extensão pela polimerase (~72 °C).',
        'A quantidade de produto dobra a cada ciclo em teoria; os kits forenses usam cerca de 28 a 30 ciclos. Uma extensão final mais longa completa a adição de A pela polimerase e evita picos −A.',
        'Ciclos demais aumentam artefatos e o risco de contaminação aparecer.');
      C('met-pcr', 'Como funciona a eletroforese capilar de STR?',
        'Os amplicons fluorescentes migram num capilar com polímero, separados por tamanho (os menores andam mais rápido); um laser excita os corantes e o detector registra os picos no eletroferograma.',
        'Um padrão interno de tamanho em cada amostra calibra a corrida; a escada alélica (ladder) permite nomear os alelos. A altura do pico (em RFU) reflete a quantidade de DNA. A resolução de 1 pb distingue alelos intermediários.',
        'O DNA migra para o polo POSITIVO, por causa dos fosfatos de carga negativa.');
      C('met-pcr', 'Qual a diferença entre eletroforese em gel (placa) e capilar?',
        'No gel de agarose ou poliacrilamida, as bandas aparecem com corante; a capilar é automatizada, detecta por fluorescência e tem resolução de 1 pb.',
        'A agarose separa fragmentos maiores e é usada para conferir a integridade do DNA ou produtos de PCR; a poliacrilamida tem maior resolução. A capilar substituiu o gel na tipagem de STR pela automação e precisão.',
        'Agarose: fragmentos grandes, menor resolução. Poliacrilamida: fragmentos pequenos, alta resolução.');
      MC('met-pcr', 'A temperatura típica da etapa de extensão na PCR é de cerca de:',
        ['72 °C', '95 °C', '37 °C', '55 °C', '4 °C'], 0,
        '72 °C é a temperatura ótima de trabalho da polimerase termoestável.');
      ORD('met-pcr', 'Ordene as etapas de um ciclo da PCR.',
        ['Desnaturação (~95 °C)', 'Anelamento dos primers (~55–60 °C)', 'Extensão (~72 °C)'],
        'O ciclo se repete cerca de 28 a 30 vezes nos kits forenses.');
      CLZ('met-pcr', 'Na eletroforese, o DNA migra para o polo ___, por causa dos grupos fosfato.',
        ['positivo (ânodo)', 'negativo (cátodo)', 'neutro', 'mais próximo da amostra'], 0,
        'Os fosfatos dão carga negativa ao DNA, que é atraído pelo polo positivo.');

      T('met-seq', 'Sequenciamento: Sanger e MPS');
      C('met-seq', 'Como funciona o sequenciamento de Sanger?',
        'Síntese de DNA com dNTPs e uma pequena fração de ddNTPs fluorescentes que interrompem a cadeia; os fragmentos são separados por tamanho e a cor do último nucleotídeo revela a sequência.',
        'Os ddNTPs não têm a hidroxila 3′, então a polimerase não consegue continuar. Lê de 700 a 1.000 pb por reação com alta acurácia. É o método clássico para a região controle do mtDNA.',
        'ddNTP = didesoxi (sem 3′-OH). dNTP = desoxi (com 3′-OH).');
      C('met-seq', 'Qual a limitação do Sanger com misturas?',
        'Em misturas ou heteroplasmia surgem picos sobrepostos na mesma posição, difíceis de separar; é uma limitação, não uma vantagem.',
        'O Sanger gera uma sequência "média" do conjunto de moléculas e não separa as contribuições. O MPS lê cada molécula individualmente (contagem de reads) e permite quantificar misturas e heteroplasmia.',
        'Item 82 de 2025 (picos ambíguos como "ferramenta útil") está ERRADO.');
      C('met-seq', 'O que é o sequenciamento massivo paralelo (MPS/NGS)?',
        'São tecnologias que sequenciam milhões de fragmentos ao mesmo tempo, permitindo analisar STRs, SNPs e mtDNA numa única corrida.',
        'Usa bibliotecas com adaptadores e índices, o que permite várias amostras juntas. Revela variação de sequência dentro dos STRs. Desvantagens: custo, preparo longo e análise bioinformática complexa; uma corrida leva de muitas horas a dias.',
        'A vantagem do MPS é a quantidade de informação, não a rapidez (o item 84 de 2025 foi anulado, mas a banca explorou essa troca).');
      C('met-seq', 'Quando usar cada técnica de análise?',
        'STR por eletroforese capilar: rotina e bancos. Sanger: mtDNA e confirmação de sequências pontuais. MPS: amostras difíceis, misturas, mtDNA completo, ancestralidade, fenótipo e genealogia.',
        'A escolha depende do vestígio, da pergunta do caso, do custo e da validação do método no laboratório. Resultados de STR por MPS podem ser convertidos para a nomenclatura por tamanho usada nos bancos.',
        'Os bancos (CODIS e BNPG) trabalham com STR por tamanho.');
      MC('met-seq', 'No Sanger, os ddNTPs interrompem a síntese porque:',
        ['Não têm a hidroxila 3′', 'Não têm base nitrogenada', 'Têm ribose no lugar de desoxirribose', 'Ficam presos à polimerase', 'Não são fluorescentes'], 0,
        'Sem a 3′-OH, não há onde ligar o próximo nucleotídeo: a cadeia termina ali.');

      T('met-emg', 'Tecnologias emergentes');
      C('met-emg', 'O que é DNA rápido (Rapid DNA)?',
        'Equipamentos integrados que fazem lise, extração, amplificação, eletroforese e análise de STR em cerca de 1 a 2 horas, sem manipulação humana.',
        'É usado principalmente com amostras de referência (swab bucal) e na identificação de vítimas de desastres; para vestígios de local de crime, a sensibilidade e a análise de misturas são limitadas. Nos EUA, uma lei de 2017 permitiu usar o Rapid DNA para perfis de referência de presos.',
        'Item 86 de 2025 (todas as etapas num só equipamento em 1–2 h) é CERTO.');
      C('met-emg', 'O que é a predição fenotípica por DNA?',
        'É a inferência de características externas (cor dos olhos, do cabelo e da pele), da ancestralidade biogeográfica e da idade, para gerar pistas quando não há referência para comparar.',
        'Usa SNPs (como o HIrisPlex-S) e metilação (idade). É probabilística e orienta a investigação; não identifica ninguém. Tem implicações éticas de privacidade e de risco de discriminação.',
        'Fenotipagem é pista; identificação exige comparação de perfis.');
      C('met-emg', 'O que é a genealogia genética forense?',
        'É a comparação de centenas de milhares de SNPs de um vestígio com bancos genealógicos de consumidores para achar parentes distantes e, montando árvores genealógicas, chegar a um suspeito.',
        'O caso mais famoso é o do Golden State Killer, nos EUA, em 2018. A identificação é sempre confirmada depois com STR de uma amostra de referência. Levanta questões de privacidade e de consentimento dos usuários dos bancos.',
        'A confirmação final é sempre com amostra de referência do suspeito.');
      C('met-emg', 'Quais os limites das tecnologias emergentes no Brasil?',
        'Custo, necessidade de validação, bancos populacionais de referência, interpretação probabilística e questões legais e éticas.',
        'A Lei 12.654/2012 proíbe que os bancos de perfis revelem traços somáticos ou comportamentais (exceto o gênero), o que restringe fenotipagem e genealogia nos bancos oficiais. Qualquer técnica precisa ser validada antes de ir a um laudo (ISO/IEC 17025).',
        'Tecnologia sem validação não deve ser usada em laudo.');
      MC('met-emg', 'A genealogia genética forense depende principalmente de:',
        ['Centenas de milhares de SNPs comparados a bancos genealógicos', 'Os 20 STRs do CODIS', 'Apenas Y-STRs', 'Testes presuntivos de saliva', 'Eletroforese em gel de agarose'], 0,
        'É preciso um volume enorme de SNPs para detectar parentesco distante, como primos de terceiro ou quarto grau.');

      /* ---------- Genética de populações ---------- */
      T('gpop-hw', 'Hardy-Weinberg e frequências');
      C('gpop-hw', 'O que diz o equilíbrio de Hardy-Weinberg?',
        'Numa população ideal, as frequências alélicas (p e q) e genotípicas (p², 2pq e q²) permanecem constantes de uma geração para outra.',
        'Condições: população muito grande, cruzamentos ao acaso, sem mutação, seleção, migração e deriva. Na perícia, verifica-se se os bancos de frequências estão em equilíbrio para poder aplicar a regra do produto.',
        'No modelo ideal NÃO há forças evolutivas atuando; não é um "equilíbrio de forças que se compensam" (item 72 de 2025).');
      C('gpop-hw', 'Como calcular as frequências alélicas a partir dos genótipos?',
        'p = (2 × homozigotos AA + heterozigotos) / (2 × N) e q = 1 − p.',
        'Exemplo da prova de 2025: 150 BB, 200 BN e 150 NN (N = 500). p(B) = (300 + 200) / 1.000 = 0,5. O esperado seria 125 BB, 250 BN e 125 NN. Como há menos heterozigotos que o esperado, a população não está em equilíbrio.',
        'Homozigotos "simétricos" não garantem equilíbrio; compare sempre os heterozigotos com 2pq.');
      C('gpop-hw', 'Para que servem as frequências alélicas na perícia?',
        'Para calcular a probabilidade de coincidência ao acaso do perfil e o LR, usando um banco de dados da população de referência.',
        'Heterozigoto: 2pq. Homozigoto: p² (com correção θ quando necessário). As frequências vêm de amostras populacionais; no Brasil, usam-se dados regionais por causa da miscigenação. Alelos raros recebem uma frequência mínima.',
        'Frequência é atributo da população, não do indivíduo (item 89 de 2025).');
      C('gpop-hw', 'O que causa desvios de Hardy-Weinberg?',
        'Endogamia, subestrutura da população (efeito Wahlund), seleção, migração, deriva, erros de genotipagem (alelos nulos, drop-out) e amostras pequenas.',
        'Excesso de homozigotos pode indicar endogamia, subestrutura ou alelos nulos (mutação no local de ligação do primer). Por isso os laboratórios testam o equilíbrio e o desequilíbrio de ligação nos bancos populacionais.',
        'Efeito Wahlund: juntar subpopulações diferentes num só banco reduz a heterozigosidade observada.');
      MC('gpop-hw', 'Numa população em Hardy-Weinberg com p = 0,7, a frequência esperada de heterozigotos é:',
        ['0,42', '0,49', '0,09', '0,21', '0,70'], 0,
        '2pq = 2 × 0,7 × 0,3 = 0,42.');
      CLZ('gpop-hw', 'Em Hardy-Weinberg, a frequência esperada de homozigotos para um alelo de frequência q é ___.',
        ['q²', '2pq', '2q', 'q/2'], 0,
        'p² para AA, 2pq para Aa e q² para aa.');

      T('gpop-for', 'Forças evolutivas e estrutura populacional');
      C('gpop-for', 'Quais são as forças evolutivas e o efeito de cada uma?',
        'Mutação (cria alelos), seleção natural (favorece alelos vantajosos), deriva genética (mudança ao acaso) e fluxo gênico (troca de alelos entre populações).',
        'A mutação é a fonte primária de variação. A seleção é a única força que leva à adaptação. A deriva é forte em populações pequenas e pode fixar ou eliminar alelos. O fluxo gênico deixa populações mais parecidas e aumenta a variabilidade local.',
        'Deriva é aleatória; seleção não é.');
      C('gpop-for', 'O que é endogamia e quais os seus efeitos?',
        'É o cruzamento entre aparentados, que aumenta a homozigose sem mudar as frequências alélicas.',
        'É medida pelo coeficiente de endogamia (F). Aumenta a chance de herdar dois alelos idênticos por descendência, elevando as doenças recessivas. Em populações isoladas, a chance de dois perfis coincidirem é maior.',
        'Item 73 de 2025 (consanguinidade "aumenta heterozigotos") está ERRADO.');
      C('gpop-for', 'O que são as estatísticas F de Wright e o θ forense?',
        'FIS mede a endogamia dentro da subpopulação, FST a diferenciação entre subpopulações e FIT a endogamia total. O θ (próximo do FST) corrige a subestrutura no cálculo forense.',
        'O NRC II (1996) recomenda as fórmulas de Balding-Nichols com θ, tipicamente entre 0,01 e 0,03, considerando que o suspeito e o verdadeiro autor podem ser da mesma subpopulação. Isso deixa o cálculo conservador, a favor da defesa.',
        'O θ aumenta a probabilidade de coincidência e, portanto, diminui o LR (item 70 de 2025, CERTO).');
      C('gpop-for', 'O que são gargalo genético e efeito fundador?',
        'Gargalo: redução drástica do tamanho da população. Efeito fundador: nova população iniciada por poucos indivíduos. Os dois reduzem a variabilidade e mudam as frequências ao acaso.',
        'São casos particulares de deriva. Explicam por que populações isoladas têm alelos raros em alta frequência e menos diversidade de perfis. No Brasil, a mistura entre europeus, africanos e indígenas teve efeito oposto, aumentando a diversidade.',
        'Mistura de populações é consequência do fluxo gênico (item 71 de 2025, CERTO).');
      MC('gpop-for', 'Qual força evolutiva é a única que leva de forma consistente à adaptação?',
        ['Seleção natural', 'Deriva genética', 'Mutação', 'Fluxo gênico', 'Endogamia'], 0,
        'A seleção natural aumenta a frequência dos alelos que melhoram a sobrevivência e a reprodução; as outras forças não são direcionais.');

      T('gpop-her', 'Padrões de herança e ligação');
      C('gpop-her', 'Como reconhecer herança autossômica dominante e recessiva num heredograma?',
        'Dominante: afetados em todas as gerações; todo afetado tem um genitor afetado. Recessiva: pode pular gerações; afetados costumam ter pais normais (portadores); a consanguinidade aumenta os casos.',
        'Nas duas, homens e mulheres são afetados igualmente. Na recessiva, o cruzamento de dois portadores (Aa × Aa) gera 1/4 de afetados. Na dominante, Aa × aa gera 1/2 de afetados.',
        'Pais normais com filho afetado indicam herança recessiva.');
      C('gpop-her', 'Como é a herança ligada ao X?',
        'Na recessiva ligada ao X, há mais homens afetados, não há transmissão de pai para filho homem, e a mãe portadora transmite o alelo para metade dos filhos.',
        'Os homens têm um só X (hemizigotos), então um alelo recessivo se manifesta. Exemplos: hemofilia A, daltonismo, distrofia de Duchenne. Em perícia, os X-STRs ajudam em parentescos complexos, como irmãs por parte de pai.',
        'O pai passa o seu X para TODAS as filhas e o Y para todos os filhos.');
      C('gpop-her', 'O que é desequilíbrio de ligação?',
        'É a associação não aleatória entre alelos de loci diferentes, geralmente por estarem próximos no mesmo cromossomo.',
        'A recombinação desfaz essa associação ao longo das gerações; loci muito próximos continuam associados. Se dois STRs estiverem ligados, não se pode simplesmente multiplicar as suas frequências. Em casos de irmãos, a ligação entre loci do mesmo cromossomo (como vWA e D12S391) pode exigir ajuste.',
        'A independência dos loci é premissa da regra do produto.');
      C('gpop-her', 'Como se herdam os marcadores de linhagem?',
        'Y-STR: do pai para o filho homem, sem recombinação. mtDNA: da mãe para todos os filhos, mas só as filhas o transmitem adiante.',
        'Servem para rastrear linhagens e identificar desaparecidos por meio de parentes distantes, mas não individualizam. No X-STR, o pai transmite o seu X inteiro às filhas.',
        'Irmão por parte de mãe compartilha o mtDNA; irmão por parte de pai compartilha o Y.');
      MC('gpop-her', 'Na herança recessiva ligada ao X, é correto afirmar:',
        ['Não há transmissão do pai para o filho homem', 'As mulheres são mais afetadas que os homens', 'Todo afetado tem pai afetado', 'O traço aparece obrigatoriamente em todas as gerações', 'O pai afetado transmite o traço a todos os filhos homens'], 0,
        'O filho homem recebe do pai o Y, não o X.');

      T('gpop-evo', 'Filogenia e evolução molecular');
      C('gpop-evo', 'O que é análise filogenética?',
        'É a reconstrução das relações evolutivas entre organismos ou sequências, representada em árvores filogenéticas.',
        'Métodos: distância (neighbor-joining, UPGMA), máxima parcimônia (menor número de mudanças), máxima verossimilhança e inferência bayesiana. O bootstrap avalia o suporte dos ramos. Usos forenses: identificar espécies, rastrear a transmissão de vírus em casos criminais e classificar haplogrupos de mtDNA e Y.',
        'Grupo monofilético = um ancestral comum e todos os seus descendentes.');
      C('gpop-evo', 'O que é o relógio molecular?',
        'É a ideia de que mutações neutras se acumulam a uma taxa aproximadamente constante, o que permite estimar há quanto tempo duas linhagens divergiram.',
        'Baseia-se na teoria neutra de Kimura: boa parte da variação molecular é neutra e se fixa por deriva. Precisa de calibração com fósseis ou eventos datados. As taxas variam entre genes; o mtDNA evolui mais rápido que a maior parte do DNA nuclear.',
        'Regiões não codificantes evoluem mais rápido que as codificantes, porque sofrem menos seleção.');
      C('gpop-evo', 'O que são haplogrupos e para que servem?',
        'São grupos de haplótipos de Y ou mtDNA que compartilham um ancestral comum, definidos por SNPs e com distribuição geográfica característica.',
        'Indicam a origem da linhagem paterna ou materna (por exemplo, haplogrupos L africanos e A, B, C e D nativo-americanos no mtDNA). No Brasil, as linhagens paternas são majoritariamente europeias e as maternas têm grande contribuição africana e indígena.',
        'O haplogrupo indica UMA linhagem, não toda a ancestralidade da pessoa.');
      C('gpop-evo', 'Como a seleção natural atuou na formação genética do Brasil?',
        'Depois da miscigenação, alelos vantajosos ligados a imunidade, metabolismo e fertilidade aumentaram de frequência em poucas gerações.',
        'O estudo citado na prova de 2025 (2.723 genomas brasileiros, publicado na Science) sugere seleção recente em genes de imunidade (origem africana), metabolismo (indígena) e fertilidade (europeia). É um exemplo de fluxo gênico e seleção atuando juntos.',
        'O fluxo gênico introduz os alelos; a seleção muda a frequência dos que dão vantagem.');
      MC('gpop-evo', 'O relógio molecular se baseia principalmente:',
        ['No acúmulo aproximadamente constante de mutações neutras', 'Na seleção de genes de fertilidade', 'No número de cromossomos de cada espécie', 'Na metilação do DNA ao longo da vida', 'No crossing-over na meiose'], 0,
        'Mutações neutras se acumulam por deriva a uma taxa relativamente constante, servindo de "relógio".');

      /* ---------- Estatística forense ---------- */
      T('est-bay', 'Teorema de Bayes e razão de verossimilhança');
      C('est-bay', 'O que diz o teorema de Bayes na forma de chances?',
        'Chance a posteriori = LR × chance a priori, sendo LR = P(E|H1) / P(E|H2).',
        'A chance a priori vem das outras provas do caso (papel do julgador); o LR é a contribuição da evidência científica (papel do perito). Para converter: probabilidade = chance / (1 + chance). Exemplo da prova: chance 1/299 × LR 100 = 100/299, ou seja, probabilidade de cerca de 25%.',
        'O perito não informa a probabilidade de culpa; informa o LR.');
      C('est-bay', 'Como interpretar o valor do LR?',
        'LR maior que 1 apoia H1, igual a 1 é neutro e menor que 1 apoia H2. Quanto mais longe de 1, mais forte o apoio.',
        'Escalas verbais, como a da ENFSI, traduzem faixas: 2–10 apoio fraco, 10–100 moderado, 100–1.000 moderadamente forte, 1.000–10.000 forte, 10.000–1.000.000 muito forte e acima disso extremamente forte. As hipóteses devem ser mutuamente exclusivas e definidas antes da análise.',
        'Com LR = 1, as chances a posteriori ficam iguais às a priori (item 96 de 2025).');
      C('est-bay', 'O que é a falácia do promotor?',
        'É confundir P(evidência | inocente) com P(inocente | evidência).',
        'Exemplo: "a chance de coincidência ao acaso é 1 em 1 milhão, então a chance de ele ser inocente é 1 em 1 milhão". Errado: a probabilidade de inocência também depende da chance a priori. A falácia da defesa é o inverso: desprezar a evidência porque muitas pessoas na cidade teriam o mesmo perfil.',

    var Persistence = (function(){
      var KEY = 'reels_concurso_v1';
      var backend = 'memory';
      var mem = null;

      function probe(storage){
        try{
          var k = '__probe__';
          storage.setItem(k, '1');
          var ok = storage.getItem(k) === '1';
          storage.removeItem(k);
          return ok;
        }catch(e){ return false; }
      }
      function init(){
        if(typeof localStorage !== 'undefined' && probe(localStorage)) backend = 'localStorage';
        else if(typeof sessionStorage !== 'undefined' && probe(sessionStorage)) backend = 'sessionStorage';
        else backend = 'memory';
        return backend;
      }
      var isPersistent = function(){ return backend !== 'memory'; };
      function exportJson(){
        var data = Persistence.load();
        return { data: data, persistent: isPersistent() };
      }
      function importJson(obj){
        var version = (obj && obj.version) ? Number(obj.version) : null;
        if(version !== 1 && version !== null) return false;
        Persistence.save(obj);
        return true;
      }
      function store(){
        if(backend === 'localStorage') return localStorage;
        if(backend === 'sessionStorage') return sessionStorage;
        return null;
      }
      function save(obj){
        var s = store();
        if(!s){ mem = obj; return false; }
        try{ s.setItem(KEY, JSON.stringify(obj)); return true; }
        catch(e){ mem = obj; return false; }
      }
      function load(){
        var s = store();
        if(!s) return mem;
        try{
          var raw = s.getItem(KEY);
          return raw ? JSON.parse(raw) : null;
        }catch(e){ return null; }
      }
      return {
        init: init, save: save, load: load,
        backend: function(){ return backend; },
        isPersistent: function(){ return backend !== 'memory'; }
      };
    })();

    var Store = (function(){
      var state = null;
      var listeners = [];
      var persist = U.debounce(function(){ Persistence.save(state); }, 150);

      function defaults(){
        return {
          version: 1,
          profile: { name:'', examDate:null, dailyGoalMinutes:120, weekdayOnly:[1,2,3,4,5,6], startDate:null },
          syllabus: [], runs: [], cards: {}, progress: {}, weakItems: {},
          content: { flashcards: [], questions: [] },
          activeRun: null,
          streak: { current:0, longest:0, lastStudyDate:null },
          settings: { sound:true, theme:'dark', fontSize:16, questionCountPerBlock:4, passThreshold:60 }
        };
      }
      function migrate(saved){
        var base = defaults();
        if(!saved || typeof saved !== 'object') return base;
        var out = Object.assign(base, saved);
        out.profile = Object.assign(defaults().profile, saved.profile || {});
        out.streak = Object.assign(defaults().streak, saved.streak || {});
        out.settings = Object.assign(defaults().settings, saved.settings || {});
        out.content = Object.assign(defaults().content, saved.content || {});
        return out;
      }
      function init(){ state = migrate(Persistence.load()); return state; }
      function get(){ return state; }
      function emit(){
        listeners.slice().forEach(function(fn){
          try{ fn(state); }catch(e){ window.reportError('Falha ao atualizar a tela: ' + e.message, e); }
        });
      }
      function set(patch){ Object.assign(state, patch); emit(); persist(); }
      function update(fn){ fn(state); emit(); persist(); }
      function subscribe(fn){
        listeners.push(fn);
        return function(){
          var i = listeners.indexOf(fn);
          if(i >= 0) listeners.splice(i,1);
        };
      }
      return { init:init, get:get, set:set, update:update, subscribe:subscribe, defaults:defaults };
    })();

    var Data = (function(){
      function state(){ return Store.get(); }
      function allFlashcards(){ return SEED.flashcards.concat(state().content.flashcards || []); }
      function allQuestions(){ return SEED.questions.concat(state().content.questions || []); }
      function countFlashcards(sid){
        var n = 0;
        allFlashcards().forEach(function(c){ if(c.syllabusId === sid) n++; });
        return n;
      }
      function countQuestions(sid){
        var n = 0;
        allQuestions().forEach(function(q){ if(q.syllabusId === sid) n++; });
        return n;
      }
      function progressPct(sid){
        var p = state().progress[sid];
        if(!p || !p.total) return 0;
        return Math.round((p.correct / p.total) * 100);
      }
      function node(id){
        var arr = state().syllabus || [];
        for(var i=0;i<arr.length;i++){ if(arr[i].id === id) return arr[i]; }
        return null;
      }
      function minutesToday(){
        var today = U.todayStr();
        var total = 0;
        (state().runs || []).forEach(function(r){
          if(r.endedAt && U.todayStr(new Date(r.endedAt)) === today){
            total += Math.max(0, (r.endedAt - r.startedAt) / 60000);
          }
        });
        return Math.round(total);
      }
      function validateContent(obj){
        var errors = [];
        var sylIds = {};
        (state().syllabus || []).forEach(function(n){ sylIds[n.id] = true; });
        if(obj && obj.syllabus){
          if(!Array.isArray(obj.syllabus)) errors.push('"syllabus" deve ser uma lista.');
          else obj.syllabus.forEach(function(n, i){
            if(!n || !n.id || !n.name) errors.push('syllabus[' + i + '] sem "id" ou "name".');
            else sylIds[n.id] = true;
          });
        }
        if(obj && obj.flashcards){
          if(!Array.isArray(obj.flashcards)) errors.push('"flashcards" deve ser uma lista.');
          else obj.flashcards.forEach(function(c, i){
            if(!c || !c.id || !c.front || !c.back) errors.push('flashcards[' + i + '] precisa de id, front e back.');
            else if(!sylIds[c.syllabusId]) errors.push('flashcards[' + i + '] usa syllabusId inexistente: ' + c.syllabusId);
          });
        }
        if(obj && obj.questions){
          if(!Array.isArray(obj.questions)) errors.push('"questions" deve ser uma lista.');
          else obj.questions.forEach(function(q, i){
            if(!q || !q.id || !q.stem) errors.push('questions[' + i + '] precisa de id e stem.');
            else if(!Array.isArray(q.options) || q.options.length < 2) errors.push('questions[' + i + '] precisa de ao menos 2 opções.');
            else if(typeof q.answer !== 'number' || q.answer < 0 || q.answer >= q.options.length) errors.push('questions[' + i + '] tem answer inválido.');
            else if(!sylIds[q.syllabusId]) errors.push('questions[' + i + '] usa syllabusId inexistente: ' + q.syllabusId);
          });
        }
        if(!obj || (!obj.syllabus && !obj.flashcards && !obj.questions)){
          errors.push('O JSON precisa conter "syllabus", "flashcards" ou "questions".');
        }
        return errors;
      }
      function importContent(obj){
        var errors = validateContent(obj);
        var added = { syllabus:0, flashcards:0, questions:0 };
        if(errors.length) return { ok:false, errors:errors, added:added };
        Store.update(function(s){
          if(obj.syllabus){
            var haveS = {};
            s.syllabus.forEach(function(n){ haveS[n.id] = true; });
            obj.syllabus.forEach(function(n){ if(!haveS[n.id]){ s.syllabus.push(n); haveS[n.id] = true; added.syllabus++; } });
          }
          if(obj.flashcards){
            var haveF = {};
            s.content.flashcards.forEach(function(c){ haveF[c.id] = true; });
            obj.flashcards.forEach(function(c){ if(!haveF[c.id]){ s.content.flashcards.push(c); haveF[c.id] = true; added.flashcards++; } });
          }
          if(obj.questions){
            var haveQ = {};
            s.content.questions.forEach(function(q){ haveQ[q.id] = true; });
            obj.questions.forEach(function(q){ if(!haveQ[q.id]){ s.content.questions.push(q); haveQ[q.id] = true; added.questions++; } });
          }
        });
        return { ok:true, errors:[], added:added };
      }
      return {
        allFlashcards: allFlashcards, allQuestions: allQuestions,
        countFlashcards: countFlashcards, countQuestions: countQuestions,
        progressPct: progressPct, node: node, minutesToday: minutesToday, validateContent: validateContent, importContent: importContent
      };
    })();

    var Planner = (function(){
      function totalItems(){ return Data.allFlashcards().length + Data.allQuestions().length; }
      function studiedItems(){
        var s = Store.get();
        var t = 0;
        Object.keys(s.progress || {}).forEach(function(k){ t += (s.progress[k].seen || 0); });
        return t;
      }
      function runsPerDay(){
        var s = Store.get();
        var perRun = 30;
        return Math.max(1, Math.round((s.profile.dailyGoalMinutes || 120) / perRun));
      }
      function schedule(){
        var s = Store.get();
        var exam = U.parseDate(s.profile.examDate);
        var start = U.parseDate(s.profile.startDate) || U.parseDate(U.todayStr());
        var now = new Date();
        if(!exam) return { configured:false };
        var totalDays = Math.max(1, Math.round((exam - start) / 86400000));
        var elapsedDays = Math.max(0, Math.round((now - start) / 86400000));
        var remainDays = Math.max(0, Math.round((exam - now) / 86400000));
        var total = totalItems();
        var studied = studiedItems();
        var weeksRemain = Math.max(0.1, remainDays / 7);
        var requiredPerWeek = Math.ceil(total / weeksRemain);
        var elapsedFrac = Math.min(1, elapsedDays / totalDays);
        var expected = Math.round(total * elapsedFrac);
        var behind = studied < expected * 0.85;
        return {
          configured:true, exam:exam, start:start, now:now,
          totalDays:totalDays, elapsedDays:elapsedDays, remainDays:remainDays,
          total:total, studied:studied, weeksRemain:weeksRemain,
          requiredPerWeek:requiredPerWeek, expected:expected, behind:behind,
          progressPct: total ? Math.min(100, Math.round((studied / total) * 100)) : 0
        };
      }
      function disciplinePlan(){
        var s = Store.get();
        var sch = schedule();
        if(!sch.configured) return [];
        var nodes = s.syllabus.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); });
        var totalWeight = nodes.reduce(function(a,n){ return a + (n.weight || 1); }, 0) || 1;
        var cum = 0;
        return nodes.map(function(n){
          cum += (n.weight || 1);
          var frac = cum / totalWeight;
          var target = U.addDays(sch.start, Math.round(sch.totalDays * frac));
          var p = s.progress[n.id] || { seen:0 };
          var count = Data.countFlashcards(n.id) + Data.countQuestions(n.id);
          var studied = p.seen || 0;
          var pct = count ? Math.min(100, Math.round((studied / count) * 100)) : 0;
          return { node:n, target:target, pct:pct, count:count, studied:studied };
        });
      }
      function weeklyDistribution(){
        var s = Store.get();
        var active = s.profile.weekdayOnly || [1,2,3,4,5,6];
        var rpd = runsPerDay();
        var labels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
        return labels.map(function(lb, i){
          var on = active.indexOf(i) >= 0;
          return { dow:i, label:lb, runs: on ? rpd : 0, active:on };
        });
      }
      return { totalItems:totalItems, studiedItems:studiedItems, runsPerDay:runsPerDay, schedule:schedule, disciplinePlan:disciplinePlan, weeklyDistribution:weeklyDistribution };
    })();

    var Scheduler = (function(){
      function nodeScore(node, counts, lastId){
        var s = Store.get();
        var w = s.weakItems && s.weakItems[node.id];
        var weakScore = (w && w.kind === 'node') ? (w.score || 0) : 0;
        var p = s.progress[node.id] || { seen:0 };
        var seen = p.seen || 0;
        var count = counts[node.id] || 0;
        var coverage = count ? Math.min(1, seen / count) : 0;
        var priority = 1 - coverage;
        var due = 0;
        var c = (s.cards || {})[node.id];
        if(c && c.dueAt){ due = Math.max(0, (Date.now() - c.dueAt) / 86400000); }
        var delay = seen === 0 ? 3 : 0;
        var score = (node.weight || 1) * (1 + weakScore * 2 + due * 0.5 + priority + delay * 0.2);
        if(node.id === lastId) score = 0;
        return score;
      }
      function choose(rng, counts, lastId, minCards){
        var s = Store.get();
        var eligible = s.syllabus.filter(function(n){ return (counts[n.id] || 0) > 0; });
        var strong = eligible.filter(function(n){ return (counts[n.id] || 0) >= (minCards || 0); });
        var base = strong.length ? strong : eligible;
        var pool = base.filter(function(n){ return n.id !== lastId; });
        if(!pool.length) pool = base;
        if(!pool.length) return null;
        var scored = pool.map(function(n){ return { node:n, score: Math.max(0.0001, nodeScore(n, counts, lastId)) }; });
        var total = scored.reduce(function(a,x){ return a + x.score; }, 0);
        var r = rng() * total;
        for(var i=0;i<scored.length;i++){ r -= scored[i].score; if(r <= 0) return scored[i].node; }
        return scored[scored.length-1].node;
      }
      return { choose:choose, nodeScore:nodeScore };
    })();

    var Reviewer = (function(){
      function computeAndStore(run){
        var threshold = Store.get().settings.passThreshold || 60;
        var byNode = {}, byQuestion = {};
        (run.answers || []).forEach(function(a){
          if(!byNode[a.syllabusId]) byNode[a.syllabusId] = { total:0, correct:0 };
          byNode[a.syllabusId].total++;
          if(a.correct) byNode[a.syllabusId].correct++;
          if(a.kind === 'question'){
            if(!byQuestion[a.refId]) byQuestion[a.refId] = { total:0, correct:0, syllabusId:a.syllabusId };
            byQuestion[a.refId].total++;
            if(a.correct) byQuestion[a.refId].correct++;
          }
        });

        Store.update(function(st){
          var w = st.weakItems || (st.weakItems = {});
          Object.keys(byNode).forEach(function(id){
            var d = byNode[id];
            var acc = d.total ? d.correct / d.total : 1;
            var node = Data.node(id);
            var weight = node ? (node.weight || 1) : 1;
            var p = st.progress[id] || { seen:0, correct:0, total:0, streak:0 };
            p.seen += d.total;
            p.correct += d.correct;
            p.total += d.total;
            st.progress[id] = p;
            if(acc * 100 < threshold){
              var prev = (w[id] && w[id].kind === 'node') ? w[id] : { score:0, reviews:0 };
              w[id] = {
                score: (1 - acc) + (prev.score || 0) * 0.5 + weight * 0.05,
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'node',
                ttl: 3
              };
            }else if(w[id] && w[id].kind === 'node'){
              w[id].score = Math.max(0, (w[id].score || 0) * 0.6);
              if(w[id].score < 0.05) delete w[id];
            }
          });
          Object.keys(byQuestion).forEach(function(qid){
            var d = byQuestion[qid];
            var prev = (w[qid] && w[qid].kind === 'question') ? w[qid] : { score:0, reviews:0 };
            if(d.correct < d.total){
              w[qid] = {
                score: (prev.score || 0) + (d.total - d.correct),
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'question',
                ttl: 3,
                syllabusId: d.syllabusId
              };
            }else if(w[qid] && w[qid].kind === 'question'){
              w[qid].score = Math.max(0, (w[qid].score || 0) - 1);
              if(w[qid].score <= 0) delete w[qid];
            }
          });
        });
      }
      return { computeAndStore: computeAndStore };
    })();

    var Router = (function(){
      var current = 'home';
      var routes = {};
      var cleanup = null;
      function register(name, fn){ routes[name] = fn; }
      function onCleanup(fn){ cleanup = fn; }
      function go(name, params){
