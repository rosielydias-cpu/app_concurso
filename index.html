    function fmtWhen(ts){
      if(!ts) return 'nunca';
      var d = new Date(ts);
      return U.fmtDate(d) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function cloudStatusText(){
      var c = Cloud.cfg();
      if(!c.url) return 'Não conectado. O conteúdo e o progresso ficam só neste aparelho.';
      var parts = [];
      parts.push('Conteúdo: ' + (c.contentNote || 'ainda não carregado') + ' (atualizado ' + fmtWhen(c.lastContentAt) + ')');
      parts.push('Progresso enviado: ' + fmtWhen(c.lastPushAt) + (c.pending ? ' · alterações aguardando envio' : ''));
      if(c.lastError) parts.push('Último erro: ' + c.lastError);
      return parts.join(' · ');
    }

    function bindCloud(vp){
      var status = vp.querySelector('#cloud-status');
      function setStatus(msg){ if(status) status.textContent = msg || cloudStatusText(); }
      function busy(btn, on, label){ if(!btn) return; btn.disabled = on; if(label) btn.textContent = label; }

      var saveBtn = vp.querySelector('#cloud-save');
      if(saveBtn) saveBtn.addEventListener('click', function(){
        var url = vp.querySelector('#cloud-url').value.trim();
        var token = vp.querySelector('#cloud-token').value.trim();
        if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) && !/^https?:\/\/(localhost|127\.0\.0\.1)/.test(url)){
          toast('Cole a URL do App da Web (começa com https://script.google.com/ e termina em /exec).');
          return;
        }
        if(!token){ toast('Cole o token gerado na planilha.'); return; }
        Cloud.setCfg({ url:url, token:token, lastError:'' });
        busy(saveBtn, true, 'Testando…');
        Cloud.test().then(function(r){
          var n = r.contagem || {};
          toast('Conectado! Planilha com ' + (n.cards || 0) + ' cards e ' + (n.questoes || 0) + ' perguntas.');
          return cloudStartup();
        }).catch(function(e){
          Cloud.setCfg({ lastError:e.message });
          toast('Não conectou: ' + e.message);
        }).then(function(){ Router.go('settings'); });
      });

      var syncBtn = vp.querySelector('#cloud-sync');
      if(syncBtn) syncBtn.addEventListener('click', function(){
        busy(syncBtn, true, 'Sincronizando…');
        cloudStartup().then(function(){
          return Cloud.pushNow();
        }).then(function(){
          toast(Cloud.cfg().lastError ? 'Erro: ' + Cloud.cfg().lastError : 'Sincronizado.');
          Router.go('settings');
        });
      });

      var seedBtn = vp.querySelector('#cloud-seed');
      var box = vp.querySelector('#cloud-seed-confirm');
      function doSeed(overwrite){
        busy(seedBtn, true, 'Enviando…');
        Cloud.seed(overwrite).then(function(r){
          var n = r.contagem || {};
          toast('Planilha preenchida: ' + n.materias + ' matérias, ' + n.cards + ' cards e ' + n.questoes + ' perguntas.');
          return cloudStartup();
        }).then(function(){ Router.go('settings'); }).catch(function(e){
          if(e.code === 'NOT_EMPTY'){
            busy(seedBtn, false, 'Enviar conteúdo do app para a planilha');
            if(box){ box.hidden = false; seedBtn.hidden = true; }
            return;
          }
          Cloud.setCfg({ lastError:e.message });
          toast('Não foi possível enviar: ' + e.message);
          Router.go('settings');
        });
      }
      if(seedBtn) seedBtn.addEventListener('click', function(){ doSeed(false); });
      var cancel = vp.querySelector('#cloud-seed-cancel');
      if(cancel) cancel.addEventListener('click', function(){ box.hidden = true; seedBtn.hidden = false; });
      var over = vp.querySelector('#cloud-seed-overwrite');
      if(over) over.addEventListener('click', function(){ box.hidden = true; seedBtn.hidden = false; doSeed(true); });

      var off = vp.querySelector('#cloud-off');
      if(off) off.addEventListener('click', function(){
        Cloud.disconnect();
        toast('Planilha desconectada. O app voltou ao conteúdo embutido.');
        setTimeout(function(){ location.reload(); }, 900);
      });
      setStatus();
    }

    function downloadJson(obj, filename){
      var blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }

    function exportBackup(){
      try{
        Persistence.save(Store.get());
        downloadJson(Store.get(), 'reels-concurso-backup-' + U.todayStr() + '.json');
        toast('Backup exportado.');
      }catch(e){ window.reportError('Falha ao exportar backup: ' + e.message, e); }
    }

    function restoreBackup(file, done){
      var reader = new FileReader();
      reader.onload = function(){
        var obj;
        try{ obj = JSON.parse(reader.result); }
        catch(e){ toast('Arquivo inválido: não é um JSON.'); return done && done(false); }
        if(!obj || typeof obj !== 'object' || !Array.isArray(obj.runs) || !obj.settings){
          toast('Este arquivo não é um backup do Reels de Concurso.');
          return done && done(false);
        }
        obj.updatedAt = Date.now();
        Persistence.save(obj);
        Store.init();
        Store.quietly(syncSyllabus);
        Persistence.save(Store.get());
        Cloud.schedulePush();
        applyTheme();
        toast('Backup restaurado: ' + Store.get().runs.length + ' runs.');
        done && done(true);
      };
      reader.onerror = function(){ toast('Falha ao ler o arquivo.'); };
      reader.readAsText(file);
    }

    function bindBackup(vp){
      var file = vp.querySelector('#backup-file');
      var exp = vp.querySelector('#backup-export');
      if(exp) exp.addEventListener('click', exportBackup);
      var imp = vp.querySelector('#backup-import');
      if(imp) imp.addEventListener('click', function(){ file.click(); });
      if(file) file.addEventListener('change', function(){
        var f = file.files && file.files[0];
        if(!f) return;
        restoreBackup(f, function(){ file.value = ''; Router.go(Router.get()); });
      });
      var reset = vp.querySelector('#backup-reset');
      var box = vp.querySelector('#reset-confirm');
      if(reset && box){
        reset.addEventListener('click', function(){ box.hidden = false; reset.hidden = true; });
        vp.querySelector('#backup-reset-cancel').addEventListener('click', function(){ box.hidden = true; reset.hidden = false; });
        vp.querySelector('#backup-reset-confirm').addEventListener('click', function(){
          var fresh = Store.defaults();
          fresh.syllabus = SEED.syllabus.map(function(n){ return Object.assign({}, n); });
          fresh.updatedAt = Date.now();
          Persistence.save(fresh);
          Store.init();
          Cloud.schedulePush();
          applyTheme();
          toast('Dados apagados. Comece de novo quando quiser.');
          Router.go('settings');
        });
      }
    }

        '</section>';

      vp.querySelector('#coach-5min').addEventListener('click', function(){
        var r = Store.get().activeRun;
        if(r && r.status === 'active') Router.go('run'); else Engine.start();
      });
      var rb = vp.querySelector('#coach-reinforce');
      if(rb) rb.addEventListener('click', function(){ Engine.startReinforce(); });
      vp.querySelectorAll('.check input').forEach(function(cb){
        cb.addEventListener('change', function(){
          Store.update(function(st){
            if(!st.coach || st.coach.day !== key) st.coach = { day:key, done:{} };
            st.coach.done[cb.dataset.id] = cb.checked;
          });
          cb.parentNode.classList.toggle('done', cb.checked);
        });
      });
    }

    var Views = {
      home: function(vp){
        var s = Store.get();
        var name = (s.profile && s.profile.name) ? ', ' + U.esc(s.profile.name) : '';
        var hasActive = !!(s.activeRun && s.activeRun.status === 'active');
        var persistent = Persistence.isPersistent();
        vp.innerHTML =
          '<section class="view view-home">' +
            '<p class="eyebrow">Sua próxima run</p>' +
            '<h1 class="greeting">' + U.greeting() + name + '</h1>' +
            '<p class="sub">Um toque para começar. Sem menus, sem atrito.</p>' +
            (!persistent ? '<div class="banner warning" id="persist-banner">Este navegador não está salvando seus dados. Exporte um backup antes de fechar. <button type="button" id="banner-export">Exportar</button> <button type="button" id="banner-settings">Backup</button></div>' : '') +
            '<div class="card">' +
              '<div class="hero-stats">' +
                '<div class="hstat"><span class="hnum">' + s.streak.current + '</span><span class="hlabel">streak</span></div>' +
                '<div class="hstat"><span class="hnum">' + Data.minutesToday() + '</span><span class="hlabel">min hoje</span></div>' +
                '<div class="hstat"><span class="hnum">' + s.runs.length + '</span><span class="hlabel">runs</span></div>' +
              '</div>' +
              '<button class="btn-primary" id="start-run">' + (hasActive ? 'Retomar run' : 'Estudar agora') + '</button>' +
              '<p class="hint">Meta diária: ' + U.fmtDuration(s.profile.dailyGoalMinutes) + '</p>' +
            '</div>' +
            '<div class="card soft">' +
              '<h2 class="h2">Como funciona</h2>' +
              '<ul class="steps">' +
                '<li><b>1.</b> 4 a 5 flashcards de um tópico, com "Aprofunde" e "Pegadinha de prova".</li>' +
                '<li><b>2.</b> Teste do tópico: múltipla escolha, ordenar, completar e certo/errado.</li>' +
                '<li><b>3.</b> Sumário reforça o que você errou.</li>' +
              '</ul>' +
            '</div>' +
          '</section>';

        var be = vp.querySelector('#banner-export');
        if(be) be.addEventListener('click', exportBackup);
        var bs = vp.querySelector('#banner-settings');
        if(bs) bs.addEventListener('click', function(){ Router.go('settings'); });
        var btn = vp.querySelector('#start-run');
        btn.addEventListener('click', function(){
          if(hasActive) Router.go('run'); else Engine.start();
        });
      },
      run: renderRun,
      summary: renderSummary,
      plan: function(vp){
        var s = Store.get();
        var sch = Planner.schedule();
        var rpd = Planner.runsPerDay();

        var groups = {};
        s.syllabus.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); }).forEach(function(n){
          var g = n.discipline || 'Outros';
          if(!groups[g]) groups[g] = [];
          groups[g].push(n);
        });
        var totalCards = Data.allFlashcards().length;
        var totalQuestions = Data.allQuestions().length;
        var planMap = {};
        Planner.disciplinePlan().forEach(function(x){ planMap[x.node.id] = x; });

        var html =
          '<section class="view">' +
            '<p class="eyebrow">Planejamento global</p>' +
            '<h1 class="h1">Plano de estudo</h1>' +
            '<p class="sub">' + s.syllabus.length + ' conteúdos · ' + totalCards + ' flashcards · ' + totalQuestions + ' questões</p>' +
            '<div class="card soft">' +
              '<p class="muted">Conteúdo de estudo autoral e não oficial. Use Estratégia Concursos e Gran Cursos para a teoria e amplie o banco por importação JSON.</p>' +
            '</div>';

        html +=
          '<div class="card">' +
            '<h2 class="h2">Configuração</h2>' +
            '<label class="field"><span>Seu nome</span><input type="text" id="cfg-name" maxlength="30" autocomplete="given-name" placeholder="Como quer ser chamada" value="' + U.esc(s.profile.name || '') + '"></label>' +
            '<label class="field"><span>Data da prova</span><input type="date" id="cfg-exam" value="' + (s.profile.examDate || '') + '"></label>' +
            '<label class="field"><span>Meta diária (min)</span><input type="number" id="cfg-goal" min="15" step="15" value="' + (s.profile.dailyGoalMinutes || 120) + '"></label>' +
            '<label class="field"><span>Início do plano</span><input type="date" id="cfg-start" value="' + (s.profile.startDate || U.todayStr()) + '"></label>' +
            '<button class="btn-primary" id="cfg-save" style="margin-top:12px">Salvar</button>' +
            '<p class="hint">' + U.fmtDuration(s.profile.dailyGoalMinutes || 120) + '/dia ≈ ' + rpd + ' run(s)/dia</p>' +
          '</div>';

        if(sch.configured){
          html +=
            '<div class="card">' +
              '<h2 class="h2">Ritmo do plano</h2>' +
              '<div class="hero-stats">' +
                '<div class="hstat"><span class="hnum">' + sch.remainDays + '</span><span class="hlabel">dias p/ prova</span></div>' +
                '<div class="hstat"><span class="hnum">' + sch.requiredPerWeek + '</span><span class="hlabel">itens/semana</span></div>' +
                '<div class="hstat"><span class="hnum">' + sch.progressPct + '%</span><span class="hlabel">coberto</span></div>' +
              '</div>' +
              '<span class="badge ' + (sch.behind ? 'warn-badge' : 'ok-badge') + '">' + (sch.behind ? 'Ritmo atrasado' : 'Em dia') + '</span>' +
              '<p class="hint">Estudado ' + sch.studied + ' / esperado ~' + sch.expected + ' · total ' + sch.total + ' itens · prova ' + U.fmtDate(sch.exam) + '</p>' +
              '<div class="week-dist">' + Planner.weeklyDistribution().map(function(d){
                return '<span class="day-chip' + (d.active ? ' on' : '') + '">' + d.label + '<b>' + (d.active ? d.runs + ' run' : 'livre') + '</b></span>';
              }).join('') + '</div>' +
            '</div>';
        }

        Object.keys(groups).forEach(function(g){
          html += '<div class="card"><h2 class="h2">' + U.esc(g) + '</h2><ul class="plan-list">';
          groups[g].forEach(function(n){
            var info = planMap[n.id] || { pct:0, target:null };
            html +=
              '<li class="plan-item">' +
                '<div class="plan-head">' +
                  '<span class="plan-name">' + U.esc(n.name) + '</span>' +
                  '<span class="weight">peso ' + (n.weight || 0) + '</span>' +
                '</div>' +
                '<div class="plan-meta">' + Data.countFlashcards(n.id) + ' cards · ' + Data.countQuestions(n.id) + ' questões' +
                  (info.target ? ' · meta ' + U.fmtDate(info.target) : '') + '</div>' +
                '<div class="bar"><span style="width:' + info.pct + '%"></span></div>' +
                (function(){
                  var ts = TOPICS.filter(function(t){ return t.node === n.id; });
                  var list = ts.length ? '<ul class="topic-list">' + ts.map(function(t){
                    var nc = Data.allFlashcards().filter(function(c){ return c.topic === t.id; }).length;
                    var nq = Data.allQuestions().filter(function(q){ return q.topic === t.id; }).length;
                    return '<li>' + U.esc(t.name) + ' <span>' + nc + ' cards · ' + nq + ' perguntas</span></li>';
                  }).join('') + '</ul>' : '';
                  return (EDITAL[n.id] || ts.length) ? '<details class="edital"><summary>' + (ts.length ? ts.length + ' tópicos · o que cai no edital' : 'O que cai no edital') + '</summary>' + list + (EDITAL[n.id] ? '<p>' + U.esc(EDITAL[n.id]) + '</p>' : '') + '</details>' : '';
                })() +
              '</li>';
          });
          html += '</ul></div>';
        });

        html +=
          '<div class="card">' +
            '<h2 class="h2">Ampliar conteúdo</h2>' +
            '<p class="muted">Importe flashcards e questões em JSON. O conteúdo é validado antes de entrar.</p>' +
            '<button class="btn-primary" id="import-btn" style="margin-top:12px">Importar conteúdo (JSON)</button>' +
            '<button class="btn-ghost" id="template-btn">Baixar modelo JSON</button>' +
            '<input type="file" id="import-file" accept=".json,application/json" hidden>' +
          '</div>' +
        '</section>';

        vp.innerHTML = html;

        vp.querySelector('#cfg-save').addEventListener('click', function(){
          var exam = vp.querySelector('#cfg-exam').value;
          var goal = parseInt(vp.querySelector('#cfg-goal').value, 10);
          var start = vp.querySelector('#cfg-start').value;
          var name = vp.querySelector('#cfg-name').value.trim().slice(0, 30);
          if(exam && exam <= U.todayStr()){ toast('A data da prova precisa ser no futuro.'); return; }
          if(exam && start && start >= exam){ toast('O início do plano precisa ser antes da prova.'); return; }
          Store.update(function(st){
            st.profile = Object.assign({}, st.profile, {
              name: name,
              examDate: exam || null,
              dailyGoalMinutes: isNaN(goal) ? 120 : Math.max(15, goal),
              startDate: start || U.todayStr()
            });
          });
          toast('Plano atualizado.');
          Router.go('plan');
        });

        var fileInput = vp.querySelector('#import-file');
        vp.querySelector('#import-btn').addEventListener('click', function(){ fileInput.click(); });
        vp.querySelector('#template-btn').addEventListener('click', function(){ downloadTemplate(); });
        fileInput.addEventListener('change', function(){
          var file = fileInput.files && fileInput.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(){
            var obj;
            try{ obj = JSON.parse(reader.result); }
            catch(e){ toast('JSON inválido: ' + e.message); fileInput.value = ''; return; }
            var res = Data.importContent(obj);
            if(!res.ok){
              toast('Importação recusada: ' + res.errors[0] + (res.errors.length > 1 ? ' (+' + (res.errors.length - 1) + ')' : ''));
            }else{
              toast('Importado: ' + res.added.flashcards + ' cards, ' + res.added.questions + ' questões, ' + res.added.syllabus + ' conteúdos.');
              Router.go('plan');
            }
            fileInput.value = '';
          };
          reader.onerror = function(){ toast('Falha ao ler o arquivo.'); };
          reader.readAsText(file);
        });
      },
      stats: renderStats,
      review: placeholder('Revisão', 'Sprint 7', 'Fila de revisão espaçada (SRS) e reforços.'),
      coach: renderCoach,
      settings: renderSettings,
    };

    function registerViews(){
      Router.register('home', Views.home);
      Router.register('run', Views.run);
      Router.register('summary', Views.summary);
      Router.register('plan', Views.plan);
      Router.register('stats', Views.stats);
      Router.register('review', Views.review);
      Router.register('coach', Views.coach);
      Router.register('settings', Views.settings);
    }

    function bindTabbar(){
      document.querySelectorAll('#tabbar .tab').forEach(function(btn){
        btn.addEventListener('click', function(){ Router.go(btn.dataset.route); });
      });
    }

    // Mantém as matérias da base (SEED) atualizadas em quem já usa o app (nomes, pesos, novas matérias),
    // preservando matérias importadas pela usuária.
    function syncSyllabus(){
      var cur = Store.get().syllabus || [];
      var seedIds = {};
      SEED.syllabus.forEach(function(n){ seedIds[n.id] = true; });
      var merged = SEED.syllabus.map(function(n){ return Object.assign({}, n); })
        .concat(cur.filter(function(n){ return !seedIds[n.id]; }));
      if(JSON.stringify(merged) !== JSON.stringify(cur)) Store.set({ syllabus: merged });
    }

    function normalizeState(){
      Store.quietly(function(){
        // Streak quebrado: se o último estudo foi antes de ontem, a sequência atual volta a 0.
        var stk = Store.get().streak;
        if(stk.lastStudyDate && stk.current){
          var gap = Math.round((U.parseDate(U.todayStr()) - U.parseDate(stk.lastStudyDate)) / 86400000);
          if(gap > 1) Store.update(function(st){ st.streak.current = 0; });
        }
        syncSyllabus();
      });
    }

    function refreshView(){
      var cur = Router.get();
      if(cur !== 'run') Router.go(cur);
    }

    // Ao abrir: atualiza o conteúdo da planilha e sincroniza o progresso (sem travar o uso offline).
    function cloudStartup(){
      if(!Cloud.enabled()) return Promise.resolve();
      return Cloud.refreshContent().then(function(r){
        if(r.changed){ normalizeState(); refreshView(); toast('Conteúdo atualizado da planilha.'); }
      }).catch(function(e){
        Cloud.setCfg({ lastError:e.message });
      }).then(function(){
        if(Router.get() === 'run') return Cloud.pushNow();
        return Cloud.pullProgress().then(function(res){
          if(res === 'pulled'){ normalizeState(); applyTheme(); refreshView(); toast('Progresso sincronizado da planilha.'); }
        });
      }).catch(function(e){
        Cloud.setCfg({ lastError:e.message });
      });
    }

    function init(){
      var backend = Persistence.init();
      Cloud.applyCached();
      Store.init();
      normalizeState();
      applyTheme();
      registerViews();
      bindTabbar();
      Store.subscribe(function(){ Cloud.schedulePush(); });
      window.addEventListener('beforeunload', function(){ Persistence.save(Store.get()); });
      document.addEventListener('visibilitychange', function(){
        if(document.hidden){ Persistence.save(Store.get()); if(Cloud.cfg().pending) Cloud.pushNow(); }
      });
      window.addEventListener('online', function(){ if(Cloud.cfg().pending) Cloud.pushNow(); });
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
      Router.go('home');
      if(backend === 'memory'){
        setTimeout(function(){ toast('Sessão não será salva (armazenamento indisponível).'); }, 700);
      }
      cloudStartup();
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
