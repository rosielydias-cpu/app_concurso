    var Planner = (function(){
      function totalItems(){ return Data.allFlashcards().length + Data.allQuestions().length; }
      function studiedItems(){
        var s = Store.get();
        var t = 0;
        Object.keys(s.progress || {}).forEach(function(k){ t += (s.progress[k].seen || 0); });
        return t;
      }
      function runsPerDay(){
        var s = Store.get();
        var perRun = 30;
        return Math.max(1, Math.round((s.profile.dailyGoalMinutes || 120) / perRun));
      }
      function schedule(){
        var s = Store.get();
        var exam = U.parseDate(s.profile.examDate);
        var start = U.parseDate(s.profile.startDate) || U.parseDate(U.todayStr());
        var now = new Date();
        if(!exam) return { configured:false };
        var totalDays = Math.max(1, Math.round((exam - start) / 86400000));
        var elapsedDays = Math.max(0, Math.round((now - start) / 86400000));
        var remainDays = Math.max(0, Math.round((exam - now) / 86400000));
        var total = totalItems();
        var studied = studiedItems();
        var weeksRemain = Math.max(0.1, remainDays / 7);
        var requiredPerWeek = Math.ceil(total / weeksRemain);
        var elapsedFrac = Math.min(1, elapsedDays / totalDays);
        var expected = Math.round(total * elapsedFrac);
        var behind = studied < expected * 0.85;
        return {
          configured:true, exam:exam, start:start, now:now,
          totalDays:totalDays, elapsedDays:elapsedDays, remainDays:remainDays,
          total:total, studied:studied, weeksRemain:weeksRemain,
          requiredPerWeek:requiredPerWeek, expected:expected, behind:behind,
          progressPct: total ? Math.min(100, Math.round((studied / total) * 100)) : 0
        };
      }
      function disciplinePlan(){
        var s = Store.get();
        var sch = schedule();
        if(!sch.configured) return [];
        var nodes = s.syllabus.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); });
        var totalWeight = nodes.reduce(function(a,n){ return a + (n.weight || 1); }, 0) || 1;
        var cum = 0;
        return nodes.map(function(n){
          cum += (n.weight || 1);
          var frac = cum / totalWeight;
          var target = U.addDays(sch.start, Math.round(sch.totalDays * frac));
          var p = s.progress[n.id] || { seen:0 };
          var count = Data.countFlashcards(n.id) + Data.countQuestions(n.id);
          var studied = p.seen || 0;
          var pct = count ? Math.min(100, Math.round((studied / count) * 100)) : 0;

        var rpd = runsPerDay();

        return labels.map(function(lb, i){
          var on = active.indexOf(i) >= 0;
          return { dow:i, label:lb, runs: on ? rpd : 0, active:on };
        });

    })();

    var Scheduler = (function(){
      function nodeScore(node, counts, lastId){
        var s = Store.get();
        var w = s.weakItems && s.weakItems[node.id];
        var weakScore = (w && w.kind === 'node') ? (w.score || 0) : 0;
        var p = s.progress[node.id] || { seen:0 };
        var seen = p.seen || 0;
        var count = counts[node.id] || 0;
        var coverage = count ? Math.min(1, seen / count) : 0;
        var priority = 1 - coverage;
        var due = 0;
        var c = (s.cards || {})[node.id];
        if(c && c.dueAt){ due = Math.max(0, (Date.now() - c.dueAt) / 86400000); }
        var delay = seen === 0 ? 3 : 0;
        var score = (node.weight || 1) * (1 + weakScore * 2 + due * 0.5 + priority + delay * 0.2);
        if(node.id === lastId) score = 0;
        return score;
      }
      function choose(rng, counts, lastId, minCards){
        var s = Store.get();
        var eligible = s.syllabus.filter(function(n){ return (counts[n.id] || 0) > 0; });
        var strong = eligible.filter(function(n){ return (counts[n.id] || 0) >= (minCards || 0); });
        var base = strong.length ? strong : eligible;
        var pool = base.filter(function(n){ return n.id !== lastId; });
        if(!pool.length) pool = base;
        if(!pool.length) return null;
        var scored = pool.map(function(n){ return { node:n, score: Math.max(0.0001, nodeScore(n, counts, lastId)) }; });
        var total = scored.reduce(function(a,x){ return a + x.score; }, 0);
        var r = rng() * total;
        for(var i=0;i<scored.length;i++){ r -= scored[i].score; if(r <= 0) return scored[i].node; }
        return scored[scored.length-1].node;
      }
      return { choose:choose, nodeScore:nodeScore };
    })();

    var Reviewer = (function(){
      function computeAndStore(run){
        var threshold = Store.get().settings.passThreshold || 60;
        var byNode = {}, byQuestion = {};
        (run.answers || []).forEach(function(a){
          if(!byNode[a.syllabusId]) byNode[a.syllabusId] = { total:0, correct:0 };
          byNode[a.syllabusId].total++;
          if(a.correct) byNode[a.syllabusId].correct++;
          if(a.kind === 'question'){
            if(!byQuestion[a.refId]) byQuestion[a.refId] = { total:0, correct:0, syllabusId:a.syllabusId };
            byQuestion[a.refId].total++;
            if(a.correct) byQuestion[a.refId].correct++;
          }
        });

        Store.update(function(st){
          var w = st.weakItems || (st.weakItems = {});
          Object.keys(byNode).forEach(function(id){
            var d = byNode[id];
            var acc = d.total ? d.correct / d.total : 1;
            var node = Data.node(id);
            var weight = node ? (node.weight || 1) : 1;
            var p = st.progress[id] || { seen:0, correct:0, total:0, streak:0 };
            p.seen += d.total;
            p.correct += d.correct;
            p.total += d.total;
            st.progress[id] = p;
            if(acc * 100 < threshold){
              var prev = (w[id] && w[id].kind === 'node') ? w[id] : { score:0, reviews:0 };
              w[id] = {
                score: (1 - acc) + (prev.score || 0) * 0.5 + weight * 0.05,
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'node',
                ttl: 3
              };
            }else if(w[id] && w[id].kind === 'node'){
              w[id].score = Math.max(0, (w[id].score || 0) * 0.6);
              if(w[id].score < 0.05) delete w[id];
            }
          });
          Object.keys(byQuestion).forEach(function(qid){
            var d = byQuestion[qid];
            var prev = (w[qid] && w[qid].kind === 'question') ? w[qid] : { score:0, reviews:0 };
            if(d.correct < d.total){
              w[qid] = {
                score: (prev.score || 0) + (d.total - d.correct),
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'question',
                ttl: 3,
                syllabusId: d.syllabusId
              };
            }else if(w[qid] && w[qid].kind === 'question'){
              w[qid].score = Math.max(0, (w[qid].score || 0) - 1);
              if(w[qid].score <= 0) delete w[qid];
            }
          });
        });
      }
      return { computeAndStore: computeAndStore };
    })();

    var Audio = (function(){
      var ctx = null;
      function ensure(){
        if(ctx) return ctx;
        try{
          var AC = window.AudioContext || window.webkitAudioContext;
          if(AC) ctx = new AC();
        }catch(e){ ctx = null; }

      function beep(freq, dur, type){

    var Engine = (function(){
      var P = { warmupCards:4, mainCards:8, blockSize:4, reinforceCards:4, reinforceQuestions:4 };

      function shuffle(arr, rng){
        var a = arr.slice();
        for(var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
        return a;
      }
      function byNode(items, nodeId){ return items.filter(function(x){ return x.syllabusId === nodeId; }); }
      function chooseMain(rng, counts){
        var s = Store.get();
        var lastId = s.runs.length ? (s.runs[s.runs.length-1].mainSyllabusId || null) : null;
        return Scheduler.choose(rng, counts, lastId, P.blockSize);
      }
      function weakNodeIds(){
        var w = Store.get().weakItems || {};
        return Object.keys(w).filter(function(id){ return w[id] && w[id].kind === 'node' && w[id].score > 0; })
          .sort(function(a,b){ return w[b].score - w[a].score; });
      }
      function weakQuestionIds(){
        var w = Store.get().weakItems || {};
        return Object.keys(w).filter(function(id){ return w[id] && w[id].kind === 'question' && w[id].score > 0; })
          .sort(function(a,b){ return w[b].score - w[a].score; });
      }
      function takeCards(nodeId, n, rng, used){
        if(!nodeId || n <= 0) return [];
        var cards = byNode(Data.allFlashcards(), nodeId).filter(function(c){ return !used[c.id]; });
        cards = shuffle(cards, rng).slice(0, n);
        cards.forEach(function(c){ used[c.id] = true; });
        return cards;
      }
      function takeQuestions(nodeIds, n, rng, used, weakQIds){
        if(n <= 0) return [];
        var out = [];
        var all = Data.allQuestions();
        if(weakQIds && weakQIds.length){
          var map = {};
          all.forEach(function(q){ map[q.id] = q; });
          for(var i=0;i<weakQIds.length && out.length<n;i++){
            var q = map[weakQIds[i]];
            if(q && !used[q.id]){ out.push(q); used[q.id] = true; }
          }
        }
        if(out.length < n){
          var pool = [];
          nodeIds.forEach(function(id){ pool = pool.concat(byNode(all, id)); });
          pool = shuffle(pool, rng);
          for(var j=0;j<pool.length && out.length<n;j++){
            if(!used[pool[j].id]){ out.push(pool[j]); used[pool[j].id] = true; }
          }
        }
        return out;
      }
      function build(){
        var rng = U.mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
        var s = Store.get();
        var allCards = Data.allFlashcards();
        var counts = {};
        allCards.forEach(function(c){ counts[c.syllabusId] = (counts[c.syllabusId] || 0) + 1; });
        var main = chooseMain(rng, counts);
        if(!main) return null;
        var usedCards = {}, usedQs = {};
        var queue = [];
        var weak = weakNodeIds();
        var weakQs = weakQuestionIds();

        // Aquecimento vem de outro conteúdo (fraco, se houver) para não esgotar os cards do conteúdo principal.
        var warmSrc = weak.filter(function(id){ return id !== main.id && (counts[id] || 0) > 0; })[0] || null;
        if(!warmSrc){
          var others = s.syllabus.filter(function(n){ return n.id !== main.id && (counts[n.id] || 0) > 0; });
          if(others.length) warmSrc = others[Math.floor(rng() * others.length)].id;
        }
        var warm = takeCards(warmSrc, P.warmupCards, rng, usedCards);
        if(warm.length < P.warmupCards){
          warm = warm.concat(takeCards(main.id, P.warmupCards - warm.length, rng, usedCards));
        }
        warm.forEach(function(c){ queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId }); });

        var qPerBlock = U.clamp(parseInt(s.settings.questionCountPerBlock, 10) || P.blockSize, 1, 10);
        var mainCards = takeCards(main.id, P.mainCards, rng, usedCards);
        var blocks = 0;
        for(var i=0;i<mainCards.length;i++){
          queue.push({ kind:'card', refId:mainCards[i].id, syllabusId:mainCards[i].syllabusId });
          if((i+1) % P.blockSize === 0){
            takeQuestions([main.id].concat(weak), qPerBlock, rng, usedQs, weakQs).forEach(function(q){
              queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
            });
            blocks++;
          }
        }
        if(blocks === 0 && mainCards.length){
          takeQuestions([main.id].concat(weak), qPerBlock, rng, usedQs, weakQs).forEach(function(q){
            queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
          });
        }

        if(weak.length || weakQs.length){
          var wsrc = weak.length ? weak[0] : main.id;
          takeCards(wsrc, P.reinforceCards, rng, usedCards).forEach(function(c){
            queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId });
          });
          takeQuestions(weak.length ? weak : [main.id], P.reinforceQuestions, rng, usedQs, weakQs).forEach(function(q){
            queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
          });
        }

        var weakMap = Store.get().weakItems || {};
        var reinforced = {};
        queue.forEach(function(it){
          if(weakMap[it.refId] && weakMap[it.refId].kind === 'question') reinforced[it.refId] = true;
          if(weakMap[it.syllabusId] && weakMap[it.syllabusId].kind === 'node') reinforced[it.syllabusId] = true;
        });

        return { queue: queue, mainSyllabusId: main.id, reinforcedIds: Object.keys(reinforced) };
      }
      function decayWeak(ids){
        if(!ids || !ids.length) return;
        Store.update(function(st){
          var w = st.weakItems || {};
          ids.forEach(function(id){
            if(w[id]){ w[id].ttl = (w[id].ttl || 0) - 1; if(w[id].ttl <= 0) delete w[id]; }
          });
        });
      }
      function beginRun(queue, mainId, reinforcedIds){
        var run = {
          id: U.uid(),
          startedAt: Date.now(),
          endedAt: null,
          mainSyllabusId: mainId || null,
          queue: queue,
          index: 0,
          answers: [],
          score: 0,
          status: 'active',
          reinforcedIds: reinforcedIds || []
        };
        Store.set({ activeRun: run });
        Router.go('run');
      }
      function start(){
        var built = build();
        if(!built || !built.queue.length){ toast('Sem conteúdo suficiente para iniciar a run.'); return; }
        decayWeak(built.reinforcedIds);
        beginRun(built.queue, built.mainSyllabusId, built.reinforcedIds);
      }
      function startReinforce(){
        var rng = U.mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
        var weak = weakNodeIds();
        var weakQs = weakQuestionIds();
        if(!weak.length && !weakQs.length){ toast('Nenhum item fraco para reforçar agora.'); return; }
        var usedCards = {}, usedQs = {};
        var queue = [];
        weak.forEach(function(id){
          takeCards(id, 3, rng, usedCards).forEach(function(c){
            queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId });
          });
        });
        takeQuestions(weak, 8, rng, usedQs, weakQs).forEach(function(q){
          queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
        });
        if(!queue.length){ toast('Nenhum item fraco disponível.'); return; }
        beginRun(queue, weak[0] || null, weak.concat(weakQs));
      }
      function updateStreak(st){
        var today = U.todayStr();
        if(st.streak.lastStudyDate === today) return;
        if(st.streak.lastStudyDate){
          var d1 = new Date(st.streak.lastStudyDate + 'T00:00:00');
          var d2 = new Date(today + 'T00:00:00');
          var diff = Math.round((d2 - d1) / 86400000);
          st.streak.current = diff === 1 ? (st.streak.current || 0) + 1 : 1;
        }else{
          st.streak.current = 1;
        }
        st.streak.lastStudyDate = today;
        st.streak.longest = Math.max(st.streak.longest || 0, st.streak.current);
      }
      function finish(){
        Store.update(function(st){
          var r = st.activeRun;
          if(!r) return;
          r.status = 'done';
          r.endedAt = Date.now();
          r.accuracy = r.answers.length ? Math.round((r.score / r.answers.length) * 100) : 0;
          r.passed = r.accuracy >= (st.settings.passThreshold || 60);
          updateStreak(st);
        });
        var run = Store.get().activeRun;
        if(run) Reviewer.computeAndStore(run);
        Store.update(function(st){
          if(!st.activeRun) return;
          st.runs.push(st.activeRun);
          st.activeRun = null;
        });
        Router.go('summary');
      }
      // Sair no meio: com respostas, fecha a run e mostra o sumário; sem respostas, descarta.
      function exit(){
        var r = Store.get().activeRun;
        if(!r){ Router.go('home'); return; }
        if(r.answers && r.answers.length){ finish(); return; }
        Store.set({ activeRun: null });
        toast('Run descartada.');
        Router.go('home');
      }
      return { start:start, startReinforce:startReinforce, finish:finish, exit:exit, build:build, params:P };
    })();

    var Stats = (function(){
      function dayKey(ts){ return U.todayStr(new Date(ts)); }
      function runs(){ return Store.get().runs || []; }
      function summary(){
        var s = Store.get();
        var rs = runs();
        var totalMs = 0, answers = 0, correct = 0;
        var days = {};
        rs.forEach(function(r){
          if(r.endedAt && r.startedAt) totalMs += Math.max(0, r.endedAt - r.startedAt);
          (r.answers || []).forEach(function(a){ answers++; if(a.correct) correct++; });
          if(r.endedAt) days[dayKey(r.endedAt)] = true;
        });
        return {
          streak: s.streak.current || 0,
          longest: s.streak.longest || 0,
          totalMinutes: Math.round(totalMs / 60000),
          runs: rs.length,
          answers: answers,
          accuracy: answers ? Math.round((correct / answers) * 100) : 0,
          studyDays: Object.keys(days).length
        };
      }
      function dailyMap(){
        var map = {};
        runs().forEach(function(r){
          if(!r.endedAt) return;
          var k = dayKey(r.endedAt);
          if(!map[k]) map[k] = { minutes:0, answers:0, correct:0, runs:0 };
          map[k].minutes += Math.max(0, (r.endedAt - r.startedAt) / 60000);
          map[k].runs++;
          (r.answers || []).forEach(function(a){ map[k].answers++; if(a.correct) map[k].correct++; });
        });
        return map;
      }
      function heatmap(days){
        days = days || 84;
        var map = dailyMap();
        var today = U.parseDate(U.todayStr());
        var out = [];
        for(var i=days-1;i>=0;i--){
          var d = U.addDays(today, -i);
          var k = U.todayStr(d);
          var m = map[k] || { minutes:0 };
          var level = 0;
          if(m.minutes >= 90) level = 4;
          else if(m.minutes >= 60) level = 3;
          else if(m.minutes >= 30) level = 2;
          else if(m.minutes > 0) level = 1;
          out.push({ key:k, date:d, minutes:Math.round(m.minutes), level:level });
        }
        return out;
      }
      function accuracySeries(limit){
        limit = limit || 20;
        var rs = runs().filter(function(r){ return r.endedAt && r.answers && r.answers.length; });
        return rs.slice(-limit).map(function(r){
          var c = 0;
          r.answers.forEach(function(a){ if(a.correct) c++; });
          return { accuracy: Math.round((c / r.answers.length) * 100), at: r.endedAt };
        });
      }
      function byDiscipline(){
        var s = Store.get();
        var nodeDisc = {};
        s.syllabus.forEach(function(n){ nodeDisc[n.id] = n.discipline || 'Outros'; });
        var agg = {};
        runs().forEach(function(r){
          (r.answers || []).forEach(function(a){
            var d = nodeDisc[a.syllabusId] || 'Outros';
            if(!agg[d]) agg[d] = { total:0, correct:0 };
            agg[d].total++;
            if(a.correct) agg[d].correct++;
          });
        });
        return Object.keys(agg).map(function(d){
          return { discipline:d, total:agg[d].total, correct:agg[d].correct, pct: agg[d].total ? Math.round((agg[d].correct / agg[d].total) * 100) : 0 };
        }).sort(function(a,b){ return b.total - a.total; });
      }
      function weakRanking(limit){
        limit = limit || 6;
        var s = Store.get();
        var w = s.weakItems || {};
        var names = {};
        s.syllabus.forEach(function(n){ names[n.id] = n.name; });
        Data.allQuestions().forEach(function(q){ names[q.id] = q.stem; });
        return Object.keys(w).map(function(id){
          return { id:id, kind:w[id].kind, score:w[id].score || 0, name: names[id] || id };
        }).sort(function(a,b){ return b.score - a.score; }).slice(0, limit);
      }
      return { summary:summary, heatmap:heatmap, accuracySeries:accuracySeries, byDiscipline:byDiscipline, weakRanking:weakRanking, dailyMap:dailyMap };
    })();

    function renderRun(vp){
      var s = Store.get();
      var run = s.activeRun;
      if(!run || run.status !== 'active'){
        vp.innerHTML =
          '<section class="view">' +
            '<p class="eyebrow">Run</p>' +
            '<h1 class="h1">Nenhuma run ativa</h1>' +
            '<div class="card">' +
              '<p class="muted">Inicie uma run para estudar flashcards e questões em ritmo de reels.</p>' +
              '<button class="btn-primary" id="run-start" style="margin-top:14px">Estudar agora</button>' +
            '</div>' +
          '</section>';
        vp.querySelector('#run-start').addEventListener('click', function(){ Engine.start(); });
        return;
      }

      var cardMap = {}, qMap = {}, nodeMap = {};
      Data.allFlashcards().forEach(function(c){ cardMap[c.id] = c; });
      Data.allQuestions().forEach(function(q){ qMap[q.id] = q; });
      s.syllabus.forEach(function(n){ nodeMap[n.id] = n; });

      vp.innerHTML =
        '<section class="view run-view">' +
          '<div class="run-top">' +
            '<button class="icon-btn" id="run-exit" aria-label="Encerrar run">' +
              '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button>' +
            '<div class="run-progress"><div id="run-progress-fill"></div></div>' +
            '<span class="run-counter" id="run-counter">0/0</span>' +
            '<span class="run-score-wrap"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.5 6 .9-4.4 4.3 1 6-5.3-2.8L6.7 19.7l1-6L3.3 9.4l6-.9z"/></svg><b id="run-score">0</b></span>' +
          '</div>' +
          '<div id="run-stage"></div>' +
        '</section>';

      var stage = vp.querySelector('#run-stage');
      var fill = vp.querySelector('#run-progress-fill');
      var counter = vp.querySelector('#run-counter');
      var scoreEl = vp.querySelector('#run-score');
      var revealed = false;
      var locked = false;

      function nodeName(sid){ var n = nodeMap[sid]; return n ? n.name : 'Conteúdo'; }

      function chrome(){
        var r = Store.get().activeRun;
        if(!r) return;
        var total = r.queue.length;
        var pct = total ? Math.round((r.index / total) * 100) : 0;
        fill.style.width = pct + '%';
        counter.textContent = r.index + '/' + total;
        scoreEl.textContent = r.score;
      }

      function record(kind, refId, syllabusId, correct){
        Store.update(function(st){
          var r = st.activeRun;
          if(!r) return;
          r.answers.push({ kind:kind, refId:refId, syllabusId:syllabusId, correct:!!correct, ts:Date.now() });
          if(correct) r.score += 1;
        });
      }

      function advance(){
        Store.update(function(st){ if(st.activeRun) st.activeRun.index += 1; });
        revealed = false;
        locked = false;
        paint();
      }

      function paint(){
        var r = Store.get().activeRun;
        if(!r) return;
        if(r.index >= r.queue.length){ Engine.finish(); return; }
        chrome();
        var item = r.queue[r.index];
        if(item.kind === 'card') paintCard(item); else paintQuestion(item);
      }

      function paintCard(item){
        var card = cardMap[item.refId];
        if(!card){ advance(); return; }
        revealed = false;
        stage.innerHTML =
          '<div class="reel">' +
            '<div class="reel-tag">Flashcard · <span>' + U.esc(nodeName(item.syllabusId)) + '</span></div>' +
            '<div class="reel-q">' + U.esc(card.front) + '</div>' +
            '<button class="btn-primary" id="reveal">Mostrar resposta</button>' +
            '<div class="reel-a" id="card-back" hidden>' + U.esc(card.back) + '</div>' +
            '<div class="card-controls" id="card-controls" hidden>' +
              '<button class="btn-no" id="ans-no">Não sei</button>' +
              '<button class="btn-yes" id="ans-yes">Sei</button>' +
            '</div>' +
            '<p class="swipe-hint" id="swipe-hint">Toque em mostrar · arraste para cima</p>' +
          '</div>';
        var back = stage.querySelector('#card-back');
        var controls = stage.querySelector('#card-controls');
        var revealBtn = stage.querySelector('#reveal');
        var hint = stage.querySelector('#swipe-hint');
        revealBtn.addEventListener('click', function(){
          if(revealed) return;
          revealed = true;
          back.hidden = false;
          controls.hidden = false;
          revealBtn.hidden = true;
          hint.textContent = 'Avalie: não sei ou sei';
        });
        stage.querySelector('#ans-no').addEventListener('click', function(){
          if(locked) return; locked = true;
          record('card', card.id, card.syllabusId, false);
          advance();
        });
        stage.querySelector('#ans-yes').addEventListener('click', function(){
          if(locked) return; locked = true;
          record('card', card.id, card.syllabusId, true);
          Audio.correct();
          advance();
        });
      }

      function paintQuestion(item){
        var q = qMap[item.refId];
        if(!q){ advance(); return; }
        var isCE = q.options.length === 2 && q.options[0] === 'Certo' && q.options[1] === 'Errado';
        var letters = isCE ? ['C','E'] : ['A','B','C','D','E','F'];
        var optsHtml = q.options.map(function(t, i){
          return '<button class="opt" data-i="' + i + '"><span class="opt-letter">' + letters[i] + '</span><span>' + U.esc(t) + '</span></button>';
        }).join('');
        stage.innerHTML =
          '<div class="reel">' +
            '<div class="reel-tag">' + (isCE ? 'Certo ou errado' : 'Questão') + ' · <span>' + U.esc(nodeName(item.syllabusId)) + '</span>' + (q.source ? ' · ' + U.esc(q.source) : '') + '</div>' +
            '<div class="reel-q' + (isCE ? ' reel-q-ce' : '') + '">' + U.esc(q.stem) + '</div>' +
            '<div class="opts' + (isCE ? ' opts-ce' : '') + '" id="opts">' + optsHtml + '</div>' +
            '<div class="feedback" id="q-feedback" hidden>' +
              '<p class="fb-title"></p>' +
              '<p class="fb-exp"></p>' +
              '<button class="btn-primary" id="q-next">Próxima</button>' +
            '</div>' +
          '</div>';
        var answered = false;
        var optEls = stage.querySelectorAll('.opt');
        optEls.forEach(function(btn, idx){
          btn.addEventListener('click', function(){
            if(answered) return;
            answered = true;
            var correct = idx === q.answer;
            record('question', q.id, q.syllabusId, correct);
            optEls.forEach(function(b, i){
              b.disabled = true;
              if(i === q.answer) b.classList.add('correct');
              else if(i === idx) b.classList.add('wrong');
            });
            var fb = stage.querySelector('#q-feedback');
            fb.hidden = false;
            fb.classList.add(correct ? 'ok' : 'bad');
            fb.querySelector('.fb-title').textContent = (correct ? 'Você acertou' : 'Você errou') + (isCE ? ' · gabarito: ' + q.options[q.answer].toUpperCase() : '');
            fb.querySelector('.fb-exp').textContent = q.explanation || '';
            if(correct) Audio.correct();
            chrome();
          });
        });
        stage.querySelector('#q-next').addEventListener('click', function(){
          if(locked) return; locked = true;
          advance();
        });
      }

      function onKey(e){
        var r = Store.get().activeRun;
        if(!r) return;
        var item = r.queue[r.index];
        if(!item) return;
        if(e.key === 'Escape'){ e.preventDefault(); Engine.exit(); return; }
        if(item.kind === 'card'){
          if(e.key === ' ' || e.key === 'ArrowDown'){
            e.preventDefault();
            if(!revealed){ var rb = stage.querySelector('#reveal'); if(rb) rb.click(); }
            else { var yes = stage.querySelector('#ans-yes'); if(yes) yes.click(); }
          }else if(revealed && (e.key === '1' || e.key === '2')){
            e.preventDefault();
            var b = stage.querySelector(e.key === '1' ? '#ans-no' : '#ans-yes');
            if(b) b.click();
          }
        }else{
          var fb = stage.querySelector('#q-feedback');
          if(fb && !fb.hidden){
            if(e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter'){
              e.preventDefault();
              var nx = stage.querySelector('#q-next'); if(nx) nx.click();
            }
          }else{
            var idx = parseInt(e.key, 10) - 1;
            var opts = stage.querySelectorAll('.opt');
            if(idx >= 0 && idx < opts.length){ e.preventDefault(); opts[idx].click(); }
          }
        }
      }

      var touchStartY = null;
      stage.addEventListener('touchstart', function(e){
        if(e.touches.length === 1) touchStartY = e.touches[0].clientY;
      }, { passive:true });
      stage.addEventListener('touchend', function(e){
        if(touchStartY === null) return;
        var endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : touchStartY;
        var dy = touchStartY - endY;
        touchStartY = null;
        if(dy > 50){
          var r = Store.get().activeRun; if(!r) return;
          var item = r.queue[r.index]; if(!item || item.kind !== 'card') return;
          if(!revealed){ var rb = stage.querySelector('#reveal'); if(rb) rb.click(); }
          else { var yes = stage.querySelector('#ans-yes'); if(yes) yes.click(); }
        }
      }, { passive:true });

      vp.querySelector('#run-exit').addEventListener('click', function(){ Engine.exit(); });
      Router.onCleanup(function(){ document.removeEventListener('keydown', onKey); });
      document.addEventListener('keydown', onKey);
      paint();
    }

    function renderSummary(vp){
      var s = Store.get();
      var run = s.runs.length ? s.runs[s.runs.length-1] : null;
      if(!run){
        vp.innerHTML =
          '<section class="view">' +
            '<p class="eyebrow">Sumário</p>' +
            '<h1 class="h1">Nenhuma run concluída</h1>' +
            '<div class="card">' +
              '<p class="muted">Conclua uma run para ver o sumário.</p>' +
              '<button class="btn-primary" id="sum-start" style="margin-top:14px">Estudar agora</button>' +
            '</div>' +
          '</section>';
        vp.querySelector('#sum-start').addEventListener('click', function(){ Engine.start(); });
        return;
      }

      var total = run.answers.length;
      var correct = 0;
      var byNode = {};
      run.answers.forEach(function(a){
        if(a.correct) correct++;
        if(!byNode[a.syllabusId]) byNode[a.syllabusId] = { total:0, correct:0 };
        byNode[a.syllabusId].total++;
        if(a.correct) byNode[a.syllabusId].correct++;
      });
      var acc = total ? Math.round((correct / total) * 100) : 0;
      var durMin = Math.max(0, Math.round(((run.endedAt || Date.now()) - run.startedAt) / 60000));
      var nodeName = {};
      s.syllabus.forEach(function(n){ nodeName[n.id] = n.name; });

      var rows = Object.keys(byNode).map(function(id){
        var d = byNode[id];
        var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
        var cls = pct >= 70 ? 'ok' : (pct >= 50 ? 'warn' : 'bad');
        return '<li class="sum-row">' +
          '<div class="plan-head"><span class="plan-name">' + U.esc(nodeName[id] || id) + '</span><span class="sum-pct ' + cls + '">' + pct + '%</span></div>' +
          '<div class="plan-meta">' + d.correct + '/' + d.total + '</div>' +
          '<div class="bar"><span class="' + cls + '" style="width:' + pct + '%"></span></div>' +
        '</li>';
      }).join('');

      var threshold = s.settings.passThreshold || 60;
      var passed = (typeof run.passed === 'boolean') ? run.passed : (acc >= threshold);
      var passBadge = passed
        ? '<span class="badge ok-badge">Meta batida</span>'
        : '<span class="badge warn-badge">Abaixo de ' + threshold + '%</span>';

      var phrase;
      if(acc >= 80) phrase = 'Excelente ritmo. Pequenas runs diárias valem mais que maratonas.';
      else if(acc >= 60) phrase = 'Bom desempenho. Amanhã comece pelos conteúdos mais fracos para consolidar.';
      else phrase = 'Dia difícil não apaga o progresso. A próxima run já vem com reforço automático dos pontos fracos.';

      var weak = s.weakItems || {};
      var weakNodeNames = Object.keys(weak).filter(function(id){ return weak[id].kind === 'node'; })
        .map(function(id){ return nodeName[id] || id; });
      var weakQCount = Object.keys(weak).filter(function(id){ return weak[id].kind === 'question'; }).length;
      var hasWeak = weakNodeNames.length > 0 || weakQCount > 0;
      var weakText = [];
      if(weakNodeNames.length) weakText.push(weakNodeNames.join(', '));
      if(weakQCount) weakText.push(weakQCount + (weakQCount === 1 ? ' questão' : ' questões'));

      var weakCard =
        '<div class="card">' +
          '<h2 class="h2">A reforçar na próxima run</h2>' +
          (hasWeak
            ? '<p class="muted">' + U.esc(weakText.join(' · ')) + '</p>' +
              '<button class="btn-primary" id="sum-reinforce" style="margin-top:12px">Reforçar agora</button>'
            : '<p class="muted">Nenhum item fraco pendente. Bom sinal — siga avançando no plano.</p>') +
        '</div>';

      var streakLine = 'Streak: ' + s.streak.current + (s.streak.current === 1 ? ' dia' : ' dias') + ' · XP: ' + (run.score * 10);

      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Run concluída</p>' +
          '<h1 class="h1">Seu sumário</h1>' +
          '<div class="card">' +
            '<div class="hero-stats">' +
              '<div class="hstat"><span class="hnum">' + acc + '%</span><span class="hlabel">acerto</span></div>' +
              '<div class="hstat"><span class="hnum">' + correct + '/' + total + '</span><span class="hlabel">acertos</span></div>' +
              '<div class="hstat"><span class="hnum">' + durMin + '</span><span class="hlabel">min</span></div>' +
            '</div>' +
            passBadge +
            '<p class="hint">' + U.esc(streakLine) + '</p>' +
            '<button class="btn-primary" id="sum-new" style="margin-top:14px">Nova run</button>' +
            '<button class="btn-ghost" id="sum-home">Voltar ao início</button>' +
          '</div>' +
          '<div class="card soft"><p class="muted">' + U.esc(phrase) + '</p></div>' +
          '<div class="card"><h2 class="h2">Por conteúdo</h2><ul class="plan-list">' + (rows || '<li class="muted">Sem dados.</li>') + '</ul></div>' +
          weakCard +
        '</section>';

      vp.querySelector('#sum-new').addEventListener('click', function(){ Engine.start(); });
      vp.querySelector('#sum-home').addEventListener('click', function(){ Router.go('home'); });
      var rb = vp.querySelector('#sum-reinforce');
      if(rb) rb.addEventListener('click', function(){ Engine.startReinforce(); });
    }

    function renderStats(vp){
      var sm = Stats.summary();
      var days = Stats.heatmap(84);
      var series = Stats.accuracySeries(20);
      var discs = Stats.byDiscipline();
      var weak = Stats.weakRanking(6);

      var pad = days.length ? days[0].date.getDay() : 0;
      var cells = '';
      for(var i=0;i<pad;i++) cells += '<span class="hm-cell empty"></span>';
      days.forEach(function(d){
        cells += '<span class="hm-cell lvl' + d.level + '" title="' + U.fmtDate(d.date) + ' · ' + d.minutes + ' min"></span>';
      });

      var lineHtml;
      if(series.length < 2){
        lineHtml = '<p class="muted">Conclua mais runs para ver a evolução da taxa de acerto.</p>';
      }else{
        var W = 300, H = 90, pd = 6, n = series.length;
        var pts = series.map(function(p, i){
          var x = pd + (i / (n - 1)) * (W - 2 * pd);
          var y = H - pd - (p.accuracy / 100) * (H - 2 * pd);
          return x.toFixed(1) + ',' + y.toFixed(1);
        }).join(' ');
        lineHtml =
          '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-line" preserveAspectRatio="none">' +
            '<line x1="0" y1="' + (H - pd) + '" x2="' + W + '" y2="' + (H - pd) + '" style="stroke:var(--border);stroke-width:1"/>' +
            '<polyline points="' + pts + '" style="fill:none;stroke:var(--accent);stroke-width:2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
          '</svg>' +
          '<p class="hint">Última run: ' + series[series.length-1].accuracy + '% · ' + n + ' runs</p>';
      }

      var discChart = (function(){
        if(!discs.length) return '<p class="muted">Sem respostas registradas ainda.</p>';
        var rowH = 26, W = 340, H = discs.length * rowH + 6;
        var bars = discs.map(function(d, i){
          var y = i * rowH + 6;
          var w = Math.max(0, (d.pct / 100) * 190);
          var color = d.pct >= 70 ? 'var(--ok)' : (d.pct >= 50 ? 'var(--warn)' : 'var(--danger)');
          var short = d.discipline.replace(/^(Específicos|Básicos|Extra) · /, '');
          var label = short.length > 15 ? short.slice(0, 14) + '…' : short;
          return '<text x="0" y="' + (y + 9) + '" style="fill:var(--muted);font-size:10.5px">' + U.esc(label) + '</text>' +
            '<rect x="100" y="' + y + '" width="190" height="10" rx="5" style="fill:var(--surface-2)"/>' +
            '<rect x="100" y="' + y + '" width="' + w.toFixed(1) + '" height="10" rx="5" style="fill:' + color + '"/>' +
            '<text x="294" y="' + (y + 9) + '" style="fill:var(--text);font-size:10.5px;font-weight:700">' + d.pct + '%</text>';
        }).join('');
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-bars" preserveAspectRatio="xMinYMin meet">' + bars + '</svg>';
      })();

      var weakRows = weak.length ? weak.map(function(w){
        return '<li class="sum-row">' +
          '<div class="plan-head"><span class="plan-name">' + U.esc(w.name) + '</span><span class="weight">' + (w.kind === 'question' ? 'questão' : 'conteúdo') + '</span></div>' +
          '<div class="plan-meta">peso de reforço ' + w.score.toFixed(1) + '</div>' +
        '</li>';
      }).join('') : '<li class="muted">Nenhum item fraco pendente.</li>';

      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Progresso</p>' +
          '<h1 class="h1">Seu progresso</h1>' +
          '<div class="card">' +
            '<div class="hero-stats">' +
              '<div class="hstat"><span class="hnum">' + sm.streak + '</span><span class="hlabel">streak</span></div>' +
              '<div class="hstat"><span class="hnum">' + sm.longest + '</span><span class="hlabel">recorde</span></div>' +
              '<div class="hstat"><span class="hnum">' + (sm.totalMinutes / 60).toFixed(1) + 'h</span><span class="hlabel">estudadas</span></div>' +
            '</div>' +
            '<p class="hint">' + sm.runs + ' runs · ' + sm.answers + ' respostas · ' + sm.accuracy + '% acerto geral · ' + sm.studyDays + ' dias estudados</p>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="h2">Constância (12 semanas)</h2>' +
            '<div class="heatmap">' + cells + '</div>' +
            '<div class="hm-legend"><span>menos</span><span class="hm-cell lvl0"></span><span class="hm-cell lvl1"></span><span class="hm-cell lvl2"></span><span class="hm-cell lvl3"></span><span class="hm-cell lvl4"></span><span>mais</span></div>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="h2">Taxa de acerto</h2>' +
            lineHtml +
          '</div>' +
          '<div class="card"><h2 class="h2">Por disciplina</h2>' + discChart + '</div>' +
          '<div class="card"><h2 class="h2">Conteúdos fracos</h2><ul class="plan-list">' + weakRows + '</ul></div>' +
        '</section>';
    }

    function renderSettings(vp){
      var s = Store.get();
      var settings = s.settings;
      var theme = settings.theme;
      var fs = settings.fontSize || 16;
      var qc = settings.questionCountPerBlock;
      function opt(v, cur, label){ return '<option value="' + v + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + label + '</option>'; }
      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Ajustes</p>' +
          '<h1 class="h1">Configurações</h1>' +
          '<div class="card">' +
            '<label class="field"><span>Tema</span>' +
              '<select id="theme" aria-label="Tema do app">' + opt('dark', theme, 'Escuro') + opt('light', theme, 'Claro') + '</select>' +
            '</label>' +
            '<label class="field"><span>Tamanho do texto</span>' +
              '<select id="font-size" aria-label="Tamanho do texto nos cards">' + opt(14, fs, 'Pequeno') + opt(16, fs, 'Médio') + opt(18, fs, 'Grande') + opt(20, fs, 'Muito grande') + '</select>' +
            '</label>' +
            '<label class="field"><span>Questões por bloco</span>' +
              '<select id="question-count" aria-label="Questões por bloco">' + opt(2, qc, '2') + opt(4, qc, '4') + opt(6, qc, '6') + '</select>' +
            '</label>' +
            '<label class="field"><span>Meta de acerto (%)</span>' +
              '<input type="number" id="pass-threshold" min="50" max="95" step="5" inputmode="numeric" aria-label="Meta de acerto em porcentagem" value="' + settings.passThreshold + '">' +
            '</label>' +
            '<label class="field"><span>Som ao acertar</span>' +
              '<input type="checkbox" id="sound" ' + (settings.sound ? 'checked' : '') + ' aria-label="Liga ou desliga o som">' +
            '</label>' +
            '<button class="btn-primary" id="settings-save" style="margin-top:12px">Salvar</button>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="h2">Backup dos seus dados</h2>' +
            '<p class="muted">Seu progresso fica salvo só neste navegador. Exporte um backup para não perder nada ou para levar para outro aparelho.</p>' +
            '<div class="row" style="margin-top:12px">' +
              '<button class="btn-ghost" id="backup-export">Exportar backup</button>' +
              '<button class="btn-ghost" id="backup-import">Restaurar backup</button>' +
            '</div>' +
            '<input type="file" id="backup-file" accept=".json,application/json" hidden>' +
            '<button class="btn-danger" id="backup-reset">Apagar todos os dados</button>' +
            '<div class="confirm-box" id="reset-confirm" hidden>' +
              '<p class="muted">Isso apaga runs, progresso, plano e conteúdo importado deste navegador. Não dá para desfazer sem um backup.</p>' +
              '<div class="row" style="margin-top:10px">' +
                '<button class="btn-ghost" id="backup-reset-cancel" style="margin-top:0">Cancelar</button>' +
                '<button class="btn-danger solid" id="backup-reset-confirm" style="margin-top:0">Apagar tudo</button>' +
              '</div>' +
            '</div>' +
            '<p class="hint">Armazenamento: ' + (Persistence.isPersistent() ? 'salvo neste navegador' : 'temporário (exporte antes de fechar)') + '</p>' +
          '</div>' +
        '</section>';
      vp.querySelector('#settings-save').addEventListener('click', function(){
        var th = parseInt(vp.querySelector('#pass-threshold').value, 10);
        var ns = Object.assign({}, Store.get().settings, {
          sound: vp.querySelector('#sound').checked,
          theme: vp.querySelector('#theme').value,
          fontSize: parseInt(vp.querySelector('#font-size').value, 10) || 16,
          questionCountPerBlock: parseInt(vp.querySelector('#question-count').value, 10) || 4,
          passThreshold: isNaN(th) ? 60 : U.clamp(th, 50, 95)
        });
        Store.update(function(st){ st.settings = ns; });
        applyTheme();
        toast(isNaN(th) || th !== ns.passThreshold ? 'Salvo. Meta de acerto ajustada para ' + ns.passThreshold + '%.' : 'Configurações salvas.');
        Router.go('settings');
      });
      bindBackup(vp);
    }

    function downloadJson(obj, filename){
      var blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }

    function exportBackup(){
      try{
        Persistence.save(Store.get());
        downloadJson(Store.get(), 'reels-concurso-backup-' + U.todayStr() + '.json');
        toast('Backup exportado.');
      }catch(e){ window.reportError('Falha ao exportar backup: ' + e.message, e); }
    }

    function restoreBackup(file, done){
      var reader = new FileReader();
      reader.onload = function(){
        var obj;
        try{ obj = JSON.parse(reader.result); }
        catch(e){ toast('Arquivo inválido: não é um JSON.'); return done && done(false); }
        if(!obj || typeof obj !== 'object' || !Array.isArray(obj.runs) || !obj.settings){
          toast('Este arquivo não é um backup do Reels de Concurso.');
          return done && done(false);
        }
        Persistence.save(obj);
        Store.init();
        syncSyllabus();
        Persistence.save(Store.get());
        applyTheme();
        toast('Backup restaurado: ' + Store.get().runs.length + ' runs.');
        done && done(true);
      };
      reader.onerror = function(){ toast('Falha ao ler o arquivo.'); };
      reader.readAsText(file);
    }

    function bindBackup(vp){
      var file = vp.querySelector('#backup-file');
      var exp = vp.querySelector('#backup-export');
      if(exp) exp.addEventListener('click', exportBackup);
      var imp = vp.querySelector('#backup-import');
      if(imp) imp.addEventListener('click', function(){ file.click(); });
      if(file) file.addEventListener('change', function(){
        var f = file.files && file.files[0];
        if(!f) return;
        restoreBackup(f, function(){ file.value = ''; Router.go(Router.get()); });
      });
      var reset = vp.querySelector('#backup-reset');
      var box = vp.querySelector('#reset-confirm');
      if(reset && box){
        reset.addEventListener('click', function(){ box.hidden = false; reset.hidden = true; });
        vp.querySelector('#backup-reset-cancel').addEventListener('click', function(){ box.hidden = true; reset.hidden = false; });
        vp.querySelector('#backup-reset-confirm').addEventListener('click', function(){
          var fresh = Store.defaults();
          fresh.syllabus = SEED.syllabus.map(function(n){ return Object.assign({}, n); });
          Persistence.save(fresh);
          Store.init();
          applyTheme();
          toast('Dados apagados. Comece de novo quando quiser.');
          Router.go('settings');
        });
      }
    }

    function renderCoach(vp){
      var s = Store.get();
      var goal = s.profile.dailyGoalMinutes || 120;
      var today = Data.minutesToday();
      var pct = Math.min(100, Math.round((today / goal) * 100));
      var sm = Stats.summary();
      var weakTop = Stats.weakRanking(1)[0];
      var weak = null;
      if(weakTop){
        var wi = (s.weakItems || {})[weakTop.id] || {};
        var wn = Data.node(weakTop.kind === 'question' ? wi.syllabusId : weakTop.id);
        weak = { name: wn ? wn.name : weakTop.name };
      }
      var runsToday = (s.runs || []).filter(function(r){ return r.endedAt && U.todayStr(new Date(r.endedAt)) === U.todayStr(); }).length;
      var sch = Planner.schedule();
      var hour = new Date().getHours();
      var key = U.todayStr();
      var checks = (s.coach && s.coach.day === key) ? s.coach.done : {};
      var routine = [
        { id:'agua', label:'Água e celular no modo foco' },
        { id:'run1', label:'Primeira run do dia' },
        { id:'reforco', label:'Reforço dos pontos fracos' },
        { id:'teoria', label:'30 min de teoria (videoaula ou PDF)' },
        { id:'revisao', label:'Revisão rápida antes de dormir' }
      ];

      var msg;
      if(runsToday === 0) msg = 'Hoje ainda não teve estudo. Use a regra dos 5 minutos: comece com uma run curta, sem compromisso de continuar.';
      else if(pct >= 100) msg = 'Meta do dia batida! O que vier agora é bônus. Descansar também faz parte do plano.';
      else msg = 'Você já fez ' + runsToday + (runsToday === 1 ? ' run' : ' runs') + ' hoje (' + U.fmtDuration(today) + '). Faltam ' + U.fmtDuration(goal - today) + ' para a meta.';

      var focus;
      if(hour < 12) focus = 'Manhã: bom horário para as matérias de maior peso na prova, como Estatística Forense e Biologia Molecular.';
      else if(hour < 18) focus = 'Tarde: alterne flashcards com questões para manter o foco.';
      else focus = 'Noite: priorize revisão e reforço. Deixe conteúdo novo para amanhã cedo.';

      var tips = [];
      if(weak) tips.push('Seu ponto mais fraco agora: <b>' + U.esc(weak.name.length > 70 ? weak.name.slice(0, 68) + '…' : weak.name) + '</b>. Faça um reforço.');
      if(sch.configured && sch.behind) tips.push('O plano está <b>atrasado</b>. Some uma run extra por dia nesta semana.');
      if(sch.configured && !sch.behind) tips.push('Plano <b>em dia</b>. Faltam ' + sch.remainDays + ' dias para a prova.');
      if(!sch.configured) tips.push('Defina a <b>data da prova</b> na aba Plano para eu calcular seu ritmo.');
      if(sm.runs >= 3 && sm.accuracy < 60) tips.push('Seu acerto geral está em <b>' + sm.accuracy + '%</b>. Antes das questões, revise a teoria do conteúdo principal.');
      if(sm.streak >= 3) tips.push('<b>' + sm.streak + ' dias</b> seguidos. Não quebre a sequência!');
      tips.push('Na CESPE, <b>cada erro anula um acerto</b>. Se não tiver segurança no item, deixe em branco.');

      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Coach</p>' +
          '<h1 class="h1">Seu treino de hoje</h1>' +
          '<div class="card">' +
            '<div class="plan-head"><span class="plan-name">Meta diária</span><span class="sum-pct ' + (pct >= 100 ? 'ok' : (pct >= 50 ? 'warn' : 'bad')) + '">' + today + ' / ' + goal + ' min</span></div>' +
            '<div class="bar goal-bar"><span style="width:' + pct + '%"></span></div>' +
            '<p class="muted" style="margin-top:12px">' + U.esc(msg) + '</p>' +
            '<button class="btn-primary" id="coach-5min" style="margin-top:14px">' + (runsToday === 0 ? 'Começar só 5 minutos' : 'Fazer mais uma run') + '</button>' +
            (weak ? '<button class="btn-ghost" id="coach-reinforce">Reforçar pontos fracos</button>' : '') +
          '</div>' +
          '<div class="card soft"><h2 class="h2">Janela de foco</h2><p class="muted">' + U.esc(focus) + '</p></div>' +
          '<div class="card"><h2 class="h2">Dicas para você</h2>' + tips.map(function(t){ return '<p class="tip">' + t + '</p>'; }).join('') + '</div>' +
          '<div class="card"><h2 class="h2">Rotina de hoje</h2>' +
            routine.map(function(r){
              var on = !!checks[r.id];
              return '<label class="check' + (on ? ' done' : '') + '"><input type="checkbox" data-id="' + r.id + '"' + (on ? ' checked' : '') + '><span>' + U.esc(r.label) + '</span></label>';
            }).join('') +
          '</div>' +
        '</section>';

      vp.querySelector('#coach-5min').addEventListener('click', function(){
        var r = Store.get().activeRun;
        if(r && r.status === 'active') Router.go('run'); else Engine.start();
      });
      var rb = vp.querySelector('#coach-reinforce');
      if(rb) rb.addEventListener('click', function(){ Engine.startReinforce(); });
      vp.querySelectorAll('.check input').forEach(function(cb){
        cb.addEventListener('change', function(){
          Store.update(function(st){
            if(!st.coach || st.coach.day !== key) st.coach = { day:key, done:{} };
            st.coach.done[cb.dataset.id] = cb.checked;
          });
          cb.parentNode.classList.toggle('done', cb.checked);
        });
      });
    }

    var Views = {
      home: function(vp){
        var s = Store.get();
        var name = (s.profile && s.profile.name) ? ', ' + U.esc(s.profile.name) : '';
        var hasActive = !!(s.activeRun && s.activeRun.status === 'active');
        var persistent = Persistence.isPersistent();
        vp.innerHTML =
          '<section class="view view-home">' +
            '<p class="eyebrow">Sua próxima run</p>' +
            '<h1 class="greeting">' + U.greeting() + name + '</h1>' +
            '<p class="sub">Um toque para começar. Sem menus, sem atrito.</p>' +
            (!persistent ? '<div class="banner warning" id="persist-banner">Este navegador não está salvando seus dados. Exporte um backup antes de fechar. <button type="button" id="banner-export">Exportar</button> <button type="button" id="banner-settings">Backup</button></div>' : '') +
            '<div class="card">' +
              '<div class="hero-stats">' +
                '<div class="hstat"><span class="hnum">' + s.streak.current + '</span><span class="hlabel">streak</span></div>' +
                '<div class="hstat"><span class="hnum">' + Data.minutesToday() + '</span><span class="hlabel">min hoje</span></div>' +
                '<div class="hstat"><span class="hnum">' + s.runs.length + '</span><span class="hlabel">runs</span></div>' +
              '</div>' +
              '<button class="btn-primary" id="start-run">' + (hasActive ? 'Retomar run' : 'Estudar agora') + '</button>' +
              '<p class="hint">Meta diária: ' + U.fmtDuration(s.profile.dailyGoalMinutes) + '</p>' +
            '</div>' +
            '<div class="card soft">' +
              '<h2 class="h2">Como funciona</h2>' +
              '<ul class="steps">' +
                '<li><b>1.</b> Flashcards em ritmo de reels.</li>' +
                '<li><b>2.</b> Bloco de questões a cada 4 cards.</li>' +
                '<li><b>3.</b> Sumário reforça o que você errou.</li>' +
              '</ul>' +
            '</div>' +
          '</section>';

        var be = vp.querySelector('#banner-export');
        if(be) be.addEventListener('click', exportBackup);
        var bs = vp.querySelector('#banner-settings');
        if(bs) bs.addEventListener('click', function(){ Router.go('settings'); });
        var btn = vp.querySelector('#start-run');
        btn.addEventListener('click', function(){
          if(hasActive) Router.go('run'); else Engine.start();
        });
      },
      run: renderRun,
      summary: renderSummary,
      plan: function(vp){
        var s = Store.get();
        var sch = Planner.schedule();
        var rpd = Planner.runsPerDay();

        var groups = {};
        s.syllabus.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); }).forEach(function(n){
          var g = n.discipline || 'Outros';
          if(!groups[g]) groups[g] = [];
          groups[g].push(n);
        });
        var totalCards = Data.allFlashcards().length;
        var totalQuestions = Data.allQuestions().length;
        var planMap = {};
        Planner.disciplinePlan().forEach(function(x){ planMap[x.node.id] = x; });

        var html =
          '<section class="view">' +
            '<p class="eyebrow">Planejamento global</p>' +
            '<h1 class="h1">Plano de estudo</h1>' +
            '<p class="sub">' + s.syllabus.length + ' conteúdos · ' + totalCards + ' flashcards · ' + totalQuestions + ' questões</p>' +
            '<div class="card soft">' +
              '<p class="muted">Conteúdo de estudo autoral e não oficial. Use Estratégia Concursos e Gran Cursos para a teoria e amplie o banco por importação JSON.</p>' +
            '</div>';

        html +=
          '<div class="card">' +
            '<h2 class="h2">Configuração</h2>' +
            '<label class="field"><span>Seu nome</span><input type="text" id="cfg-name" maxlength="30" autocomplete="given-name" placeholder="Como quer ser chamada" value="' + U.esc(s.profile.name || '') + '"></label>' +
            '<label class="field"><span>Data da prova</span><input type="date" id="cfg-exam" value="' + (s.profile.examDate || '') + '"></label>' +
            '<label class="field"><span>Meta diária (min)</span><input type="number" id="cfg-goal" min="15" step="15" value="' + (s.profile.dailyGoalMinutes || 120) + '"></label>' +
            '<label class="field"><span>Início do plano</span><input type="date" id="cfg-start" value="' + (s.profile.startDate || U.todayStr()) + '"></label>' +
            '<button class="btn-primary" id="cfg-save" style="margin-top:12px">Salvar</button>' +
            '<p class="hint">' + U.fmtDuration(s.profile.dailyGoalMinutes || 120) + '/dia ≈ ' + rpd + ' run(s)/dia</p>' +
          '</div>';

        if(sch.configured){
          html +=
            '<div class="card">' +
              '<h2 class="h2">Ritmo do plano</h2>' +
              '<div class="hero-stats">' +
                '<div class="hstat"><span class="hnum">' + sch.remainDays + '</span><span class="hlabel">dias p/ prova</span></div>' +
                '<div class="hstat"><span class="hnum">' + sch.requiredPerWeek + '</span><span class="hlabel">itens/semana</span></div>' +
                '<div class="hstat"><span class="hnum">' + sch.progressPct + '%</span><span class="hlabel">coberto</span></div>' +
              '</div>' +
              '<span class="badge ' + (sch.behind ? 'warn-badge' : 'ok-badge') + '">' + (sch.behind ? 'Ritmo atrasado' : 'Em dia') + '</span>' +
              '<p class="hint">Estudado ' + sch.studied + ' / esperado ~' + sch.expected + ' · total ' + sch.total + ' itens · prova ' + U.fmtDate(sch.exam) + '</p>' +
              '<div class="week-dist">' + Planner.weeklyDistribution().map(function(d){
                return '<span class="day-chip' + (d.active ? ' on' : '') + '">' + d.label + '<b>' + (d.active ? d.runs + ' run' : 'livre') + '</b></span>';
              }).join('') + '</div>' +
            '</div>';
        }

        Object.keys(groups).forEach(function(g){
          html += '<div class="card"><h2 class="h2">' + U.esc(g) + '</h2><ul class="plan-list">';
          groups[g].forEach(function(n){
            var info = planMap[n.id] || { pct:0, target:null };
            html +=
              '<li class="plan-item">' +
                '<div class="plan-head">' +
                  '<span class="plan-name">' + U.esc(n.name) + '</span>' +
                  '<span class="weight">peso ' + (n.weight || 0) + '</span>' +
                '</div>' +
                '<div class="plan-meta">' + Data.countFlashcards(n.id) + ' cards · ' + Data.countQuestions(n.id) + ' questões' +
                  (info.target ? ' · meta ' + U.fmtDate(info.target) : '') + '</div>' +
                '<div class="bar"><span style="width:' + info.pct + '%"></span></div>' +
              '</li>';
          });
          html += '</ul></div>';
        });

        html +=
          '<div class="card">' +
            '<h2 class="h2">Ampliar conteúdo</h2>' +
            '<p class="muted">Importe flashcards e questões em JSON. O conteúdo é validado antes de entrar.</p>' +
            '<button class="btn-primary" id="import-btn" style="margin-top:12px">Importar conteúdo (JSON)</button>' +
            '<button class="btn-ghost" id="template-btn">Baixar modelo JSON</button>' +
            '<input type="file" id="import-file" accept=".json,application/json" hidden>' +
          '</div>' +
        '</section>';

        vp.innerHTML = html;

        vp.querySelector('#cfg-save').addEventListener('click', function(){
          var exam = vp.querySelector('#cfg-exam').value;
          var goal = parseInt(vp.querySelector('#cfg-goal').value, 10);
          var start = vp.querySelector('#cfg-start').value;
          var name = vp.querySelector('#cfg-name').value.trim().slice(0, 30);
          if(exam && exam <= U.todayStr()){ toast('A data da prova precisa ser no futuro.'); return; }
          if(exam && start && start >= exam){ toast('O início do plano precisa ser antes da prova.'); return; }
          Store.update(function(st){
            st.profile = Object.assign({}, st.profile, {
              name: name,
              examDate: exam || null,
              dailyGoalMinutes: isNaN(goal) ? 120 : Math.max(15, goal),
              startDate: start || U.todayStr()
            });
          });
          toast('Plano atualizado.');
          Router.go('plan');
        });

        var fileInput = vp.querySelector('#import-file');
        vp.querySelector('#import-btn').addEventListener('click', function(){ fileInput.click(); });
        vp.querySelector('#template-btn').addEventListener('click', function(){ downloadTemplate(); });
        fileInput.addEventListener('change', function(){
          var file = fileInput.files && fileInput.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(){
            var obj;
            try{ obj = JSON.parse(reader.result); }
            catch(e){ toast('JSON inválido: ' + e.message); fileInput.value = ''; return; }
            var res = Data.importContent(obj);
            if(!res.ok){
              toast('Importação recusada: ' + res.errors[0] + (res.errors.length > 1 ? ' (+' + (res.errors.length - 1) + ')' : ''));
            }else{
              toast('Importado: ' + res.added.flashcards + ' cards, ' + res.added.questions + ' questões, ' + res.added.syllabus + ' conteúdos.');
              Router.go('plan');
            }
            fileInput.value = '';
          };
          reader.onerror = function(){ toast('Falha ao ler o arquivo.'); };
          reader.readAsText(file);
        });
      },
      stats: renderStats,
      review: placeholder('Revisão', 'Sprint 7', 'Fila de revisão espaçada (SRS) e reforços.'),
      coach: renderCoach,
      settings: renderSettings,
    };

    function registerViews(){
      Router.register('home', Views.home);
      Router.register('run', Views.run);
      Router.register('summary', Views.summary);
      Router.register('plan', Views.plan);
      Router.register('stats', Views.stats);
      Router.register('review', Views.review);
      Router.register('coach', Views.coach);
      Router.register('settings', Views.settings);
    }

    function bindTabbar(){
      document.querySelectorAll('#tabbar .tab').forEach(function(btn){
        btn.addEventListener('click', function(){ Router.go(btn.dataset.route); });
      });
    }

    // Mantém as matérias da base (SEED) atualizadas em quem já usa o app (nomes, pesos, novas matérias),
    // preservando matérias importadas pela usuária.
    function syncSyllabus(){
      var cur = Store.get().syllabus || [];
      var seedIds = {};
      SEED.syllabus.forEach(function(n){ seedIds[n.id] = true; });
      var merged = SEED.syllabus.map(function(n){ return Object.assign({}, n); })
        .concat(cur.filter(function(n){ return !seedIds[n.id]; }));
      if(JSON.stringify(merged) !== JSON.stringify(cur)) Store.set({ syllabus: merged });
    }

    function init(){
      var backend = Persistence.init();
      Store.init();
      // Streak quebrado: se o último estudo foi antes de ontem, a sequência atual volta a 0.
      var stk = Store.get().streak;
      if(stk.lastStudyDate && stk.current){
        var gap = Math.round((U.parseDate(U.todayStr()) - U.parseDate(stk.lastStudyDate)) / 86400000);
        if(gap > 1) Store.update(function(st){ st.streak.current = 0; });
      }
      syncSyllabus();
      applyTheme();
      registerViews();
      bindTabbar();
      window.addEventListener('beforeunload', function(){ Persistence.save(Store.get()); });
      document.addEventListener('visibilitychange', function(){ if(document.hidden) Persistence.save(Store.get()); });
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
      Router.go('home');
      if(backend === 'memory'){
        setTimeout(function(){ toast('Sessão não será salva (armazenamento indisponível).'); }, 700);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
