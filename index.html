        ['Worm', 'Vírus', 'Cavalo de Troia', 'Spyware', 'Keylogger'], 0,
        'O worm se propaga de forma autônoma; o vírus depende de um arquivo hospedeiro.');

      T('inf-prot', 'Proteção, autenticação e certificação digital');
      C('inf-prot', 'Qual a diferença entre antivírus, firewall e EDR?',
        'Antivírus detecta e remove malware nos arquivos. Firewall controla o tráfego de rede, permitindo ou bloqueando conexões. EDR monitora continuamente os dispositivos, detecta comportamentos suspeitos e responde a incidentes.',
        'O antivírus tradicional usa assinaturas e heurística; o EDR registra eventos (processos, conexões) e permite investigar e isolar a máquina. Anti-spyware é especializado em programas espiões. Firewall pode ser do computador ou da rede.',
        'Item 17 de 2025: antivírus NÃO controla o tráfego da rede. ERRADO.');
      C('inf-prot', 'O que é autenticação multifator (MFA)?',
        'É a combinação de fatores de categorias diferentes: algo que você sabe (senha, PIN), algo que você tem (celular, token) e algo que você é (biometria).',
        'Duas senhas são o mesmo fator e não formam MFA. Códigos de aplicativo autenticador ou chave física são mais seguros que SMS. A MFA bloqueia a maior parte dos ataques com senhas vazadas.',
        'Senha + pergunta secreta = um fator só (as duas são "algo que você sabe").');
      C('inf-prot', 'O que garantem a assinatura e o certificado digital?',
        'A assinatura digital garante autenticidade (autoria), integridade (não alteração) e não repúdio. O certificado digital, emitido por Autoridade Certificadora (ICP-Brasil), vincula a chave pública ao titular.',
        'Assina-se com a chave PRIVADA do signatário, sobre o resumo (hash) do documento, e confere-se com a chave PÚBLICA dele. A assinatura não garante sigilo; para isso, cifra-se com a chave pública do destinatário. Certificado A1 fica em arquivo; A3, em token ou cartão.',
        'Assinatura digital NÃO garante confidencialidade.');
      C('inf-prot', 'Para que serve um gerenciador de senhas?',
        'Guarda senhas fortes e diferentes para cada serviço num cofre cifrado, protegido por uma senha mestra (de preferência com MFA).',
        'Também gera senhas aleatórias e preenche automaticamente só nos sites legítimos, o que ajuda contra phishing. A senha mestra deve ser longa e única.',
        'Reutilizar a mesma senha em vários serviços é o maior risco depois de um vazamento.');
      MC('inf-prot', 'Na assinatura digital, o documento é assinado com:',
        ['A chave privada do signatário', 'A chave pública do signatário', 'A chave pública do destinatário', 'A chave privada do destinatário', 'Uma senha compartilhada'], 0,
        'Só o titular tem a chave privada, e qualquer pessoa confere com a chave pública dele.');
      CLZ('inf-prot', 'Senha + código no celular é um exemplo de ___.',
        ['autenticação multifator', 'criptografia simétrica', 'firewall', 'backup incremental'], 0,
        'Combina "algo que você sabe" com "algo que você tem".');

      T('inf-net', 'Redes, nuvem e acesso remoto');
      C('inf-net', 'Quais os tipos de rede por abrangência?',
        'LAN (local: casa, escritório), MAN (metropolitana: uma cidade) e WAN (longa distância: países; a internet é a maior delas).',
        'Fala-se também em PAN (pessoal, como o Bluetooth). Intranet é uma rede privada que usa as tecnologias da internet, com acesso restrito; extranet é a parte da intranet aberta a parceiros autorizados.',
        'Intranet usa os mesmos protocolos da internet (TCP/IP, HTTP); o que muda é o acesso restrito.');
      C('inf-net', 'O que são TCP/IP e NAT?',
        'TCP/IP é a arquitetura de protocolos da internet (camadas de aplicação, transporte, internet e acesso à rede). NAT traduz os endereços IP privados da rede interna para um IP público.',
        'TCP é orientado à conexão e confiável; UDP é mais rápido e não garante a entrega. Protocolos de aplicação: HTTP/HTTPS (web), SMTP (envio de e-mail), POP3 e IMAP (recebimento) e DNS (traduz nomes em endereços IP). O NAT permite que muitos dispositivos compartilhem um IP público.',
        'HTTPS é HTTP com criptografia TLS; não deixa a rede mais rápida.');
      C('inf-net', 'O que são VPN e RDP?',
        'VPN cria um túnel cifrado pela internet para acessar uma rede privada com segurança. RDP é o protocolo de Área de Trabalho Remota da Microsoft, para controlar outro computador.',
        'RDP exposto diretamente na internet é alvo frequente de ataques; o recomendado é usá-lo dentro de uma VPN e com MFA. A VPN protege os dados no caminho, mas não protege contra malware no próprio dispositivo.',
        'VPN não é antivírus: cifra o tráfego, não limpa a máquina.');
      C('inf-net', 'Quais os modelos, vantagens e desvantagens da computação em nuvem?',
        'Modelos de serviço: IaaS (infraestrutura), PaaS (plataforma) e SaaS (software pronto, como o Microsoft 365). Vantagens: elasticidade, pagamento por uso e acesso de qualquer lugar. Desvantagens: dependência da internet e do provedor e cuidados com privacidade.',
        'Modelos de implantação: pública, privada, híbrida e comunitária. A segurança é responsabilidade compartilhada entre provedor e cliente; no SaaS, o cliente cuida dos dados e dos acessos.',
        'Gmail e Microsoft 365 são SaaS; uma máquina virtual alugada é IaaS.');
      MC('inf-net', 'O Microsoft 365 usado pelo navegador é um exemplo de:',
        ['SaaS', 'IaaS', 'PaaS', 'LAN', 'NAT'], 0,
        'É software pronto, entregue como serviço pela internet.');

      T('inf-db', 'Bancos de dados');
      C('inf-db', 'Qual a diferença entre dados estruturados, semiestruturados e não estruturados?',
        'Estruturados seguem um esquema fixo (tabelas com linhas e colunas). Não estruturados não têm modelo predefinido (textos livres, imagens, vídeos, áudios). Semiestruturados têm marcação flexível (JSON, XML).',
        'Bancos relacionais (SQL) guardam dados estruturados; bancos NoSQL lidam melhor com semiestruturados e grandes volumes. A maior parte dos dados produzidos hoje é não estruturada.',
        'Planilha e tabela de banco = estruturados; o texto livre de um e-mail = não estruturado.');
      C('inf-db', 'O que são chave primária e chave estrangeira?',
        'A chave primária identifica cada registro de forma única e não pode ser nula. A chave estrangeira é um campo que aponta para a chave primária de outra tabela, criando o relacionamento.',
        'A integridade referencial impede, por exemplo, cadastrar um laudo para um caso inexistente. Chave composta usa mais de um campo. Chaves candidatas são campos que poderiam ser a primária.',
        'Chave estrangeira pode se repetir; a primária, não.');
      C('inf-db', 'Quais os tipos de relacionamento (cardinalidade)?',
        '1:1 (um para um), 1:N (um para muitos) e N:N (muitos para muitos), este implementado com uma tabela associativa.',
        'Exemplo: um perito emite muitos laudos (1:N); laudos e vestígios podem ser N:N. N:1 é o mesmo 1:N visto do outro lado.',
        'Item 20 de 2025 (quatro variações, incluindo N:1) está ERRADO.');
      C('inf-db', 'Para que serve a normalização?',
        'Para organizar as tabelas reduzindo redundância e anomalias de inserção, atualização e exclusão, preservando a integridade dos dados.',
        'Formas normais: 1FN (valores atômicos), 2FN (sem dependência parcial da chave) e 3FN (sem dependência transitiva). Normalizar demais pode exigir muitas junções e piorar consultas; às vezes se desnormaliza de propósito.',
        'O objetivo central é integridade e menos redundância (o item 19 de 2025, que incluía "otimização de desempenho", foi anulado).');
      MC('inf-db', 'Um campo da tabela LAUDO que guarda o código do PERITO e aponta para a tabela PERITO é:',
        ['Chave estrangeira', 'Chave primária', 'Atributo multivalorado', 'Índice obrigatório', 'Chave candidata'], 0,
        'Ele referencia a chave primária de outra tabela, criando o relacionamento.');

      T('inf-ia', 'Python, metadados, dados e IA');
      C('inf-ia', 'Quais as características da linguagem Python?',
        'É de alto nível, interpretada e de tipagem dinâmica, e a indentação define os blocos de código.',
        'Tipos básicos: int, float, str, bool. Coleções: list (mutável, []), tuple (imutável, ()), dict (chave e valor, {}) e set. Comentários com #. É muito usada em ciência de dados, automação e análise forense (bibliotecas como pandas).',
        'Lista é mutável; tupla é imutável.');
      C('inf-ia', 'O que são metadados e por que importam em perícia?',
        'São "dados sobre dados": informações que descrevem um arquivo, como autor, datas de criação e modificação e programa usado; em fotos, os dados EXIF (câmera, data, GPS).',
        'Ajudam a datar e atribuir documentos e imagens, mas podem ser alterados ou apagados; por isso devem ser confrontados com outras evidências. Ao compartilhar arquivos, metadados podem expor informações sensíveis, como a localização.',
        'Data de metadado pode ser alterada: sozinha, não é prova absoluta.');
      C('inf-ia', 'O que são mineração de dados e big data?',
        'Mineração de dados é a descoberta de padrões em grandes bases (classificação, agrupamento, associação, detecção de anomalias). Big data se caracteriza pelos 5 Vs: volume, velocidade, variedade, veracidade e valor.',
        'Classificação é supervisionada (categorias conhecidas); agrupamento (clustering) é não supervisionado (descobre grupos sem rótulos prévios). Regras de associação encontram itens que ocorrem juntos. Aprendizado de máquina é o campo que permite aos sistemas aprender com dados.',
        'Item 15 de 2025 (clustering "atribui categorias") está ERRADO: isso é classificação.');
      C('inf-ia', 'O que são IA generativa e low-code?',
        'IA generativa cria conteúdo novo (texto, imagem, código) a partir de padrões aprendidos, como os grandes modelos de linguagem. Low-code/no-code permite criar aplicações com pouca ou nenhuma programação, por interfaces visuais.',
        'Modelos generativos podem "alucinar" (inventar informações plausíveis), reproduzir vieses e expor dados sigilosos colocados nos comandos. Low-code acelera soluções internas, mas exige governança de segurança e manutenção.',
        'Texto fluente gerado por IA não é garantia de verdade: precisa ser verificado.');
      MC('inf-ia', 'Agrupar ocorrências semelhantes sem categorias definidas previamente é uma tarefa de:',
        ['Clustering (agrupamento)', 'Classificação', 'Normalização', 'Criptografia', 'Regressão'], 0,
        'O clustering é não supervisionado: descobre os grupos sem rótulos prévios.');

      /* ---------- Direitos Humanos ---------- */
      T('dh-cf', 'Direitos humanos na CF e sistema internacional');
      C('dh-cf', 'Como a CF/1988 trata os tratados de direitos humanos?',
        'Os aprovados em cada Casa do Congresso, em dois turnos, por 3/5 dos votos, equivalem a emendas constitucionais (art. 5º, §3º). Os demais, segundo o STF, têm status supralegal.',
        'O art. 5º, §2º, diz que os direitos expressos não excluem os decorrentes de tratados. O art. 4º, II, põe a prevalência dos direitos humanos entre os princípios das relações internacionais, e o §4º do art. 5º submete o Brasil ao Tribunal Penal Internacional. Por ser supralegal, o Pacto de São José afastou a prisão do depositário infiel (Súmula Vinculante 25).',
        'Supralegal = acima das leis e abaixo da Constituição (item 42 de 2025, CERTO).');
      C('dh-cf', 'Como é o sistema internacional de proteção dos direitos humanos?',
        'Há o sistema global (ONU) e os regionais (interamericano, europeu e africano), que se complementam. No global, destacam-se a Declaração Universal (1948) e os Pactos de 1966 (direitos civis e políticos; direitos econômicos, sociais e culturais).',
        'O sistema interamericano tem a Comissão Interamericana, que recebe petições individuais, e a Corte Interamericana, que julga Estados que aceitaram sua jurisdição (o Brasil aceitou em 1998). Os mecanismos internacionais são subsidiários: atuam quando o Estado falha. O duplo grau de jurisdição está no art. 8.2.h da Convenção Americana.',
        'O indivíduo peticiona à COMISSÃO; só a Comissão e os Estados levam casos à CORTE.');
      C('dh-cf', 'Quais os requisitos para peticionar à Comissão Interamericana?',
        'Esgotamento dos recursos internos, prazo de 6 meses da decisão definitiva, ausência de litispendência internacional e identificação do peticionário (art. 46 da Convenção Americana).',
        'O esgotamento é dispensado quando não há devido processo legal para o direito violado, quando o acesso aos recursos foi negado ou impedido e quando há demora injustificada na decisão (art. 46.2). Qualquer pessoa, grupo ou ONG reconhecida pode peticionar.',
        'Item 45 de 2025 ("não basta a simples mora, ainda que injustificada") está ERRADO.');
      C('dh-cf', 'Quais as características dos direitos humanos?',
        'Universalidade, indivisibilidade, interdependência, inalienabilidade, imprescritibilidade, historicidade e vedação do retrocesso.',
        'Indivisibilidade e interdependência: direitos civis e políticos e direitos sociais formam um todo. A doutrina fala em gerações ou dimensões: 1ª, liberdades individuais; 2ª, direitos sociais; 3ª, direitos difusos (meio ambiente, paz).',
        'Em regra, os direitos não são absolutos (admitem ponderação), mas a proibição da tortura é absoluta.');
      MC('dh-cf', 'Um tratado de direitos humanos aprovado sem o rito do art. 5º, §3º, tem, segundo o STF, status:',
        ['Supralegal', 'Constitucional', 'De lei ordinária', 'De decreto regulamentar', 'Sem efeito interno'], 0,
        'Fica acima das leis e abaixo da Constituição (RE 466.343).');

      T('dh-conv', 'Convenções internacionais');
      C('dh-conv', 'O que diz a Convenção para a Prevenção e Punição do Genocídio (1948)?',
        'Genocídio são atos cometidos com a intenção de destruir, no todo ou em parte, um grupo nacional, étnico, racial ou religioso: matar membros, causar lesão grave, impor condições de vida destrutivas, impedir nascimentos ou transferir crianças à força.',
        'É crime de direito internacional, em tempo de paz ou de guerra. Também são puníveis a conspiração, a incitação direta e pública, a tentativa e a cumplicidade. Grupos políticos não estão na definição. No Brasil, a Lei 2.889/1956 tipifica o genocídio.',
        'O que caracteriza o genocídio é a intenção específica de destruir o grupo.');
      C('dh-conv', 'O que preveem a Convenção dos Refugiados (1951) e o Protocolo de 1967?',
        'Refugiado é quem, por fundado temor de perseguição por raça, religião, nacionalidade, grupo social ou opinião política, está fora do seu país e não pode ou não quer voltar. O princípio central é a não devolução (non-refoulement).',
        'O Protocolo de 1967 retirou as limitações temporal (eventos antes de 1951) e geográfica. Refugiados que residem regularmente devem ter, quanto a profissões liberais, tratamento tão favorável quanto possível e não menos favorável que o dado aos estrangeiros em geral (art. 19). A Lei 9.474/1997 amplia o conceito para grave e generalizada violação de direitos humanos.',
        'Item 40 de 2025 é CERTO.');
      C('dh-conv', 'O que dizem as convenções sobre discriminação racial e contra a mulher?',
        'A Convenção sobre Discriminação Racial (1965) proíbe distinções por raça, cor, descendência ou origem nacional ou étnica. A CEDAW (1979) proíbe a discriminação contra a mulher e protege, por exemplo, a sua nacionalidade no casamento (art. 9º).',
        'As duas admitem ações afirmativas temporárias para acelerar a igualdade, que não são consideradas discriminação. Pela CEDAW, casar com estrangeiro ou a mudança de nacionalidade do marido não alteram automaticamente a nacionalidade da esposa, não a tornam apátrida e não a obrigam a adotar a do marido.',
        'Ações afirmativas temporárias NÃO violam essas convenções (item 43 de 2025, CERTO).');
      C('dh-conv', 'O que dizem as convenções contra a tortura e contra o desaparecimento forçado?',
        'A Convenção contra a Tortura (ONU, 1984) traz proibição absoluta: nenhuma circunstância excepcional ou ordem superior justifica a tortura. Desaparecimento forçado é a privação de liberdade por agentes do Estado seguida da recusa em reconhecê-la ou da ocultação do paradeiro.',
        'A Convenção contra a Tortura proíbe devolver alguém a Estado onde corra risco de tortura, e declarações obtidas sob tortura não valem como prova. O desaparecimento forçado é crime de natureza permanente enquanto não se esclarece o destino da vítima, e os familiares têm direito à verdade. No Brasil, a Lei 9.455/1997 define os crimes de tortura.',
        'Ordem de superior hierárquico NÃO justifica tortura.');
      MC('dh-conv', 'O Protocolo de 1967 sobre o Estatuto dos Refugiados:',
        ['Retirou as limitações temporal e geográfica da Convenção de 1951', 'Criou o Tribunal Penal Internacional', 'Proibiu as ações afirmativas', 'Excluiu a perseguição religiosa do conceito', 'Permitiu a devolução de refugiados'], 0,
        'Com o Protocolo, a proteção deixou de valer só para eventos anteriores a 1951 e para a Europa.');

      T('dh-forca', 'Presos e uso da força');
      C('dh-forca', 'O que dizem as Regras de Mandela?',
        'São as Regras Mínimas da ONU para o Tratamento de Presos (revistas em 2015): tratamento com dignidade, proibição de tortura, separação de categorias de presos, acesso à saúde e limites ao isolamento.',
        'O confinamento solitário prolongado (mais de 15 dias seguidos) é proibido. Presos com deficiência devem receber adaptações razoáveis para terem acesso igual à vida na prisão. Instrumentos de contenção não podem ser usados como punição.',
        'Item 41 de 2025 ("vedam qualquer tratamento diferenciado a presos com deficiência") está ERRADO.');
      C('dh-forca', 'O que preveem os Princípios Básicos sobre o Uso da Força e Armas de Fogo (Havana, 1990)?',
        'Os agentes devem tentar meios não violentos antes da força; a força deve ser necessária e proporcional; armas de fogo só em legítima defesa própria ou de terceiros contra ameaça iminente de morte ou ferimento grave.',
        'O uso letal intencional só é admitido quando estritamente inevitável para proteger a vida. Os governos devem fornecer equipamentos menos letais e treinamento. Depois do uso da força, deve haver socorro médico aos feridos e relatório.',
        'Arma de fogo é o último recurso, não o primeiro.');
      C('dh-forca', 'O que diz a Lei 13.060/2014?',
        'Disciplina o uso dos instrumentos de menor potencial ofensivo pelos agentes de segurança pública, que devem priorizá-los, desde que isso não ponha em risco a integridade física ou psíquica dos policiais.',
        'Não é legítimo usar arma de fogo contra pessoa em fuga desarmada ou que não represente risco imediato de morte ou lesão, nem contra veículo que desrespeite bloqueio policial sem representar esse risco. Princípios: legalidade, necessidade, razoabilidade e proporcionalidade.',
        'Atirar em veículo que só furou um bloqueio, sem oferecer risco, não é legítimo.');
      C('dh-forca', 'O que é o Decreto 12.341/2024?',
        'É o decreto que regulamenta a Lei 13.060/2014, disciplinando o uso da força e dos instrumentos de menor potencial ofensivo pelos profissionais de segurança pública, com foco na legalidade, na necessidade, na proporcionalidade e na proteção da vida.',
        'Reforça o uso diferenciado da força, a prioridade da comunicação e da negociação, a arma de fogo como último recurso, a capacitação e o registro e a apuração dos casos de uso da força. Por ser norma recente do edital, leia o texto do decreto para os detalhes.',
        'A banca costuma explorar normas novas listadas no edital.');
      MC('dh-forca', 'Pela Lei 13.060/2014, NÃO é legítimo o uso de arma de fogo contra:',
        ['Pessoa em fuga desarmada que não represente risco imediato', 'Agressor armado que ameaça matar um refém', 'Quem atira contra policiais', 'Agressor que tenta ferir gravemente alguém com uma faca', 'Agressor em situação de legítima defesa de terceiro'], 0,
        'A lei proíbe expressamente o tiro contra pessoa em fuga desarmada que não ofereça risco imediato.');

      /* ---------- Noções de Criminalística ---------- */
      T('crim-con', 'Conceitos, vestígios e princípio de Locard');
      C('crim-con', 'Qual a relação entre ciências forenses, criminalística e perícia?',
        'Ciências forenses são todas as ciências aplicadas à Justiça. Criminalística é a disciplina que estuda os vestígios materiais do crime para esclarecer o fato e a autoria. Perícia é o exame técnico feito por especialista para produzir prova.',
        'A criminalística reúne áreas como local de crime, balística, documentoscopia, genética, química, informática e engenharia forense. A medicina legal estuda o corpo humano, vivo ou morto, e é disciplina correlata. A perícia criminal federal é feita pelos peritos da Polícia Federal.',
        'Perícia criminal (processo penal, perito oficial) ≠ perícia civil (perito nomeado pelo juiz, com assistentes das partes).');
      C('crim-con', 'Qual a diferença entre vestígio, evidência e indício?',
        'Vestígio é todo objeto ou material, visível ou latente, ligado à infração (CPP, art. 158-A, §3º). Evidência é o vestígio cuja relação com o fato foi demonstrada pela análise. Indício é a circunstância conhecida e provada que permite concluir, por indução, a existência de outra (CPP, art. 239).',
        'Sequência pericial: vestígio (material bruto) → análise → evidência → uso no processo. Indício é conceito jurídico: prova indireta, que pode sustentar condenação quando múltiplo e convergente.',
        'Nem todo vestígio vira evidência: só o que se mostra ligado ao fato.');
      C('crim-con', 'O que diz o princípio de Locard?',
        'É o princípio da troca: todo contato deixa uma marca. O autor leva algo do local e deixa algo nele.',
        'Fundamenta a busca de vestígios: fibras, pelos, DNA, impressões, solo. Por isso não existe "crime perfeito" no sentido técnico; o desafio é encontrar e interpretar os vestígios. A visão moderna inclui estudos de transferência e persistência, como o do DNA sob as unhas.',
        'Item 36 de 2025 é CERTO.');
      C('crim-con', 'Como se classificam os vestígios?',
        'Quanto à natureza: biológicos (sangue, sêmen, saliva, pelos), físicos (fragmentos, vidros), químicos (drogas, resíduos de tiro, explosivos), morfológicos (formas e marcas, como pegadas, impressões e marcas de ferramenta) e microvestígios (fibras, partículas).',
        'Quanto à relação com o fato: verdadeiros (produzidos pelo crime), forjados (plantados para enganar) e ilusórios (sem relação com o fato, como os deixados por quem entrou depois). Microvestígios exigem lupa, microscópio ou luz forense.',
        'Fluidos corporais são vestígios biológicos, não morfológicos (item 35 de 2025, ERRADO).');
      MC('crim-con', 'Pegadas, marcas de ferramenta e impressões são classificadas como vestígios:',
        ['Morfológicos', 'Biológicos', 'Químicos', 'Ilusórios', 'Microvestígios'], 0,
        'Vestígios morfológicos são formas e marcas deixadas por contato.');

      T('crim-loc', 'Local de crime e fotografia pericial');
      C('crim-loc', 'O que é local de crime e como ele se classifica?',
        'É toda área onde ocorreu um fato que pode configurar infração penal e que guarda vestígios dele. Classifica-se em imediato (onde o fato ocorreu), mediato (as adjacências) e relacionado (outro lugar ligado ao fato).',
        'Também se fala em local interno (ambiente fechado) e externo, e em idôneo (preservado) ou inidôneo (violado). O local é fonte de informação: posição dos objetos, manchas, trajetórias, sinais de luta.',
        'O tempo decorrido não dispensa o isolamento e a preservação (item 39 de 2025, ERRADO).');
      C('crim-loc', 'Quais as etapas do processamento pericial do local?',
        'Isolamento e preservação, busca de vestígios, documentação (fixação: fotografia, croqui e descrição), coleta, acondicionamento, transporte e liberação do local.',
        'Métodos de busca: espiral, linhas paralelas, quadrantes (grade) e setores. A fixação registra a posição exata dos vestígios antes de qualquer movimentação. O local só é liberado depois que o perito conclui o exame.',
        'Fixe antes de coletar: vestígio retirado sem registro perde o contexto.');
      C('crim-loc', 'O que diz a lei e a técnica sobre a fotografia pericial?',
        'O CPP manda fotografar os cadáveres na posição em que forem encontrados e, na medida do possível, as lesões externas e os vestígios do local (art. 164), e permite instruir os laudos com fotografias, desenhos ou esquemas (arts. 165 e 169).',
        'A técnica segue a sequência: fotos gerais (panorâmicas), médias (relação entre objetos) e de detalhe, estas com e sem escala métrica. Imagens raster (formadas por pixels) perdem nitidez quando ampliadas demais (pixelização); por isso se fotografa em alta resolução e se preservam os arquivos originais.',
        'Item 37 de 2025 (pixelização da imagem raster) é CERTO.');
      C('crim-loc', 'Como deve ser feito o isolamento do local?',
        'De forma ampla, com cordão e controle de acesso, registro de quem entra e sai e proibição de mexer em qualquer coisa até a chegada e a liberação da perícia (CPP, arts. 6º, I, e 169).',
        'O primeiro policial a chegar deve socorrer vítimas, garantir a segurança e isolar. Alterações inevitáveis, como o socorro, devem ser registradas e informadas ao perito. O CPP proíbe a entrada em local isolado e a remoção de vestígios antes da liberação pelo perito, e tipifica essa conduta como fraude processual (art. 158-C, §2º).',
        'Mexer no local antes da liberação pela perícia configura fraude processual.');
      MC('crim-loc', 'A sequência correta das fotografias periciais num local de crime é:',
        ['Gerais, médias e de detalhe (com e sem escala)', 'Apenas de detalhe', 'De detalhe, médias e gerais', 'Apenas panorâmicas', 'Somente depois da coleta dos vestígios'], 0,
        'Do geral para o particular, e antes de mexer em qualquer vestígio.');
      ORD('crim-loc', 'Ordene as etapas do processamento pericial do local de crime.',
        ['Isolamento e preservação', 'Busca de vestígios', 'Documentação (fixação)', 'Coleta', 'Acondicionamento e transporte', 'Liberação do local'],
        'Primeiro se preserva e documenta; só depois se coleta. O local é liberado por último.');

      T('crim-tan', 'Tanatologia e traumatologia forense');
      C('crim-tan', 'O que é o exame perinecroscópico?',
        'É o exame do cadáver no próprio local do crime, antes da necropsia: posição, vestes, lesões aparentes, fenômenos cadavéricos e vestígios ao redor do corpo.',
        'Ajuda a estimar o tempo de morte e a dinâmica do fato (luta, arrasto, posição da vítima). O corpo é fotografado na posição em que foi encontrado. A necropsia, no IML, completa a investigação da causa da morte.',
        'Perinecroscopia = no local; necropsia = no IML.');
      C('crim-tan', 'Quais são os fenômenos cadavéricos?',
        'Abióticos imediatos (parada cardiorrespiratória, perda da consciência) e consecutivos (resfriamento, desidratação, livores e rigidez). Transformativos destrutivos (autólise, putrefação) e conservadores (saponificação, mumificação).',
        'Valores aproximados: livores (manchas por gravidade) surgem em 1 a 3 h e se fixam em 8 a 12 h. A rigidez começa em 1 a 3 h pela mandíbula e nuca, em sentido craniocaudal (lei de Nysten), é máxima em 8 a 12 h e se desfaz em 24 a 36 h. A putrefação começa pela mancha verde abdominal (fossa ilíaca direita), por volta de 18 a 24 h. O ambiente altera muito esses tempos.',
        'Livor que muda de lugar quando o corpo é virado ainda não se fixou: morte recente.');
      C('crim-tan', 'O que é cronotanatognose?',
        'É a estimativa do tempo decorrido desde a morte, a partir dos fenômenos cadavéricos, da temperatura do corpo, do conteúdo gástrico, da fauna cadavérica e de outros sinais.',
        'O resfriamento é de cerca de 0,5 a 1,5 °C por hora nas primeiras horas, conforme o ambiente e as roupas. A entomologia forense (ciclo de vida das moscas) ajuda em intervalos longos. Todos os métodos dão faixas, não horários exatos.',
        'A cronotanatognose dá um intervalo estimado, nunca a hora exata.');
      C('crim-tan', 'Como se classificam as lesões por agentes mecânicos?',
        'Perfurante (lesão punctória: agulha), cortante (incisa: lâmina), contundente (contusa: martelo, soco), perfurocortante (perfuroincisa: faca de ponta), perfurocontundente (perfurocontusa: projétil de arma de fogo) e cortocontundente (cortocontusa: facão, machado).',
        'Agentes físicos: temperatura, eletricidade, pressão e radiação. Físico-químicos: asfixias (esganadura, estrangulamento, enforcamento, afogamento, sufocação). Químicos: cáusticos e venenos. A lesão incisa tem bordas regulares e termina numa cauda de escoriação.',
        'Projétil de arma de fogo = perfurocontundente; faca de ponta = perfurocortante.');
      MC('crim-tan', 'O projétil de arma de fogo é classificado como instrumento:',
        ['Perfurocontundente', 'Perfurocortante', 'Cortante', 'Cortocontundente', 'Perfurante'], 0,
        'Ele perfura e contunde ao mesmo tempo, sem gume cortante.');

      T('crim-bal', 'Balística forense');
      C('crim-bal', 'O que é arma de fogo e qual a diferença entre calibre real e nominal?',
        'Arma de fogo é o engenho que lança projéteis pela força expansiva dos gases da queima de um propelente. Calibre real é o diâmetro interno do cano (medido entre os cheios, nas armas raiadas); calibre nominal é a designação comercial (.38, 9 mm, .40).',
        'Nas armas de alma lisa (espingardas), o calibre é dado em "gauge" (ex.: 12): o número de esferas de chumbo do diâmetro do cano que pesam uma libra. O raiamento (raias e cheios) faz o projétil girar e deixa marcas nele.',
        'No sistema gauge, o calibre 12 é MAIOR que o calibre 20.');
      C('crim-bal', 'Quais os elementos do cartucho de munição?',
        'Estojo, espoleta (com a mistura iniciadora), carga de projeção (pólvora) e projétil.',
        'O percussor atinge a espoleta, que inflama a pólvora; os gases empurram o projétil pelo cano. Espoletas com chumbo, bário e antimônio geram os resíduos de tiro clássicos, analisados por microscopia eletrônica de varredura (MEV/EDS). Cartuchos de espingarda têm bucha e vários projéteis de chumbo.',
        'Projétil é só o que sai pelo cano; "bala" é termo leigo.');
      C('crim-bal', 'Como se identifica uma arma de fogo?',
        'Diretamente, por marca, modelo e número de série (inclusive revelando números raspados). Indiretamente, comparando as microestrias do projétil e as marcas do percussor, culatra, extrator e ejetor no estojo com padrões disparados no laboratório.',
        'O comparador balístico mostra dois projéteis lado a lado. Sistemas automatizados alimentam o banco de perfis balísticos; no Brasil, há o Sistema Nacional de Análise Balística (SINAB) e o Banco Nacional de Perfis Balísticos. Números raspados podem ser revelados por métodos químicos ou magnéticos.',
        'Microestrias no projétil vêm do cano; marcas no estojo vêm do mecanismo da arma.');
      C('crim-bal', 'Como se estima a distância do tiro?',
        'Tiro encostado: câmara de mina (sinal de Hofmann), marca da boca do cano (Puppe-Werkgartner) e resíduos dentro do ferimento. Curta distância: chamuscamento, esfumaçamento e tatuagem (grãos de pólvora). Longa distância: apenas orla de contusão e de enxugo, sem resíduos.',
        'A tatuagem (grãos incrustados) não sai com lavagem; o esfumaçamento sai. As orlas de contusão e de enxugo aparecem no orifício de entrada em qualquer distância. O orifício de saída costuma ser maior, irregular e sem orlas.',
        'Tatuagem não sai com lavagem; esfumaçamento sai.');
      MC('crim-bal', 'Grãos de pólvora incrustados na pele ao redor do orifício de entrada, que não saem com lavagem, indicam:',
        ['Zona de tatuagem: tiro a curta distância', 'Tiro a longa distância', 'Orla de enxugo, que aparece em qualquer distância', 'Orifício de saída', 'Arma de alma lisa'], 0,
        'A tatuagem só se forma quando a boca do cano está próxima o bastante para os grãos atingirem a pele.');
      CLZ('crim-bal', 'O calibre ___ é a designação comercial da munição, como .38 ou 9 mm.',
        ['nominal', 'real', 'gauge', 'raiado'], 0,
        'O calibre real é o diâmetro interno medido no cano.');

      T('crim-lau', 'Laudo pericial e avanços em ciências forenses');
      C('crim-lau', 'Quais as partes de um laudo pericial?',
        'Preâmbulo (quem, quando e a pedido de quem), histórico (contexto), descrição (o que foi examinado), discussão (análise técnica), conclusão e respostas aos quesitos.',
        'O laudo deve ser claro, objetivo, fundamentado e reprodutível, descrevendo métodos e limitações. O prazo é de 10 dias, prorrogável em casos excepcionais a pedido dos peritos (CPP, art. 160, parágrafo único). O juiz não fica preso ao laudo (art. 182).',
        'Laudo é o documento do perito oficial; parecer é o documento do assistente técnico.');
      C('crim-lau', 'Quais os objetivos principais de um laudo pericial?',
        'Constatar a materialidade do fato, esclarecer a dinâmica (como ocorreu), contribuir para a autoria (quem) e fornecer elementos sobre o tempo e o meio empregado.',
        'O laudo responde ao que foi perguntado, sem extrapolar a área técnica: o perito não julga culpa. As conclusões devem indicar o grau de certeza e as limitações (por exemplo, perfil parcial ou mistura).',
        'O perito conclui sobre fatos técnicos, não sobre culpabilidade.');
      C('crim-lau', 'Como a análise de isótopos ajuda a perícia?',
        'As razões de isótopos estáveis (carbono, nitrogênio, oxigênio, hidrogênio, estrôncio) funcionam como "assinaturas" de origem geográfica, dieta e processo de fabricação.',
        'Aplicações: origem de drogas, explosivos, alimentos e madeira; região onde viveu uma pessoa não identificada, a partir de cabelo, ossos e dentes (estrôncio e oxigênio refletem o solo e a água). É medida por espectrometria de massas de razão isotópica (IRMS).',
        'Para origem, usam-se isótopos ESTÁVEIS, não radioativos.');
      C('crim-lau', 'O que é a rastreabilidade de metais preciosos?',
        'É a determinação da origem do ouro e de outros metais pela sua composição química e isotópica, para combater a extração e o comércio ilegais, como o garimpo em terras indígenas.',
        'A Polícia Federal desenvolve um banco de assinaturas de amostras de ouro de diferentes regiões (projeto Ouro Alvo) para comparar com o ouro apreendido. Bancos de dados em criminalística também incluem perfis genéticos e perfis balísticos.',
        'Bancos de dados da criminalística: perfis genéticos, perfis balísticos, impressões digitais e assinaturas de ouro.');
      MC('crim-lau', 'Para estimar a região de origem de uma amostra de ouro apreendido, usa-se principalmente:',
        ['A composição química e isotópica comparada a um banco de referência', 'O teste de Kastle-Meyer', 'A comparação de microestrias', 'A coloração de Gram', 'O teste de amilase'], 0,
        'Cada jazida tem uma assinatura química e isotópica característica.');
      ORD('crim-lau', 'Ordene as partes do laudo pericial.',
        ['Preâmbulo', 'Histórico', 'Descrição', 'Discussão', 'Conclusão', 'Respostas aos quesitos'],
        'Do contexto para a análise e daí para as conclusões.');

      /* ---------- Direito Processual Penal ---------- */
      T('dpp-ip', 'Inquérito policial');
      C('dpp-ip', 'Quais as características do inquérito policial?',
        'Procedimento administrativo, escrito, inquisitivo (sem contraditório pleno), sigiloso quando necessário, oficioso, indisponível para a autoridade policial e dispensável para a ação penal.',
        'A autoridade policial não pode mandar arquivar o inquérito (CPP, art. 17). O advogado tem acesso aos elementos de prova já documentados (Súmula Vinculante 14). O inquérito é dispensável quando o titular da ação já tem elementos suficientes.',
        'Delegado NÃO arquiva inquérito.');
      C('dpp-ip', 'Como o inquérito é instaurado?',
        'De ofício (crime de ação pública incondicionada), por requisição da autoridade judiciária ou do Ministério Público, por requerimento do ofendido ou por auto de prisão em flagrante. Na ação privada ou pública condicionada, depende de requerimento ou representação.',
        'Notitia criminis: de cognição imediata (a polícia toma conhecimento diretamente), mediata (comunicação formal) ou coercitiva (prisão em flagrante). Delatio criminis: comunicação feita por qualquer pessoa do povo (art. 5º, §3º). Denúncia anônima exige verificação preliminar antes da instauração.',
        'Denúncia anônima sozinha não basta: faz-se uma verificação preliminar.');
      C('dpp-ip', 'Quais os prazos e o valor probatório do inquérito?',
        'CPP: 10 dias com o indiciado preso e 30 dias se solto (prorrogáveis). Na Polícia Federal: 15 dias com preso, prorrogáveis por mais 15 (Lei 5.010/1966). O valor probatório é relativo.',
        'O juiz não pode fundamentar a decisão exclusivamente nos elementos do inquérito, ressalvadas as provas cautelares, não repetíveis e antecipadas (art. 155), como as perícias, que têm contraditório diferido.',
        'Perícias feitas no inquérito valem no processo: são provas não repetíveis.');
      C('dpp-ip', 'O que é o indiciamento?',
        'É ato privativo do delegado de polícia, fundamentado, que aponta o investigado como provável autor com base em análise técnico-jurídica do fato (Lei 12.830/2013, art. 2º, §6º).',
        'Deve indicar autoria, materialidade e circunstâncias. O juiz e o Ministério Público não podem requisitar o indiciamento (entendimento do STF). A autoridade pode negar diligências pedidas pelo ofendido, exceto o exame de corpo de delito (arts. 14 e 184).',
        'O exame de corpo de delito pedido pelo ofendido não pode ser negado.');
      MC('dpp-ip', 'A autoridade policial que conclui que o fato não é crime pode:',
        ['Relatar o inquérito e remetê-lo, mas não arquivá-lo', 'Arquivar o inquérito por despacho próprio', 'Destruir os autos', 'Arquivar depois de ouvir a vítima', 'Arquivar se o crime for de menor potencial ofensivo'], 0,
        'O arquivamento não cabe à autoridade policial (art. 17 do CPP).');

      T('dpp-per', 'Prova pericial e corpo de delito');
      C('dpp-per', 'Quando o exame de corpo de delito é obrigatório?',
        'Quando a infração deixar vestígios: o exame direto ou indireto é indispensável e não pode ser suprido pela confissão do acusado (CPP, art. 158).',
        'Tem prioridade quando envolver violência doméstica e familiar contra a mulher ou violência contra criança, adolescente, idoso ou pessoa com deficiência. Se os vestígios desapareceram, a prova testemunhal pode suprir a falta (art. 167).',
        'A confissão NÃO supre o exame de corpo de delito.');
      C('dpp-per', 'Quem faz a perícia e quais as formalidades?',
        'Um perito oficial com diploma de curso superior. Na falta, duas pessoas idôneas com diploma superior, preferencialmente na área, que prestam compromisso (CPP, art. 159, caput e §1º).',
        'O laudo sai em até 10 dias, prorrogáveis. Os peritos descrevem minuciosamente o que examinarem e respondem aos quesitos; podem ser recusados por suspeição. A Lei 12.030/2009 garante aos peritos oficiais autonomia técnica, científica e funcional.',
        'Perito oficial: basta UM. Peritos nomeados (não oficiais): DOIS.');
      C('dpp-per', 'Como atua o assistente técnico?',
        'Indicado pelas partes, atua depois de admitido pelo juiz e após a conclusão dos exames e a elaboração do laudo pelos peritos oficiais (art. 159, §4º). Pode apresentar parecer e responder a quesitos.',
        'Havendo requerimento, o material probatório fica disponível no ambiente do órgão oficial, que mantém a sua guarda, na presença de perito oficial, para exame pelos assistentes, salvo se for impossível conservá-lo (§6º).',
        'Item 32 de 2025 é CERTO.');
      C('dpp-per', 'E se o laudo tiver falhas ou for contestado?',
        'Havendo omissões, obscuridades ou contradições, o juiz manda suprir, complementar ou esclarecer o laudo e pode determinar nova perícia (art. 181). O juiz não fica preso ao laudo: pode aceitá-lo ou rejeitá-lo, no todo ou em parte (art. 182).',
        'Se os peritos divergirem, cada um registra sua opinião, e a autoridade pode nomear um terceiro (art. 180). Em perícia complexa, de mais de uma área, pode haver mais de um perito oficial e mais de um assistente (art. 159, §7º).',
        'O juiz não é obrigado a seguir o laudo (sistema liberatório).');
      MC('dpp-per', 'Na falta de perito oficial, o exame será feito por:',
        ['Duas pessoas idôneas com diploma superior, preferencialmente na área', 'Uma pessoa idônea qualquer', 'O delegado de polícia', 'O escrivão', 'O assistente técnico da defesa'], 0,
        'É a regra do art. 159, §1º, do CPP.');

      T('dpp-prova', 'Provas, ônus e busca e apreensão');
      C('dpp-prova', 'Como funcionam o ônus da prova e as provas ilícitas?',
        'A prova da alegação cabe a quem a fizer (art. 156). Provas ilícitas, obtidas com violação de normas constitucionais ou legais, são inadmissíveis e devem ser desentranhadas, assim como as delas derivadas (art. 157).',
        'Exceções para as derivadas: quando não há nexo de causalidade com a ilícita ou quando poderiam ser obtidas por fonte independente. Para o STJ, a quebra da cadeia de custódia não gera nulidade automática: o juiz avalia a confiabilidade da prova.',
        'Teoria dos frutos da árvore envenenada: a prova derivada da ilícita também é ilícita, salvo fonte independente.');
      C('dpp-prova', 'Como deve ser feito o reconhecimento de pessoas?',
        'Pelo art. 226 do CPP: quem vai reconhecer descreve antes a pessoa; o suspeito é colocado, se possível, ao lado de outras pessoas parecidas; lavra-se auto do ato.',
        'O STJ entende que o procedimento do art. 226 é garantia mínima e que, sem ele, o reconhecimento não vale como prova (HC 598.886/SC, 2020). O reconhecimento por foto segue as mesmas cautelas e, sozinho, não pode fundamentar condenação.',
        'Reconhecimento sem as formalidades do art. 226 não serve como prova (STJ).');
      C('dpp-prova', 'O que são acareação, documentos e indícios?',
        'Acareação é o confronto entre pessoas cujas declarações divergem sobre fatos relevantes (art. 229). Documentos são quaisquer escritos, instrumentos ou papéis, públicos ou particulares (art. 232). Indício é a circunstância conhecida e provada que permite concluir, por indução, a existência de outra (art. 239).',
        'Na acareação, os acareados são reperguntados sobre os pontos de divergência. Indícios são prova indireta e, se múltiplos, graves e concordantes, podem sustentar uma condenação.',
        'Indício (prova indireta, conceito jurídico) ≠ vestígio (material).');
      C('dpp-prova', 'Como é a busca e apreensão?',
        'Domiciliar: exige mandado judicial e deve ser feita de dia, salvo consentimento do morador, flagrante, desastre ou socorro (CF, art. 5º, XI). Pessoal: dispensa mandado em caso de prisão ou de fundada suspeita de que a pessoa leva arma ou objetos do crime (CPP, art. 244).',
        'O STF exige fundadas razões, justificadas depois, para entrar em domicílio sem mandado em caso de flagrante (Tema 280). O STJ exige prova de que o consentimento do morador foi livre (de preferência registrada em vídeo). A busca em mulher é feita por outra mulher, se isso não atrasar a diligência (art. 249).',
        'Item 33 de 2025 (busca com consentimento válido do morador, sem mandado) é CERTO.');
      MC('dpp-prova', 'A prova derivada de uma prova ilícita:',
        ['É inadmissível, salvo se não houver nexo causal ou puder ser obtida por fonte independente', 'É sempre admissível', 'É admissível se o réu confessar', 'Só é ilícita em crimes hediondos', 'É admissível a critério do delegado'], 0,
        'É a regra do art. 157, §1º, do CPP.');

      T('dpp-fla', 'Prisão em flagrante e cadeia de custódia');
      C('dpp-fla', 'Quais as hipóteses de flagrante (CPP, art. 302)?',
        'Próprio: está cometendo ou acaba de cometer a infração. Impróprio: é perseguido logo após, em situação que faça presumir a autoria. Presumido: é encontrado logo depois com instrumentos, armas, objetos ou papéis que façam presumir a autoria.',
        'Nos crimes permanentes, como o tráfico na modalidade "ter em depósito", o flagrante dura enquanto não cessar a permanência (art. 303). Qualquer pessoa pode, e as autoridades policiais devem, prender quem esteja em flagrante (art. 301).',
        'Flagrante facultativo: qualquer pessoa. Obrigatório: autoridades policiais e seus agentes.');
      C('dpp-fla', 'Quais as espécies de flagrante e quais são ilegais?',
        'Esperado (a polícia aguarda o crime acontecer): legal. Prorrogado ou diferido (ação controlada, para colher mais provas): legal quando previsto em lei. Preparado (o agente provocador induz o crime): ilegal, é crime impossível (Súmula 145 do STF). Forjado (provas plantadas): ilegal.',
        'A ação controlada está prevista, por exemplo, na Lei de Organizações Criminosas (Lei 12.850/2013) e na Lei de Drogas. No flagrante preparado não há crime porque a consumação é impossível pela atuação da polícia.',
        'Súmula 145 do STF: não há crime quando a preparação do flagrante pela polícia torna impossível a consumação.');
      C('dpp-fla', 'O que acontece depois da prisão em flagrante?',
        'Lavra-se o auto de prisão em flagrante, entrega-se nota de culpa ao preso em 24 horas, comunica-se imediatamente o juiz, o Ministério Público e a família, e o auto vai ao juiz em até 24 horas, com audiência de custódia.',
        'Na audiência de custódia, o juiz relaxa a prisão ilegal, converte em preventiva (se presentes os requisitos e insuficientes outras medidas) ou concede liberdade provisória (art. 310). Se o preso não indicar advogado, cópia do auto vai à Defensoria Pública.',
        'Prazo de 24 horas para a nota de culpa e para a audiência de custódia.');
      C('dpp-fla', 'Como o CPP regula a cadeia de custódia?',
        'É o conjunto de procedimentos para manter e documentar a história cronológica do vestígio (art. 158-A), em 10 etapas: reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte (art. 158-B).',
        'Começa com a preservação do local ou com o procedimento em que se detecta o vestígio, e o agente que reconhece o vestígio fica responsável por preservá-lo (art. 158-A, §2º). Os institutos de criminalística devem ter central de custódia (art. 158-E). Para o STJ, a quebra da cadeia não gera nulidade automática; afeta o valor da prova.',
        'A cadeia NÃO começa no transporte ao instituto (item 34 de 2025, ERRADO).');
      MC('dpp-fla', 'O flagrante em que a polícia induz o agente a cometer o crime, tornando impossível a consumação, é:',
        ['Preparado: ilegal (Súmula 145 do STF)', 'Esperado: legal', 'Prorrogado: legal', 'Presumido: legal', 'Impróprio: legal'], 0,
        'No flagrante preparado há crime impossível; no esperado, a polícia apenas aguarda, sem induzir.');
      ORD('dpp-fla', 'Ordene as quatro últimas etapas da cadeia de custódia (CPP, art. 158-B).',
        ['Recebimento', 'Processamento', 'Armazenamento', 'Descarte'],
        'Antes delas vêm reconhecimento, isolamento, fixação, coleta, acondicionamento e transporte.');

      /* ---------- Raciocínio Lógico ---------- */
      T('rl-prop', 'Proposições, conectivos e tabela-verdade');
      C('rl-prop', 'O que é uma proposição?',
        'É uma sentença declarativa que pode ser julgada verdadeira ou falsa, mas não as duas coisas ao mesmo tempo.',
        'Não são proposições: perguntas, ordens, exclamações, sentenças abertas com variável ("x + 2 = 5") e paradoxos ("esta frase é falsa"). Proposições compostas combinam as simples por conectivos.',
        '"Que horas são?" e "Estude!" não são proposições.');
      C('rl-prop', 'Quando cada conectivo é verdadeiro?',
        'Conjunção (P ∧ Q): V só se as duas forem V. Disjunção (P ∨ Q): F só se as duas forem F. Disjunção exclusiva (ou... ou): V se exatamente uma for V. Condicional (P → Q): F só quando P é V e Q é F. Bicondicional (P ↔ Q): V quando as duas têm o mesmo valor.',
        'Na condicional, P é condição suficiente para Q, e Q é condição necessária para P. "A só se B" e "A somente se B" significam A → B. "Se e somente se" é bicondicional.',
        'Condicional com antecedente falso é SEMPRE verdadeira.');
      C('rl-prop', 'Quantas linhas tem uma tabela-verdade?',
        '2ⁿ linhas, em que n é o número de proposições simples distintas.',
        'Tautologia: sempre verdadeira (ex.: P ∨ ¬P). Contradição: sempre falsa (P ∧ ¬P). Contingência: às vezes V, às vezes F. Com 3 proposições, 8 linhas; com 4, 16.',
        'Conte as proposições DISTINTAS, não quantas vezes aparecem.');
      C('rl-prop', 'Como resolver questões com regras e fatos, como a do laboratório da prova de 2025?',
        'Traduza as frases em símbolos, parta dos fatos dados como verdadeiros e aplique as regras: se P → Q e P é V, então Q é V (modus ponens); se Q é F, então P é F (modus tollens).',
        'Exemplo da prova: Q → (P ∨ R) é verdadeira; com Q (sensor ativado) e ¬R (porta fechada), P (luzes apagadas) tem de ser verdadeira. "O alarme S só dispara se Q e R" equivale a S → (Q ∧ R); S verdadeira com Q falsa contraria a regra.',
        'Afirmar o consequente (Q, logo P) e negar o antecedente (¬P, logo ¬Q) são falácias.');
      MC('rl-prop', 'A proposição "Se o laudo foi entregue, então o caso foi encerrado" é FALSA quando:',
        ['O laudo foi entregue e o caso não foi encerrado', 'O laudo não foi entregue e o caso foi encerrado', 'Nenhum dos dois ocorreu', 'Os dois ocorreram', 'Nunca: ela é sempre verdadeira'], 0,
        'A condicional só é falsa com antecedente verdadeiro e consequente falso.');
      CLZ('rl-prop', 'Uma tabela-verdade com 3 proposições simples tem ___ linhas.',
        ['8', '6', '9', '3'], 0,
        '2³ = 8.');

      T('rl-eq', 'Equivalências, negações e De Morgan');
      C('rl-eq', 'Quais as equivalências da condicional?',
        'P → Q ≡ ¬Q → ¬P (contrapositiva) ≡ ¬P ∨ Q.',
        'A recíproca (Q → P) e a inversa (¬P → ¬Q) NÃO são equivalentes à original. Assim, Q → (P ∨ R) equivale a ¬Q ∨ P ∨ R, e não a Q ∧ (P ∨ R).',
        'Item 49 de 2025 (equivalência com Q ∧ (P ∨ R)) está ERRADO.');
      C('rl-eq', 'Quais são as leis de De Morgan?',
        '¬(P ∧ Q) ≡ ¬P ∨ ¬Q e ¬(P ∨ Q) ≡ ¬P ∧ ¬Q.',
        'Negar uma conjunção dá a disjunção das negações, e vice-versa. Exemplo: a negação de "O perito é farmacêutico e biólogo" é "O perito não é farmacêutico ou não é biólogo".',
        'Troque o conectivo E negue as duas partes.');
      C('rl-eq', 'Como negar a condicional e a bicondicional?',
        '¬(P → Q) ≡ P ∧ ¬Q. ¬(P ↔ Q) ≡ ou P ou Q (disjunção exclusiva), ou seja, (P ∧ ¬Q) ∨ (¬P ∧ Q).',
        'A negação da condicional não é outra condicional: mantém o antecedente, nega o consequente e liga com "e". Exemplo: a negação de "Se estudar, passa" é "Estuda e não passa".',
        'A negação de uma condicional NUNCA tem "se... então".');
      C('rl-eq', 'Como negar proposições com quantificadores?',
        'A negação de "Todo A é B" é "Algum A não é B". A de "Algum A é B" é "Nenhum A é B". A de "Nenhum A é B" é "Algum A é B".',
        'Na lógica de primeira ordem: ¬∀x P(x) ≡ ∃x ¬P(x) e ¬∃x P(x) ≡ ∀x ¬P(x). A negação de "todo" não é "nenhum".',
        'A negação de "Todos os laudos foram entregues" é "Algum laudo não foi entregue".');
      MC('rl-eq', 'A negação de "Se o vestígio foi coletado, então foi lacrado" é:',
        ['O vestígio foi coletado e não foi lacrado', 'Se o vestígio não foi coletado, então não foi lacrado', 'O vestígio não foi coletado ou foi lacrado', 'Se foi lacrado, então foi coletado', 'O vestígio não foi coletado e foi lacrado'], 0,
        '¬(P → Q) ≡ P ∧ ¬Q.');
      CLZ('rl-eq', 'Pela lei de De Morgan, ¬(P ∧ Q) equivale a ___.',
        ['¬P ∨ ¬Q', '¬P ∧ ¬Q', 'P ∨ Q', '¬P → Q'], 0,
        'Nega-se cada parte e troca-se o "e" por "ou".');

      T('rl-arg', 'Argumentação, diagramas e quantificadores');
      C('rl-arg', 'O que é um argumento válido?',
        'É aquele em que, se as premissas forem verdadeiras, a conclusão é necessariamente verdadeira. A validade depende da forma, não do conteúdo.',
        'Um argumento pode ser válido com premissas falsas e inválido com conclusão verdadeira. Formas válidas: modus ponens (P → Q; P; logo Q), modus tollens (P → Q; ¬Q; logo ¬P), silogismo hipotético (P → Q; Q → R; logo P → R) e silogismo disjuntivo (P ∨ Q; ¬P; logo Q).',
        'Válido não é o mesmo que verdadeiro: validade é sobre a estrutura.');
      C('rl-arg', 'Como usar diagramas lógicos?',
        '"Todo A é B": o conjunto A fica dentro de B. "Nenhum A é B": os conjuntos ficam separados. "Algum A é B": há interseção.',
        'Para testar uma conclusão, procure um desenho em que as premissas valham e a conclusão falhe; se existir, o argumento é inválido. "Algum A não é B": parte de A fica fora de B.',
        '"Todo A é B" não implica "todo B é A".');
      C('rl-arg', 'O que são dedução, indução e analogia?',
        'Dedução vai do geral para o particular, com conclusão necessária. Indução vai de casos particulares para uma generalização, com conclusão provável. Analogia conclui por semelhança entre casos.',
        'A lógica formal das provas trata da dedução. Na perícia, a indução aparece na construção de bases de dados (frequências), e o indício é um raciocínio indutivo (CPP, art. 239).',
        'Indução nunca garante a conclusão; só a torna provável.');
      C('rl-arg', 'Como resolver problemas de verdades e mentiras?',
        'Suponha que uma afirmação é verdadeira e veja se surge contradição; se surgir, ela é falsa. Teste as hipóteses até que todas as condições se encaixem.',
        'Organize as informações em tabela. Comece pelas afirmações que se contradizem diretamente: uma delas é necessariamente falsa. Em problemas de associação (quem fez o quê), use tabela de dupla entrada e vá eliminando possibilidades.',
        'Duas pessoas que acusam uma à outra de mentir não podem estar ambas dizendo a verdade.');
      MC('rl-arg', 'Premissas: "Se há sangue, faz-se o teste" e "Não se fez o teste". A conclusão válida é:',
        ['Não havia sangue', 'Havia sangue', 'O teste foi positivo', 'Nada se pode concluir', 'Havia outro fluido'], 0,
        'É o modus tollens: P → Q; ¬Q; logo ¬P.');

      T('rl-cont', 'Contagem, probabilidade e conjuntos');
      C('rl-cont', 'Quais as fórmulas de contagem?',
        'Princípio multiplicativo: m × n maneiras. Permutação: n!. Arranjo (a ordem importa): n! / (n − p)!. Combinação (a ordem não importa): n! / [p! (n − p)!].',
        'Formar uma comissão de 3 peritos entre 10 é combinação: C(10, 3) = 120. Escolher presidente, vice e secretário entre 10 é arranjo: 10 × 9 × 8 = 720. Permutação com repetição: anagramas de ARARA = 5! / (3! × 2!) = 10.',
        'Pergunte-se: trocar a ordem gera um resultado diferente? Se sim, é arranjo; se não, combinação.');
      C('rl-cont', 'Como calcular probabilidades?',
        'P = casos favoráveis / casos possíveis. P(A ou B) = P(A) + P(B) − P(A e B). Eventos independentes: P(A e B) = P(A) × P(B). Complementar: P(não A) = 1 − P(A).',
        'Probabilidade condicional: P(A|B) = P(A e B) / P(B), base do teorema de Bayes usado na genética forense. "Pelo menos um" costuma ser mais fácil pelo complementar: 1 − P(nenhum).',
        'Para "pelo menos um", calcule 1 − P(nenhum).');
      C('rl-cont', 'Como resolver problemas de conjuntos?',
        'n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Com três conjuntos: soma dos três − interseções duas a duas + interseção tripla.',
        'No diagrama de Venn, preencha do centro (interseção tripla) para fora. Complementar de A: os elementos do universo fora de A. Diferença A − B: os elementos de A que não estão em B.',
        'Comece sempre pela interseção ao preencher o diagrama.');
      C('rl-cont', 'Como resolver o problema das câmeras da prova de 2025?',
        '3 câmeras que cobrem no máximo 2 salas cada cobrem no máximo 6 salas; com campos sobrepostos, podem cobrir menos de 3. O intervalo "de 3 a 5" está errado.',
        'Problemas de máximo e mínimo pedem o melhor e o pior caso: o máximo sem sobreposição e o mínimo com sobreposição. Leia "no máximo" e "pelo menos" com atenção.',
        '"No máximo duas salas" permite que uma câmera cubra uma sala só ou as mesmas salas de outra.');
      MC('rl-cont', 'De quantas maneiras se forma uma equipe de 3 peritos entre 6 candidatos (a ordem não importa)?',
        ['20', '120', '18', '216', '6'], 0,
        'C(6, 3) = 6! / (3! × 3!) = 20.');
      CLZ('rl-cont', 'Se P(A) = 0,3, então P(não A) = ___.',
        ['0,7', '0,3', '1,3', '0,09'], 0,
        'P(não A) = 1 − 0,3 = 0,7.');

      /* ---------- Direito Penal ---------- */
      T('dp-lei', 'Princípios e aplicação da lei penal');
      C('dp-lei', 'Quais os princípios básicos do Direito Penal?',
        'Legalidade (não há crime sem lei anterior que o defina), anterioridade, irretroatividade da lei mais grave, intervenção mínima (subsidiariedade e fragmentariedade), lesividade, culpabilidade, individualização da pena e insignificância.',
        'A insignificância exclui a tipicidade material. O STF exige mínima ofensividade, nenhuma periculosidade social, reduzido grau de reprovabilidade e inexpressividade da lesão. Em regra, não se aplica a crimes com violência ou grave ameaça.',
        'A insignificância exclui a tipicidade (material), não a ilicitude.');
      C('dp-lei', 'Como a lei penal se aplica no tempo?',
        'Vale a lei do tempo do crime, que é o momento da ação ou omissão (teoria da atividade, art. 4º). A lei mais benéfica retroage, mesmo após condenação definitiva; a mais grave não retroage.',
        'A abolitio criminis (lei que deixa de considerar o fato crime) extingue a punibilidade e faz cessar os efeitos penais da sentença, mas não os civis. Leis temporárias e excepcionais continuam valendo para os fatos praticados durante sua vigência, mesmo depois de revogadas (art. 3º).',
        'Item 30 de 2025 (agente menor de idade na data dos disparos é inimputável) é CERTO.');
      C('dp-lei', 'Como a lei penal se aplica no espaço?',
        'Lugar do crime: teoria da ubiquidade, ou seja, onde ocorreu a ação ou omissão, no todo ou em parte, e onde se produziu ou deveria produzir-se o resultado (art. 6º). Regra geral: territorialidade (art. 5º).',
        'Extensões do território: embarcações e aeronaves públicas brasileiras onde estiverem; as privadas, em alto-mar ou no espaço aéreo correspondente. Extraterritorialidade incondicionada (art. 7º, I): crimes contra a vida ou a liberdade do Presidente, contra o patrimônio ou a fé pública da União, contra a Administração Pública por quem está a seu serviço e genocídio por brasileiro ou domiciliado no Brasil.',
        'Mnemônico LUTA: Lugar = Ubiquidade; Tempo = Atividade (item 29 de 2025, ERRADO por dizer "apenas onde o resultado ocorreu").');
      C('dp-lei', 'Qual a diferença entre crime consumado e tentado?',
        'Consumado: quando se reúnem todos os elementos da definição legal. Tentado: iniciada a execução, não se consuma por circunstâncias alheias à vontade do agente; a pena é diminuída de 1/3 a 2/3 (art. 14).',
        'Desistência voluntária e arrependimento eficaz (art. 15): o agente responde só pelos atos já praticados. Arrependimento posterior (art. 16): crime sem violência ou grave ameaça, dano reparado até o recebimento da denúncia, redução de 1/3 a 2/3. Crime impossível (art. 17): meio absolutamente ineficaz ou objeto absolutamente impróprio; não se pune.',
        'Na tentativa, a consumação falha por fatores ALHEIOS à vontade; na desistência, o agente para voluntariamente.');
      MC('dp-lei', 'Para o Código Penal, o tempo do crime é o momento:',
        ['Da ação ou omissão, ainda que outro seja o do resultado', 'Do resultado', 'Da descoberta do fato', 'Do oferecimento da denúncia', 'Da sentença'], 0,
        'É a teoria da atividade (art. 4º do CP).');
      CLZ('dp-lei', 'Pela teoria da ___, o lugar do crime é tanto onde ocorreu a ação quanto onde se produziu o resultado.',
        ['ubiquidade', 'atividade', 'resultado', 'territorialidade'], 0,
        'É a regra do art. 6º do CP.');

      T('dp-crime', 'Fato típico, ilicitude e excludentes');
      C('dp-crime', 'Quais os elementos do fato típico?',
        'Conduta (dolosa ou culposa), resultado (nos crimes materiais), nexo causal e tipicidade.',
        'No conceito analítico tripartite, crime é fato típico, ilícito e culpável. Dolo: vontade de realizar a conduta (direto) ou assunção do risco (eventual). Culpa: imprudência, negligência ou imperícia, com resultado previsível. Crimes formais e de mera conduta não exigem resultado naturalístico.',
        'Dolo eventual: assume o risco. Culpa consciente: prevê o resultado, mas acredita que não vai acontecer.');
      C('dp-crime', 'Quais são as excludentes de ilicitude?',
        'Estado de necessidade, legítima defesa, estrito cumprimento do dever legal e exercício regular de direito (art. 23).',
        'Legítima defesa: repelir injusta agressão, atual ou iminente, a direito próprio ou alheio, usando moderadamente os meios necessários (art. 25); inclui o agente de segurança que repele agressão a vítima mantida refém. Estado de necessidade: salvar direito de perigo atual, não provocado pelo agente, que não podia ser evitado de outro modo (art. 24).',
        'Em qualquer excludente, o agente responde pelo excesso doloso ou culposo (art. 23, parágrafo único).');
      C('dp-crime', 'Qual a diferença entre legítima defesa e estado de necessidade?',
        'Na legítima defesa há uma agressão humana injusta; no estado de necessidade há um perigo (natural ou humano) e um conflito entre bens jurídicos.',
        'No estado de necessidade sacrifica-se um bem para salvar outro (ex.: arrombar uma porta para fugir de um incêndio). Não pode alegá-lo quem tem o dever legal de enfrentar o perigo, como bombeiros e policiais, salvo situações excepcionais.',
        'Ataque de animal: em regra, estado de necessidade; se o animal for usado por alguém como arma, legítima defesa.');
      C('dp-crime', 'O que é excesso punível?',
        'É a intensificação desnecessária de uma conduta que começou justificada; o agente responde pelo excesso, a título de dolo ou culpa (art. 23, parágrafo único).',
        'Exemplo: continuar golpeando o agressor depois de desarmá-lo. O excesso doloso é consciente; o culposo decorre de erro evitável na avaliação da situação. Para a doutrina, o excesso causado por medo ou surpresa (exculpante) pode afastar a culpabilidade.',
        'A excludente cobre a conduta inicial; o excesso é punido à parte.');
      MC('dp-crime', 'Quem repele, com moderação, injusta agressão atual a direito de outra pessoa age em:',
        ['Legítima defesa', 'Estado de necessidade', 'Estrito cumprimento do dever legal', 'Exercício regular de direito', 'Arrependimento eficaz'], 0,
        'A legítima defesa protege direito próprio ou de terceiro (art. 25 do CP).');

      T('dp-esp', 'Crimes em espécie');
      C('dp-esp', 'Quais os principais crimes contra a pessoa?',
        'Homicídio (art. 121), feminicídio (art. 121-A, crime autônomo desde a Lei 14.994/2024), induzimento ao suicídio, infanticídio, aborto, lesão corporal (art. 129) e crimes contra a liberdade (sequestro, ameaça).',
        'Qualificadoras do homicídio (art. 121, §2º): motivo torpe ou fútil, veneno, fogo, explosivo, asfixia, tortura ou meio cruel, traição, emboscada ou recurso que dificulte a defesa, para assegurar outro crime, entre outras. A lesão corporal se classifica em leve, grave, gravíssima e seguida de morte.',
        'O feminicídio deixou de ser qualificadora: é o art. 121-A, com pena de 20 a 40 anos.');
      C('dp-esp', 'Qual a diferença entre furto, roubo, extorsão e estelionato?',
        'Furto: subtrair coisa alheia móvel sem violência (art. 155). Roubo: subtrair com violência ou grave ameaça (art. 157). Extorsão: constranger alguém, com violência ou grave ameaça, a fazer, tolerar ou deixar de fazer algo para obter vantagem econômica (art. 158). Estelionato: obter vantagem ilícita induzindo alguém em erro por fraude (art. 171).',
        'No roubo, o agente subtrai; na extorsão, a vítima colabora entregando a vantagem. Desde a Lei 13.964/2019, o estelionato é, em regra, de ação pública condicionada à representação. Latrocínio é o roubo com resultado morte.',
        'Furto mediante fraude: a fraude distrai a vítima e o agente subtrai. Estelionato: a vítima entrega por engano.');
      C('dp-esp', 'Quais os principais crimes contra a fé pública?',
        'Moeda falsa (art. 289), falsificação de documento público (art. 297), falsificação de documento particular (art. 298), falsidade ideológica (art. 299) e uso de documento falso (art. 304).',
        'Falsidade material: o documento é forjado ou alterado (a forma é falsa), o que a perícia documentoscópica pode revelar. Falsidade ideológica: o documento é formalmente verdadeiro, mas o conteúdo é falso. Alguns documentos particulares são equiparados aos públicos, como título ao portador e testamento particular (art. 297, §2º).',
        'Material = forma falsa (a perícia ajuda). Ideológica = conteúdo falso.');
      C('dp-esp', 'Quais os principais crimes contra a Administração Pública?',
        'Peculato (apropriar-se ou desviar bem de que tem a posse em razão do cargo, art. 312), concussão (exigir vantagem indevida, art. 316), corrupção passiva (solicitar, receber ou aceitar promessa de vantagem, art. 317), prevaricação (retardar ou deixar de praticar ato de ofício por interesse pessoal, art. 319) e corrupção ativa (particular oferecer ou prometer vantagem, art. 333).',
        'Para fins penais, funcionário público é quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração (art. 327). No peculato culposo, reparar o dano antes da sentença irrecorrível extingue a punibilidade.',
        'Exigir = concussão. Solicitar = corrupção passiva. Oferecer (particular) = corrupção ativa.');
      MC('dp-esp', 'O servidor que EXIGE vantagem indevida em razão da função comete:',
        ['Concussão', 'Corrupção passiva', 'Corrupção ativa', 'Prevaricação', 'Peculato'], 0,
        'O verbo "exigir" caracteriza a concussão (art. 316 do CP).');

      /* ---------- Direito Administrativo ---------- */
      T('da-org', 'Organização administrativa e princípios');
      C('da-org', 'Qual a diferença entre descentralização e desconcentração?',
        'Descentralização: a atividade é transferida para outra pessoa jurídica (autarquia, fundação, empresa estatal ou particular por delegação). Desconcentração: as competências são distribuídas entre órgãos dentro da mesma pessoa jurídica.',
        'Descentralização por outorga: a lei cria a entidade e transfere a titularidade e a execução do serviço. Por delegação (colaboração): transfere-se só a execução, por contrato (concessão, permissão) ou ato. Centralização e concentração são os opostos. Órgãos não têm personalidade jurídica.',
        'Item 22 de 2025 (concessão a particular por contrato = descentralização) é CERTO.');
      C('da-org', 'Como é formada a administração indireta?',
        'Por autarquias, fundações públicas, empresas públicas e sociedades de economia mista, vinculadas (não subordinadas) a um órgão da administração direta.',
        'Autarquia: pessoa jurídica de direito público, criada por lei específica, para atividades típicas de Estado, com patrimônio e receita próprios (ex.: INSS). Empresa pública: direito privado, capital 100% público, qualquer forma societária (ex.: Caixa). Sociedade de economia mista: direito privado, sempre sociedade anônima, com maioria do capital votante público (ex.: Banco do Brasil).',
        'Autarquia é CRIADA por lei; empresa pública e sociedade de economia mista têm a criação AUTORIZADA por lei.');
      C('da-org', 'O que é o controle finalístico (tutela)?',
        'É o controle que a administração direta exerce sobre as entidades da indireta, nos limites da lei, para verificar se cumprem suas finalidades, sem hierarquia.',
        'A hierarquia existe entre órgãos da mesma pessoa jurídica. Entre administração direta e indireta há vinculação e supervisão ministerial.',
        'Não há subordinação hierárquica entre um ministério e uma autarquia: há vinculação.');
      C('da-org', 'Quais são os princípios da Administração Pública?',
        'Expressos no art. 37 da CF: legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE). Implícitos: supremacia e indisponibilidade do interesse público, razoabilidade, proporcionalidade, motivação, autotutela, continuidade e segurança jurídica.',
        'Pela legalidade administrativa, o gestor só faz o que a lei permite. A supremacia e a indisponibilidade do interesse público são os pilares do regime jurídico-administrativo (prerrogativas e sujeições). Pela autotutela, a administração anula seus atos ilegais e revoga os inconvenientes (Súmula 473 do STF).',
        'A razoabilidade é princípio IMPLÍCITO, não está no art. 37.');
      MC('da-org', 'A criação de uma secretaria dentro de um ministério é exemplo de:',
        ['Desconcentração', 'Descentralização por outorga', 'Descentralização por delegação', 'Concessão de serviço público', 'Privatização'], 0,
        'A secretaria é um órgão da mesma pessoa jurídica (a União): é desconcentração.');

      T('da-ato', 'Ato administrativo e poderes');
      C('da-ato', 'Quais os elementos (requisitos) do ato administrativo?',
        'Competência, finalidade, forma, motivo e objeto.',
        'Competência, finalidade e forma são, em regra, vinculados; motivo e objeto podem ser discricionários (o mérito administrativo). Vícios de competência e de forma podem ser convalidados em certos casos; os de finalidade, motivo e objeto, em regra, não. Pela teoria dos motivos determinantes, os motivos declarados vinculam a validade do ato.',
        'Mnemônico COFIFOMOB: COmpetência, FInalidade, FOrma, MOtivo, OBjeto.');
      C('da-ato', 'Quais os atributos do ato administrativo?',
        'Presunção de legitimidade e veracidade, imperatividade, autoexecutoriedade e tipicidade.',
        'A presunção é relativa: admite prova em contrário. Imperatividade: o ato impõe obrigações sem depender da concordância do particular (nem todos os atos a têm). Autoexecutoriedade: execução direta pela administração, sem ordem judicial, quando a lei permite ou em urgência, como a interdição de um estabelecimento.',
        'A cobrança de multa não paga depende de execução judicial: não é autoexecutória.');
      C('da-ato', 'Como se extinguem os atos administrativos?',
        'Por anulação (ilegalidade; feita pela administração ou pelo Judiciário, com efeitos retroativos), revogação (conveniência e oportunidade; só pela administração, efeitos para o futuro), cassação (o beneficiário descumpriu condições) e caducidade (lei nova tornou o ato incompatível).',
        'O direito de anular atos favoráveis ao destinatário decai em 5 anos, salvo má-fé (Lei 9.784/1999, art. 54). Atos vinculados e os que já geraram direito adquirido não podem ser revogados.',
        'O Judiciário anula atos ilegais, mas não revoga atos de outro Poder por conveniência.');
      C('da-ato', 'Quais são os poderes administrativos e o que é abuso de poder?',
        'Poderes: hierárquico, disciplinar, regulamentar e de polícia (além do vinculado e do discricionário). Abuso de poder tem duas espécies: excesso de poder (agir além da competência) e desvio de poder ou de finalidade (agir com fim diferente do previsto em lei).',
        'Hierárquico: ordenar, fiscalizar, avocar e delegar dentro da mesma pessoa. Disciplinar: punir servidores e quem tem vínculo especial com a administração. Regulamentar: editar decretos para a fiel execução das leis. Polícia: limitar direitos individuais em favor do interesse público (alvarás, fiscalização).',
        'Excesso = competência. Desvio = finalidade.');
      MC('da-ato', 'Um chefe remove um servidor de ofício para puni-lo, embora a lei preveja a remoção para atender à necessidade do serviço. Houve:',
        ['Desvio de finalidade', 'Excesso de poder', 'Ato vinculado regular', 'Exercício do poder regulamentar', 'Revogação'], 0,
        'A competência existia, mas foi usada para um fim diferente do previsto em lei.');
      CLZ('da-ato', 'A revogação de um ato administrativo ocorre por razões de conveniência e ___.',
        ['oportunidade', 'ilegalidade', 'competência', 'forma'], 0,
        'Ilegalidade leva à anulação; conveniência e oportunidade, à revogação.');

      T('da-agen', 'Agentes públicos e Lei 8.112/1990');
      C('da-agen', 'Quais as espécies de agentes públicos?',
        'Agentes políticos (chefes do Executivo, parlamentares, ministros), servidores públicos (estatutários, empregados públicos e temporários), militares e particulares em colaboração (jurados, mesários, concessionários).',
        'Cargo: conjunto de atribuições criado por lei, ocupado por estatutário. Emprego: vínculo contratual (CLT). Função: atribuição sem cargo (função de confiança e temporários). Cargo em comissão: livre nomeação e exoneração, para direção, chefia e assessoramento.',
        'Função de confiança: só para servidor efetivo. Cargo em comissão: qualquer pessoa, respeitado um percentual mínimo de efetivos.');
      C('da-agen', 'Quais as formas de provimento na Lei 8.112/1990?',
        'Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração e recondução.',
        'A nomeação é a única forma originária. Reintegração: retorno do servidor demitido quando a demissão é anulada. Recondução: retorno ao cargo anterior por inabilitação em estágio probatório ou reintegração do antigo ocupante. Reversão: retorno do aposentado. Aproveitamento: retorno do servidor em disponibilidade.',
        'Transferência e ascensão foram declaradas inconstitucionais (exigiriam concurso).');
      C('da-agen', 'Como funcionam a estabilidade e o estágio probatório?',
        'O servidor nomeado por concurso para cargo efetivo adquire estabilidade após 3 anos de efetivo exercício e aprovação em avaliação especial de desempenho (CF, art. 41).',
        'O estável só perde o cargo por sentença judicial transitada em julgado, por processo administrativo disciplinar com ampla defesa, por avaliação periódica de desempenho insuficiente (na forma de lei complementar) ou por excesso de despesa com pessoal. Extinto o cargo, o estável fica em disponibilidade com remuneração proporcional.',
        'A estabilidade (3 anos) é no SERVIÇO PÚBLICO; o estágio probatório avalia a aptidão para o CARGO.');
      C('da-agen', 'Quais as penalidades disciplinares da Lei 8.112/1990?',
        'Advertência, suspensão (até 90 dias), demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão e destituição de função comissionada (art. 127).',
        'Cabe demissão, por exemplo, por crime contra a administração, abandono de cargo (mais de 30 dias consecutivos), improbidade e corrupção. O processo disciplinar é conduzido por comissão de três servidores estáveis. A sindicância pode resultar em arquivamento, advertência ou suspensão de até 30 dias.',
        'A suspensão pode ser convertida em multa de 50% por dia de remuneração, com o servidor continuando a trabalhar.');
      MC('da-agen', 'Pela CF, o servidor nomeado por concurso para cargo efetivo adquire estabilidade após:',
        ['3 anos de efetivo exercício e avaliação especial de desempenho', '2 anos de exercício', '5 anos de exercício', 'A posse', 'A aprovação no concurso'], 0,
        'É a regra do art. 41 da CF, desde a EC 19/1998.');

      T('da-lic', 'Licitações e contratação direta (Lei 14.133/2021)');
      C('da-lic', 'Quais as modalidades de licitação na Lei 14.133/2021?',
        'Pregão, concorrência, concurso, leilão e diálogo competitivo.',
        'Pregão: bens e serviços comuns (menor preço ou maior desconto). Concorrência: bens e serviços especiais e obras e serviços de engenharia. Concurso: trabalho técnico, científico ou artístico, com prêmio. Leilão: venda de bens. Diálogo competitivo: contratações inovadoras, com diálogo com licitantes pré-selecionados. Tomada de preços e convite foram extintos.',
        'O registro de preços NÃO é modalidade: é procedimento auxiliar (item 23 de 2025, ERRADO).');
      C('da-lic', 'Quais os critérios de julgamento?',
        'Menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance (no leilão) e maior retorno econômico (art. 33).',
        'O maior retorno econômico é usado em contratos de eficiência, em que a remuneração depende da economia gerada. Técnica e preço vale para serviços em que a técnica pesa, como os serviços técnicos especializados de natureza intelectual.',
        'Critério de julgamento (o "tipo") não é modalidade.');
      C('da-lic', 'Qual a diferença entre dispensa e inexigibilidade?',
        'Inexigibilidade: a competição é inviável (rol exemplificativo do art. 74: fornecedor exclusivo, artista consagrado, serviços técnicos de notória especialização, credenciamento, imóvel com características únicas). Dispensa: a competição seria possível, mas a lei autoriza não licitar (rol taxativo do art. 75: baixo valor, emergência etc.).',
        'Na contratação direta, o processo deve ter justificativa de preço, razão da escolha do contratado, estimativa de despesa e demonstração de recursos orçamentários (art. 72).',
        'A justificativa de preço é obrigatória na contratação direta (item 24 de 2025, ERRADO por dizer "opcional").');
      C('da-lic', 'Quais as fases do procedimento licitatório?',
        'Preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, recursal e homologação (art. 17).',
        'Em regra, o julgamento vem antes da habilitação (só se confere a documentação do vencedor), mas a ordem pode ser invertida por ato motivado. A fase recursal é única. Alguns princípios: legalidade, impessoalidade, moralidade, publicidade, eficiência, planejamento, transparência, competitividade, vinculação ao edital e julgamento objetivo (art. 5º).',
        'Na Lei 14.133, a regra é julgar primeiro e habilitar depois.');
      MC('da-lic', 'Na Lei 14.133/2021, a contratação de artista consagrado pela crítica é hipótese de:',
        ['Inexigibilidade de licitação', 'Dispensa de licitação', 'Pregão', 'Leilão', 'Diálogo competitivo'], 0,
        'Não há como comparar objetivamente artistas: a competição é inviável.');
      ORD('da-lic', 'Ordene as fases da licitação na Lei 14.133/2021 (regra geral).',
        ['Preparatória', 'Divulgação do edital', 'Propostas e lances', 'Julgamento', 'Habilitação', 'Recursal', 'Homologação'],
        'Na regra da nova lei, o julgamento vem antes da habilitação.');

      T('da-resp', 'Responsabilidade civil e controle da administração');
      C('da-resp', 'Como é a responsabilidade civil do Estado na CF?',
