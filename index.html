        'Objetiva, na modalidade risco administrativo: as pessoas jurídicas de direito público e as de direito privado prestadoras de serviço público respondem pelos danos que seus agentes causarem a terceiros, independentemente de dolo ou culpa (art. 37, §6º).',
        'Basta provar conduta, dano e nexo causal. O Estado tem direito de regresso contra o agente que agiu com dolo ou culpa. O STF fixou que a vítima deve processar o Estado, não diretamente o agente (Tema 940).',
        'O Estado responde objetivamente; o agente responde em ação de regresso, se agiu com dolo ou culpa.');
      C('da-resp', 'E nos casos de omissão do Estado?',
        'Em regra, aplica-se a responsabilidade subjetiva, pela culpa do serviço (o serviço não funcionou, funcionou mal ou atrasou). O STF admite responsabilidade objetiva quando havia um dever específico de agir, como na morte de preso sob custódia.',
        'Na custódia, o Estado assume o dever de proteger o preso e responde por sua morte se esse dever foi descumprido (STF, Tema 592). Uma omissão genérica, como não impedir todos os crimes de uma cidade, não gera indenização automática.',
        'Morte de detento sob custódia: o Estado responde (dever específico de proteção).');
      C('da-resp', 'Quais as excludentes e atenuantes da responsabilidade do Estado?',
        'Excludentes: culpa exclusiva da vítima, caso fortuito ou força maior e fato exclusivo de terceiro, porque rompem o nexo causal. Atenuante: culpa concorrente da vítima, que reduz a indenização.',
        'A teoria do risco administrativo admite excludentes; a do risco integral não, e é aplicada só em casos excepcionais, como dano nuclear e ambiental. Força maior que o Estado poderia ter evitado não exclui a responsabilidade.',
        'Risco administrativo admite excludentes; risco integral, não.');
      C('da-resp', 'Como é feito o controle da Administração Pública?',
        'Internamente (autotutela, hierarquia, controle interno), externamente pelo Legislativo (com auxílio do Tribunal de Contas) e pelo Judiciário (controle de legalidade, não de mérito).',
        'Pela autotutela, a administração anula seus atos ilegais e revoga os inconvenientes (Súmula 473 do STF). O Judiciário só age quando provocado e controla a legalidade, incluindo razoabilidade e proporcionalidade, sem substituir o mérito. O TCU julga contas e aplica sanções; o Congresso pode sustar atos normativos que excedam o poder regulamentar.',
        'O Judiciário não revoga ato administrativo de outro Poder por conveniência.');
      MC('da-resp', 'Na responsabilidade objetiva do Estado (risco administrativo), a vítima precisa provar:',
        ['Conduta, dano e nexo causal', 'Dolo do agente', 'Culpa do agente', 'Apenas o dano', 'Que o agente foi condenado criminalmente'], 0,
        'Não é preciso provar dolo ou culpa do agente.');

      /* ---------- Direito Constitucional ---------- */
      T('dc-dir', 'Direitos e garantias fundamentais');
      C('dc-dir', 'Quais as principais garantias individuais do art. 5º?',
        'Igualdade, legalidade, inviolabilidade do domicílio, sigilo das comunicações, liberdade de expressão (vedado o anonimato), devido processo legal, contraditório e ampla defesa, presunção de inocência, juiz natural e inadmissibilidade das provas ilícitas.',
        'A casa é asilo inviolável: sem consentimento, só em flagrante, desastre, socorro ou, durante o dia, por ordem judicial (inciso XI). O sigilo telefônico só pode ser quebrado por ordem judicial, para investigação criminal ou instrução processual penal (XII). Não haverá penas de morte (salvo guerra declarada), de caráter perpétuo, de trabalhos forçados, de banimento ou cruéis (XLVII).',
        'A pena de morte tem uma ÚNICA exceção: guerra declarada (item 27 de 2025, CERTO).');
      C('dc-dir', 'Quais são os remédios constitucionais?',
        'Habeas corpus (liberdade de locomoção), habeas data (informações pessoais em bancos de dados), mandado de segurança (direito líquido e certo não amparado por HC ou HD), mandado de injunção (falta de norma que torne inviável o exercício de direito) e ação popular (anular ato lesivo ao patrimônio público, à moralidade ou ao meio ambiente).',
        'Habeas corpus e habeas data são gratuitos. A ação popular só pode ser proposta por cidadão (eleitor), isento de custas salvo má-fé. O mandado de segurança coletivo pode ser impetrado por partido com representação no Congresso, sindicato, entidade de classe ou associação.',
        'Ação popular: o legitimado é o CIDADÃO (eleitor), não qualquer pessoa.');
      C('dc-dir', 'Quais são os direitos sociais?',
        'Educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados (art. 6º).',
        'São direitos de segunda dimensão, que exigem prestações do Estado; são limitados pela reserva do possível, mas protegidos pelo mínimo existencial e pela vedação do retrocesso. Os direitos dos trabalhadores estão no art. 7º.',
        'O transporte foi incluído como direito social pela EC 90/2015.');
      C('dc-dir', 'Quais as características dos direitos fundamentais?',
        'Historicidade, universalidade, inalienabilidade, imprescritibilidade, irrenunciabilidade, relatividade (admitem ponderação) e aplicabilidade imediata (art. 5º, §1º).',
        'Os direitos e garantias individuais são cláusulas pétreas (art. 60, §4º, IV): não podem ser abolidos por emenda. Valem também entre particulares (eficácia horizontal). Estrangeiros residentes e não residentes também são protegidos.',
        'Direitos fundamentais são RELATIVOS; a doutrina aponta como exceção a proibição da tortura.');
      MC('dc-dir', 'O remédio constitucional para conhecer ou retificar informações pessoais em bancos de dados públicos é:',
        ['Habeas data', 'Habeas corpus', 'Mandado de injunção', 'Ação popular', 'Mandado de segurança coletivo'], 0,
        'O habeas data protege o acesso e a retificação de dados pessoais (art. 5º, LXXII).');

      T('dc-nac', 'Nacionalidade, direitos políticos e partidos');
      C('dc-nac', 'Quem são os brasileiros natos?',
        'Os nascidos no Brasil, ainda que de pais estrangeiros (desde que estes não estejam a serviço de seu país); os nascidos no exterior de pai ou mãe brasileiros a serviço do Brasil; e os nascidos no exterior de pai ou mãe brasileiros registrados em repartição brasileira ou que venham residir no Brasil e optem, após a maioridade, pela nacionalidade brasileira (art. 12, I).',
        'Naturalizados adquirem a nacionalidade na forma da lei. Originários de países de língua portuguesa precisam só de 1 ano de residência ininterrupta e idoneidade moral; os demais estrangeiros, de 15 anos de residência ininterrupta e ausência de condenação penal, desde que requeiram (art. 12, II).',
        'A lei não pode distinguir natos e naturalizados, salvo nos casos previstos na própria CF.');
      C('dc-nac', 'Quais cargos são privativos de brasileiro nato?',
        'Presidente e Vice-Presidente da República, Presidente da Câmara, Presidente do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa (art. 12, §3º).',
        'Também só natos ocupam as vagas de cidadãos no Conselho da República. O naturalizado pode ter a naturalização cancelada por sentença judicial em caso de fraude no processo de naturalização ou de atentado contra a ordem constitucional e o Estado Democrático (redação da EC 131/2023).',
        'Ministro do STJ não precisa ser nato; Ministro do STF, sim.');
      C('dc-nac', 'Como funcionam os direitos políticos?',
        'Alistamento e voto são obrigatórios para maiores de 18 anos e facultativos para analfabetos, maiores de 70 anos e jovens de 16 e 17 anos. Não podem se alistar os estrangeiros e os conscritos durante o serviço militar obrigatório.',
        'Idades mínimas para concorrer: 35 anos (Presidente, Vice e Senador), 30 (Governador e Vice), 21 (Deputado, Prefeito, Vice-Prefeito e juiz de paz) e 18 (Vereador). Inalistáveis e analfabetos são inelegíveis. É proibida a cassação de direitos políticos; perda e suspensão só nos casos do art. 15.',
        'O analfabeto pode votar, mas não pode ser votado.');
      C('dc-nac', 'Como a CF trata os partidos políticos?',
        'É livre a criação, fusão, incorporação e extinção de partidos, resguardados a soberania, o regime democrático, o pluripartidarismo e os direitos fundamentais. Os partidos adquirem personalidade jurídica na forma da lei civil e registram o estatuto no TSE (art. 17).',
        'Têm autonomia para definir sua estrutura interna. É proibido receber recursos de entidade ou governo estrangeiros e usar organização paramilitar. A EC 97/2017 proibiu coligações nas eleições proporcionais e criou cláusula de desempenho.',
        'Criar partido NÃO depende de autorização do Congresso (item 26 de 2025, ERRADO).');
      MC('dc-nac', 'É cargo privativo de brasileiro nato:',
        ['Ministro do Supremo Tribunal Federal', 'Ministro do Superior Tribunal de Justiça', 'Senador da República', 'Governador de Estado', 'Deputado Federal'], 0,
        'Os cargos privativos de nato estão no art. 12, §3º, da CF; STJ, Senado, governos e Câmara (exceto a presidência) não estão na lista.');

      T('dc-exe', 'Poder Executivo e segurança pública');
      C('dc-exe', 'Quais a forma e o sistema de governo do Brasil?',
        'Forma de governo: república. Sistema de governo: presidencialismo. Forma de Estado: federação. Regime: democrático.',
        'No presidencialismo, o Presidente acumula as funções de chefe de Estado (representa o país) e de chefe de governo (dirige a administração). O plebiscito de 1993 manteve a república presidencialista. O mandato é de 4 anos, com uma reeleição.',
        'Item 28 de 2025 ("exclusivamente chefe de Estado") está ERRADO.');
      C('dc-exe', 'Quais os órgãos de segurança pública (art. 144)?',
        'Polícia Federal, Polícia Rodoviária Federal, Polícia Ferroviária Federal, polícias civis, polícias militares e corpos de bombeiros militares e polícias penais federal, estaduais e distrital.',
        'A segurança pública é dever do Estado, direito e responsabilidade de todos. Polícias civis: polícia judiciária e apuração de infrações (exceto as militares e as da União), dirigidas por delegados de carreira. PMs: polícia ostensiva e preservação da ordem. Bombeiros: defesa civil, além do previsto em lei. Polícias penais (EC 104/2019): segurança dos estabelecimentos penais.',
        'Bombeiros executam atividades de defesa civil (item 25 de 2025, CERTO).');
      C('dc-exe', 'Quais as atribuições da Polícia Federal (art. 144, §1º)?',
        'Apurar infrações contra a ordem política e social ou em detrimento de bens, serviços e interesses da União, e outras com repercussão interestadual ou internacional que exijam repressão uniforme; prevenir e reprimir o tráfico de drogas, o contrabando e o descaminho; exercer as funções de polícia marítima, aeroportuária e de fronteiras; e exercer, com exclusividade, a polícia judiciária da União.',
        'A PF é órgão permanente, organizado e mantido pela União e estruturado em carreira. A perícia criminal federal faz parte da PF.',
        'Polícia judiciária da UNIÃO é exclusividade da PF.');
      C('dc-exe', 'Quais atribuições privativas do Presidente são mais cobradas?',
        'Nomear e exonerar Ministros, exercer a direção superior da administração federal, sancionar, promulgar e publicar leis, expedir decretos e regulamentos, vetar projetos, manter relações com Estados estrangeiros, celebrar tratados (sujeitos ao Congresso), decretar estado de defesa e de sítio e comandar as Forças Armadas (art. 84).',
        'O Presidente pode delegar a Ministros, ao Procurador-Geral da República ou ao Advogado-Geral da União, entre outras, a organização da administração por decreto e o provimento e a extinção de cargos. Crimes de responsabilidade: julgados pelo Senado, depois de autorização de 2/3 da Câmara; crimes comuns: pelo STF.',
        'Decreto autônomo (art. 84, VI) só para organizar a administração sem aumentar despesa e para extinguir cargos vagos.');
      MC('dc-exe', 'Exercer com exclusividade as funções de polícia judiciária da União é atribuição da:',
        ['Polícia Federal', 'Polícia Rodoviária Federal', 'Polícia Civil dos estados', 'Polícia Penal Federal', 'Força Nacional'], 0,
        'É a regra do art. 144, §1º, IV, da CF.');

      T('dc-soc', 'Ordem social');
      C('dc-soc', 'Qual a base e qual o objetivo da ordem social?',
        'A base é o primado do trabalho, e o objetivo é o bem-estar e a justiça sociais (art. 193).',
        'A ordem social abrange seguridade social, educação, cultura e desporto, ciência e tecnologia, comunicação social, meio ambiente, família, criança, adolescente, jovem e idoso, e indígenas.',
        'BASE = trabalho; OBJETIVO = bem-estar e justiça sociais.');
      C('dc-soc', 'O que compõe a seguridade social?',
        'Saúde, previdência social e assistência social (art. 194).',
        'Saúde: direito de todos e dever do Estado, com acesso universal e igualitário (SUS). Previdência: contributiva e de filiação obrigatória. Assistência social: prestada a quem dela precisar, independentemente de contribuição, como o benefício de um salário mínimo ao idoso e à pessoa com deficiência sem meios de se manter.',
        'Previdência exige contribuição; saúde e assistência, não.');
      C('dc-soc', 'O que diz a CF sobre o meio ambiente?',
        'Todos têm direito ao meio ambiente ecologicamente equilibrado, bem de uso comum do povo, cabendo ao Poder Público e à coletividade defendê-lo e preservá-lo para as presentes e futuras gerações (art. 225).',
        'Condutas lesivas sujeitam pessoas físicas ou jurídicas a sanções penais e administrativas, independentemente da obrigação de reparar o dano; por isso a pessoa jurídica pode responder por crime ambiental. Floresta Amazônica, Mata Atlântica, Serra do Mar, Pantanal e Zona Costeira são patrimônio nacional.',
        'Pessoa jurídica pode responder penalmente por crime ambiental.');
      C('dc-soc', 'O que diz a CF sobre família, criança, idoso e indígenas?',
        'Crianças, adolescentes e jovens têm prioridade absoluta (art. 227). Idosos têm amparo da família, da sociedade e do Estado, e os maiores de 65 anos têm transporte coletivo urbano gratuito (art. 230). Aos indígenas são reconhecidos organização social, costumes, línguas e direitos originários sobre as terras que tradicionalmente ocupam (art. 231).',
        'As terras indígenas são bens da União, inalienáveis e indisponíveis; os indígenas têm posse permanente e usufruto exclusivo das riquezas do solo, dos rios e dos lagos. Explorar recursos hídricos e minerais nessas terras depende de autorização do Congresso, ouvidas as comunidades. A família tem especial proteção do Estado.',
        'Terra indígena é propriedade da União, com posse permanente dos indígenas.');
      MC('dc-soc', 'Segundo a CF, a seguridade social compreende:',
        ['Saúde, previdência social e assistência social', 'Saúde, educação e previdência', 'Previdência, trabalho e moradia', 'Assistência social, cultura e lazer', 'Saúde e segurança pública'], 0,
        'É o tripé do art. 194 da CF.');

      return { topics:topics, cards:cards, questions:questions };
    })();

    // Itens da prova 2025 associados aos tópicos (aparecem no teste do tópico correspondente).
    var QTOPIC = {

    // Cards antigos de qualidade (ISO 17025) entram no tópico de acreditação.

    // Tipo de interação de uma questão: mc (múltipla escolha), ce (certo/errado), cloze (completar), order (ordenar).
    function qtype(q){
      if(q.type) return q.type;
      return (q.options && q.options.length === 2 && q.options[0] === 'Certo' && q.options[1] === 'Errado') ? 'ce' : 'mc';

    // Conteúdo embutido no app (usado para preencher a planilha na primeira vez).
    var BUILTIN = { syllabus: SEED.syllabus.slice(), flashcards: SEED.flashcards.slice(), questions: SEED.questions.slice(), topics: TOPICS.slice() };

    /* ===== Banco de dados no Google Planilhas (Apps Script) =====
       Conteúdo: lido da planilha e guardado em cache local (funciona offline com a última cópia).

    var Cloud = (function(){
      var CFG_KEY = 'reels_sheet_cfg', CACHE_KEY = 'reels_sheet_content';

      var TIPO_OUT = { mc:'multipla', ce:'certo_errado', cloze:'lacuna', order:'ordenar' };

      var pushTimer = null, pushing = false, suspended = false;

      function readLS(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }

      function setCfg(patch){ var c = Object.assign(cfg(), patch); writeLS(CFG_KEY, c); return c; }
      function enabled(){ return !!cfg().url; }
      function canSync(){ var c = cfg(); return !!(c.url && c.token); }

      function request(method, params, body){
        var c = cfg();
        if(!c.url) return Promise.reject(new Error('Planilha não configurada.'));
        var url = c.url;
        if(params){
          url += (url.indexOf('?') < 0 ? '?' : '&') + Object.keys(params).map(function(k){
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);

          if(!r.ok) throw new Error('A planilha respondeu com erro ' + r.status + '.');
          return r.json();

      /* ---- Conversão planilha ↔ app ---- */
      function split(s){ return String(s || '').split('|').map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }
      function fromSheet(raw){
        var syllabus = (raw.materias || []).map(function(m){
          return { id:String(m.id).trim(), name:m.nome || m.id, parentId:null, weight:Number(m.peso) || 1, order:Number(m.ordem) || 99, discipline:m.grupo || 'Outros' };
        });
        var ids = {}; syllabus.forEach(function(n){ ids[n.id] = true; });
        var topics = (raw.topicos || []).filter(function(t){ return ids[t.materia]; }).map(function(t){
          return { id:String(t.id).trim(), node:String(t.materia).trim(), name:t.nome || t.id };
        });
        var ignored = 0;
        var flashcards = [];
        (raw.cards || []).forEach(function(c){
          if(!ids[c.materia] || !c.frente || !c.resposta){ ignored++; return; }
          var o = { id:String(c.id).trim(), syllabusId:String(c.materia).trim(), front:c.frente, back:c.resposta };
          if(c.topico) o.topic = String(c.topico).trim();
          if(c.aprofunde) o.more = c.aprofunde;
          if(c.pegadinha) o.tip = c.pegadinha;
          flashcards.push(o);
        });
        var questions = [];
        (raw.questoes || []).forEach(function(q){
          var type = TIPO_IN[String(q.tipo || '').trim().toLowerCase()] || 'mc';
          var o = { id:String(q.id).trim(), syllabusId:String(q.materia).trim(), stem:q.enunciado, explanation:q.explicacao || '' };
          if(q.topico) o.topic = String(q.topico).trim();
          if(q.fonte) o.source = q.fonte;
          var g = String(q.gabarito || '').trim().toUpperCase();
          if(type === 'order'){
            o.type = 'order'; o.items = split(q.alternativas);
            if(o.items.length < 2){ ignored++; return; }
          }else if(type === 'ce'){
            o.options = ['Certo', 'Errado'];
            o.answer = (g === 'C' || g === 'CERTO') ? 0 : (g === 'E' || g === 'ERRADO') ? 1 : -1;
          }else{
            if(type === 'cloze') o.type = 'cloze';
            o.options = split(q.alternativas);
            o.answer = LETRAS.indexOf(g.charAt(0));
          }
          if(!ids[o.syllabusId] || !o.stem || (o.options && !(o.answer >= 0 && o.answer < o.options.length))){ ignored++; return; }
          questions.push(o);
        });
        return { syllabus:syllabus, topics:topics, flashcards:flashcards, questions:questions, ignored:ignored };
      }
      function toSheet(src){
        return {
          materias: src.syllabus.map(function(n){ return { id:n.id, nome:n.name, peso:n.weight, ordem:n.order, grupo:n.discipline }; }),
          topicos: src.topics.map(function(t){ return { id:t.id, materia:t.node, nome:t.name }; }),
          cards: src.flashcards.map(function(c){ return { id:c.id, materia:c.syllabusId, topico:c.topic || '', frente:c.front, resposta:c.back, aprofunde:c.more || '', pegadinha:c.tip || '' }; }),

              alternativas: t === 'order' ? q.items.join(' | ') : t === 'ce' ? '' : q.options.join(' | '),
              gabarito: t === 'order' ? '' : t === 'ce' ? (q.answer === 0 ? 'C' : 'E') : LETRAS.charAt(q.answer),

      function refreshContent(){
        return request('GET', { action:'content', t:Date.now() }).then(function(raw){

          if(changed) writeLS(CACHE_KEY, { raw:raw, at:Date.now() });
          setCfg({ lastContentAt:Date.now(), contentNote: applied.flashcards.length + ' cards e ' + applied.questions.length + ' perguntas' + (applied.ignored ? ' (' + applied.ignored + ' linhas ignoradas por erro de preenchimento)' : ''), lastError:'' });

      /* ---- Progresso ---- */

          .catch(function(e){ setCfg({ pending:true, lastError:e.message }); return false; })

      }
      function pullProgress(){
        if(!canSync()) return Promise.resolve('off');
        return request('GET', { action:'progress', token:cfg().token, t:Date.now() }).then(function(res){
          var local = Store.get();
          var localAt = local.updatedAt || 0;

            setCfg({ lastPullAt:Date.now(), lastError:'' });

        });

        return request('POST', null, { action:'seedContent', overwrite:!!overwrite, content:toSheet(BUILTIN) });
      }
      function test(){ return request('GET', { action:'ping', token:cfg().token, t:Date.now() }); }
      function disconnect(){ try{ localStorage.removeItem(CFG_KEY); localStorage.removeItem(CACHE_KEY); }catch(e){} }

      return { cfg:cfg, setCfg:setCfg, enabled:enabled, canSync:canSync, applyCached:applyCached, refreshContent:refreshContent,
        pullProgress:pullProgress, pushNow:pushNow, schedulePush:schedulePush, seed:seed, test:test, disconnect:disconnect,
        isSuspended:function(){ return suspended; } };
    })();

    var Persistence = (function(){
      var KEY = 'reels_concurso_v1';
      var backend = 'memory';
      var mem = null;

      function probe(storage){
        try{
          var k = '__probe__';
          storage.setItem(k, '1');
          var ok = storage.getItem(k) === '1';
          storage.removeItem(k);
          return ok;
        }catch(e){ return false; }
      }
      function init(){
        if(typeof localStorage !== 'undefined' && probe(localStorage)) backend = 'localStorage';
        else if(typeof sessionStorage !== 'undefined' && probe(sessionStorage)) backend = 'sessionStorage';
        else backend = 'memory';
        return backend;
      }
      var isPersistent = function(){ return backend !== 'memory'; };
      function exportJson(){
        var data = Persistence.load();
        return { data: data, persistent: isPersistent() };
      }
      function importJson(obj){
        var version = (obj && obj.version) ? Number(obj.version) : null;
        if(version !== 1 && version !== null) return false;
        Persistence.save(obj);
        return true;
      }
      function store(){
        if(backend === 'localStorage') return localStorage;
        if(backend === 'sessionStorage') return sessionStorage;
        return null;
      }
      function save(obj){
        var s = store();
        if(!s){ mem = obj; return false; }
        try{ s.setItem(KEY, JSON.stringify(obj)); return true; }
        catch(e){ mem = obj; return false; }
      }
      function load(){
        var s = store();
        if(!s) return mem;
        try{
          var raw = s.getItem(KEY);
          return raw ? JSON.parse(raw) : null;
        }catch(e){ return null; }
      }
      return {
        init: init, save: save, load: load,
        backend: function(){ return backend; },
        isPersistent: function(){ return backend !== 'memory'; }
      };
    })();

    var Store = (function(){
      var state = null;
      var listeners = [];
      var persist = U.debounce(function(){ Persistence.save(state); }, 150);

      function defaults(){
        return {
          version: 1,
          profile: { name:'', examDate:null, dailyGoalMinutes:120, weekdayOnly:[1,2,3,4,5,6], startDate:null },
          syllabus: [], runs: [], cards: {}, progress: {}, weakItems: {},
          content: { flashcards: [], questions: [] },
          activeRun: null,
          streak: { current:0, longest:0, lastStudyDate:null },
          settings: { sound:true, theme:'dark', fontSize:16, questionCountPerBlock:4, passThreshold:60 }
        };
      }
      function migrate(saved){
        var base = defaults();
        if(!saved || typeof saved !== 'object') return base;
        var out = Object.assign(base, saved);
        out.profile = Object.assign(defaults().profile, saved.profile || {});
        out.streak = Object.assign(defaults().streak, saved.streak || {});
        out.settings = Object.assign(defaults().settings, saved.settings || {});
        out.content = Object.assign(defaults().content, saved.content || {});

      function get(){ return state; }
      function emit(){

        });
      }

      // Alterações automáticas (inicialização, sincronização) não contam como "editado agora".
      function quietly(fn){ quiet = true; try{ fn(); }finally{ quiet = false; } }

      function update(fn){ fn(state); touch(); emit(); persist(); }

        listeners.push(fn);
        return function(){
          var i = listeners.indexOf(fn);
          if(i >= 0) listeners.splice(i,1);
        };
      }

    })();

    var Data = (function(){
      function state(){ return Store.get(); }
      function allFlashcards(){ return SEED.flashcards.concat(state().content.flashcards || []); }
      function allQuestions(){ return SEED.questions.concat(state().content.questions || []); }
      function countFlashcards(sid){
        var n = 0;
        allFlashcards().forEach(function(c){ if(c.syllabusId === sid) n++; });
        return n;
      }
      function countQuestions(sid){
        var n = 0;
        allQuestions().forEach(function(q){ if(q.syllabusId === sid) n++; });
        return n;

      function progressPct(sid){
        var p = state().progress[sid];
        if(!p || !p.total) return 0;
        return Math.round((p.correct / p.total) * 100);
      }
      function node(id){
        var arr = state().syllabus || [];
        for(var i=0;i<arr.length;i++){ if(arr[i].id === id) return arr[i]; }

        var today = U.todayStr();

        (state().runs || []).forEach(function(r){
          if(r.endedAt && U.todayStr(new Date(r.endedAt)) === today){
            total += Math.max(0, (r.endedAt - r.startedAt) / 60000);
          }
        });
        return Math.round(total);
      }
      function validateContent(obj){
        var errors = [];
        var sylIds = {};
        (state().syllabus || []).forEach(function(n){ sylIds[n.id] = true; });
        if(obj && obj.syllabus){
          if(!Array.isArray(obj.syllabus)) errors.push('"syllabus" deve ser uma lista.');
          else obj.syllabus.forEach(function(n, i){
            if(!n || !n.id || !n.name) errors.push('syllabus[' + i + '] sem "id" ou "name".');
            else sylIds[n.id] = true;
          });
        }
        if(obj && obj.flashcards){
          if(!Array.isArray(obj.flashcards)) errors.push('"flashcards" deve ser uma lista.');
          else obj.flashcards.forEach(function(c, i){
            if(!c || !c.id || !c.front || !c.back) errors.push('flashcards[' + i + '] precisa de id, front e back.');
            else if(!sylIds[c.syllabusId]) errors.push('flashcards[' + i + '] usa syllabusId inexistente: ' + c.syllabusId);
          });
        }
        if(obj && obj.questions){
          if(!Array.isArray(obj.questions)) errors.push('"questions" deve ser uma lista.');
          else obj.questions.forEach(function(q, i){
            if(!q || !q.id || !q.stem) errors.push('questions[' + i + '] precisa de id e stem.');
            else if(!Array.isArray(q.options) || q.options.length < 2) errors.push('questions[' + i + '] precisa de ao menos 2 opções.');
            else if(typeof q.answer !== 'number' || q.answer < 0 || q.answer >= q.options.length) errors.push('questions[' + i + '] tem answer inválido.');
            else if(!sylIds[q.syllabusId]) errors.push('questions[' + i + '] usa syllabusId inexistente: ' + q.syllabusId);
          });
        }
        if(!obj || (!obj.syllabus && !obj.flashcards && !obj.questions)){
          errors.push('O JSON precisa conter "syllabus", "flashcards" ou "questions".');
        }

      function importContent(obj){
        var errors = validateContent(obj);
        var added = { syllabus:0, flashcards:0, questions:0 };
        if(errors.length) return { ok:false, errors:errors, added:added };
        Store.update(function(s){
          if(obj.syllabus){
            var haveS = {};
            s.syllabus.forEach(function(n){ haveS[n.id] = true; });
            obj.syllabus.forEach(function(n){ if(!haveS[n.id]){ s.syllabus.push(n); haveS[n.id] = true; added.syllabus++; } });
          }
          if(obj.flashcards){
            var haveF = {};
            s.content.flashcards.forEach(function(c){ haveF[c.id] = true; });
            obj.flashcards.forEach(function(c){ if(!haveF[c.id]){ s.content.flashcards.push(c); haveF[c.id] = true; added.flashcards++; } });
          }
          if(obj.questions){
            var haveQ = {};
            s.content.questions.forEach(function(q){ haveQ[q.id] = true; });
            obj.questions.forEach(function(q){ if(!haveQ[q.id]){ s.content.questions.push(q); haveQ[q.id] = true; added.questions++; } });
          }
        });
        return { ok:true, errors:[], added:added };

        allFlashcards: allFlashcards, allQuestions: allQuestions,
        countFlashcards: countFlashcards, countQuestions: countQuestions,
        progressPct: progressPct, node: node, minutesToday: minutesToday, validateContent: validateContent, importContent: importContent
      };
    })();

    var Planner = (function(){
      function totalItems(){ return Data.allFlashcards().length + Data.allQuestions().length; }
      function studiedItems(){

        return t;

      function runsPerDay(){
        var s = Store.get();

      function schedule(){
        var s = Store.get();
        var exam = U.parseDate(s.profile.examDate);
        var start = U.parseDate(s.profile.startDate) || U.parseDate(U.todayStr());
        var now = new Date();
        if(!exam) return { configured:false };
        var totalDays = Math.max(1, Math.round((exam - start) / 86400000));
        var elapsedDays = Math.max(0, Math.round((now - start) / 86400000));
        var remainDays = Math.max(0, Math.round((exam - now) / 86400000));
        var total = totalItems();
        var studied = studiedItems();
        var weeksRemain = Math.max(0.1, remainDays / 7);
        var requiredPerWeek = Math.ceil(total / weeksRemain);
        var elapsedFrac = Math.min(1, elapsedDays / totalDays);
        var expected = Math.round(total * elapsedFrac);
        var behind = studied < expected * 0.85;
        return {

          totalDays:totalDays, elapsedDays:elapsedDays, remainDays:remainDays,
          total:total, studied:studied, weeksRemain:weeksRemain,
          requiredPerWeek:requiredPerWeek, expected:expected, behind:behind,
          progressPct: total ? Math.min(100, Math.round((studied / total) * 100)) : 0
        };
      }
      function disciplinePlan(){
        var s = Store.get();
        var sch = schedule();
        if(!sch.configured) return [];
        var nodes = s.syllabus.slice().sort(function(a,b){ return (a.order || 0) - (b.order || 0); });
        var totalWeight = nodes.reduce(function(a,n){ return a + (n.weight || 1); }, 0) || 1;
        var cum = 0;
        return nodes.map(function(n){
          cum += (n.weight || 1);
          var frac = cum / totalWeight;
          var target = U.addDays(sch.start, Math.round(sch.totalDays * frac));
          var p = s.progress[n.id] || { seen:0 };
          var count = Data.countFlashcards(n.id) + Data.countQuestions(n.id);
          var studied = p.seen || 0;

    var Scheduler = (function(){
      function nodeScore(node, counts, lastId){
        var s = Store.get();
        var w = s.weakItems && s.weakItems[node.id];
        var weakScore = (w && w.kind === 'node') ? (w.score || 0) : 0;
        var p = s.progress[node.id] || { seen:0 };
        var seen = p.seen || 0;
        var count = counts[node.id] || 0;
        var coverage = count ? Math.min(1, seen / count) : 0;
        var priority = 1 - coverage;
        var due = 0;
        var c = (s.cards || {})[node.id];
        if(c && c.dueAt){ due = Math.max(0, (Date.now() - c.dueAt) / 86400000); }
        var delay = seen === 0 ? 3 : 0;
        var score = (node.weight || 1) * (1 + weakScore * 2 + due * 0.5 + priority + delay * 0.2);
        if(node.id === lastId) score = 0;
        return score;
      }
      function choose(rng, counts, lastId, minCards){
        var s = Store.get();
        var eligible = s.syllabus.filter(function(n){ return (counts[n.id] || 0) > 0; });
        var strong = eligible.filter(function(n){ return (counts[n.id] || 0) >= (minCards || 0); });
        var base = strong.length ? strong : eligible;
        var pool = base.filter(function(n){ return n.id !== lastId; });
        if(!pool.length) pool = base;
        if(!pool.length) return null;
        var scored = pool.map(function(n){ return { node:n, score: Math.max(0.0001, nodeScore(n, counts, lastId)) }; });
        var total = scored.reduce(function(a,x){ return a + x.score; }, 0);
        var r = rng() * total;
        for(var i=0;i<scored.length;i++){ r -= scored[i].score; if(r <= 0) return scored[i].node; }
        return scored[scored.length-1].node;
      }
      return { choose:choose, nodeScore:nodeScore };
    })();

    var Reviewer = (function(){
      function computeAndStore(run){
        var threshold = Store.get().settings.passThreshold || 60;
        var byNode = {}, byQuestion = {};
        (run.answers || []).forEach(function(a){
          if(!byNode[a.syllabusId]) byNode[a.syllabusId] = { total:0, correct:0 };
          byNode[a.syllabusId].total++;
          if(a.correct) byNode[a.syllabusId].correct++;
          if(a.kind === 'question'){
            if(!byQuestion[a.refId]) byQuestion[a.refId] = { total:0, correct:0, syllabusId:a.syllabusId };
            byQuestion[a.refId].total++;
            if(a.correct) byQuestion[a.refId].correct++;
          }
        });

        Store.update(function(st){
          var w = st.weakItems || (st.weakItems = {});
          Object.keys(byNode).forEach(function(id){
            var d = byNode[id];
            var acc = d.total ? d.correct / d.total : 1;
            var node = Data.node(id);
            var weight = node ? (node.weight || 1) : 1;
            var p = st.progress[id] || { seen:0, correct:0, total:0, streak:0 };
            p.seen += d.total;
            p.correct += d.correct;
            p.total += d.total;
            st.progress[id] = p;
            if(acc * 100 < threshold){
              var prev = (w[id] && w[id].kind === 'node') ? w[id] : { score:0, reviews:0 };
              w[id] = {
                score: (1 - acc) + (prev.score || 0) * 0.5 + weight * 0.05,
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'node',
                ttl: 3
              };
            }else if(w[id] && w[id].kind === 'node'){
              w[id].score = Math.max(0, (w[id].score || 0) * 0.6);
              if(w[id].score < 0.05) delete w[id];
            }
          });
          Object.keys(byQuestion).forEach(function(qid){
            var d = byQuestion[qid];
            var prev = (w[qid] && w[qid].kind === 'question') ? w[qid] : { score:0, reviews:0 };
            if(d.correct < d.total){
              w[qid] = {
                score: (prev.score || 0) + (d.total - d.correct),
                lastSeenAt: Date.now(),
                reviews: (prev.reviews || 0) + 1,
                kind: 'question',
                ttl: 3,
                syllabusId: d.syllabusId
              };
            }else if(w[qid] && w[qid].kind === 'question'){
              w[qid].score = Math.max(0, (w[qid].score || 0) - 1);
              if(w[qid].score <= 0) delete w[qid];
            }
          });
        });
      }
      return { computeAndStore: computeAndStore };
    })();

    var Audio = (function(){
      var ctx = null;
      function ensure(){
        if(ctx) return ctx;
        try{
          var AC = window.AudioContext || window.webkitAudioContext;
          if(AC) ctx = new AC();
        }catch(e){ ctx = null; }
        return ctx;
      }
      function beep(freq, dur, type){
        if(!Store.get().settings.sound) return;
        var c = ensure();
        if(!c) return;
        try{
          var o = c.createOscillator(), g = c.createGain();
          o.type = type || 'sine';
          o.frequency.value = freq;
          o.connect(g); g.connect(c.destination);
          var t = c.currentTime;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.start(t); o.stop(t + dur + 0.03);
        }catch(e){}
      }
      return { correct: function(){ beep(880, 0.12, 'sine'); } };
    })();

    var Engine = (function(){
      var P = { warmupCards:4, mainCards:8, blockSize:4, reinforceCards:4, reinforceQuestions:4, topicsPerRun:2, cardsPerTopic:5 };

      function shuffle(arr, rng){
        var a = arr.slice();
        for(var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
        return a;
      }
      function byNode(items, nodeId){ return items.filter(function(x){ return x.syllabusId === nodeId; }); }
      function chooseMain(rng, counts){
        var s = Store.get();
        var lastId = s.runs.length ? (s.runs[s.runs.length-1].mainSyllabusId || null) : null;
        return Scheduler.choose(rng, counts, lastId, P.blockSize);
      }
      function weakNodeIds(){
        var w = Store.get().weakItems || {};
        return Object.keys(w).filter(function(id){ return w[id] && w[id].kind === 'node' && w[id].score > 0; })
          .sort(function(a,b){ return w[b].score - w[a].score; });
      }
      function weakQuestionIds(){
        var w = Store.get().weakItems || {};
        return Object.keys(w).filter(function(id){ return w[id] && w[id].kind === 'question' && w[id].score > 0; })
          .sort(function(a,b){ return w[b].score - w[a].score; });
      }
      function takeCards(nodeId, n, rng, used){
        if(!nodeId || n <= 0) return [];
        var cards = byNode(Data.allFlashcards(), nodeId).filter(function(c){ return !used[c.id]; });
        cards = shuffle(cards, rng).slice(0, n);
        cards.forEach(function(c){ used[c.id] = true; });
        return cards;
      }
      function takeQuestions(nodeIds, n, rng, used, weakQIds){
        if(n <= 0) return [];
        var out = [];
        var all = Data.allQuestions();
        if(weakQIds && weakQIds.length){
          var map = {};
          all.forEach(function(q){ map[q.id] = q; });
          for(var i=0;i<weakQIds.length && out.length<n;i++){
            var q = map[weakQIds[i]];
            if(q && !used[q.id]){ out.push(q); used[q.id] = true; }
          }
        }
        if(out.length < n){
          var pool = [];
          nodeIds.forEach(function(id){ pool = pool.concat(byNode(all, id)); });
          pool = shuffle(pool, rng);
          for(var j=0;j<pool.length && out.length<n;j++){
            if(!used[pool[j].id]){ out.push(pool[j]); used[pool[j].id] = true; }
          }
        }
        return out;
      }
      function seenCounts(){
        var seen = {};
        (Store.get().runs || []).forEach(function(r){
          (r.answers || []).forEach(function(a){ seen[a.refId] = (seen[a.refId] || 0) + 1; });
        });
        return seen;
      }
      // Primeiro uma pergunta de múltipla escolha; depois alterna os outros tipos (ordenar, completar, certo/errado).
      function pickVaried(list, n, rng, seen){
        var byType = {};
        shuffle(list, rng).sort(function(a, b){ return (seen[a.id] || 0) - (seen[b.id] || 0); }).forEach(function(q){
          var t = qtype(q);
          (byType[t] = byType[t] || []).push(q);
        });
        var types = ['mc', 'order', 'cloze', 'ce'];
        var out = [];
        for(var round=0; round<20 && out.length<n; round++){
          var took = false;
          types.forEach(function(t){
            if(out.length < n && byType[t] && byType[t].length){ out.push(byType[t].shift()); took = true; }
          });
          if(!took) break;
        }
        return out;
      }
      function buildTopics(mainTopics, rng, usedCards, usedQs, queue){
        var seen = seenCounts();
        var cardsAll = Data.allFlashcards(), qsAll = Data.allQuestions();
        var qPer = U.clamp(parseInt(Store.get().settings.questionCountPerBlock, 10) || 4, 1, 10);
        var ranked = mainTopics.map(function(t){
          var tc = cardsAll.filter(function(c){ return c.topic === t.id; });
          var exposure = tc.reduce(function(a, c){ return a + (seen[c.id] || 0); }, 0) / Math.max(1, tc.length);
          return { t:t, cards:tc, score: exposure + rng() * 0.5 };
        }).filter(function(x){ return x.cards.length; }).sort(function(a, b){ return a.score - b.score; });
        ranked.slice(0, P.topicsPerRun).forEach(function(x){
          var cs = shuffle(x.cards.filter(function(c){ return !usedCards[c.id]; }), rng)
            .sort(function(a, b){ return (seen[a.id] || 0) - (seen[b.id] || 0); })
            .slice(0, P.cardsPerTopic);
          cs.forEach(function(c){
            usedCards[c.id] = true;
            queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId, topic:x.t.id });
          });
          var tq = qsAll.filter(function(q){ return q.topic === x.t.id && !usedQs[q.id]; });
          pickVaried(tq, qPer, rng, seen).forEach(function(q){
            usedQs[q.id] = true;
            queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId, topic:x.t.id });
          });
        });
      }
      function build(){
        var rng = U.mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
        var s = Store.get();
        var allCards = Data.allFlashcards();
        var counts = {};
        allCards.forEach(function(c){ counts[c.syllabusId] = (counts[c.syllabusId] || 0) + 1; });
        var main = chooseMain(rng, counts);
        if(!main) return null;
        var usedCards = {}, usedQs = {};
        var queue = [];
        var weak = weakNodeIds();
        var weakQs = weakQuestionIds();

        var mainTopics = TOPICS.filter(function(t){ return t.node === main.id; });
        if(mainTopics.length){
          // Matéria organizada por tópicos: 4–5 cards de um tópico e, em seguida, o teste daquele tópico.
          buildTopics(mainTopics, rng, usedCards, usedQs, queue);
        }else{
        // Aquecimento vem de outro conteúdo (fraco, se houver) para não esgotar os cards do conteúdo principal.
        var warmSrc = weak.filter(function(id){ return id !== main.id && (counts[id] || 0) > 0; })[0] || null;
        if(!warmSrc){
          var others = s.syllabus.filter(function(n){ return n.id !== main.id && (counts[n.id] || 0) > 0; });
          if(others.length) warmSrc = others[Math.floor(rng() * others.length)].id;
        }
        var warm = takeCards(warmSrc, P.warmupCards, rng, usedCards);
        if(warm.length < P.warmupCards){
          warm = warm.concat(takeCards(main.id, P.warmupCards - warm.length, rng, usedCards));
        }
        warm.forEach(function(c){ queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId }); });

        var qPerBlock = U.clamp(parseInt(s.settings.questionCountPerBlock, 10) || P.blockSize, 1, 10);
        var mainCards = takeCards(main.id, P.mainCards, rng, usedCards);
        var blocks = 0;
        for(var i=0;i<mainCards.length;i++){
          queue.push({ kind:'card', refId:mainCards[i].id, syllabusId:mainCards[i].syllabusId });
          if((i+1) % P.blockSize === 0){
            takeQuestions([main.id].concat(weak), qPerBlock, rng, usedQs, weakQs).forEach(function(q){
              queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
            });
            blocks++;
          }
        }
        if(blocks === 0 && mainCards.length){
          takeQuestions([main.id].concat(weak), qPerBlock, rng, usedQs, weakQs).forEach(function(q){
            queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
          });
        }
        }

        if(weak.length || weakQs.length){
          var wsrc = weak.length ? weak[0] : main.id;
          takeCards(wsrc, P.reinforceCards, rng, usedCards).forEach(function(c){
            queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId });
          });
          takeQuestions(weak.length ? weak : [main.id], P.reinforceQuestions, rng, usedQs, weakQs).forEach(function(q){
            queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
          });
        }

        var weakMap = Store.get().weakItems || {};
        var reinforced = {};
        queue.forEach(function(it){
          if(weakMap[it.refId] && weakMap[it.refId].kind === 'question') reinforced[it.refId] = true;
          if(weakMap[it.syllabusId] && weakMap[it.syllabusId].kind === 'node') reinforced[it.syllabusId] = true;
        });

        return { queue: queue, mainSyllabusId: main.id, reinforcedIds: Object.keys(reinforced) };
      }
      function decayWeak(ids){
        if(!ids || !ids.length) return;
        Store.update(function(st){
          var w = st.weakItems || {};
          ids.forEach(function(id){
            if(w[id]){ w[id].ttl = (w[id].ttl || 0) - 1; if(w[id].ttl <= 0) delete w[id]; }
          });
        });
      }
      function beginRun(queue, mainId, reinforcedIds){
        var run = {
          id: U.uid(),
          startedAt: Date.now(),
          endedAt: null,
          mainSyllabusId: mainId || null,
          queue: queue,
          index: 0,
          answers: [],
          score: 0,
          status: 'active',
          reinforcedIds: reinforcedIds || []
        };
        Store.set({ activeRun: run });
        Router.go('run');
      }
      function start(){
        var built = build();
        if(!built || !built.queue.length){ toast('Sem conteúdo suficiente para iniciar a run.'); return; }
        decayWeak(built.reinforcedIds);
        beginRun(built.queue, built.mainSyllabusId, built.reinforcedIds);
      }
      function startReinforce(){
        var rng = U.mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
        var weak = weakNodeIds();
        var weakQs = weakQuestionIds();
        if(!weak.length && !weakQs.length){ toast('Nenhum item fraco para reforçar agora.'); return; }
        var usedCards = {}, usedQs = {};
        var queue = [];
        weak.forEach(function(id){
          takeCards(id, 3, rng, usedCards).forEach(function(c){
            queue.push({ kind:'card', refId:c.id, syllabusId:c.syllabusId });
          });
        });
        takeQuestions(weak, 8, rng, usedQs, weakQs).forEach(function(q){
          queue.push({ kind:'question', refId:q.id, syllabusId:q.syllabusId });
        });
        if(!queue.length){ toast('Nenhum item fraco disponível.'); return; }
        beginRun(queue, weak[0] || null, weak.concat(weakQs));
      }
      function updateStreak(st){
        var today = U.todayStr();
        if(st.streak.lastStudyDate === today) return;
        if(st.streak.lastStudyDate){
          var d1 = new Date(st.streak.lastStudyDate + 'T00:00:00');
          var d2 = new Date(today + 'T00:00:00');
          var diff = Math.round((d2 - d1) / 86400000);
          st.streak.current = diff === 1 ? (st.streak.current || 0) + 1 : 1;
        }else{
          st.streak.current = 1;
        }
        st.streak.lastStudyDate = today;
        st.streak.longest = Math.max(st.streak.longest || 0, st.streak.current);
      }
      function finish(){
        Store.update(function(st){
          var r = st.activeRun;
          if(!r) return;
          r.status = 'done';
          r.endedAt = Date.now();
          r.accuracy = r.answers.length ? Math.round((r.score / r.answers.length) * 100) : 0;
          r.passed = r.accuracy >= (st.settings.passThreshold || 60);
          updateStreak(st);
        });
        var run = Store.get().activeRun;
        if(run) Reviewer.computeAndStore(run);
        Store.update(function(st){
          if(!st.activeRun) return;
          st.runs.push(st.activeRun);
          st.activeRun = null;
        });
        Router.go('summary');
      }
      // Sair no meio: com respostas, fecha a run e mostra o sumário; sem respostas, descarta.
      function exit(){
        var r = Store.get().activeRun;
        if(!r){ Router.go('home'); return; }
        if(r.answers && r.answers.length){ finish(); return; }
        Store.set({ activeRun: null });
        toast('Run descartada.');
        Router.go('home');
      }
      return { start:start, startReinforce:startReinforce, finish:finish, exit:exit, build:build, params:P };
    })();

    var Stats = (function(){
      function dayKey(ts){ return U.todayStr(new Date(ts)); }
      function runs(){ return Store.get().runs || []; }
      function summary(){
        var s = Store.get();
        var rs = runs();
        var totalMs = 0, answers = 0, correct = 0;
        var days = {};
        rs.forEach(function(r){
          if(r.endedAt && r.startedAt) totalMs += Math.max(0, r.endedAt - r.startedAt);
          (r.answers || []).forEach(function(a){ answers++; if(a.correct) correct++; });
          if(r.endedAt) days[dayKey(r.endedAt)] = true;
        });
        return {
          streak: s.streak.current || 0,
          longest: s.streak.longest || 0,
          totalMinutes: Math.round(totalMs / 60000),
          runs: rs.length,
          answers: answers,
          accuracy: answers ? Math.round((correct / answers) * 100) : 0,
          studyDays: Object.keys(days).length
        };
      }
      function dailyMap(){
        var map = {};
        runs().forEach(function(r){
          if(!r.endedAt) return;
          var k = dayKey(r.endedAt);
          if(!map[k]) map[k] = { minutes:0, answers:0, correct:0, runs:0 };
          map[k].minutes += Math.max(0, (r.endedAt - r.startedAt) / 60000);
          map[k].runs++;
          (r.answers || []).forEach(function(a){ map[k].answers++; if(a.correct) map[k].correct++; });
        });
        return map;
      }
      function heatmap(days){
        days = days || 84;
        var map = dailyMap();
        var today = U.parseDate(U.todayStr());
        var out = [];
        for(var i=days-1;i>=0;i--){
          var d = U.addDays(today, -i);
          var k = U.todayStr(d);
          var m = map[k] || { minutes:0 };
          var level = 0;
          if(m.minutes >= 90) level = 4;
          else if(m.minutes >= 60) level = 3;
          else if(m.minutes >= 30) level = 2;
          else if(m.minutes > 0) level = 1;
          out.push({ key:k, date:d, minutes:Math.round(m.minutes), level:level });
        }
        return out;
      }
      function accuracySeries(limit){
        limit = limit || 20;
        var rs = runs().filter(function(r){ return r.endedAt && r.answers && r.answers.length; });
        return rs.slice(-limit).map(function(r){
          var c = 0;
          r.answers.forEach(function(a){ if(a.correct) c++; });
          return { accuracy: Math.round((c / r.answers.length) * 100), at: r.endedAt };
        });
      }
      function byDiscipline(){
        var s = Store.get();
        var nodeDisc = {};
        s.syllabus.forEach(function(n){ nodeDisc[n.id] = n.discipline || 'Outros'; });
        var agg = {};
        runs().forEach(function(r){
          (r.answers || []).forEach(function(a){
            var d = nodeDisc[a.syllabusId] || 'Outros';
            if(!agg[d]) agg[d] = { total:0, correct:0 };
            agg[d].total++;
            if(a.correct) agg[d].correct++;
          });
        });
        return Object.keys(agg).map(function(d){
          return { discipline:d, total:agg[d].total, correct:agg[d].correct, pct: agg[d].total ? Math.round((agg[d].correct / agg[d].total) * 100) : 0 };
        }).sort(function(a,b){ return b.total - a.total; });
      }
      function weakRanking(limit){
        limit = limit || 6;
        var s = Store.get();
        var w = s.weakItems || {};
        var names = {};
        s.syllabus.forEach(function(n){ names[n.id] = n.name; });
        Data.allQuestions().forEach(function(q){ names[q.id] = q.stem; });
        return Object.keys(w).map(function(id){
          return { id:id, kind:w[id].kind, score:w[id].score || 0, name: names[id] || id };
        }).sort(function(a,b){ return b.score - a.score; }).slice(0, limit);
      }
      return { summary:summary, heatmap:heatmap, accuracySeries:accuracySeries, byDiscipline:byDiscipline, weakRanking:weakRanking, dailyMap:dailyMap };
    })();

    function renderRun(vp){
      var s = Store.get();
      var run = s.activeRun;
      if(!run || run.status !== 'active'){
        vp.innerHTML =
          '<section class="view">' +
            '<p class="eyebrow">Run</p>' +
            '<h1 class="h1">Nenhuma run ativa</h1>' +
            '<div class="card">' +
              '<p class="muted">Inicie uma run para estudar flashcards e questões em ritmo de reels.</p>' +
              '<button class="btn-primary" id="run-start" style="margin-top:14px">Estudar agora</button>' +
            '</div>' +
          '</section>';
        vp.querySelector('#run-start').addEventListener('click', function(){ Engine.start(); });
        return;
      }

      var cardMap = {}, qMap = {}, nodeMap = {};
      Data.allFlashcards().forEach(function(c){ cardMap[c.id] = c; });
      Data.allQuestions().forEach(function(q){ qMap[q.id] = q; });
      s.syllabus.forEach(function(n){ nodeMap[n.id] = n; });

      vp.innerHTML =
        '<section class="view run-view">' +
          '<div class="run-top">' +
            '<button class="icon-btn" id="run-exit" aria-label="Encerrar run">' +
              '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button>' +
            '<div class="run-progress"><div id="run-progress-fill"></div></div>' +
            '<span class="run-counter" id="run-counter">0/0</span>' +
            '<span class="run-score-wrap"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.5 6 .9-4.4 4.3 1 6-5.3-2.8L6.7 19.7l1-6L3.3 9.4l6-.9z"/></svg><b id="run-score">0</b></span>' +
          '</div>' +
          '<div id="run-stage"></div>' +
        '</section>';

      var stage = vp.querySelector('#run-stage');
      var fill = vp.querySelector('#run-progress-fill');
      var counter = vp.querySelector('#run-counter');
      var scoreEl = vp.querySelector('#run-score');
      var revealed = false;
      var locked = false;

      function nodeName(sid){ var n = nodeMap[sid]; return n ? n.name : 'Conteúdo'; }

      function chrome(){
        var r = Store.get().activeRun;
        if(!r) return;
        var total = r.queue.length;
        var pct = total ? Math.round((r.index / total) * 100) : 0;
        fill.style.width = pct + '%';
        counter.textContent = r.index + '/' + total;
        scoreEl.textContent = r.score;
      }

      function record(kind, refId, syllabusId, correct){
        Store.update(function(st){
          var r = st.activeRun;
          if(!r) return;
          r.answers.push({ kind:kind, refId:refId, syllabusId:syllabusId, correct:!!correct, ts:Date.now() });
          if(correct) r.score += 1;
        });
      }

      function advance(){
        Store.update(function(st){ if(st.activeRun) st.activeRun.index += 1; });
        revealed = false;
        locked = false;
        paint();
      }

      function paint(){
        var r = Store.get().activeRun;
        if(!r) return;
        if(r.index >= r.queue.length){ Engine.finish(); return; }
        chrome();
        var item = r.queue[r.index];
        if(item.kind === 'card') paintCard(item); else paintQuestion(item);
      }

      // Posição do item dentro do bloco do tópico (ex.: card 2 de 5).
      function topicPos(r, item){
        if(!item.topic) return '';
        var total = 0, pos = 0;
        r.queue.forEach(function(it, i){
          if(it.topic === item.topic && it.kind === item.kind){ total++; if(i <= r.index) pos = total; }
        });
        return total > 1 ? ' · ' + pos + '/' + total : '';
      }
      function label(item){
        return item.topic && TOPIC_NAME[item.topic] ? TOPIC_NAME[item.topic] : nodeName(item.syllabusId);
      }

      function paintCard(item){
        var card = cardMap[item.refId];
        if(!card){ advance(); return; }
        revealed = false;
        var r = Store.get().activeRun;
        stage.innerHTML =
          '<div class="reel">' +
            '<div class="reel-tag">Flashcard · <span>' + U.esc(label(item)) + '</span>' + topicPos(r, item) + '</div>' +
            '<div class="reel-q">' + U.esc(card.front) + '</div>' +
            '<button class="btn-primary" id="reveal">Mostrar resposta</button>' +
            '<div class="reel-a" id="card-back" hidden>' +
              '<p class="ans">' + U.esc(card.back) + '</p>' +
              (card.more ? '<div class="more-box"><b>Aprofunde</b><p>' + U.esc(card.more) + '</p></div>' : '') +
              (card.tip ? '<div class="tip-box"><b>Pegadinha de prova</b><p>' + U.esc(card.tip) + '</p></div>' : '') +
            '</div>' +
            '<div class="card-controls" id="card-controls" hidden>' +
              '<button class="btn-no" id="ans-no">Não sei</button>' +
              '<button class="btn-yes" id="ans-yes">Sei</button>' +
            '</div>' +
            '<p class="swipe-hint" id="swipe-hint">Toque em mostrar · arraste para cima</p>' +
          '</div>';
        var back = stage.querySelector('#card-back');
        var controls = stage.querySelector('#card-controls');
        var revealBtn = stage.querySelector('#reveal');
        var hint = stage.querySelector('#swipe-hint');
        revealBtn.addEventListener('click', function(){
          if(revealed) return;
          revealed = true;
          back.hidden = false;
          controls.hidden = false;
          revealBtn.hidden = true;
          hint.textContent = 'Leia o "Aprofunde" e avalie: não sei ou sei';
        });
        stage.querySelector('#ans-no').addEventListener('click', function(){
          if(locked) return; locked = true;
          record('card', card.id, card.syllabusId, false);
          advance();
        });
        stage.querySelector('#ans-yes').addEventListener('click', function(){
          if(locked) return; locked = true;
          record('card', card.id, card.syllabusId, true);
          Audio.correct();
          advance();
        });
      }

      var TYPE_LABEL = { mc:'Múltipla escolha', ce:'Certo ou errado', cloze:'Complete a lacuna', order:'Ordene as etapas' };

      function paintQuestion(item){
        var q = qMap[item.refId];
        if(!q){ advance(); return; }
        var type = qtype(q);
        var r = Store.get().activeRun;
        var tag = '<div class="reel-tag">' + (item.topic ? 'Teste do tópico · ' : '') + TYPE_LABEL[type] +
          ' · <span>' + U.esc(label(item)) + '</span>' + (q.source ? ' · ' + U.esc(q.source) : '') + '</div>';
        var feedbackHtml =
          '<div class="feedback" id="q-feedback" hidden>' +
            '<p class="fb-title"></p>' +
            '<div class="fb-extra"></div>' +
            '<p class="fb-exp"></p>' +
            '<button class="btn-primary" id="q-next">Próxima</button>' +
          '</div>';
        var answered = false;

        function finishAnswer(correct, title, extraHtml){
          record('question', q.id, q.syllabusId, correct);
          var fb = stage.querySelector('#q-feedback');
          fb.hidden = false;
          fb.classList.add(correct ? 'ok' : 'bad');
          fb.querySelector('.fb-title').textContent = (correct ? 'Você acertou' : 'Você errou') + (title ? ' · ' + title : '');
          fb.querySelector('.fb-extra').innerHTML = extraHtml || '';
          fb.querySelector('.fb-exp').textContent = q.explanation || '';
          if(correct) Audio.correct();
          chrome();
          fb.scrollIntoView({ block:'nearest', behavior:'smooth' });
        }

        if(type === 'order'){
          // Embaralha garantindo que não comece já na ordem certa.
          var idxs = q.items.map(function(_, i){ return i; });
          for(var tries=0; tries<10; tries++){
            idxs.sort(function(){ return Math.random() - 0.5; });
            if(idxs.some(function(v, i){ return v !== i; })) break;
          }
          stage.innerHTML =
            '<div class="reel">' + tag +
              '<div class="reel-q">' + U.esc(q.stem) + '</div>' +
              '<p class="muted">Toque nas etapas na ordem correta. Toque numa etapa escolhida para desfazer.</p>' +
              '<ol class="ord-picked" id="ord-picked"></ol>' +
              '<div class="ord-pool" id="ord-pool">' + idxs.map(function(i, k){
                return '<button class="ord-item" data-i="' + i + '"><span class="opt-letter">' + (k + 1) + '</span><span>' + U.esc(q.items[i]) + '</span></button>';
              }).join('') + '</div>' +
              '<button class="btn-primary" id="ord-check" disabled>Conferir ordem</button>' +
              feedbackHtml +
            '</div>';
          var picked = [];
          var pickedEl = stage.querySelector('#ord-picked');
          var checkBtn = stage.querySelector('#ord-check');
          function renderPicked(){
            pickedEl.innerHTML = picked.map(function(i){ return '<li data-i="' + i + '">' + U.esc(q.items[i]) + '</li>'; }).join('');
            checkBtn.disabled = picked.length !== q.items.length;
            stage.querySelectorAll('.ord-item').forEach(function(b){ b.disabled = answered || picked.indexOf(+b.dataset.i) >= 0; });
          }
          stage.querySelectorAll('.ord-item').forEach(function(b){
            b.addEventListener('click', function(){
              if(answered || picked.indexOf(+b.dataset.i) >= 0) return;
              picked.push(+b.dataset.i);
              renderPicked();
            });
          });
          pickedEl.addEventListener('click', function(e){
            var li = e.target.closest('li');
            if(!li || answered) return;
            picked.splice(picked.indexOf(+li.dataset.i), 1);
            renderPicked();
          });
          checkBtn.addEventListener('click', function(){
            if(answered || picked.length !== q.items.length) return;
            answered = true;
            var correct = picked.every(function(v, i){ return v === i; });
            pickedEl.querySelectorAll('li').forEach(function(li, pos){
              li.classList.add(+li.dataset.i === pos ? 'right' : 'off');
            });
            checkBtn.hidden = true;
            stage.querySelector('#ord-pool').hidden = true;
            finishAnswer(correct, correct ? '' : 'ordem correta abaixo',
              correct ? '' : '<ol class="ord-answer">' + q.items.map(function(t){ return '<li>' + U.esc(t) + '</li>'; }).join('') + '</ol>');
          });
          renderPicked();
        }else{
          var isCE = type === 'ce';
          // Múltipla escolha e lacuna: alternativas embaralhadas a cada vez.
          var order = q.options.map(function(_, i){ return i; });
          if(!isCE) order.sort(function(){ return Math.random() - 0.5; });
          var letters = isCE ? ['C','E'] : ['A','B','C','D','E','F'];
          var optsHtml = order.map(function(orig, pos){
            return '<button class="opt' + (type === 'cloze' ? ' chip' : '') + '" data-i="' + orig + '"><span class="opt-letter">' + letters[pos] + '</span><span>' + U.esc(q.options[orig]) + '</span></button>';
          }).join('');
          var stemHtml = U.esc(q.stem);
          if(type === 'cloze') stemHtml = stemHtml.replace('___', '<span class="blank" id="blank">______</span>');
          stage.innerHTML =
            '<div class="reel">' + tag +
              '<div class="reel-q' + (isCE ? ' reel-q-ce' : '') + '">' + stemHtml + '</div>' +
              '<div class="opts' + (isCE ? ' opts-ce' : '') + (type === 'cloze' ? ' opts-chips' : '') + '" id="opts">' + optsHtml + '</div>' +
              feedbackHtml +
            '</div>';
          var optEls = stage.querySelectorAll('.opt');
          optEls.forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var chosen = +btn.dataset.i;
              var correct = chosen === q.answer;
              optEls.forEach(function(b){
                b.disabled = true;
                if(+b.dataset.i === q.answer) b.classList.add('correct');
                else if(b === btn) b.classList.add('wrong');
              });
              if(type === 'cloze'){
                var bl = stage.querySelector('#blank');
                if(bl){ bl.textContent = q.options[q.answer]; bl.classList.add(correct ? 'ok' : 'bad'); }
              }
              var title = isCE ? 'gabarito: ' + q.options[q.answer].toUpperCase()
                : (correct ? '' : 'resposta: ' + q.options[q.answer]);
              finishAnswer(correct, title, '');
            });
          });
        }
        stage.querySelector('#q-next').addEventListener('click', function(){
          if(locked) return; locked = true;
          advance();
        });
      }

      function onKey(e){
        var r = Store.get().activeRun;
        if(!r) return;
        var item = r.queue[r.index];
        if(!item) return;
        if(e.key === 'Escape'){ e.preventDefault(); Engine.exit(); return; }
        if(item.kind === 'card'){
          if(e.key === ' ' || e.key === 'ArrowDown'){
            e.preventDefault();
            if(!revealed){ var rb = stage.querySelector('#reveal'); if(rb) rb.click(); }
            else { var yes = stage.querySelector('#ans-yes'); if(yes) yes.click(); }
          }else if(revealed && (e.key === '1' || e.key === '2')){
            e.preventDefault();
            var b = stage.querySelector(e.key === '1' ? '#ans-no' : '#ans-yes');
            if(b) b.click();
          }
        }else{
          var fb = stage.querySelector('#q-feedback');
          if(fb && !fb.hidden){
            if(e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter'){
              e.preventDefault();
              var nx = stage.querySelector('#q-next'); if(nx) nx.click();
            }
          }else{
            var idx = parseInt(e.key, 10) - 1;
            var ordItems = stage.querySelectorAll('.ord-item');
            if(ordItems.length){
              if(e.key === 'Enter'){ e.preventDefault(); var oc = stage.querySelector('#ord-check'); if(oc && !oc.disabled) oc.click(); }
              else if(idx >= 0 && idx < ordItems.length){ e.preventDefault(); ordItems[idx].click(); }
              return;
            }
            var opts = stage.querySelectorAll('.opt');
            if(idx >= 0 && idx < opts.length){ e.preventDefault(); opts[idx].click(); }
          }
        }
      }

      var touchStartY = null;
      stage.addEventListener('touchstart', function(e){
        if(e.touches.length === 1) touchStartY = e.touches[0].clientY;
      }, { passive:true });
      stage.addEventListener('touchend', function(e){
        if(touchStartY === null) return;
        var endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : touchStartY;
        var dy = touchStartY - endY;
        touchStartY = null;
        if(dy > 50){
          var r = Store.get().activeRun; if(!r) return;
          var item = r.queue[r.index]; if(!item || item.kind !== 'card') return;
          if(!revealed){ var rb = stage.querySelector('#reveal'); if(rb) rb.click(); }
          else { var yes = stage.querySelector('#ans-yes'); if(yes) yes.click(); }
        }
      }, { passive:true });

      vp.querySelector('#run-exit').addEventListener('click', function(){ Engine.exit(); });
      Router.onCleanup(function(){ document.removeEventListener('keydown', onKey); });
      document.addEventListener('keydown', onKey);
      paint();
    }

    function renderSummary(vp){
      var s = Store.get();
      var run = s.runs.length ? s.runs[s.runs.length-1] : null;
      if(!run){
        vp.innerHTML =
          '<section class="view">' +
            '<p class="eyebrow">Sumário</p>' +
            '<h1 class="h1">Nenhuma run concluída</h1>' +
            '<div class="card">' +
              '<p class="muted">Conclua uma run para ver o sumário.</p>' +
              '<button class="btn-primary" id="sum-start" style="margin-top:14px">Estudar agora</button>' +
            '</div>' +
          '</section>';
        vp.querySelector('#sum-start').addEventListener('click', function(){ Engine.start(); });
        return;
      }

      var total = run.answers.length;
      var correct = 0;
      var byNode = {};
      run.answers.forEach(function(a){
        if(a.correct) correct++;
        if(!byNode[a.syllabusId]) byNode[a.syllabusId] = { total:0, correct:0 };
        byNode[a.syllabusId].total++;
        if(a.correct) byNode[a.syllabusId].correct++;
      });
      var acc = total ? Math.round((correct / total) * 100) : 0;
      var durMin = Math.max(0, Math.round(((run.endedAt || Date.now()) - run.startedAt) / 60000));
      var nodeName = {};
      s.syllabus.forEach(function(n){ nodeName[n.id] = n.name; });

      var rows = Object.keys(byNode).map(function(id){
        var d = byNode[id];
        var pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
        var cls = pct >= 70 ? 'ok' : (pct >= 50 ? 'warn' : 'bad');
        return '<li class="sum-row">' +
          '<div class="plan-head"><span class="plan-name">' + U.esc(nodeName[id] || id) + '</span><span class="sum-pct ' + cls + '">' + pct + '%</span></div>' +
          '<div class="plan-meta">' + d.correct + '/' + d.total + '</div>' +
          '<div class="bar"><span class="' + cls + '" style="width:' + pct + '%"></span></div>' +
        '</li>';
      }).join('');

      var threshold = s.settings.passThreshold || 60;
      var passed = (typeof run.passed === 'boolean') ? run.passed : (acc >= threshold);
      var passBadge = passed
        ? '<span class="badge ok-badge">Meta batida</span>'
        : '<span class="badge warn-badge">Abaixo de ' + threshold + '%</span>';

      var phrase;
      if(acc >= 80) phrase = 'Excelente ritmo. Pequenas runs diárias valem mais que maratonas.';
      else if(acc >= 60) phrase = 'Bom desempenho. Amanhã comece pelos conteúdos mais fracos para consolidar.';
      else phrase = 'Dia difícil não apaga o progresso. A próxima run já vem com reforço automático dos pontos fracos.';

      var weak = s.weakItems || {};
      var weakNodeNames = Object.keys(weak).filter(function(id){ return weak[id].kind === 'node'; })
        .map(function(id){ return nodeName[id] || id; });
      var weakQCount = Object.keys(weak).filter(function(id){ return weak[id].kind === 'question'; }).length;
      var hasWeak = weakNodeNames.length > 0 || weakQCount > 0;
      var weakText = [];
      if(weakNodeNames.length) weakText.push(weakNodeNames.join(', '));
      if(weakQCount) weakText.push(weakQCount + (weakQCount === 1 ? ' questão' : ' questões'));

      var weakCard =
        '<div class="card">' +
          '<h2 class="h2">A reforçar na próxima run</h2>' +
          (hasWeak
            ? '<p class="muted">' + U.esc(weakText.join(' · ')) + '</p>' +
              '<button class="btn-primary" id="sum-reinforce" style="margin-top:12px">Reforçar agora</button>'
            : '<p class="muted">Nenhum item fraco pendente. Bom sinal — siga avançando no plano.</p>') +
        '</div>';

      var streakLine = 'Streak: ' + s.streak.current + (s.streak.current === 1 ? ' dia' : ' dias') + ' · XP: ' + (run.score * 10);

      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Run concluída</p>' +
          '<h1 class="h1">Seu sumário</h1>' +
          '<div class="card">' +
            '<div class="hero-stats">' +
              '<div class="hstat"><span class="hnum">' + acc + '%</span><span class="hlabel">acerto</span></div>' +
              '<div class="hstat"><span class="hnum">' + correct + '/' + total + '</span><span class="hlabel">acertos</span></div>' +
              '<div class="hstat"><span class="hnum">' + durMin + '</span><span class="hlabel">min</span></div>' +
            '</div>' +
            passBadge +
            '<p class="hint">' + U.esc(streakLine) + '</p>' +

    function renderStats(vp){
      var sm = Stats.summary();
      var days = Stats.heatmap(84);
      var series = Stats.accuracySeries(20);
      var discs = Stats.byDiscipline();
      var weak = Stats.weakRanking(6);

      var pad = days.length ? days[0].date.getDay() : 0;
      var cells = '';
      for(var i=0;i<pad;i++) cells += '<span class="hm-cell empty"></span>';
      days.forEach(function(d){
        cells += '<span class="hm-cell lvl' + d.level + '" title="' + U.fmtDate(d.date) + ' · ' + d.minutes + ' min"></span>';
      });

      var lineHtml;
      if(series.length < 2){
        lineHtml = '<p class="muted">Conclua mais runs para ver a evolução da taxa de acerto.</p>';
      }else{
        var W = 300, H = 90, pd = 6, n = series.length;
        var pts = series.map(function(p, i){
          var x = pd + (i / (n - 1)) * (W - 2 * pd);
          var y = H - pd - (p.accuracy / 100) * (H - 2 * pd);
          return x.toFixed(1) + ',' + y.toFixed(1);
        }).join(' ');
        lineHtml =
          '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-line" preserveAspectRatio="none">' +
            '<line x1="0" y1="' + (H - pd) + '" x2="' + W + '" y2="' + (H - pd) + '" style="stroke:var(--border);stroke-width:1"/>' +
            '<polyline points="' + pts + '" style="fill:none;stroke:var(--accent);stroke-width:2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
          '</svg>' +
          '<p class="hint">Última run: ' + series[series.length-1].accuracy + '% · ' + n + ' runs</p>';
      }

      var discChart = (function(){
        if(!discs.length) return '<p class="muted">Sem respostas registradas ainda.</p>';
        var rowH = 26, W = 340, H = discs.length * rowH + 6;
        var bars = discs.map(function(d, i){
          var y = i * rowH + 6;
          var w = Math.max(0, (d.pct / 100) * 190);
          var color = d.pct >= 70 ? 'var(--ok)' : (d.pct >= 50 ? 'var(--warn)' : 'var(--danger)');
          var short = d.discipline.replace(/^(Específicos|Básicos|Extra) · /, '');
          var label = short.length > 15 ? short.slice(0, 14) + '…' : short;
          return '<text x="0" y="' + (y + 9) + '" style="fill:var(--muted);font-size:10.5px">' + U.esc(label) + '</text>' +
            '<rect x="100" y="' + y + '" width="190" height="10" rx="5" style="fill:var(--surface-2)"/>' +
            '<rect x="100" y="' + y + '" width="' + w.toFixed(1) + '" height="10" rx="5" style="fill:' + color + '"/>' +
            '<text x="294" y="' + (y + 9) + '" style="fill:var(--text);font-size:10.5px;font-weight:700">' + d.pct + '%</text>';
        }).join('');
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-bars" preserveAspectRatio="xMinYMin meet">' + bars + '</svg>';
      })();

      var weakRows = weak.length ? weak.map(function(w){
        return '<li class="sum-row">' +
          '<div class="plan-head"><span class="plan-name">' + U.esc(w.name) + '</span><span class="weight">' + (w.kind === 'question' ? 'questão' : 'conteúdo') + '</span></div>' +
          '<div class="plan-meta">peso de reforço ' + w.score.toFixed(1) + '</div>' +
        '</li>';
      }).join('') : '<li class="muted">Nenhum item fraco pendente.</li>';

      vp.innerHTML =
        '<section class="view">' +
          '<p class="eyebrow">Progresso</p>' +
          '<h1 class="h1">Seu progresso</h1>' +
          '<div class="card">' +
            '<div class="hero-stats">' +
              '<div class="hstat"><span class="hnum">' + sm.streak + '</span><span class="hlabel">streak</span></div>' +
              '<div class="hstat"><span class="hnum">' + sm.longest + '</span><span class="hlabel">recorde</span></div>' +
              '<div class="hstat"><span class="hnum">' + (sm.totalMinutes / 60).toFixed(1) + 'h</span><span class="hlabel">estudadas</span></div>' +
            '</div>' +
            '<p class="hint">' + sm.runs + ' runs · ' + sm.answers + ' respostas · ' + sm.accuracy + '% acerto geral · ' + sm.studyDays + ' dias estudados</p>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="h2">Constância (12 semanas)</h2>' +
            '<div class="heatmap">' + cells + '</div>' +
            '<div class="hm-legend"><span>menos</span><span class="hm-cell lvl0"></span><span class="hm-cell lvl1"></span><span class="hm-cell lvl2"></span><span class="hm-cell lvl3"></span><span class="hm-cell lvl4"></span><span>mais</span></div>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="h2">Taxa de acerto</h2>' +
            lineHtml +
          '</div>' +
          '<div class="card"><h2 class="h2">Por disciplina</h2>' + discChart + '</div>' +
          '<div class="card"><h2 class="h2">Conteúdos fracos</h2><ul class="plan-list">' + weakRows + '</ul></div>' +
        '</section>';
    }
