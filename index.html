           Gabarito oficial definitivo. Omitidos: anulados (básicos 18, 19, 31, 38; específicos 55, 84, 91, 93, 94,
           97, 99, 106, 116), itens que dependem do texto longo de Português (1–8) e itens cuja justificativa
           da banca não dá para reconstruir com segurança (14, 50, 117). answer: 0 = Certo, 1 = Errado. */
        { id:'pf25-09', syllabusId:'pt', source:'Cebraspe 2025 · item 9', stem:'Com base no Manual de Redação da Presidência da República: Respeitosamente e Atenciosamente são os dois fechos indicados para as comunicações oficiais, sendo o seu uso regulado pela relação de hierarquia entre emissor e destinatário da comunicação.', options:['Certo','Errado'], answer:0, explanation:'"Respeitosamente" é usado para autoridades de hierarquia superior; "Atenciosamente", para a mesma hierarquia ou inferior.' },
        { id:'pf25-10', syllabusId:'pt', source:'Cebraspe 2025 · item 10', stem:'Exposição de motivos é o expediente oficial a ser elaborado para se submeter projeto de ato normativo à consideração do presidente ou vice-presidente da República.', options:['Certo','Errado'], answer:0, explanation:'A exposição de motivos é dirigida ao Presidente (ou ao Vice) para informar sobre um assunto, propor uma medida ou submeter projeto de ato normativo.' },
        { id:'pf25-11', syllabusId:'pt', source:'Cebraspe 2025 · item 11', stem:'Em expedientes oficiais que tenham mais de uma página, todas as páginas devem conter cabeçalho que apresente o brasão de Armas da República, o nome do órgão principal e, se necessário, o nome de órgãos secundários.', options:['Certo','Errado'], answer:1, explanation:'O cabeçalho com o brasão vai somente na primeira página do documento.' },
        { id:'pf25-12', syllabusId:'pt', source:'Cebraspe 2025 · item 12', stem:'Com vistas a garantir o caráter público e a finalidade das comunicações oficiais, nelas deve ser empregado o padrão oficial de linguagem, que, desenvolvido a partir da norma padrão da língua portuguesa, é o modelo reconhecido como regra para os documentos oficiais.', options:['Certo','Errado'], answer:1, explanation:'O Manual (3ª ed.) afirma que não existe propriamente um "padrão oficial de linguagem"; o que se usa é a norma padrão da língua.' },
        { id:'pf25-13', syllabusId:'inf', source:'Cebraspe 2025 · item 13', stem:'No Windows, um arquivo pode estar distribuído em diversos volumes.', options:['Certo','Errado'], answer:1, explanation:'Um arquivo pertence a um único volume. O que pode ocorrer é um mesmo volume ocupar vários discos (volume estendido).' },
        { id:'pf25-15', syllabusId:'inf', source:'Cebraspe 2025 · item 15', stem:'A técnica de clustering em data mining atribui categorias aos grupos de dados para facilitar a análise e a tomada de decisão.', options:['Certo','Errado'], answer:1, explanation:'O clustering agrupa os dados por semelhança, sem categorias prévias (não supervisionado). Atribuir categorias definidas é classificação.' },
        { id:'pf25-16', syllabusId:'inf', source:'Cebraspe 2025 · item 16', stem:'Em geral, projetos de Big Data caracterizam-se por cinco diferentes atributos: valor, variedade, velocidade, veracidade e volume.', options:['Certo','Errado'], answer:0, explanation:'Esses são os 5 Vs do Big Data.' },
        { id:'pf25-17', syllabusId:'inf', source:'Cebraspe 2025 · item 17', stem:'Firewalls e antivírus são ferramentas de proteção da rede por meio do controle do tráfego de dados e do impedimento a acessos não autorizados.', options:['Certo','Errado'], answer:1, explanation:'Controlar o tráfego é papel do firewall. O antivírus detecta e remove malware; não controla o tráfego da rede.' },
        { id:'pf25-20', syllabusId:'inf', source:'Cebraspe 2025 · item 20', stem:'Cardinalidades são restrições em relacionamentos e podem ter quatro diferentes variações: 1:1, 1:N, N:1 e N:N.', options:['Certo','Errado'], answer:1, explanation:'Usualmente se classificam em três tipos: 1:1, 1:N e N:N (N:1 é o mesmo 1:N visto do outro lado).' },
        { id:'pf25-21', syllabusId:'da', source:'Cebraspe 2025 · item 21', stem:'Autarquias são entidades que compõem a administração pública descentralizada, criadas por lei específica, com patrimônio e receita próprios, e dotadas de autonomia administrativa e financeira.', options:['Certo','Errado'], answer:0, explanation:'É a definição de autarquia: pessoa jurídica de direito público da administração indireta, criada por lei específica (CF, art. 37, XIX).' },
        { id:'pf25-22', syllabusId:'da', source:'Cebraspe 2025 · item 22', stem:'Ocorre descentralização administrativa quando o Estado concede ao particular determinado serviço público mediante celebração de um contrato.', options:['Certo','Errado'], answer:0, explanation:'É a descentralização por colaboração (delegação), como nas concessões e permissões de serviço público.' },
        { id:'pf25-23', syllabusId:'da', source:'Cebraspe 2025 · item 23', stem:'O sistema de registro de preços consiste em modalidade de licitação destinada a registrar formalmente os preços de bens e serviços para futuras contratações.', options:['Certo','Errado'], answer:1, explanation:'O SRP é um procedimento auxiliar (Lei 14.133/2021, art. 78), não uma modalidade.' },
        { id:'pf25-24', syllabusId:'da', source:'Cebraspe 2025 · item 24', stem:'Nos casos de contratação direta por inexigibilidade de licitação em razão da inviabilidade de competição, a justificativa do preço a ser contratado é opcional.', options:['Certo','Errado'], answer:1, explanation:'A justificativa de preço é obrigatória na contratação direta (Lei 14.133/2021, art. 72, VII).' },
        { id:'pf25-25', syllabusId:'dc', source:'Cebraspe 2025 · item 25', stem:'Os corpos de bombeiros militares integram o sistema de segurança pública, a eles incumbindo a execução das atividades de defesa civil.', options:['Certo','Errado'], answer:0, explanation:'CF, art. 144, V e §5º: aos bombeiros militares cabe, além das atribuições definidas em lei, a execução de atividades de defesa civil.' },
        { id:'pf25-26', syllabusId:'dc', source:'Cebraspe 2025 · item 26', stem:'Os partidos políticos são dotados de autonomia, entretanto sua criação, fusão, incorporação e extinção dependem de autorização do Congresso Nacional.', options:['Certo','Errado'], answer:1, explanation:'A criação, fusão, incorporação e extinção de partidos são livres (CF, art. 17); o estatuto é registrado no TSE.' },
        { id:'pf25-27', syllabusId:'dc', source:'Cebraspe 2025 · item 27', stem:'O direito à vida é protegido como cláusula pétrea pela CF, sendo vedada a pena de morte, salvo no caso de guerra declarada.', options:['Certo','Errado'], answer:0, explanation:'CF, art. 5º, XLVII, "a"; os direitos e as garantias individuais são cláusula pétrea (art. 60, §4º, IV).' },
        { id:'pf25-28', syllabusId:'dc', source:'Cebraspe 2025 · item 28', stem:'No sistema presidencialista, o presidente da República exerce exclusivamente as funções de chefe de Estado.', options:['Certo','Errado'], answer:1, explanation:'No presidencialismo, o Presidente acumula as funções de chefe de Estado e de chefe de governo.' },
        { id:'pf25-29', syllabusId:'dp', source:'Cebraspe 2025 · item 29', stem:'O agente atirou na vítima no Brasil, em cidade de fronteira, e a vítima morreu dias depois na Argentina. Nos termos da teoria da ubiquidade adotada pelo Código Penal brasileiro, o crime deverá ser considerado praticado apenas no local onde o resultado morte se consumou, ou seja, na Argentina.', options:['Certo','Errado'], answer:1, explanation:'Pela ubiquidade (CP, art. 6º), considera-se praticado o crime tanto onde ocorreu a ação quanto onde se produziu o resultado; logo, também no Brasil.' },
        { id:'pf25-30', syllabusId:'dp', source:'Cebraspe 2025 · item 30', stem:'O agente atirou na vítima em 10/01/2020, quando era menor de idade, e completou 18 anos antes de a vítima morrer, em 15/01/2020. Conforme a teoria da atividade adotada pelo Código Penal, o tempo do crime deve ser fixado no momento da ação ou omissão, razão pela qual o agente deverá ser considerado inimputável.', options:['Certo','Errado'], answer:0, explanation:'CP, art. 4º: considera-se praticado o crime no momento da ação, ainda que outro seja o do resultado. Na data dos disparos, ele era menor.' },
        { id:'pf25-32', syllabusId:'dpp', source:'Cebraspe 2025 · item 32', stem:'Após o laudo, a defesa pediu acesso ao material periciado para produzir parecer por assistente técnico. Esse pedido poderá ser atendido, desde que possível a conservação do material probatório, mas sua análise por assistente técnico deverá ocorrer no ambiente do órgão oficial e perante perito oficial.', options:['Certo','Errado'], answer:0, explanation:'CPP, art. 159, §6º: o material é disponibilizado no ambiente do órgão oficial, na presença de perito oficial.' },
        { id:'pf25-33', syllabusId:'dpp', source:'Cebraspe 2025 · item 33', stem:'A busca domiciliar realizada pela autoridade policial com o consentimento válido do morador é considerada válida, ainda que ausente mandado judicial.', options:['Certo','Errado'], answer:0, explanation:'CF, art. 5º, XI: a casa é inviolável, salvo com o consentimento do morador (entre outras hipóteses).' },
        { id:'pf25-34', syllabusId:'dpp', source:'Cebraspe 2025 · item 34', stem:'A cadeia de custódia iniciou-se com o transporte dos vestígios ao instituto de criminalística, momento em que se registra formalmente sua entrada no sistema pericial.', options:['Certo','Errado'], answer:1, explanation:'CPP, art. 158-A, §1º: a cadeia começa com a preservação do local de crime ou com os procedimentos em que se detecta o vestígio.' },
        { id:'pf25-35', syllabusId:'crim', source:'Cebraspe 2025 · item 35', stem:'Os vestígios morfológicos incluem restos de fluidos corporais, como sangue e sêmen, encontrados na cena do crime.', options:['Certo','Errado'], answer:1, explanation:'Fluidos corporais são vestígios biológicos. Os morfológicos são marcas e formas, como pegadas, impressões e marcas de ferramenta.' },
        { id:'pf25-36', syllabusId:'crim', source:'Cebraspe 2025 · item 36', stem:'De acordo com o princípio de Locard, não há crime sem vestígio e, com a aplicação das técnicas adequadas, os vestígios do crime podem ser localizados.', options:['Certo','Errado'], answer:0, explanation:'Princípio da troca de Locard: todo contato deixa uma marca, e cabe à perícia encontrá-la.' },
        { id:'pf25-37', syllabusId:'crim', source:'Cebraspe 2025 · item 37', stem:'Quando ampliada, a imagem raster, predominantemente utilizada em registros fotográficos periciais, pode sofrer o processo de pixelização, que compromete a nitidez e os detalhes da imagem da cena.', options:['Certo','Errado'], answer:0, explanation:'Imagens raster (bitmap) são formadas por pixels; ampliá-las além da resolução revela os pixels e reduz a nitidez.' },
        { id:'pf25-39', syllabusId:'crim', source:'Cebraspe 2025 · item 39', stem:'O isolamento e a preservação do local do crime são etapas prescindíveis nos casos em que haja confirmação de que o fato criminoso ocorreu há mais de 48 horas da chegada do perito criminal ao local.', options:['Certo','Errado'], answer:1, explanation:'O isolamento e a preservação são sempre necessários (CPP, art. 6º, I, e art. 158-A); o tempo decorrido não os dispensa.' },
        { id:'pf25-40', syllabusId:'dh', source:'Cebraspe 2025 · item 40', stem:'Os Estados-partes da Convenção Relativa ao Estatuto dos Refugiados devem conferir aos refugiados que residam regularmente em seu território tratamento tão favorável quanto possível, e não menos favorável do que é dado aos estrangeiros em geral, no que diz respeito ao exercício de profissões liberais por aqueles que possuam diploma reconhecido.', options:['Certo','Errado'], answer:0, explanation:'É a regra do art. 19 da Convenção de 1951.' },
        { id:'pf25-41', syllabusId:'dh', source:'Cebraspe 2025 · item 41', stem:'As regras mínimas da ONU para o tratamento de pessoas presas, em observância ao princípio da igualdade, vedam qualquer tratamento diferenciado entre reclusos com deficiência e os demais.', options:['Certo','Errado'], answer:1, explanation:'As Regras de Mandela exigem adaptações razoáveis para presos com deficiência; tratar de forma diferenciada para igualar não é discriminação.' },
        { id:'pf25-42', syllabusId:'dh', source:'Cebraspe 2025 · item 42', stem:'O STF consolidou o entendimento de que os tratados e as convenções referentes a direitos humanos subscritos pelo Brasil sem seguir o rito constitucionalmente determinado são considerados normas supralegais.', options:['Certo','Errado'], answer:0, explanation:'Esse é o entendimento do RE 466.343 (prisão do depositário infiel): ficam acima das leis e abaixo da Constituição.' },
        { id:'pf25-43', syllabusId:'dh', source:'Cebraspe 2025 · item 43', stem:'Os Estados-partes da CEDAW comprometem-se a garantir que nem o casamento com um estrangeiro nem a mudança de nacionalidade do marido durante o casamento modifiquem automaticamente a nacionalidade da esposa, convertam-na em apátrida ou a obriguem a adotar a nacionalidade do cônjuge.', options:['Certo','Errado'], answer:0, explanation:'É o texto do art. 9º da Convenção sobre a Eliminação de Todas as Formas de Discriminação contra a Mulher.' },
        { id:'pf25-44', syllabusId:'dh', source:'Cebraspe 2025 · item 44', stem:'O duplo grau de jurisdição é um direito reconhecido pela Convenção Americana de Direitos Humanos, a qual foi incorporada ao direito brasileiro.', options:['Certo','Errado'], answer:0, explanation:'Está no art. 8.2.h da CADH (Pacto de São José), promulgada pelo Decreto 678/1992.' },
        { id:'pf25-45', syllabusId:'dh', source:'Cebraspe 2025 · item 45', stem:'Para peticionar à Comissão Interamericana, é preciso que tenha havido o esgotamento de todos os recursos na jurisdição interna, não bastando a simples mora do Estado-parte no julgamento de tais recursos, ainda que injustificada.', options:['Certo','Errado'], answer:1, explanation:'O art. 46.2 da CADH dispensa o esgotamento quando há demora injustificada na decisão dos recursos.' },
        { id:'pf25-46', syllabusId:'rl', source:'Cebraspe 2025 · item 46', stem:'Se existirem 3 câmeras e se o campo de visão de cada câmera puder cobrir, no máximo, duas salas distintas, então a quantidade de salas que podem ser cobertas por essas câmeras varia de 3 a 5 salas.', options:['Certo','Errado'], answer:1, explanation:'O máximo é 3 × 2 = 6 salas, e, com campos sobrepostos, o mínimo pode ser menor que 3. O intervalo de 3 a 5 está errado.' },
        { id:'pf25-47', syllabusId:'rl', source:'Cebraspe 2025 · item 47', stem:'P: luzes apagadas; Q: sensor ativado; R: porta aberta. Sabe-se que Q → (P ∨ R) é verdadeira. Se o sensor de presença foi ativado e a porta do arquivo estava fechada, então as luzes estavam acesas.', options:['Certo','Errado'], answer:1, explanation:'Com Q verdadeira, P ∨ R precisa ser verdadeira; como R é falsa (porta fechada), P é verdadeira: as luzes estavam APAGADAS.' },
        { id:'pf25-48', syllabusId:'rl', source:'Cebraspe 2025 · item 48', stem:'Regra da perícia: o alarme de movimentação (S) só é disparado se o sensor de presença (Q) for ativado e a porta (R) estiver aberta. A possibilidade de o alarme ter sido disparado ainda que o sensor de presença não tenha sido ativado contradiz essa regra.', options:['Certo','Errado'], answer:0, explanation:'"S só se Q e R" equivale a S → (Q ∧ R). S verdadeira com Q falsa torna a condicional falsa, contrariando a regra.' },
        { id:'pf25-49', syllabusId:'rl', source:'Cebraspe 2025 · item 49', stem:'A proposição Q → (P ∨ R) é logicamente equivalente à proposição Q ∧ (P ∨ R).', options:['Certo','Errado'], answer:1, explanation:'Q → (P ∨ R) equivale a ¬Q ∨ P ∨ R. A conjunção Q ∧ (P ∨ R) exige Q verdadeira, então não são equivalentes.' },
        { id:'pf25-51', syllabusId:'pol', source:'Cebraspe 2025 · item 51', stem:'Um estudo mostrou que o DNA masculino sob as unhas de vítimas após um arranhão foi detectado até 6 horas depois, com queda significativa após 3 horas. A baixa persistência de DNA subungueal após 6 horas decorre da rápida degradação do DNA fora do corpo.', options:['Certo','Errado'], answer:1, explanation:'A queda se deve sobretudo à perda mecânica (atrito, lavagem, contato com objetos); o DNA é relativamente estável e não se degrada tão rápido.' },
        { id:'pf25-52', syllabusId:'bcm', source:'Cebraspe 2025 · item 52', stem:'A análise de lâminas com amostras subungueais coletadas logo após um arranhão no braço de um agressor revela, à microscopia óptica, conjuntos de células alongadas e fusiformes, uni e binucleadas, típicas de tecido epitelial cutâneo.', options:['Certo','Errado'], answer:1, explanation:'O arranhão traz principalmente células da camada córnea: achatadas, queratinizadas e em geral sem núcleo. Células fusiformes não são típicas da epiderme.' },
        { id:'pf25-53', syllabusId:'pol', source:'Cebraspe 2025 · item 53', stem:'A análise de marcadores situados no cromossomo Y é inadequada quando se avalia um conjunto de suspeitos que compartilham um ancestral comum via paterna.', options:['Certo','Errado'], answer:0, explanation:'O Y é herdado em bloco pela linha paterna: parentes paternos têm o mesmo haplótipo e não podem ser diferenciados.' },
        { id:'pf25-54', syllabusId:'pol', source:'Cebraspe 2025 · item 54', stem:'Se o DNA de fundo das amostras subungueais for de um animal macho (o cachorro da vítima) e estiver em maior quantidade que o DNA do suspeito, o perfil obtido por kits comerciais de Y-STR irá excluir o suspeito.', options:['Certo','Errado'], answer:1, explanation:'Os kits de STR são específicos para humanos: o DNA do cão não é amplificado e não gera perfil que exclua o suspeito.' },
        { id:'pf25-56', syllabusId:'bcm', source:'Cebraspe 2025 · item 56', stem:'O fato de o transcriptoma variar com o avanço da idade reflete que há diferença no repertório de genes que são transcritos em diferentes fases da vida.', options:['Certo','Errado'], answer:0, explanation:'O transcriptoma é o conjunto de RNAs expressos; a mudança com a idade reflete diferenças em quais genes são transcritos e em que nível.' },
        { id:'pf25-57', syllabusId:'bcm', source:'Cebraspe 2025 · item 57', stem:'O produto do processo de transcrição em eucariotos terá como destino final a tradução em uma proteína específica.', options:['Certo','Errado'], answer:1, explanation:'Muitos transcritos não são traduzidos: rRNA, tRNA, miRNA, lncRNA etc.' },
        { id:'pf25-58', syllabusId:'bcm', source:'Cebraspe 2025 · item 58', stem:'O resultado da análise do transcriptoma de uma amostra obtida de uma mancha de sangue encontrada em uma cena de crime será diferente se o sangue for venoso ou menstrual.', options:['Certo','Errado'], answer:0, explanation:'O sangue menstrual tem mRNAs próprios (ex.: MMP7, MMP11) que permitem distingui-lo do sangue venoso.' },
        { id:'pf25-59', syllabusId:'bcm', source:'Cebraspe 2025 · item 59', stem:'As moléculas analisadas para a obtenção dos padrões de expressão (transcriptoma) são do tipo ácido ribonucleico com uma base modificada, a 7-metilguanosina, na extremidade 3’, formando o CAP.', options:['Certo','Errado'], answer:1, explanation:'O CAP de 7-metilguanosina fica na extremidade 5′; na 3′ fica a cauda poli-A.' },
        { id:'pf25-60', syllabusId:'bcm', source:'Cebraspe 2025 · item 60', stem:'A principal diferença entre as proteínas está na sequência de beta-aminoácidos, cuja variabilidade na natureza é de 20 tipos, que se combinam a depender da sequência de trifosfatos de desoxinucleotídeos dos genes que as codificam.', options:['Certo','Errado'], answer:1, explanation:'As proteínas são formadas por ALFA-aminoácidos, e a sequência é dada pela sequência de nucleotídeos do gene (via mRNA), não por "trifosfatos de desoxinucleotídeos".' },
        { id:'pf25-61', syllabusId:'bcm', source:'Cebraspe 2025 · item 61', stem:'A alteração de um único aminoácido na composição de uma enzima tem o potencial de alterar a atividade enzimática, principalmente quando essa alteração estiver no sítio ativo da enzima.', options:['Certo','Errado'], answer:0, explanation:'Uma única substituição pode mudar a estrutura ou o sítio ativo (ex.: mutações de ponto que inativam enzimas).' },
        { id:'pf25-62', syllabusId:'bcm', source:'Cebraspe 2025 · item 62', stem:'A identificação de aminoácidos essenciais, como histidina, isoleucina e leucina, na cena de um crime revela a presença de espécies vegetais.', options:['Certo','Errado'], answer:1, explanation:'"Essencial" significa que o humano não sintetiza esse aminoácido; ele está presente nas proteínas de todos os seres vivos e não indica planta.' },
        { id:'pf25-63', syllabusId:'bcm', source:'Cebraspe 2025 · item 63', stem:'Cada proteína de um dado organismo eucarioto é codificada por um dado gene, seja nuclear, seja extranuclear, cujo produto da transcrição é um RNA mensageiro.', options:['Certo','Errado'], answer:1, explanation:'A relação não é de um gene para uma proteína: o splicing alternativo gera várias proteínas de um gene, e muitos genes produzem RNAs não codificantes.' },
        { id:'pf25-64', syllabusId:'met', source:'Cebraspe 2025 · item 64', stem:'Para obter ácidos nucleicos e identificar espécies em produtos animais (marfim, couro, embutidos), é necessário romper a parede celular, que, devido a sua composição proteica, pode ser aberta com enzimas de atividade exonuclease.', options:['Certo','Errado'], answer:1, explanation:'Células animais não têm parede celular. A lise usa detergentes e proteinase K; exonucleases degradariam o próprio DNA.' },
        { id:'pf25-65', syllabusId:'pol', source:'Cebraspe 2025 · item 65', stem:'Os marcadores do tipo STR estão deixando de ser usados na prática forense por serem tradicionalmente analisados com base no sequenciamento de um número limitado de segmentos do DNA.', options:['Certo','Errado'], answer:1, explanation:'Os STRs seguem como padrão (CODIS, BNPG) e são tipados tradicionalmente por tamanho de fragmento em eletroforese capilar, não por sequenciamento.' },
        { id:'pf25-66', syllabusId:'bcm', source:'Cebraspe 2025 · item 66', stem:'Para inferir hábitos como o consumo de álcool e tabaco a partir de uma amostra de cena de crime, uma estratégia é avaliar o epigenoma, pois esses hábitos modificam o padrão de metilação, o que pode afetar o funcionamento de genes.', options:['Certo','Errado'], answer:0, explanation:'O tabagismo e o álcool deixam assinaturas de metilação do DNA (ex.: no gene AHRR, para o tabaco).' },
        { id:'pf25-67', syllabusId:'bcm', source:'Cebraspe 2025 · item 67', stem:'O genoma humano, assim como o de outros primatas, distingue-se do genoma de outros organismos, como fungos, plantas e peixes, por apresentar um número significativamente maior de genes codificadores de proteínas.', options:['Certo','Errado'], answer:1, explanation:'O humano tem cerca de 20 mil genes codificadores, número comparável ao de peixes e menor que o de várias plantas.' },
        { id:'pf25-68', syllabusId:'pol', source:'Cebraspe 2025 · item 68', stem:'Perfil genético é um conjunto de genótipos obtido a partir da análise de marcadores selecionados; um perfil útil para a identificação individual pode não ser útil para a inferência de traços físicos e ancestralidade biogeográfica.', options:['Certo','Errado'], answer:0, explanation:'Os STRs de identificação são não codificantes; para fenótipo e ancestralidade, usam-se outros marcadores (SNPs).' },
        { id:'pf25-69', syllabusId:'gpop', source:'Cebraspe 2025 · item 69', stem:'Em uma população de 500 indivíduos, um marcador com alelos B e N mostrou 150 BB, 200 BN e 150 NN. Nessa situação, a população encontra-se de acordo com o princípio de Hardy-Weinberg.', options:['Certo','Errado'], answer:1, explanation:'p(B) = (300 + 200)/1000 = 0,5. O esperado seria 125 BB, 250 BN e 125 NN; há falta de heterozigotos, então a população não está em equilíbrio.' },
        { id:'pf25-70', syllabusId:'gpop', source:'Cebraspe 2025 · item 70', stem:'Ao analisar a probabilidade de coincidência de perfis genéticos nas populações, os cálculos devem ser ajustados com base na estrutura populacional, incorporando nas fórmulas o coeficiente de Wright, um ajuste feito para corrigir a endogamia dentro de uma população.', options:['Certo','Errado'], answer:0, explanation:'Aplica-se a correção θ (FST) para a subestruturação e o parentesco populacional, conforme o NRC II.' },
        { id:'pf25-71', syllabusId:'gpop', source:'Cebraspe 2025 · item 71', stem:'A mistura genética, que ocorre quando os indivíduos têm ascendência de mais de uma subpopulação, é uma consequência do fluxo gênico, que pode levar à introdução de novos alelos em uma população, aumentando a variabilidade genética.', options:['Certo','Errado'], answer:0, explanation:'O fluxo gênico traz alelos de outras populações e aumenta a variabilidade.' },
        { id:'pf25-72', syllabusId:'gpop', source:'Cebraspe 2025 · item 72', stem:'No equilíbrio de Hardy-Weinberg ideal, as forças evolutivas de mutação, seleção e deriva genética podem-se opor umas às outras e criar um equilíbrio dinâmico no qual não há modificação real das frequências alélicas.', options:['Certo','Errado'], answer:1, explanation:'No modelo ideal de Hardy-Weinberg, NÃO atua nenhuma força evolutiva; não se trata de forças que se compensam.' },
        { id:'pf25-73', syllabusId:'gpop', source:'Cebraspe 2025 · item 73', stem:'Em subpopulações isoladas, ocorrem cruzamentos consanguíneos, que aumentam a frequência de heterozigotos em uma população e podem resultar em maior ocorrência de distúrbios genéticos recessivos.', options:['Certo','Errado'], answer:1, explanation:'A consanguinidade aumenta os HOMOZIGOTOS (e por isso as doenças recessivas), reduzindo os heterozigotos.' },
        { id:'pf25-74', syllabusId:'met', source:'Cebraspe 2025 · item 74', stem:'Antes de serem descartados, os vestígios de material biológico devem ser mantidos armazenados em condições adequadas pelo prazo de 10 anos, conforme legislação vigente; e seu descarte deve ser feito em lixo apropriado, com EPI específico.', options:['Certo','Errado'], answer:1, explanation:'Não há um prazo legal único de 10 anos. Pelo CPP (art. 158-B, X), o descarte respeita a legislação e, quando pertinente, depende de autorização judicial.' },
        { id:'pf25-75', syllabusId:'met', source:'Cebraspe 2025 · item 75', stem:'Numa faca encontrada perto do local de crime, há impressões digitais obscurecidas por uma mancha de sangue. Deve-se dar preferência ao exame papiloscópico em detrimento do exame de DNA, pois as impressões serão do autor do crime e o sangue, da vítima.', options:['Certo','Errado'], answer:1, explanation:'Não se pode presumir de quem é cada vestígio. A sequência dos exames deve ser planejada para preservar ambos (documentar a impressão e coletar o sangue sem destruí-la).' },
        { id:'pf25-76', syllabusId:'met', source:'Cebraspe 2025 · item 76', stem:'Durante o processamento de vestígios biológicos em um laboratório de DNA, deve ser evitado o fluxo de materiais e pessoas das áreas destinadas à amplificação e à genotipagem para as áreas onde são realizadas atividades prévias à amplificação.', options:['Certo','Errado'], answer:0, explanation:'O fluxo deve ser unidirecional (pré-PCR → pós-PCR), para evitar a contaminação por amplicons.' },
        { id:'pf25-77', syllabusId:'met', source:'Cebraspe 2025 · item 77', stem:'Na eletroforese, os produtos de amplificação de microssatélites (STR) marcados com corantes fluorescentes são separados e detectados, e as informações de pico resultantes (tamanho e quantidade de DNA) compõem o genótipo STR.', options:['Certo','Errado'], answer:0, explanation:'Na eletroforese capilar, o tamanho define o alelo e a altura do pico reflete a quantidade de DNA.' },
        { id:'pf25-78', syllabusId:'met', source:'Cebraspe 2025 · item 78', stem:'Durante o exame pericial de genética forense, o processamento de uma amostra questionada deve seguir as etapas: avaliação/amostragem do vestígio, extração do DNA, validação, amplificação e eletroforese.', options:['Certo','Errado'], answer:1, explanation:'Entre a extração e a amplificação vem a QUANTIFICAÇÃO, e não a "validação" (que se aplica a métodos, não a amostras).' },
        { id:'pf25-79', syllabusId:'met', source:'Cebraspe 2025 · item 79', stem:'A amplificação consiste em um processo enzimático no qual uma região específica do DNA é replicada repetidamente para produzir várias cópias de uma sequência específica.', options:['Certo','Errado'], answer:0, explanation:'É a PCR: ciclos de desnaturação, anelamento e extensão pela DNA polimerase.' },
        { id:'pf25-80', syllabusId:'met', source:'Cebraspe 2025 · item 80', stem:'O excesso de DNA presente em uma amostra pode gerar artefatos na reação de PCR que dificultam a interpretação dos resultados.', options:['Certo','Errado'], answer:0, explanation:'O excesso de DNA gera picos fora de escala, pull-up, stutters elevados e picos divididos.' },
        { id:'pf25-81', syllabusId:'met', source:'Cebraspe 2025 · item 81', stem:'Ao extrair materiais biológicos para fins de genotipagem forense, é importante tentar prevenir a degradação do DNA molde e, sempre que possível, remover inibidores da PCR.', options:['Certo','Errado'], answer:0, explanation:'Inibidores como o heme, o ácido húmico e o índigo reduzem a amplificação; a extração deve preservar o DNA e removê-los.' },
        { id:'pf25-82', syllabusId:'met', source:'Cebraspe 2025 · item 82', stem:'Um diferencial do sequenciamento de Sanger é a ocorrência de picos sobrepostos no caso de análises de misturas de material genético, sendo os denominados picos ambíguos ferramentas úteis na análise de múltiplos alvos simultaneamente.', options:['Certo','Errado'], answer:1, explanation:'Os picos sobrepostos são uma LIMITAÇÃO do Sanger em misturas. Para múltiplos alvos e misturas, usa-se o sequenciamento massivo paralelo.' },
        { id:'pf25-83', syllabusId:'met', source:'Cebraspe 2025 · item 83', stem:'O sequenciamento de Sanger é um método fundamental para determinar a ordem dos nucleotídeos no DNA por meio da utilização de DNA polimerase, primers e ddNTPs fluorescentes, que interrompem a síntese do DNA de forma controlada.', options:['Certo','Errado'], answer:0, explanation:'É o método de terminação de cadeia: os ddNTPs não têm a 3′-OH e interrompem a extensão.' },
        { id:'pf25-85', syllabusId:'met', source:'Cebraspe 2025 · item 85', stem:'A fenotipagem forense por DNA prevê características externas, como aparência, ancestralidade biogeográfica, idade e tipo de tecido corporal, para oferecer pistas investigativas na ausência de amostra de referência para comparação.', options:['Certo','Errado'], answer:0, explanation:'A predição de características a partir do DNA gera pistas investigativas quando não há com quem comparar o perfil.' },
        { id:'pf25-86', syllabusId:'met', source:'Cebraspe 2025 · item 86', stem:'A tecnologia de DNA rápido possibilita que todas as etapas de processamento de uma amostra biológica (lise, extração, quantificação, amplificação, eletroforese capilar e análise de dados) sejam realizadas em um único equipamento e em um período entre 1 hora e 2 horas.', options:['Certo','Errado'], answer:0, explanation:'Os sistemas de Rapid DNA integram o processo completo em cerca de 1 a 2 horas.' },
        { id:'pf25-87', syllabusId:'est', source:'Cebraspe 2025 · item 87', stem:'O teorema de Bayes é uma ferramenta útil para tornar mais clara aos membros de um tribunal a regra da avaliação da prova usada pelo cientista, permitindo que a crença do júri seja atualizada pela nova informação, a prova científica.', options:['Certo','Errado'], answer:0, explanation:'A crença a priori é atualizada pela evidência (via LR), gerando a crença a posteriori.' },
        { id:'pf25-88', syllabusId:'est', source:'Cebraspe 2025 · item 88', stem:'O exame indica 90% de chance de o DNA ser do suspeito (H1) e 10% de ser de outra pessoa (H2); as probabilidades iniciais eram 70% para H1 e 30% para H2. Sendo as únicas hipóteses, a probabilidade de H2 após considerar conjuntamente essas informações é superior a 0,10.', options:['Certo','Errado'], answer:1, explanation:'P(H2) = 0,3 × 0,1 / (0,7 × 0,9 + 0,3 × 0,1) = 0,03 / 0,66 ≈ 0,045, ou seja, menor que 0,10.' },
        { id:'pf25-89', syllabusId:'est', source:'Cebraspe 2025 · item 89', stem:'O teorema de Bayes pode ser corretamente empregado para determinar a frequência alélica de um indivíduo suspeito, com base no banco de dados populacional.', options:['Certo','Errado'], answer:1, explanation:'A frequência alélica é estimada por contagem num banco populacional. Além disso, frequência é atributo da população, não do indivíduo.' },
        { id:'pf25-90', syllabusId:'est', source:'Cebraspe 2025 · item 90', stem:'Em relação à estatística clássica, a estatística bayesiana oferece uma abordagem mais direta para determinadas questões, incorporando as informações disponíveis a priori e fornecendo uma maneira mais simples de interpretar os resultados.', options:['Certo','Errado'], answer:0, explanation:'A abordagem bayesiana responde diretamente à probabilidade das hipóteses, incorporando o conhecimento prévio.' },
        { id:'pf25-92', syllabusId:'est', source:'Cebraspe 2025 · item 92', stem:'Teste de paternidade com um único locus. Se o valor da razão de verossimilhança não for superior a 10, a evidência genética nesse locus será considerada conclusiva para a paternidade.', options:['Certo','Errado'], answer:1, explanation:'Um LR baixo indica evidência fraca. Um único locus nunca é conclusivo; a paternidade combina vários loci.' },
        { id:'pf25-95', syllabusId:'est', source:'Cebraspe 2025 · item 95', stem:'Na genética forense, a razão de verossimilhança representa a força da evidência genética, sendo calculada como a razão entre a probabilidade da evidência sob H1 (hipótese da acusação) e a probabilidade da evidência sob H2 (hipótese da defesa).', options:['Certo','Errado'], answer:0, explanation:'É a definição: LR = P(E|H1) / P(E|H2).' },
        { id:'pf25-96', syllabusId:'est', source:'Cebraspe 2025 · item 96', stem:'Se a razão de verossimilhança for igual a 1, a evidência genética pode tornar diferentes as probabilidades a priori de duas hipóteses.', options:['Certo','Errado'], answer:1, explanation:'Com LR = 1, a evidência é neutra: as chances a posteriori ficam iguais às a priori.' },
        { id:'pf25-98', syllabusId:'est', source:'Cebraspe 2025 · item 98', stem:'Em casos de vínculo genético, como paternidade, a exclusão de um alelo compartilhado entre suposto pai e filho invalida a hipótese de paternidade com 100% de certeza.', options:['Certo','Errado'], answer:1, explanation:'Uma única incompatibilidade pode ser mutação; a exclusão exige incompatibilidades em vários loci.' },
        { id:'pf25-100', syllabusId:'est', source:'Cebraspe 2025 · item 100', stem:'Prior de culpa: 1 em 300. Se culpado, a coincidência genética ocorre com 100%; se inocente, com 1%. A razão de verossimilhança entre as hipóteses de culpa e de inocência do suspeito é igual a 90.', options:['Certo','Errado'], answer:1, explanation:'LR = 1 / 0,01 = 100.' },
        { id:'pf25-101', syllabusId:'est', source:'Cebraspe 2025 · item 101', stem:'Houve coincidência entre o DNA da cena e o perfil do suspeito. Uma vez que a coincidência genética não ocorre ao acaso, é correto afirmar que o suspeito é o autor do crime.', options:['Certo','Errado'], answer:1, explanation:'A coincidência não prova a autoria: pode ser acaso (1% aqui), transferência ou contato legítimo. Afirmar o contrário é a falácia do promotor.' },
        { id:'pf25-102', syllabusId:'est', source:'Cebraspe 2025 · item 102', stem:'Prior de culpa: 1 em 300; P(coincidência | culpado) = 1; P(coincidência | inocente) = 0,01. A coincidência genética aumenta a probabilidade de culpa do suspeito de 0,33% para aproximadamente 25%.', options:['Certo','Errado'], answer:0, explanation:'Chance a posteriori = 100 × (1/299) = 100/299, então a probabilidade é 100/399 ≈ 25%. A probabilidade a priori era 1/300 ≈ 0,33%.' },
        { id:'pf25-103', syllabusId:'est', source:'Cebraspe 2025 · item 103', stem:'Com os mesmos dados (prior 1/300, LR = 100), a probabilidade de o suspeito ser culpado, uma vez que houve coincidência genética, é de aproximadamente 25%.', options:['Certo','Errado'], answer:0, explanation:'100/399 ≈ 0,25. Note como um LR de 100 não leva a "99% de culpa" quando a probabilidade a priori é baixa.' },
        { id:'pf25-104', syllabusId:'qual', source:'Cebraspe 2025 · item 104', stem:'Agirá incorretamente um perito que, em laboratório acreditado pela ISO/IEC 17025, decidir não estimar a incerteza de medição de um método validado para tipagem de DNA, por ser amplamente reconhecido e já possuir incerteza estabelecida e verificada, sendo usado conforme instruções técnicas e com controle dos fatores de influência.', options:['Certo','Errado'], answer:1, explanation:'A norma (7.6.3) considera atendido o requisito quando um método reconhecido já especifica a sua incerteza e é seguido corretamente.' },
        { id:'pf25-105', syllabusId:'qual', source:'Cebraspe 2025 · item 105', stem:'Um laboratório de genética forense deve estar legalmente acreditado segundo a ISO/IEC 17025 para que seus laudos sejam aceitos judicialmente.', options:['Certo','Errado'], answer:1, explanation:'A acreditação demonstra competência, mas não é requisito legal para a validade do laudo em juízo.' },
        { id:'pf25-107', syllabusId:'qual', source:'Cebraspe 2025 · item 107', stem:'Em laboratório acreditado e integrante da RIBPG, a aplicação das diretrizes das resoluções da RIBPG (validação e controle de qualidade) é obrigatória e deve ocorrer de forma complementar às exigências da ISO/IEC 17025:2017, sem substituí-las.', options:['Certo','Errado'], answer:0, explanation:'As resoluções do Comitê Gestor somam-se à norma; uma não substitui a outra.' },
        { id:'pf25-108', syllabusId:'bpg', source:'Cebraspe 2025 · item 108', stem:'A atuação do perito criminal na área de genética forense deve observar, entre outras normas, a Constituição Federal de 1988, o Código de Processo Penal e a Lei n.º 12.654/2012, que trata da identificação criminal por perfil genético.', options:['Certo','Errado'], answer:0, explanation:'A Lei 12.654/2012 prevê a coleta de perfil genético como forma de identificação criminal.' },
        { id:'pf25-109', syllabusId:'qual', source:'Cebraspe 2025 · item 109', stem:'Conforme a Resolução n.º 12/2019 do Comitê Gestor da RIBPG, a identificação de não conformidades que comprometam a confiabilidade dos dados de um laboratório obriga o Comitê Gestor a suspender temporariamente o compartilhamento dos perfis com o BNPG, até que as irregularidades sejam integralmente sanadas.', options:['Certo','Errado'], answer:1, explanation:'Gabarito oficial: ERRADO. A banca não aceitou a suspensão obrigatória e automática. Leia o texto da Resolução 12/2019 para ver o tratamento previsto para as não conformidades.' },
        { id:'pf25-110', syllabusId:'qual', source:'Cebraspe 2025 · item 110', stem:'A participação em ensaios interlaboratoriais é indicada apenas para laboratórios que ainda não são acreditados segundo a ISO/IEC 17025:2017, como forma de comprovar sua competência técnica para fins de credenciamento.', options:['Certo','Errado'], answer:1, explanation:'Laboratórios acreditados também devem participar, para monitorar o desempenho e manter a acreditação.' },
        { id:'pf25-111', syllabusId:'qual', source:'Cebraspe 2025 · item 111', stem:'Um laboratório que falha em um teste de proficiência deve automaticamente perder a acreditação junto à Coordenação-Geral de Acreditação do INMETRO.', options:['Certo','Errado'], answer:1, explanation:'Uma falha exige investigação da causa e ação corretiva; não leva à perda automática da acreditação.' },
        { id:'pf25-112', syllabusId:'qual', source:'Cebraspe 2025 · item 112', stem:'A participação em ensaios de proficiência é considerada ferramenta suplementar, em que são realizadas, internamente, diferentes avaliações sobre a qualidade do laboratório.', options:['Certo','Errado'], answer:1, explanation:'O ensaio de proficiência é uma avaliação EXTERNA, feita por comparação com outros laboratórios.' },
        { id:'pf25-113', syllabusId:'bpg', source:'Cebraspe 2025 · item 113', stem:'A atuação integrada entre laboratórios estaduais e federais por meio da RIBPG permite uma comparação automatizada de perfis genéticos entre diferentes unidades da Federação, otimizando a identificação de pessoas e o esclarecimento de crimes interestaduais.', options:['Certo','Errado'], answer:0, explanation:'Essa integração é justamente a finalidade da rede.' },
        { id:'pf25-114', syllabusId:'bpg', source:'Cebraspe 2025 · item 114', stem:'O Banco Nacional de Perfis Genéticos pode ser utilizado no combate a crimes violentos, mas não para a identificação de pessoas desaparecidas, por ausência de previsão legal.', options:['Certo','Errado'], answer:1, explanation:'Os bancos também identificam desaparecidos, comparando restos mortais com familiares de referência.' },
        { id:'pf25-115', syllabusId:'bpg', source:'Cebraspe 2025 · item 115', stem:'A alimentação dos bancos de perfis genéticos ocorre a partir da submissão de perfis obtidos por laboratórios integrantes da RIBPG, devendo obedecer a critérios técnicos e legais específicos, como a padronização dos marcadores e autorização legal ou judicial para inclusão dos dados.', options:['Certo','Errado'], answer:0, explanation:'Só entram perfis de laboratórios da rede, com marcadores padronizados e com base legal ou judicial.' },
        { id:'pf25-118', syllabusId:'bpg', source:'Cebraspe 2025 · item 118', stem:'A consolidação dos bancos de perfis genéticos no Brasil foi favorecida por acordos com o FBI, que fez a cessão do software CODIS, e pela criação da RIBPG, viabilizando o intercâmbio nacional de perfis genéticos.', options:['Certo','Errado'], answer:0, explanation:'O CODIS foi cedido pelo FBI por acordo de cooperação e é o software usado na RIBPG.' },
        { id:'pf25-119', syllabusId:'bpg', source:'Cebraspe 2025 · item 119', stem:'De acordo com o Decreto n.º 7.950/2013, a competência para realizar auditorias periódicas nos bancos de perfis genéticos pode ser delegada aos laboratórios integrantes da RIBPG.', options:['Certo','Errado'], answer:1, explanation:'O laboratório não audita a si mesmo: a auditoria é atribuição definida no âmbito do Comitê Gestor da RIBPG, não delegável aos laboratórios auditados.' },

    var AREA19 = (function(){

      /* ---------- Biologia Celular e Molecular ---------- */
      T('bcm-cel', 'Células e tecidos');
      C('bcm-cel', 'Quais são os quatro tecidos básicos dos animais?',
        'Epitelial, conjuntivo, muscular e nervoso.',
        'Epitelial: células justapostas, pouca matriz; reveste superfícies e forma glândulas (a epiderme é epitélio estratificado pavimentoso queratinizado). Conjuntivo: muita matriz extracelular; inclui sangue, osso, cartilagem e tecido adiposo. Muscular: liso, estriado esquelético e cardíaco. Nervoso: neurônios e células da glia.',
        'Sangue é tecido conjuntivo, não um "quinto tecido". Hemácias maduras de mamíferos não têm núcleo; o DNA nuclear de uma mancha de sangue vem dos leucócitos.');
      C('bcm-cel', 'Quais são os principais tecidos vegetais?',
        'Meristemas (crescimento), revestimento (epiderme e periderme), parênquimas, sustentação (colênquima e esclerênquima) e condução (xilema e floema).',
        'Parênquimas fazem preenchimento, fotossíntese (clorênquima) e reserva. Xilema leva água e sais (seiva bruta) da raiz às folhas; floema distribui a seiva elaborada (açúcares). O esclerênquima tem parede secundária lignificada e células geralmente mortas na maturidade.',
        'Colênquima: células vivas, parede espessada de celulose (sustentação flexível). Esclerênquima: lignina, rígido. A banca gosta de trocar os dois.');
      C('bcm-cel', 'Como é a membrana plasmática e como as substâncias a atravessam?',
        'É uma bicamada de fosfolipídios com proteínas, colesterol (em animais) e glicocálix: o modelo do mosaico fluido.',
        'É semipermeável. Moléculas pequenas e apolares passam por difusão simples; íons e moléculas polares usam canais ou transportadores (difusão facilitada, sem gasto de energia) ou transporte ativo com ATP (ex.: bomba Na⁺/K⁺). Partículas grandes entram e saem por endocitose e exocitose.',
        'Difusão facilitada NÃO gasta ATP. O que define o transporte ativo é ir contra o gradiente, com gasto de energia.');
      C('bcm-cel', 'Que revestimento externo têm as células de plantas, fungos, bactérias e animais?',
        'Plantas: parede de celulose. Fungos: parede de quitina. Bactérias: parede de peptidoglicano. Células animais: não têm parede, só membrana plasmática.',
        'Isso muda a extração de DNA. Em plantas é preciso romper a parede (moagem, nitrogênio líquido, tampão CTAB). Em tecidos animais basta lisar a membrana com detergente e digerir proteínas com proteinase K.',
        'Item 64 de 2025: "romper a parede celular de couro e marfim com exonuclease" está errado duas vezes. Células animais não têm parede, e exonuclease degrada o próprio DNA.');
      MC('bcm-cel', 'Por que o DNA nuclear de uma mancha de sangue vem principalmente dos leucócitos?',
        ['Porque as hemácias maduras de mamíferos não têm núcleo', 'Porque as plaquetas concentram o DNA nuclear', 'Porque o plasma não contém células', 'Porque as hemácias degradam o DNA dos leucócitos', 'Porque o sangue é um tecido epitelial'], 0,
        'Hemácias maduras perdem o núcleo durante a maturação. Plaquetas são fragmentos celulares sem núcleo; o DNA nuclear vem dos glóbulos brancos.');
      CLZ('bcm-cel', 'Células animais não têm ___; por isso a lise para extrair DNA usa detergente e proteinase K.',
        ['parede celular', 'membrana plasmática', 'núcleo', 'ribossomos'], 0,
        'Só plantas (celulose), fungos (quitina) e bactérias (peptidoglicano) têm parede celular.');

      T('bcm-bio', 'Biomoléculas, proteínas e enzimas');
      C('bcm-bio', 'Quais são as principais biomoléculas e suas funções?',
        'Carboidratos (energia e estrutura), lipídios (reserva, membranas, hormônios), proteínas (estrutura, enzimas, transporte, defesa) e ácidos nucleicos (informação genética).',
        'Os monômeros são monossacarídeos, ácidos graxos e glicerol, aminoácidos e nucleotídeos. A água é a substância mais abundante na célula (cerca de 70%). Sais minerais atuam no equilíbrio osmótico e como cofatores (ex.: o Mg²⁺ é cofator da DNA polimerase na PCR).',
        'Celulose (plantas) e quitina (fungos e artrópodes) são polissacarídeos estruturais. Glicogênio (animais) e amido (plantas) são de reserva.');
      C('bcm-bio', 'Quais são os níveis de estrutura das proteínas?',
        'Primária (sequência de aminoácidos), secundária (α-hélice e folha β), terciária (dobramento 3D) e quaternária (associação de subunidades).',
        'A forma 3D, que define a função, é determinada pela estrutura primária. Calor, pH extremo e solventes desnaturam a proteína: ela perde a conformação, mas mantém a sequência. Uma única troca de aminoácido pode alterar a função, como na anemia falciforme (Glu→Val na β-globina).',
        'Proteínas são formadas por ALFA-aminoácidos (item 60 de 2025 dizia "beta"). Desnaturar não quebra ligações peptídicas; quem quebra é a hidrólise.');
      C('bcm-bio', 'Como funcionam as enzimas e o que significa o Km?',
        'São catalisadores biológicos: reduzem a energia de ativação sem serem consumidas e sem alterar o equilíbrio. O Km é a concentração de substrato em que a velocidade é metade da Vmax.',
        'Na cinética de Michaelis-Menten, a velocidade cresce com o substrato até a saturação (Vmax). Km baixo significa alta afinidade. Atividade depende de temperatura e pH ótimos, cofatores (íons metálicos) e coenzimas (muitas derivadas de vitaminas). O sítio ativo se ajusta ao substrato (encaixe induzido).',
        'A enzima não muda o ΔG nem a constante de equilíbrio da reação; muda só a velocidade.');
      C('bcm-bio', 'Como diferenciar os tipos de inibição enzimática?',
        'Competitiva: Km aumenta e Vmax não muda. Não competitiva: Vmax diminui e Km não muda. Incompetitiva: os dois diminuem. Irreversível: inativa a enzima por ligação covalente.',
        'O inibidor competitivo disputa o sítio ativo e é vencido com excesso de substrato. O não competitivo se liga a outro sítio. Exemplos: organofosforados inibem de forma irreversível a acetilcolinesterase; o EDTA sequestra o Mg²⁺ e assim inibe nucleases.',
        'O EDTA do tampão TE protege o DNA justamente por inibir as DNases dependentes de Mg²⁺; em excesso, também atrapalha a PCR.');
      MC('bcm-bio', 'Uma enzima na presença de um inibidor competitivo apresenta:',
        ['Km aparente maior e Vmax inalterada', 'Km menor e Vmax maior', 'Km inalterado e Vmax menor', 'Km e Vmax menores', 'Perda permanente da atividade'], 0,
        'O inibidor competitivo aumenta o Km aparente (é preciso mais substrato para chegar a Vmax/2), mas com substrato suficiente a Vmax é atingida.');

      T('bcm-div', 'Divisão celular e recombinação');
      C('bcm-div', 'Quais as fases da mitose e o que acontece em cada uma?',
        'Prófase (condensação dos cromossomos), metáfase (alinhamento no equador), anáfase (separação das cromátides-irmãs) e telófase (formação dos novos núcleos), seguida da citocinese.',
        'O DNA é replicado antes, na fase S da interfase. A mitose gera 2 células geneticamente idênticas à original (2n → 2n), garantindo crescimento e reparo. Cromossomos metafásicos, mais condensados, são os usados no cariótipo.',
        'Na mitose não há pareamento de homólogos nem crossing-over; isso só acontece na prófase I da meiose.');
      C('bcm-div', 'O que caracteriza a meiose?',
        'Duas divisões após uma única replicação, gerando 4 células haploides (2n → n) geneticamente diferentes.',
        'A meiose I é reducional: os homólogos se pareiam (sinapse), trocam segmentos (crossing-over) e se separam. A meiose II é equacional: separam-se as cromátides-irmãs. A variabilidade vem do crossing-over e da segregação independente dos cromossomos.',
        'Na anáfase I separam-se os HOMÓLOGOS; as cromátides-irmãs só se separam na anáfase II.');
      C('bcm-div', 'O que é recombinação e por que ela importa para os STRs?',
        'É a troca de segmentos entre cromossomos homólogos (crossing-over), que gera novas combinações de alelos nos gametas.',
        'Loci próximos no mesmo cromossomo tendem a ser herdados juntos (ligação). Os STRs forenses foram escolhidos em cromossomos diferentes ou distantes para se comportarem como independentes, o que permite multiplicar as frequências (regra do produto).',
        'A região não recombinante do Y e o mtDNA praticamente não recombinam; por isso são herdados em bloco, como haplótipos.');
      C('bcm-div', 'Como a meiose explica a herança dos STRs entre pais e filhos?',
        'Cada genitor transmite ao filho um dos seus dois alelos de cada locus, pela segregação dos homólogos na meiose.',
        'Em cada locus autossômico, o filho tem um alelo materno e um paterno: é a base do teste de vínculo genético. Se o suposto pai não tem o alelo paterno obrigatório, há uma incompatibilidade, que pode ser exclusão ou mutação.',
        'Um genitor homozigoto (ex.: 12,12) obrigatoriamente transmite esse alelo. Um heterozigoto transmite cada alelo com probabilidade 1/2.');
      MC('bcm-div', 'Em que momento ocorre o crossing-over?',
        ['Prófase I da meiose', 'Anáfase da mitose', 'Anáfase II da meiose', 'Fase S da interfase', 'Telófase I da meiose'], 0,
        'O crossing-over ocorre quando os homólogos estão pareados, na prófase I da meiose.');
      ORD('bcm-div', 'Ordene as fases da mitose.',
        ['Prófase', 'Metáfase', 'Anáfase', 'Telófase'],
        'Prófase (condensa) → metáfase (alinha) → anáfase (separa) → telófase (novos núcleos). Depois vem a citocinese.');

      T('bcm-dna', 'Estrutura, replicação e propriedades do DNA');
      C('bcm-dna', 'Como é a estrutura do DNA?',
        'Dupla hélice de duas fitas antiparalelas de nucleotídeos (desoxirribose + fosfato + base), com pareamento A=T (2 pontes de hidrogênio) e G≡C (3 pontes).',
        'Pelas regras de Chargaff, A = T e G = C, logo purinas = pirimidinas. O esqueleto açúcar-fosfato fica do lado de fora e tem carga negativa; por isso o DNA migra para o polo positivo na eletroforese. O RNA usa ribose e uracila e geralmente é fita simples.',
        'Purinas (A e G) têm dois anéis; pirimidinas (C, T e U) têm um. Cafeína e guanina compartilham o núcleo purínico.');
      C('bcm-dna', 'Como ocorre a replicação do DNA?',
        'É semiconservativa: cada fita serve de molde, e cada nova molécula tem uma fita antiga e uma nova.',
        'A helicase abre a hélice; a primase faz um primer de RNA; a DNA polimerase só adiciona nucleotídeos à extremidade 3′-OH (síntese 5′→3′). A fita líder é contínua; a tardia é feita em fragmentos de Okazaki, unidos pela DNA ligase. A atividade revisora (exonuclease 3′→5′) corrige erros.',
        'A DNA polimerase não começa do zero: precisa de primer. Na PCR, os primers são pequenos oligonucleotídeos de DNA sintéticos.');
      C('bcm-dna', 'O que são desnaturação e hibridização do DNA?',

        'Desnaturar não quebra as ligações fosfodiéster, só as pontes de hidrogênio entre as bases.');
      C('bcm-dna', 'Por que o DNA é um vestígio relativamente estável?',
        'A desoxirribose (sem a hidroxila 2′) e as ligações fosfodiéster tornam o DNA bem mais estável que o RNA, principalmente em amostras secas.',
        'Umidade, calor, luz UV e microrganismos aceleram a degradação. DNA degradado dá perfis parciais, com perda dos alelos maiores (o eletroferograma fica "em declive"). Por isso secar a amostra e guardar em papel, em local fresco, é essencial.',
        'A queda do DNA sob as unhas em poucas horas se deve principalmente à perda mecânica, não à degradação química rápida (item 51 de 2025).');
      MC('bcm-dna', 'Sobre o pareamento entre guanina e citosina, é correto afirmar:',
        ['Tem três pontes de hidrogênio, o que eleva a Tm de regiões ricas em GC', 'Tem duas pontes de hidrogênio, como A–T', 'É uma ligação covalente que não se rompe no aquecimento', 'Ocorre apenas no RNA', 'Envolve a uracila no DNA'], 0,
        'G≡C tem três pontes de hidrogênio e A=T tem duas; por isso o DNA rico em GC precisa de mais energia para desnaturar.');

      T('bcm-exp', 'Transcrição, tradução e regulação gênica');
      C('bcm-exp', 'Como é a transcrição e o processamento do RNA em eucariotos?',
        'A RNA polimerase II transcreve o gene a partir do promotor. O pré-mRNA recebe CAP na 5′ (7-metilguanosina) e cauda poli-A na 3′, e sofre splicing (remoção dos íntrons).',
        'O splicing alternativo combina éxons de formas diferentes e gera várias proteínas a partir de um mesmo gene. Só depois o mRNA maduro sai do núcleo. rRNAs e tRNAs são transcritos por outras RNA polimerases (I e III).',

      C('bcm-exp', 'Como é o código genético e como ocorre a tradução?',
        'Cada códon (3 nucleotídeos do mRNA) especifica um aminoácido. Dos 64 códons, 61 codificam aminoácidos e 3 são de parada (UAA, UAG, UGA). O códon de início é AUG (metionina).',
        'O código é degenerado (vários códons para o mesmo aminoácido), não ambíguo e quase universal. No ribossomo, o mRNA é lido de 5′ para 3′; os tRNAs trazem os aminoácidos pelo anticódon, e as ligações peptídicas formam a proteína.',

      C('bcm-exp', 'Todo RNA vira proteína?',
